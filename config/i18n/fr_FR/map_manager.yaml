map_manager:
  HUD 场景: Scène HUD
  HUD 场景绑定（坐标在场景编辑器里标定）: Liaisons de scène HUD (calibrez les coordonnées dans le gestionnaire de scènes)
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point} est hors de la minicarte ; la détection d''orientation utilise temporairement le centre de la zone.'
  ⚠ 缺失：{key}: '⚠ Manquant : {key}'
  不能删除: Suppression impossible
  从当前画面截取: Capturer depuis l'image actuelle
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: Génère également la scène HUD map_<key> ; calibrez ensuite les zones minicarte et carte du monde dans le gestionnaire de scènes.
  保存当前画面为探查图片: Enregistrer l'image actuelle comme image de relevé
  先登记地域: Enregistrez d'abord une région
  删除地图: Supprimer la carte
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: Supprimer la carte « {name} » et sa carte de base ? La scène HUD générée automatiquement map_{key} sera aussi supprimée.
  删除选中 POI: Supprimer le POI sélectionné
  删除选中地域: Supprimer les régions sélectionnées
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: Ne cochez qu'une fois la carte entièrement assemblée ; un assemblage réussi ne signifie pas que toute la carte a été relevée.
  只读，请先“复制到本地”再修改: Lecture seule ; choisissez « Copier en local » avant de modifier
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): Fichiers image (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: Cliquez sur la carte de base pour ajouter un POI ; cliquez sur un marqueur existant pour le sélectionner. Les coordonnées sont normalisées par rapport à la carte de base.
  地图 key: Clé de carte
  地域与探查: Régions et relevés
  地域仍被使用: Région encore utilisée
  地域名称: Nom de région
  坐标必须在 0–1 之间: Les coordonnées doivent être comprises entre 0 et 1
  基本信息: Informations de base
  基本信息与绑定: Informations de base et liaisons
  复制到本地: Copier en local
  大地图底图: Image de base de la carte du monde
  大地图正北朝上: Carte du monde orientée nord en haut
  导入底图文件…: Importer une carte de base…
  导航模式: Mode de navigation
  小写字母开头，字母/数字/下划线: Commence par une minuscule ; lettres, chiffres, underscores
  小地图朝向: Orientation de la minicarte
  尖端（退化）: Pointe (dégénérée)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 'Aucune carte de base : utilisez d''abord « Calibrer le HUD… » pour la carte du monde, puis importez dans l''onglet « Carte de base et POI »'
  展示: Affichage
  底图与 POI: Carte de base et POI
  底图区域未标定: Zone de carte de base non calibrée
  底图可标注 POI；空白部分尚未探查。: Les POI sont placés sur la carte de base ; les zones blanches n'ont pas encore été relevées.
  底图已完成整图探查: Carte de base entièrement relevée
  底图编码失败: Échec de l'encodage de la carte de base
  底图：局部探查，待补齐: 'Carte de base : relevé partiel, à compléter'
  底图：整图探查已完成: 'Carte de base : relevé complet terminé'
  当前地图有未保存的修改，放弃吗？: Cette carte contient des modifications non enregistrées ; les ignorer ?
  当前布局不存在，未能定位地图区域。: La disposition actuelle n'existe pas ; impossible de localiser la zone de carte.
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: La disposition actuelle n'a pas calibré {scene}.{point} ; la détection d'orientation utilise temporairement le centre de la minicarte.
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: La disposition actuelle n'a pas calibré {scene}.{region} ; impossible de recadrer la zone de carte.
  当前无法读取布局，未能定位地图区域。: Impossible de lire la disposition ; impossible de localiser la zone de carte.
  当前未选择地图，无法解析地图区域。: Aucune carte sélectionnée ; impossible de résoudre la zone de carte.
  截取当前画面: Capturer l'image actuelle
  截图所属地域: Région de cette capture
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: Enregistrez les régions selon le sélecteur de zones du jeu. Les images de relevé et la carte de base sont stockées séparément ; basculez la vue dans l'onglet Carte de base.
  探查: Relevés
  探查图片仅供查看: Les images de relevé sont en lecture seule
  探查图片缺失或无法解码: Image de relevé manquante ou impossible à décoder
  探查截图用于查看；POI 只在底图上编辑。: Les captures de relevé servent à la consultation ; les POI s'éditent uniquement sur la carte de base.
  搜索窗口（相对短边）: Fenêtre de recherche (par rapport au côté court)
  新地域: Nouvelle région
  新建地图: Nouvelle carte
  无效的 POI: POI invalide
  无法获取截图: Impossible de capturer l'écran
  '无法解码图片: {path}': 'Impossible de décoder l''image : {path}'
  无法读取图片: Impossible de lire l'image
  是否仍然使用整帧作为底图？: Utiliser malgré tout l'image complète comme carte de base ?
  最小面积（像素）: Surface minimale (pixels)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 'Orientation {deg:.1f}°　confiance {conf:.2f}　méthode : {method}　surface {area}px'
  未保存: Non enregistré
  未取得当前画面: Aucune image actuelle capturée
  未找到箭头：检查颜色阈值或小地图区域标定: 'Flèche introuvable : vérifiez le seuil de couleur ou la calibration de la minicarte'
  来源：{layer}: 'Source : {layer}'
  标定 HUD…（打开场景编辑器）: Calibrer le HUD… (ouvre le gestionnaire de scènes)
  标识: Identité
  没有地图。点击“新建”创建一张。: Aucune carte. Cliquez sur « Nouveau » pour en créer une.
  添加地域: Ajouter une région
  添加失败: Échec de l'ajout
  添加探查图片: Ajouter une image de relevé
  添加探查图片…: Ajouter une image de relevé…
  燕尾缺口: Encoche en queue d'aronde
  留空 = key: Vide = key
  种类: Type
  箭头颜色与搜索参数（保存到地图）: Couleur de flèche et paramètres de recherche (enregistrés dans la carte)
  识别结果: Résultat de détection
  该地域已有探查图片，不能直接删除。: Cette région contient des images de relevé et ne peut pas être supprimée directement.
  请选择截图所属地域。: Sélectionnez la région à laquelle appartient cette capture.
  读取失败: Échec de la lecture
  读取当前布局失败，未能定位地图区域。: Impossible de lire la disposition actuelle ; impossible de localiser la zone de carte.
  载入截图文件…: Charger un fichier de capture…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: Chargez une capture en jeu, recadrez selon la zone minicarte calibrée de la disposition actuelle et analysez la flèche jaune concave centrée. 0° = nord (haut de l'écran), sens horaire positif.
  适应窗口: Ajuster à la fenêtre
  选择局内截图: Sélectionner une capture en jeu
  选择底图: Sélectionner une carte de base
  重新识别: Détecter à nouveau
  （尚未载入截图）: (aucune capture chargée)
  'POI key 重复: {key}': 'Clé POI en double : {key}'
maps:
  'POI key 重复: {key}': 'Clé POI en double : {key}'
  '地图 key 已存在: {key}': 'Cette clé de carte existe déjà : {key}'
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: Capture d'écran indisponible ; positionnez d'abord la fenêtre ou connectez un appareil dans la fenêtre principale
