map_manager:
  HUD 场景: Сцена HUD
  HUD 场景绑定（坐标在场景编辑器里标定）: Привязки сцены HUD (координаты калибруются в редакторе сцен)
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point} находится вне области миникарты; для определения направления временно используется центр области.'
  ⚠ 缺失：{key}: '⚠ Отсутствует: {key}'
  不能删除: Нельзя удалить
  从当前画面截取: Захватить из текущего кадра
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: Одновременно будет создана сцена HUD map_<key>; затем откалибруйте области миникарты и карты мира в редакторе сцен.
  保存当前画面为探查图片: Сохранить текущий кадр как изображение разведки
  先登记地域: Сначала добавьте регион
  删除地图: Удалить карту
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: Удалить карту «{name}» и её базовую карту? Автоматически созданная сцена HUD map_{key} также будет удалена.
  删除选中 POI: Удалить выбранную POI
  删除选中地域: Удалить выбранные регионы
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: Отмечайте только после фактического сбора всей карты; успешная склейка не означает, что исследована вся карта.
  只读，请先“复制到本地”再修改: Только чтение; сначала нажмите «Копировать локально» для редактирования
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): Изображения (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: Нажмите на базовую карту, чтобы добавить POI; нажмите на существующую метку, чтобы выбрать её. Координаты нормализованы по базовой карте.
  地图 key: Ключ карты
  地域与探查: Регионы и разведка
  地域仍被使用: Регион используется
  地域名称: Название региона
  坐标必须在 0–1 之间: Координаты должны быть в диапазоне от 0 до 1
  基本信息: Основное
  基本信息与绑定: Основное и привязки
  复制到本地: Копировать локально
  大地图底图: Базовая карта мира
  大地图正北朝上: Карта мира ориентирована на север
  导入底图文件…: Импортировать базовую карту…
  导航模式: Режим навигации
  小写字母开头，字母/数字/下划线: Начинается со строчной буквы; буквы, цифры, подчёркивания
  小地图朝向: Направление на миникарте
  尖端（退化）: Кончик (вырожденный)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 'Базовая карта ещё не импортирована: сначала нажмите «Калибровать HUD…» для области карты мира, затем импортируйте на вкладке «Базовая карта и POI»'
  展示: Просмотр
  底图与 POI: Базовая карта и POI
  底图区域未标定: Область базовой карты не откалибрована
  底图可标注 POI；空白部分尚未探查。: На базовой карте можно отмечать POI; пустые области ещё не исследованы.
  底图已完成整图探查: Базовая карта исследована полностью
  底图编码失败: Ошибка кодирования базовой карты
  底图：局部探查，待补齐: 'Базовая карта: исследована частично, требуется дополнение'
  底图：整图探查已完成: 'Базовая карта: полная разведка завершена'
  当前地图有未保存的修改，放弃吗？: В текущей карте есть несохранённые изменения; отменить их?
  当前布局不存在，未能定位地图区域。: Текущий макет не существует; не удалось определить область карты.
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: В текущем макете не откалибрована точка {scene}.{point}; для определения направления временно используется центр миникарты.
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: В текущем макете не откалибрована область {scene}.{region}; невозможно обрезать область карты.
  当前无法读取布局，未能定位地图区域。: Не удаётся прочитать макет; не удалось определить область карты.
  当前未选择地图，无法解析地图区域。: Карта не выбрана; невозможно определить область карты.
  截取当前画面: Захватить текущий кадр
  截图所属地域: Регион этого скриншота
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: Регистрируйте регионы по переключателю областей в игре. Изображения разведки и базовая карта хранятся отдельно; переключать просмотр можно на вкладке базовой карты.
  探查: Разведка
  探查图片仅供查看: Изображения разведки доступны только для просмотра
  探查图片缺失或无法解码: Изображение разведки отсутствует или не декодируется
  探查截图用于查看；POI 只在底图上编辑。: Скриншоты разведки предназначены для просмотра; POI редактируются только на базовой карте.
  搜索窗口（相对短边）: Окно поиска (от короткой стороны)
  新地域: Новый регион
  新建地图: Новая карта
  无效的 POI: Недопустимая POI
  无法获取截图: Не удалось получить скриншот
  '无法解码图片: {path}': 'Не удалось декодировать изображение: {path}'
  无法读取图片: Не удалось прочитать изображение
  是否仍然使用整帧作为底图？: Всё равно использовать весь кадр в качестве базовой карты?
  最小面积（像素）: Мин. площадь (пикс.)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 'Направление {deg:.1f}°　уверенность {conf:.2f}　метод: {method}　площадь {area}px'
  未保存: Не сохранено
  未取得当前画面: Текущий кадр не получен
  未找到箭头：检查颜色阈值或小地图区域标定: 'Стрелка не найдена: проверьте порог цвета или калибровку области миникарты'
  来源：{layer}: 'Источник: {layer}'
  标定 HUD…（打开场景编辑器）: Калибровать HUD… (открывает редактор сцен)
  标识: Идентификатор
  没有地图。点击“新建”创建一张。: Карт нет. Нажмите «Новая», чтобы создать карту.
  添加地域: Добавить регион
  添加失败: Ошибка добавления
  添加探查图片: Добавить изображение разведки
  添加探查图片…: Добавить изображение разведки…
  燕尾缺口: Вырез «ласточкин хвост»
  留空 = key: Пусто = key
  种类: Тип
  箭头颜色与搜索参数（保存到地图）: Цвет стрелки и параметры поиска (сохраняются в карте)
  识别结果: Результат распознавания
  该地域已有探查图片，不能直接删除。: У этого региона есть изображения разведки, его нельзя удалить напрямую.
  请选择截图所属地域。: Выберите регион, к которому относится скриншот.
  读取失败: Ошибка чтения
  读取当前布局失败，未能定位地图区域。: Не удалось прочитать текущий макет; не удалось определить область карты.
  载入截图文件…: Загрузить файл скриншота…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: После загрузки полного игрового скриншота он обрезается по откалиброванной области миникарты текущего макета и распознаётся центральная жёлтая вогнутая стрелка. 0° = север (верх экрана), по часовой стрелке — положительный угол.
  适应窗口: По размеру окна
  选择局内截图: Выбор игрового скриншота
  选择底图: Выбор базовой карты
  重新识别: Распознать заново
  （尚未载入截图）: (скриншот не загружен)
  'POI key 重复: {key}': 'Повторяющийся ключ POI: {key}'
maps:
  'POI key 重复: {key}': 'Повторяющийся ключ POI: {key}'
  '地图 key 已存在: {key}': 'Ключ карты уже существует: {key}'
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: Скриншот недоступен; сначала выберите окно или подключите устройство в главном окне
