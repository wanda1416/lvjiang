- key: other
  name: 其他
  type: func
  is_text: true
  is_clickable: true
  views: [base, game, camera, screen, audio, social, building, store, other]
  to: /other
  navigation: switch
- key: input_area
  name: 输入区
  type: func
  is_text: false
  is_clickable: true
  view: redeem_code
- key: redeem_label
  name: 兑换文本
  type: attr
  is_text: true
  is_clickable: true
  view: redeem_code
references:
- scene: general_control
  entity: confirm
  view: redeem_code
- scene: general_control
  entity: cancel
  view: redeem_code
