  勾选后不下发 Profile 数据库和定义，手机总览数据继续由账号云端同步更新。手机处于云端模式（默认）时必须勾选，否则手机会拒绝接收。: When checked, the Profile database and definitions are not pushed; the phone's overview keeps updating via account cloud sync. Must be checked when the phone is in cloud mode (default), or the phone rejects the transfer.
