  未单独标定点击区域时，落点框从区域中心向四边延伸的比例。0.25 = 落点覆盖区域中间的一半；必须小于 0.5: Anteil, um den sich der Klickbereich von der Bereichsmitte zu den Rändern erstreckt, wenn kein eigener Klickbereich kalibriert ist. 0.25 = Klicks decken die mittlere Hälfte ab; muss kleiner als 0.5 sein
