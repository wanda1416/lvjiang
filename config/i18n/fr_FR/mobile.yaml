  除本窗口外还有 {n} 路连接连着这台手机，可能来自另一个窗口或另一台电脑，操作会互相打断: Outre cette fenêtre, {n} autres connexions sont actives sur ce téléphone (autre fenêtre ou autre ordinateur) ; les opérations risquent de s'interrompre mutuellement
  同步布局: Synchroniser les dispositions
  将更新脚本、布局和用户数据；总览数据不随包下发，由手机账号云端同步。: Mettra à jour les scripts, dispositions et données utilisateur ; les données de vue d'ensemble ne sont pas incluses dans le paquet et se synchronisent via le cloud du compte mobile.
