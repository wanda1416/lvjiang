  实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流: "Khi thực tế chỉ chọn một đơn vị người dùng, chạy thẳng tác vụ mà không gọi quy trình vòng đời"
  实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流: "Khi thực tế chỉ chọn một đơn vị người dùng, chạy thẳng tác vụ; đơn vị theo thuộc tính luôn chạy quy trình chuẩn bị"
  对应的任务脚本已不存在；取消勾选并保存即可从列表移除: Kịch bản tác vụ tương ứng không còn tồn tại; bỏ chọn và lưu để xóa khỏi danh sách
