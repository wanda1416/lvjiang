  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: Detiene una app Android o PC según su registro y confirma que el proceso haya desaparecido
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: Inicia una app Android o PC según su registro y confirma que el proceso aparezca
