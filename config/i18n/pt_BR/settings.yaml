  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'Por padrão, tenta iniciar o fluxo de vídeo 5 vezes e, em caso de falha, reconecta o agente 5 vezes e o ADB 5 vezes, com intervalo de 2 s. Se continuar indisponível, aguarda intervenção manual sem tempo limite: Sim verifica novamente e Não interrompe a tarefa; fechar o aviso não interrompe a tarefa e o banner superior permanece.

    Gestos multitoque e simultâneos não sofrem fallback. Entradas cujo envio seja incerto nunca são repetidas automaticamente. As configurações valem para tarefas iniciadas depois.'
  鼠标/触控移动到目标位置的耗时: Tempo para o mouse ou toque se mover até a posição de destino
