  "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。\n不会改写装备；进入后的调律处理仍使用完整实际词条。": "Solo ignora otros afijos existentes en la comprobación del umbral de armonización; el potencial máximo del primer afijo decide si entra en armonización.\nNo modifica el equipo; al entrar, el gestor de armonización sigue usando todos los afijos reales completos."
  "本赛季仍可承音的最低装备等级。低于它的装备本赛季已被抛弃，既不能原地承音也不能承音到下一阶，因此不参与满等级/满承音假设。\n这与等级配置里的「支持承音」不是一回事：后者描述该等级的装备当年是否允许承音。": "Nivel mínimo de equipo que aún admite Chengyin esta temporada. El equipo inferior queda obsoleto esta temporada (ni Chengyin en el sitio ni al siguiente nivel), por lo que queda excluido de los supuestos de nivel máximo y Chengyin máximo.\nEsto no es lo mismo que «Admite Chengyin» en configuración de niveles, que indica si ese nivel permitía Chengyin en su momento."
