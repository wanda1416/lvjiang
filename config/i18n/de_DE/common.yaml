  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Zeichnet die rohe Zeitachse von Tastatur, Maustasten, Mausrad und optional Mausbewegungen auf. Beim Speichern entsteht unter workflows/lvtrace eine zugehörige Spurdatei für zeitgetreue Wiedergabe, geeignet für zeitkritische Szenarien wie Spielkameras. Das Skript hängt von dieser Spurdatei ab und kann nicht allein als WF-Text übertragen werden.
