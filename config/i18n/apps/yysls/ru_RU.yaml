  "删除套装「{name}」？\n\n备战方案和装备记录里引用它的部位，删除后会按未知套装处理，不会自动清空。{detail}": "Удалить комплект «{name}»?\n\nСлоты в пресетах и записях снаряжения, ссылающиеся на него, будут отображаться как неизвестный комплект и не очистятся автоматически.{detail}"
  "删除左侧全部旧版本，并把备战方案引用迁移到右侧版本；冲突组互斥选择": "Удалить все старые версии слева и перенести ссылки из пресетов на правую версию; конфликтующие группы взаимоисключающие"
