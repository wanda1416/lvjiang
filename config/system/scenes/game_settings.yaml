- key: camera
  name: 镜头
  type: func
  is_text: true
  is_clickable: true
  views: [base, game, camera, screen, audio, social, building, store, other]
  to: /camera
  navigation: switch
- key: screen
  name: 画面
  type: func
  is_text: true
  is_clickable: true
  views: [base, game, camera, screen, audio, social, building, store, other]
  to: /screen
  navigation: switch
- key: audio
  name: 音频
  type: func
  is_text: true
  is_clickable: true
  views: [base, game, camera, screen, audio, social, building, store, other]
  to: /audio
  navigation: switch
- key: social
  name: 社交
  type: func
  is_text: true
  is_clickable: true
  views: [base, game, camera, screen, audio, social, building, store, other]
  to: /social
  navigation: switch
- key: building
  name: 建造
  type: func
  is_text: true
  is_clickable: true
  views: [base, game, camera, screen, audio, social, building, store, other]
  to: /building
