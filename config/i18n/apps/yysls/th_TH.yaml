  已撤销未保存的调律配置更改: เลิกทำการแก้ไขตั้งค่าการปรับจูนที่ยังไม่ได้บันทึกแล้ว
  已新增基础规则组「{name}」: เพิ่มกลุ่มกฎพื้นฐานใหม่ "{name}" แล้ว
