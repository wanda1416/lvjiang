  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Gera WF DSL legível e editável diretamente. Ao parar a gravação, combina pressionamentos, seguradas, liberações e esperas seguintes quando seguro; movimentos contínuos de mouse e esperas curtas são agrupados em ~100ms. Ideal para interfaces comuns e ajustes manuais; não indicado para câmera de jogo que exige reprodução exata dos eventos brutos.
