  ? "「{target}」在 {level} 级还没有毕业率方案，暂时无法比较最优组合。\n\n现有可用等级：{levels}。"
  : "\"{target}\" chưa có phương án tỷ lệ tốt nghiệp ở cấp {level}, tạm chưa thể so sánh tổ hợp tối ưu.\n\nCác cấp hiện có: {levels}."
  "「{target}」还没有可用的毕业率方案，导入后才能比较最优组合。": "\"{target}\" chưa có phương án tỷ lệ tốt nghiệp khả dụng, hãy nhập trước để so sánh tổ hợp tối ưu."
  ? "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。\n不会改写装备；进入后的调律处理仍使用完整实际词条。"
  : "Chỉ bỏ qua các dòng hiện có khác khi kiểm tra ngưỡng Điều Luật, dùng tiềm năng tối đa của dòng đầu để quyết định có vào quy trình Điều Luật hay không.\nKhông ghi đè trang bị; sau khi vào xử lý Điều Luật vẫn dùng đầy đủ dòng thuộc tính thực tế."
  ? "本赛季仍可承音的最低装备等级。低于它的装备本赛季已被抛弃，既不能原地承音也不能承音到下一阶，因此不参与满等级/满承音假设。\n这与等级配置里的「支持承音」不是一回事：后者描述该等级的装备当年是否允许承音。"
  : "Cấp trang bị thấp nhất vẫn còn có thể Thừa Âm trong mùa giải này. Trang bị thấp hơn cấp này đã bị loại trong mùa hiện tại, không thể Thừa Âm tại chỗ hay lên bậc tiếp theo, nên không tham gia giả định Đầy cấp/Đầy Thừa Âm.\nMục này khác với \"Hỗ trợ Thừa Âm\" trong Cấu hình cấp: mục sau mô tả trang bị ở cấp đó trước đây có cho phép Thừa Âm hay không."
