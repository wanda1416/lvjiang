  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: キーボード・マウスボタン・ホイールおよび任意のマウス移動の生タイムラインを記録します。保存時に workflows/lvtrace 配下へ対応するトレースファイルも生成され、録画時に近いタイミングで再生できるためゲーム視点など高精度な時系列操作に適しています。WF テキストのみをコピーして移行することはできません。
