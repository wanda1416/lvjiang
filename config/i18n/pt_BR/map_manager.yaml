map_manager:
  HUD 场景: Cena HUD
  HUD 场景绑定（坐标在场景编辑器里标定）: Vínculos da cena HUD (calibre as coordenadas no Editor de Cenas)
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point} está fora da área do minimapa; a detecção de direção usará o centro da área por enquanto.'
  ⚠ 缺失：{key}: '⚠ Ausente: {key}'
  不能删除: Não é possível excluir
  从当前画面截取: Capturar da tela atual
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: Isso também gera a cena HUD map_<key>; depois calibre as áreas do minimapa e do mapa-múndi no Editor de Cenas.
  保存当前画面为探查图片: Salvar a tela atual como imagem de reconhecimento
  先登记地域: Cadastre uma região primeiro
  删除地图: Excluir mapa
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: Excluir o mapa "{name}" e seu mapa base? A cena HUD gerada automaticamente map_{key} também será excluída.
  删除选中 POI: Excluir POI selecionado
  删除选中地域: Excluir regiões selecionadas
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: Marque apenas depois de completar o mapa inteiro; uma junção bem-sucedida não significa que o mapa completo foi mapeado.
  只读，请先“复制到本地”再修改: Somente leitura; clique em "Copiar para local" antes de editar
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): Arquivos de imagem (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: Clique no mapa base para adicionar um POI; clique em um marcador existente para selecioná-lo. As coordenadas são normalizadas pelo mapa base.
  地图 key: Chave do mapa
  地域与探查: Regiões e reconhecimento
  地域仍被使用: Região ainda em uso
  地域名称: Nome da região
  坐标必须在 0–1 之间: As coordenadas devem estar entre 0 e 1
  基本信息: Informações básicas
  基本信息与绑定: Informações básicas e vínculos
  复制到本地: Copiar para local
  大地图底图: Imagem base do mapa-múndi
  大地图正北朝上: Mapa-múndi orientado ao norte
  导入底图文件…: Importar mapa base…
  导航模式: Modo de navegação
  小写字母开头，字母/数字/下划线: Começa com letra minúscula; letras, números e sublinhados
  小地图朝向: Direção no minimapa
  尖端（退化）: Ponta (degenerada)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 'Nenhum mapa base importado: use "Calibrar HUD…" para marcar a área do mapa-múndi e importe na aba "Mapa base e POI"'
  展示: Exibição
  底图与 POI: Mapa base e POI
  底图区域未标定: Área do mapa base não calibrada
  底图可标注 POI；空白部分尚未探查。: Os POIs podem ser marcados no mapa base; as áreas em branco ainda não foram exploradas.
  底图已完成整图探查: Reconhecimento completo do mapa base concluído
  底图编码失败: Falha ao codificar o mapa base
  底图：局部探查，待补齐: 'Mapa base: reconhecimento parcial, incompleto'
  底图：整图探查已完成: 'Mapa base: reconhecimento completo concluído'
  当前地图有未保存的修改，放弃吗？: Este mapa tem alterações não salvas; descartá-las?
  当前布局不存在，未能定位地图区域。: O layout atual não existe; não foi possível localizar a área do mapa.
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: O layout atual ainda não calibrou {scene}.{point}; a detecção de direção usará o centro do minimapa por enquanto.
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: O layout atual ainda não calibrou {scene}.{region}; não é possível recortar a área do mapa.
  当前无法读取布局，未能定位地图区域。: Não foi possível ler o layout atual; não foi possível localizar a área do mapa.
  当前未选择地图，无法解析地图区域。: Nenhum mapa selecionado; não é possível resolver a área do mapa.
  截取当前画面: Capturar tela atual
  截图所属地域: Região desta captura
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: Cadastre regiões pelo seletor de áreas do jogo. As imagens de reconhecimento e o mapa base são salvos separadamente e podem ser alternados na aba do mapa base.
  探查: Reconhecimento
  探查图片仅供查看: Imagens de reconhecimento são somente para visualização
  探查图片缺失或无法解码: Imagem de reconhecimento ausente ou impossível de decodificar
  探查截图用于查看；POI 只在底图上编辑。: Capturas de reconhecimento são apenas para visualização; os POIs são editados somente no mapa base.
  搜索窗口（相对短边）: Janela de busca (relativa ao lado menor)
  新地域: Nova região
  新建地图: Novo mapa
  无效的 POI: POI inválido
  无法获取截图: Não foi possível capturar a tela
  '无法解码图片: {path}': 'Não foi possível decodificar a imagem: {path}'
  无法读取图片: Não foi possível ler a imagem
  是否仍然使用整帧作为底图？: Usar o quadro inteiro como mapa base mesmo assim?
  最小面积（像素）: Área mínima (pixels)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 'Direção {deg:.1f}°　confiança {conf:.2f}　método: {method}　área {area}px'
  未保存: Não salvo
  未取得当前画面: Nenhuma tela atual capturada
  未找到箭头：检查颜色阈值或小地图区域标定: 'Seta não encontrada: verifique o limite de cor ou a calibração da área do minimapa'
  来源：{layer}: 'Origem: {layer}'
  标定 HUD…（打开场景编辑器）: Calibrar HUD… (abre o Editor de Cenas)
  标识: Identificação
  没有地图。点击“新建”创建一张。: Nenhum mapa encontrado. Clique em "Novo" para criar um.
  添加地域: Adicionar região
  添加失败: Falha ao adicionar
  添加探查图片: Adicionar imagem de reconhecimento
  添加探查图片…: Adicionar imagem de reconhecimento…
  燕尾缺口: Entalhe em cauda de andorinha
  留空 = key: Em branco = chave
  种类: Tipo
  箭头颜色与搜索参数（保存到地图）: Cor da seta e parâmetros de busca (salvos no mapa)
  识别结果: Resultado da detecção
  该地域已有探查图片，不能直接删除。: Esta região possui imagens de reconhecimento e não pode ser excluída diretamente.
  请选择截图所属地域。: Selecione a região a que esta captura pertence.
  读取失败: Falha na leitura
  读取当前布局失败，未能定位地图区域。: Falha ao ler o layout atual; não foi possível localizar a área do mapa.
  载入截图文件…: Carregar arquivo de captura…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: Após carregar uma captura completa do jogo, o recorte é feito pela área do minimapa calibrada no layout atual para detectar a seta amarela côncava centralizada. 0° = norte (topo da tela), sentido horário positivo.
  适应窗口: Ajustar à janela
  选择局内截图: Selecionar captura do jogo
  选择底图: Selecionar mapa base
  重新识别: Detectar novamente
  （尚未载入截图）: (nenhuma captura carregada)
  'POI key 重复: {key}': 'Chave de POI duplicada: {key}'
maps:
  'POI key 重复: {key}': 'Chave de POI duplicada: {key}'
  '地图 key 已存在: {key}': 'A chave do mapa já existe: {key}'
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: Captura indisponível; posicione a janela ou conecte um dispositivo na janela principal primeiro
