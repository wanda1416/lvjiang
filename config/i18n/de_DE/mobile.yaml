  "手机内置任务，可独立配置和执行，无需先连接 PC。可向手机下发脚本、配置和 Profile，也可独立回传手机历史与日志。": "Integrierte Aufgaben auf dem Telefon lassen sich unabhängig ohne PC konfigurieren und ausführen. Skripte, Konfigurationen und Profile können ans Telefon übertragen sowie Verlauf und Protokolle separat zurückübertragen werden."
