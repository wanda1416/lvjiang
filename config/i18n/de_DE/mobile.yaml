  "确认手机已安装律匠 app、与本机同一局域网或已用 USB 连接，并在 app 内开启无障碍服务": "Stellen Sie sicher, dass die LvJiang-App auf dem Telefon installiert ist, sich im selben LAN befindet oder per USB verbunden ist und der Bedienungshilfen-Dienst in der App aktiviert wurde"
