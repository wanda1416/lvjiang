  请到「脚本」页至少勾选一个脚本: Check at least one script on the "Scripts" page
  请在「工具 → 批量配置」中配置条目准备工作流: Configure the item prepare workflow in "Tools → Batch Configuration"
  请至少勾选一个脚本: Check at least one script
  请选择 workflows 目录下的 .wf 文件: Pick a .wf file under the workflows directory
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: The scheduling unit is a configuration-group definition; change it in "Tools → Batch Configuration"
  选择工作流文件: Select Workflow File
