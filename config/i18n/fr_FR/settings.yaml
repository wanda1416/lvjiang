  完全离线模式（暂停全部联网功能）: Mode hors ligne complet (suspend toutes les fonctions réseau)
  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 'Fonction expérimentale : de nombreux scripts ne fonctionnent pas encore dans ce mode et les signalements d''indisponibilité ne sont pas traités. La capture en arrière-plan permet de capturer le jeu même recouvert par d''autres fenêtres, légèrement plus lentement ; elle exige aussi l''entrée en arrière-plan, et aucune des deux ne fonctionne si la fenêtre est réduite. Ceci définit la valeur par défaut : l''interface principale ne coche automatiquement « Capture en arrière-plan » qu''une fois « Mode arrière-plan » activé, modifiable à tout moment pendant l''exécution.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Fonction expérimentale : le téléphone doit avoir l''app LvJiang installée avec le service d''accessibilité activé ; cela ne change que le canal des clics et glissements, pas la méthode de capture. Repli sur ADB shell input en cas d''échec de connexion.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: Aucune information de connexion de ce type pour le moment ; connectez d'abord un appareil ou localisez une fenêtre depuis la fenêtre principale.
