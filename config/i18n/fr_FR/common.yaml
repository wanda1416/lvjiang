  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Génère du WF DSL lisible et modifiable. À l'arrêt, les appuis/maintiens/relâchements de touches et attentes suivantes sont fusionnés si sûr ; les mouvements continus de souris et courtes attentes sont regroupés par tranches d'environ 100 ms. Adapté aux interfaces classiques et retouches manuelles, mais pas aux mouvements de caméra nécessitant une lecture exacte des événements bruts.
