  "单击查看词条详情": "Nhấp để xem chi tiết dòng thuộc tính"
  "卡片显示原始装备数值，计算假设标注在卡片上方": "Thẻ hiển thị chỉ số trang bị gốc, giả định tính toán ghi ở phía trên thẻ"
  "原地承音：等级不变，词条数值落到承音上限": "Thừa Âm tại chỗ: giữ nguyên cấp, nâng chỉ số dòng thuộc tính lên giới hạn Thừa Âm"
  "原词条": "Dòng gốc"
  "及以上装备": "trở lên"
  "双击「规则说明」列可编辑，选中一行后可复制/删除该规则组": "Nhấp đúp cột \"Mô tả quy tắc\" để sửa; chọn một hàng để sao chép/xóa nhóm quy tắc đó"
  "双击单元格即可逐项编辑；灰色单元格由流派决定": "Nhấp đúp vào ô để sửa từng mục; ô màu xám do lưu phái quyết định"
  "发现 {count} 处部位/品阶无启用规则覆盖：": "Phát hiện {count} tổ hợp vị trí/phẩm chất chưa có quy tắc đang bật bao phủ:"
  "发现同时配置 动态属攻和真实属攻，建议修正": "Phát hiện cấu hình đồng thời thuộc tính công động và thuộc tính công thật, khuyến nghị sửa lại"
  "取最大值": "Lấy giá trị lớn nhất"
  "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。": "Chỉ bỏ qua các dòng hiện có khác khi kiểm tra ngưỡng Điều Luật, dùng tiềm năng tối đa của dòng đầu để quyết định có vào quy trình Điều Luật hay không."
  "不会改写装备；进入后的调律处理仍使用完整实际词条。": "Không ghi đè trang bị; sau khi vào xử lý Điều Luật vẫn dùng đầy đủ dòng thuộc tính thực tế."
  "只影响本次计算，不会写进搭配": "Chỉ ảnh hưởng lần tính này, không ghi vào phối trang bị"
  "只有主实例可以启动 MCP 服务": "Chỉ phiên bản chính mới có thể khởi chạy dịch vụ MCP"
  "只有开发模式可以指定保存位置": "Chỉ chế độ nhà phát triển mới có thể chỉ định vị trí lưu"
  "只检查部位和金/紫品阶是否有启用规则；判定结果和首词条条件需在实际运行时确定。": "Chỉ kiểm tra xem vị trí và phẩm chất vàng/tím có quy tắc đang bật hay không; kết quả phán định và điều kiện dòng đầu cần xác định khi chạy thực tế."
  "只能从可用词条库里、且各流派转律词条库允许转出的词条中选择；动态类四个词条只要在可用词条库中即可选。": "Chỉ được chọn từ kho dòng thuộc tính khả dụng và được kho dòng Chuyển Luật của từng lưu phái cho phép; 4 dòng thuộc tính động chỉ cần có trong kho khả dụng là chọn được."
  "只评估本次自动调律实际勾选的规则与玩法，避免为本次不打算培养的方案消耗材料。": "Chỉ đánh giá các quy tắc và lối chơi thực tế được chọn cho lần Tự động Điều Luật này, tránh tốn nguyên liệu cho phương án không dự định bồi dưỡng lần này."
  "只读实例不能停用 MCP 服务，请在主实例操作": "Phiên bản chỉ đọc không thể dừng dịch vụ MCP, vui lòng thao tác trên phiên bản chính"
