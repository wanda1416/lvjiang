  在画布上框选一个矩形即为模板图。分组留空写入 common；布局分组的模板由场景管理截取，这里不能写。: Выделите прямоугольник на холсте, чтобы создать шаблон. Если оставить группу пустой, сохранится в common; шаблоны групп макета снимаются в редакторе сцен и здесь недоступны для записи.
  模板名（不含分组）: Имя шаблона (без группы)
  测试匹配: Проверить совпадение
