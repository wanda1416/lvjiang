  用户名已存在: 使用者名稱已存在
  用户属性: 使用者屬性
  ? '确定要删除用户「{name}」吗？

    用户将从当前列表和批量配置中移除，关联数据文件会保留；以后添加同名用户即可恢复。'
  : '確定要刪除使用者「{name}」嗎？

    使用者將從當前列表和批次配置中移除，關聯資料檔案會保留；以後新增同名使用者即可恢復。'
  ＋ 新建用户: ＋ 新建使用者
user_toolbar:
  上一个用户: 上一個使用者
  下一个用户: 下一個使用者
