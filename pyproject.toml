[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lvjiang"
version = "0.1.0"
description = "通用视觉 RPA 引擎（支持插件扩展，燕云十六声装备调律工具）"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "mss>=9.0",
    "pynput>=1.7",
    "rapidocr-onnxruntime>=1.2",
    "onnxruntime>=1.20,<1.21",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "av>=12.0",  # PyAV — H.264 解码（scrcpy 模式需要）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

# src-layout：`src/` 只是源根，不是包；可导入的包是 src/lvjiang/。
# 这样打包边界可枚举（源根下只有 lvjiang 一个子项），Android 侧 Chaquopy 的
# srcDir 才能直接指向 src/ 而不会把 config/ data/ docs/ 一并卷进 APK。
[tool.setuptools.packages.find]
where = ["src"]

# grammar.lark 是 DSL 解析器运行时要读的文件，不声明的话非 editable 安装会缺它
[tool.setuptools.package-data]
lvjiang = ["workflows/grammar/*.lark"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# 让裸检出（未 pip install -e .）也能直接跑 pytest：把源根加进 sys.path
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
# 机器上可能同时存在 PySide6，固定 pytest-qt 用项目依赖的 PyQt6，避免 Qt DLL 冲突
qt_api = "pyqt6"
# 把未处理警告升级为错误，保障回归基线干净（具体需要时再单独放行）
filterwarnings = ["error"]
