  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 'Le test d''exécution lance réellement le script avant d''appeler cette fonction : ne l''utilisez pas sur des scripts lents ou non fiables, l''interface reste bloquée jusqu''au retour.'
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: Cette fonction nécessite l'injection du moteur (_engine/_wf) et ne peut être appelée que pendant l'exécution d'un script
