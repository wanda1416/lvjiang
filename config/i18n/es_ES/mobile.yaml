  ℹ️ shell 通道不可用（Shizuku 未授权）。普通点击与截图不受影响: ℹ️ El canal shell no está disponible (Shizuku sin autorización). Los toques normales y las capturas no se ven afectados
  ✅ Shizuku 已授权：shell 通道可用: '✅ Shizuku autorizado: canal shell disponible'
  '✅ 支持输入时间线（并发手势）：声明 #% requires: [device_gesture] 的脚本可以运行': '✅ Admite línea de tiempo de entrada (gestos simultáneos): los scripts que declaran #% requires: [device_gesture] pueden ejecutarse'
  '❌ 不支持输入时间线：声明 #% requires: [device_gesture] 的脚本会在加载时被拒绝，需要先开启无障碍服务': '❌ No admite línea de tiempo de entrada: los scripts que declaran #% requires: [device_gesture] se rechazarán al cargar; activa primero el servicio de accesibilidad'
  上一设备操作已完成；当前设备已切换，请刷新状态: La operación del dispositivo anterior ha finalizado; el dispositivo actual ha cambiado, actualiza el estado
  下发全部用户、任务配置和 Profile，仅携带所选布局及其继承依赖；保留手机历史、日志和结果。: Envía todos los usuarios, la configuración de tareas y el perfil, incluyendo solo el diseño seleccionado y sus dependencias heredadas; conserva el historial, los registros y los resultados del teléfono.
  下发配置: Enviar configuración
  下发配置（需激活功能）: Enviar configuración (requiere activación)
  下载 APK 到本机: Descargar APK al PC
  下载失败: Error de descarga
  二维码来源: Origen del código QR
  二维码生成失败，请手动打开上面的链接: Error al generar el código QR; abre el enlace superior manualmente
  仅合并已结束的手机记录；参数、Profile 和插件业务数据不回传。重复回传不会重复导入。: Solo se combinan los registros finalizados del teléfono; los parámetros, el perfil y los datos de complementos no se suben. Volver a subir no duplica importaciones.
  任务状态：{state}: 'Estado de la tarea: {state}'
  体检失败：{err}: 'Error en el diagnóstico: {err}'
  使用应用预置配置；执行用户：{user}: 'Usa la configuración integrada de la app; usuario en ejecución: {user}'
  保留各用户的任务设置（含插件任务）和手机独有用户；脚本、布局和 Profile DB 仍更新。: Conserva los ajustes de tareas de cada usuario (incluidas las tareas de complementos) y los usuarios exclusivos del teléfono; los scripts, diseños y la base de datos de perfiles sí se actualizan.
  保留手机任务参数: Conservar parámetros de tareas del teléfono
  保留手机任务参数及手机独有用户。: Conserva los parámetros de tareas del teléfono y los usuarios exclusivos del teléfono.
  保留手机批量配置: Conservar configuración de lotes del teléfono
  保留手机批量配置。: Conserva la configuración de lotes del teléfono.
  保留手机整份批量配置组；取消后使用电脑配置组。本次运行草稿仍保留。: Conserva todos los grupos de configuración de lotes del teléfono; si se desmarca, se usan los del PC. El borrador de la ejecución actual se mantiene.
  先「下载 APK 到本机」或选择一个本地安装包: Primero «Descargar APK al PC» o selecciona un paquete local
  先准备一个本地安装包: Prepara primero un paquete local
