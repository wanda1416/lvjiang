  '{what}: 需要坐标引用（$var = [scene].[region]、find 结果或 (x, y[, w, h]) 字面量），实际: {t}': '{what} : référence de coordonnées attendue ($var = [scene].[region], résultat find ou littéral (x, y[, w, h])), reçu : {t}'
