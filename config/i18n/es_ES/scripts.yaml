  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 'La ejecución de prueba ejecuta realmente el script antes de llamar a esta función: no la uses con scripts lentos o de origen desconocido, ya que la interfaz quedará bloqueada hasta que termine.'
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: Esta función requiere inyección del motor (_engine/_wf) y solo puede llamarse durante la ejecución de un script
  语法检查通过（保存后会再做布局引用校验）: Comprobación de sintaxis superada (al guardar se volverán a comprobar las referencias del diseño)
