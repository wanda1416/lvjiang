  新热键已保存，但当前进程重建全局监听失败；本次运行继续使用原热键，重启后将重试新设置。: บันทึกปุ่มลัดใหม่แล้ว แต่โปรเซสปัจจุบันสร้างตัวดักฟังส่วนกลางใหม่ไม่สำเร็จ การรันรอบนี้จะใช้ปุ่มลัดเดิมต่อ และจะลองใช้ค่าใหม่หลังรีสตาร์ต
