batch:
  ? "* 表示当前用户使用独立参数\n"
  : "* indica que este usuario utiliza parámetros propios\n"
  <b>选择执行单元</b>: <b>Seleccionar unidades de ejecución</b>
  <b>选择执行脚本</b>: <b>Seleccionar scripts</b>
  Profile 定义不可用: Las definiciones de perfil no están disponibles
  Profile 定义已不存在: Las definiciones de perfil ya no existen
  '[批量] 以下已勾选脚本当前不可用，本次不会执行：': '[Lote] Los siguientes scripts seleccionados no están disponibles y no se ejecutarán:'
  '{name}（已失效）': '{name} (obsoleto)'
  不指定: Sin especificar
  人: usuarios
  人无数值，置于末尾: usuarios sin valor al final
  全局任务参数: Parámetros globales de tareas
  单个执行单元时跳过上述生命周期工作流: Omitir los flujos de ciclo de vida anteriores cuando haya una sola unidad de ejecución
  单元: Unidades
  单元候选: Unidades candidatas
  单元候选（{key}）: Unidades candidatas ({key})
  单元候选（用户名）: Unidades candidatas (nombre de usuario)
  可见任务: Tareas visibles
  可见用户: Usuarios visibles
  定义主页面右键「按 Profile 排序」用哪个键、什么方向。排完的顺序只属于本次运行，不写回这里: Define qué clave y dirección usa la opción «Ordenar por perfil» del menú contextual en la ventana principal. El orden resultante solo aplica a esa ejecución y no se guarda aquí
  实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流: Cuando solo se seleccione una unidad de usuario, ejecutar las tareas directamente sin llamar a los flujos de ciclo de vida
  实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流: Cuando solo se seleccione una unidad de usuario, ejecutar las tareas directamente; las unidades de atributo siempre ejecutan el flujo de preparación
  对应的任务脚本已不存在；取消勾选并保存即可从列表移除: El script de tarea correspondiente ya no existe; desmárcalo y guarda para quitarlo de la lista
  工作流文件 (*.wf): Archivos de flujo de trabajo (*.wf)
  已按 Profile 排序用户: Usuarios ordenados por perfil
  异常恢复: Recuperación ante anomalías
  ? '当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。'
  : 'Programando por «{key}», pero el flujo de preparación de elemento «{wf}» no selecciona ni devuelve el nombre de usuario de la unidad. Usa batch/prepare_item_by_attr.wf o declara #% batch_unit_prepare: true en tu propio flujo y devuelve username.'
  当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。: Programación por atributo activa; configura primero el flujo de preparación de elemento en «Herramientas → Configuración de lotes».
  恢复默认顺序: Restaurar orden predeterminado
  手机端正在执行任务，请暂停或者结束任务: El teléfono está ejecutando una tarea; páusala o detenla primero
  ? "手机端正在执行任务，请暂停或者结束任务。\n\n设备返回：{detail}"
  : "El teléfono está ejecutando una tarea; páusala o detenla primero.\n\nRespuesta del dispositivo: {detail}"
  ? "执行用户：{username}\n参数来源：{source}"
  : "Usuario en ejecución: {username}\nOrigen de parámetros: {source}"
  ? "执行用户：{username}\n点击查看本轮任务参数"
  : "Usuario en ejecución: {username}\nHaz clic para ver los parámetros de esta ronda"
  执行顺序: Orden de ejecución
  批量设置: Ajustes de lote
  批量配置: Configuración de lotes
  拖动可临时调整实际执行顺序: Arrastra para ajustar temporalmente el orden real de ejecución
  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: Arrastra para ajustar el orden real de ejecución; haz clic derecho para restaurar el orden predeterminado, mezclar u ordenar por perfil; el orden en Configuración de lotes es solo el orden inicial
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: Arrastra para ajustar el orden real de ejecución; haz clic derecho para restaurar el orden predeterminado o mezclar; el orden en Configuración de lotes es solo el orden inicial
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: Arrastra para ajustar el orden real de ejecución; haz clic derecho para restaurar el orden predeterminado o mezclar; el orden en Configuración de lotes es solo el orden inicial
  指定顺序排序: Ordenar según orden especificado
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: 'No aplicable al programar por atributo: un valor de atributo puede corresponder a varios usuarios, por lo que el flujo de preparación debe seleccionar y devolver el nombre de usuario y el ciclo de vida siempre se ejecuta. Al volver a «Nombre de usuario» se restaura tu selección original'
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: Programar por nombre de usuario o por un atributo del perfil. Determina el contenido de la lista de candidatos en la ventana principal, el contrato del ciclo de vida y la validez del flujo de preparación de elementos; pertenece a la definición del grupo de configuración
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: 'La clave de ordenación pertenece a la definición del grupo de configuración; haz clic derecho en la lista de usuarios y elige «Ordenar por perfil» para ordenar una vez: el orden solo aplica a esa ejecución'
  新建配置: Nueva configuración
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: Se utiliza para devolver el juego a la pantalla de inicio de sesión tras una pausa anómala en modo desatendido. La casilla «Desatendido» de la ventana principal requiere configurarlo antes
  无法开始批量任务: No se puede iniciar la tarea por lotes
  暂无启用的单元，请到「单元」页勾选: No hay unidades habilitadas; marca alguna en la pestaña «Unidades»
  暂无配置组，请先通过「工具 → 批量配置」添加: No hay grupos de configuración; añade uno en «Herramientas → Configuración de lotes»
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: 'Márcalo cuando vayas a dejar el equipo desatendido durante mucho tiempo: si una tarea se pausa por una anomalía, no esperará, se registrará como fallida y se omitirá; después, el «flujo de recuperación» del grupo devolverá el juego a la pantalla de inicio de sesión y continuará con la siguiente tarea. Las confirmaciones, entradas y selecciones seguirán esperando interacción del usuario'
  条目准备: Preparación de elemento
  条目准备工作流不支持当前属性调度，请到批量配置中修改: El flujo de preparación de elemento no admite la programación por atributo actual; cámbialo en Configuración de lotes
  条目收尾: Cierre de elemento
  浏览...: Examinar...
  点击查看本轮任务参数: Haz clic para ver los parámetros de esta ronda
  用户独立参数: Parámetros propios del usuario
  确定删除当前批量配置吗？: ¿Seguro que quieres eliminar la configuración de lote actual?
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: La primera columna controla si aparece en la ventana principal; la segunda controla si queda marcado en la carga inicial o al pulsar «Restaurar predeterminados». Arrastra para ajustar el orden inicial
  脚本: Script
  脚本候选: Scripts candidatos
  请到「单元」页至少勾选一个执行单元: Marca al menos una unidad de ejecución en la pestaña «Unidades»
  请到「脚本」页至少勾选一个脚本: Marca al menos un script en la pestaña «Scripts»
  请在「工具 → 批量配置」中配置条目准备工作流: Configura el flujo de preparación de elemento en «Herramientas → Configuración de lotes»
  请至少勾选一个脚本: Marca al menos un script
  请选择 workflows 目录下的 .wf 文件: Selecciona un archivo .wf dentro de la carpeta workflows
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: La unidad de programación pertenece a la definición del grupo de configuración; cámbiala en «Herramientas → Configuración de lotes»
  选择工作流文件: Seleccionar archivo de flujo de trabajo
  配置名称已存在: El nombre de configuración ya existe
  重命名配置: Renombrar configuración
  随机打乱顺序: Mezclar orden
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: 'Configura primero el «flujo de recuperación» de este grupo en «Herramientas → Configuración de lotes»: el modo desatendido depende de él para devolver el juego a la pantalla de inicio de sesión tras una pausa anómala'
  默认执行: Ejecutar por defecto
  配置名称: Nombre de la configuración
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: En destinos Android, el lote puede iniciarse en orientación vertical siempre que al intercambiar ancho y alto coincida con la proporción del lienzo de diseño. Tras iniciar, el «flujo de recuperación» del grupo devuelve el juego a la pantalla de inicio de sesión y luego el «flujo de preparación de elemento» vuelve a entrar al juego. Ambos flujos deben configurarse en «Herramientas → Configuración de lotes»
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: 'Configura primero el «flujo de recuperación» y el «flujo de preparación de elemento» de este grupo en «Herramientas → Configuración de lotes»: el inicio en vertical devuelve primero el juego a la pantalla de inicio de sesión, y sin preparación de elemento no podrá volver a entrar al juego'
  允许竖屏需要先配置条目准备工作流: Permitir vertical requiere configurar antes el flujo de preparación de elemento
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: Al iniciar con «Permitir vertical», primero el flujo de recuperación devuelve el cliente a la pantalla de inicio de sesión y se necesita el flujo de preparación de elemento para volver al juego. Configura primero el flujo de preparación de elemento para este grupo en «Herramientas → Configuración de lotes».
