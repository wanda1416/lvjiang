  律匠 移动设备诊断报告: Informe de diagnóstico de dispositivo móvil de LvJiang
  恒等（未标定）: Identidad (sin calibrar)
  截图坐标与输入坐标一致。非 20:9 机型若点位整体偏移，在手机端悬浮球里做一次屏幕标定: Las coordenadas de captura y entrada coinciden. En dispositivos que no sean 20:9 con desplazamiento general, realiza una calibración de pantalla desde la bola flotante del teléfono
  手势、点击与截图都依赖它。在 app 内按引导开启；部分系统会在「受限设置」里额外拦一道，需要先允许: Los gestos, toques y capturas dependen de él. Actívalo siguiendo la guía en la app; algunos sistemas lo bloquean en «Ajustes restringidos», donde deberás permitirlo primero
  手势测试: Prueba de gestos
  手势测试失败：{err}: 'Error en la prueba de gestos: {err}'
  手势测试已取消: Prueba de gestos cancelada
  手机: Teléfono
  手机内置任务，可独立配置和执行，无需先连接 PC。可向手机下发脚本、配置和 Profile，也可独立回传手机历史与日志。: Tareas integradas en el teléfono, configurables y ejecutables sin conectar al PC. Puedes enviar scripts, configuraciones y perfiles al teléfono, y subir su historial y registros por separado.
  手机历史、日志和结果保留；回传需单独操作。确认下发？: Se conservan el historial, los registros y los resultados del teléfono; la subida se realiza por separado. ¿Confirmar el envío?
  手机执行用户：{user}；最近同步：{time}: 'Usuario en ejecución del teléfono: {user}; última sincronización: {time}'
  手机缺失 {count} 个附件，相关历史不完整；请检查手机原文件。: Faltan {count} adjuntos en el teléfono; el historial relacionado está incompleto. Revisa los archivos originales en el teléfono.
  手机要访问的本机地址。多网卡时选与手机同网段的那个；换地址只改链接，不会中断共享: Dirección local a la que accederá el teléfono. Con varias interfaces de red, elige la de la misma subred que el teléfono; cambiarla solo actualiza el enlace y no interrumpe la compartición
  执行任务: Ejecutar tarea
  执行用户（手机资料）: Usuario en ejecución (perfil del teléfono)
