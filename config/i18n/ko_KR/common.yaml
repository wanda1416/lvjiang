about:
  仅限非商业使用: 비상업적 용도로만 사용
  律匠: 뤼장 (LvJiang)
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: 본 프로젝트는 학습 및 기술 연구 목적으로만 제공됩니다. 자동화 도구를 사용하여 게임을 조작하는 행위는 해당 게임의 이용약관을 위반할 수 있으며, 이로 인해 발생하는 모든 결과는 사용자가 직접 책임집니다.
  本项目源码公开、免费使用: 본 프로젝트는 소스 코드가 공개되어 있으며 무료로 사용할 수 있습니다
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: 창 위치 지정 캡처 → 영역 주석 → OCR 인식 → 워크플로 실행
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: 소프트웨어는 어떠한 보증도 없이 있는 그대로 제공되며, 제작자는 본 소프트웨어 사용으로 인해 발생한 어떠한 손실에 대해서도 책임을 지지 않습니다.
  通用视觉 RPA 引擎: 범용 비주얼 RPA 엔진
