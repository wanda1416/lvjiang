  "实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。": "ฟีเจอร์ทดลอง: สคริปต์จำนวนมากยังไม่สามารถทำงานในโหมดนี้ได้ และไม่รับแจ้งปัญหาการใช้งานไม่ได้สำหรับฟีเจอร์นี้ การจับภาพเบื้องหลังช่วยให้จับภาพหน้าต่างเกมได้แม้ถูกหน้าต่างอื่นบัง แต่จะช้ากว่าการจับภาพเบื้องหน้าเล็กน้อย โดยต้องใช้ร่วมกับการป้อนข้อมูลเบื้องหลัง และหากย่อหน้าต่างลงจะไม่สามารถรับภาพได้ ค่านี้เป็นค่าเริ่มต้น หน้าต่างหลักจะเลือก \"จับภาพเบื้องหลัง\" อัตโนมัติเมื่อติ๊ก \"โหมดเบื้องหลัง\" เท่านั้น และเปลี่ยนได้ตลอดเวลาระหว่างการทำงาน"
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'ฟีเจอร์ทดลอง: โทรศัพท์ต้องติดตั้งแอป LvJiang และเปิดบริการการเข้าถึง โดยจะเปลี่ยนเฉพาะช่องทางการแตะและการปัด ไม่เปลี่ยนวิธีจับภาพหน้าจอ หากเชื่อมต่อไม่สำเร็จจะสลับกลับไปใช้ ADB shell input'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: ยังไม่มีข้อมูลการเชื่อมต่อประเภทนี้ กรุณาเชื่อมต่ออุปกรณ์หรือระบุตำแหน่งหน้าต่างในหน้าต่างหลักก่อน
