map_manager:
  HUD 场景: Cảnh HUD
  HUD 场景绑定（坐标在场景编辑器里标定）: Liên kết cảnh HUD (hiệu chỉnh tọa độ trong Trình chỉnh sửa cảnh)
  "{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。": "{scene}.{point} nằm ngoài vùng bản đồ nhỏ; nhận diện hướng tạm dùng tâm vùng."
  "⚠ 缺失：{key}": "⚠ Thiếu: {key}"
  不能删除: Không thể xóa
  从当前画面截取: Chụp từ khung hình hiện tại
  "会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。": "Đồng thời tạo cảnh HUD map_<key>; sau đó hiệu chỉnh vùng bản đồ nhỏ và bản đồ lớn trong Trình chỉnh sửa cảnh."
  保存当前画面为探查图片: Lưu khung hình hiện tại làm ảnh khảo sát
  先登记地域: Đăng ký khu vực trước
  删除地图: Xóa bản đồ
  "删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。": "Xóa bản đồ \"{name}\" cùng bản đồ nền? Cảnh HUD map_{key} được tạo tự động cũng sẽ bị xóa theo."
  删除选中 POI: Xóa POI đã chọn
  删除选中地域: Xóa khu vực đã chọn
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: Chỉ đánh dấu sau khi thực sự hoàn thiện toàn bộ bản đồ; ghép ảnh thành công không có nghĩa là đã thu thập đủ cả bản đồ.
  只读，请先“复制到本地”再修改: "Chỉ đọc, vui lòng \"Sao chép về cục bộ\" trước khi chỉnh sửa"
  "图片文件 (*.png *.jpg *.jpeg *.bmp *.webp)": "Tệp hình ảnh (*.png *.jpg *.jpeg *.bmp *.webp)"
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: Nhấp lên bản đồ nền để thêm POI; nhấp vào điểm đánh dấu có sẵn để chọn. Tọa độ là tọa độ chuẩn hóa của bản đồ nền.
  地图 key: Khóa bản đồ
  地域与探查: "Khu vực & Khảo sát"
  地域仍被使用: Khu vực vẫn đang được sử dụng
  地域名称: Tên khu vực
  坐标必须在 0–1 之间: Tọa độ phải nằm trong khoảng 0–1
  基本信息: Thông tin cơ bản
  基本信息与绑定: "Thông tin cơ bản & Liên kết"
  复制到本地: Sao chép về cục bộ
  大地图底图: Bản đồ nền đại bản đồ
  大地图正北朝上: Bản đồ lớn hướng Bắc lên trên
  导入底图文件…: Nhập tệp bản đồ nền…
  导航模式: Chế độ điều hướng
  小写字母开头，字母/数字/下划线: "Bắt đầu bằng chữ thường; gồm chữ cái, chữ số, dấu gạch dưới"
  小地图朝向: Hướng bản đồ nhỏ
  尖端（退化）: Đầu mũi nhọn (suy biến)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: "Chưa nhập bản đồ nền: hãy \"Hiệu chỉnh HUD…\" vùng bản đồ lớn trước, rồi nhập tại trang \"Bản đồ nền & POI\""
  展示: Hiển thị
  底图与 POI: "Bản đồ nền & POI"
  底图区域未标定: Chưa hiệu chỉnh vùng bản đồ nền
  底图可标注 POI；空白部分尚未探查。: Có thể đánh dấu POI trên bản đồ nền; phần trống là vùng chưa khảo sát.
  底图已完成整图探查: Bản đồ nền đã hoàn tất khảo sát toàn bản đồ
  底图编码失败: Mã hóa bản đồ nền thất bại
  底图：局部探查，待补齐: "Bản đồ nền: khảo sát cục bộ, cần bổ sung"
  底图：整图探查已完成: "Bản đồ nền: đã hoàn tất khảo sát toàn bản đồ"
  当前地图有未保存的修改，放弃吗？: "Bản đồ hiện tại có thay đổi chưa lưu, bạn có muốn hủy bỏ không?"
  当前布局不存在，未能定位地图区域。: "Bố cục hiện tại không tồn tại, không thể định vị vùng bản đồ."
  "当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。": "Bố cục hiện tại chưa hiệu chỉnh {scene}.{point}, nhận diện hướng tạm dùng tâm vùng bản đồ nhỏ."
  "当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。": "Bố cục hiện tại chưa hiệu chỉnh {scene}.{region}, không thể cắt vùng bản đồ."
  当前无法读取布局，未能定位地图区域。: "Hiện không thể đọc bố cục, không thể định vị vùng bản đồ."
  当前未选择地图，无法解析地图区域。: "Chưa chọn bản đồ, không thể phân tích vùng bản đồ."
  截取当前画面: Chụp khung hình hiện tại
  截图所属地域: Khu vực của ảnh chụp
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: "Đăng ký khu vực theo bộ chọn khu vực trong trò chơi. Ảnh khảo sát và bản đồ nền được lưu riêng, có thể chuyển đổi xem ở trang bản đồ nền."
  探查: Khảo sát
  探查图片仅供查看: Ảnh khảo sát chỉ để xem
  探查图片缺失或无法解码: Thiếu ảnh khảo sát hoặc không thể giải mã
  探查截图用于查看；POI 只在底图上编辑。: Ảnh chụp khảo sát dùng để xem; POI chỉ chỉnh sửa trên bản đồ nền.
  搜索窗口（相对短边）: Cửa sổ tìm kiếm (theo cạnh ngắn)
  新地域: Khu vực mới
  新建地图: Tạo bản đồ mới
  无效的 POI: POI không hợp lệ
  无法获取截图: Không thể lấy ảnh chụp màn hình
  "无法解码图片: {path}": "Không thể giải mã hình ảnh: {path}"
  无法读取图片: Không thể đọc hình ảnh
  是否仍然使用整帧作为底图？: "Vẫn sử dụng toàn bộ khung hình làm bản đồ nền?"
  最小面积（像素）: Diện tích tối thiểu (pixel)
  "朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px": "Hướng {deg:.1f}°　Độ tin cậy {conf:.2f}　Phương pháp: {method}　Diện tích {area}px"
  未保存: Chưa lưu
  未取得当前画面: Chưa lấy được khung hình hiện tại
  未找到箭头：检查颜色阈值或小地图区域标定: "Không tìm thấy mũi tên: hãy kiểm tra ngưỡng màu hoặc hiệu chỉnh vùng bản đồ nhỏ"
  "来源：{layer}": "Nguồn: {layer}"
  标定 HUD…（打开场景编辑器）: Hiệu chỉnh HUD… (mở Trình chỉnh sửa cảnh)
  标识: Định danh
  没有地图。点击“新建”创建一张。: "Chưa có bản đồ nào. Bấm \"Tạo mới\" để tạo."
  添加地域: Thêm khu vực
  添加失败: Thêm thất bại
  添加探查图片: Thêm ảnh khảo sát
  添加探查图片…: Thêm ảnh khảo sát…
  燕尾缺口: Khuyết đuôi én
  "留空 = key": "Để trống = key"
  种类: Loại
  箭头颜色与搜索参数（保存到地图）: Màu mũi tên và tham số tìm kiếm (lưu vào bản đồ)
  识别结果: Kết quả nhận diện
  该地域已有探查图片，不能直接删除。: "Khu vực này đã có ảnh khảo sát, không thể xóa trực tiếp."
  请选择截图所属地域。: Vui lòng chọn khu vực mà ảnh chụp này thuộc về.
  读取失败: Đọc thất bại
  读取当前布局失败，未能定位地图区域。: "Đọc bố cục hiện tại thất bại, không thể định vị vùng bản đồ."
  载入截图文件…: Tải tệp ảnh chụp…
  "载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。": "Sau khi tải ảnh chụp toàn màn hình trong trò chơi, hệ thống sẽ cắt theo vùng bản đồ nhỏ đã hiệu chỉnh của bố cục hiện tại và phân tích mũi tên màu vàng lõm ở giữa. 0° = chính Bắc (phía trên màn hình), chiều kim đồng hồ là dương."
  适应窗口: Vừa cửa sổ
  选择局内截图: Chọn ảnh chụp trong trò chơi
  选择底图: Chọn bản đồ nền
  重新识别: Nhận diện lại
  （尚未载入截图）: (chưa tải ảnh chụp)
  "POI key 重复: {key}": "Trùng khóa POI: {key}"
maps:
  "POI key 重复: {key}": "Trùng khóa POI: {key}"
  "地图 key 已存在: {key}": "Khóa bản đồ đã tồn tại: {key}"
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: "Tính năng chụp màn hình không khả dụng, vui lòng định vị cửa sổ hoặc kết nối thiết bị trong cửa sổ chính trước"
