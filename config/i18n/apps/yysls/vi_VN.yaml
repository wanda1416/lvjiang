  "勾选参与候选筛选的玩法；装备只要有一条玩法达标就保留": "Đánh dấu lối chơi tham gia lọc ứng viên; trang bị chỉ cần đạt chuẩn một lối chơi là được giữ lại"
  "勾选后，满承音假设会把本件当作承音装备计算；只影响计算，不改变装备的承音状态": "Khi đánh dấu, giả định Đầy Thừa Âm sẽ tính món này như trang bị Thừa Âm; chỉ ảnh hưởng tính toán, không đổi trạng thái Thừa Âm thật"
  "勾选表示该词条是调律过程中调出的，非扫描时已有": "Đánh dấu nghĩa là dòng thuộc tính này xuất hiện trong quá trình Điều Luật, không có sẵn khi quét"
  "勾选该词条可出现的装备部位（全选 = 全部）": "Đánh dấu vị trí trang bị mà dòng thuộc tính này có thể xuất hiện (Chọn tất cả = Tất cả)"
  "匹配关键字": "Từ khóa khớp"
