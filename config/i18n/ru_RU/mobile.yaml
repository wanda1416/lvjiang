  "局域网扫描用于发现已开启无线 ADB 的设备；本机端口扫描用于发现只监听 127.0.0.1 的模拟器。\n扫描只建立 ADB 连接，不会切换主界面的执行目标。": "Сканирование локальной сети находит устройства с включённым беспроводным ADB; сканирование локальных портов находит эмуляторы, слушающие только 127.0.0.1.\nСканирование лишь устанавливает ADB-подключение и не меняет цель выполнения в главном окне."
