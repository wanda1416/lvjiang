  "勾选参与候选筛选的玩法；装备只要有一条玩法达标就保留": "Отметьте стили игры для фильтрации кандидатов; снаряжение сохраняется, если подходит хотя бы одному стилю"
  "勾选后，满承音假设会把本件当作承音装备计算；只影响计算，不改变装备的承音状态": "Если отмечено, допущение полного Чэнъинь считает этот предмет прошедшим Чэнъинь; влияет только на расчёт, не меняя реальное состояние"
  "勾选表示该词条是调律过程中调出的，非扫描时已有": "Отметьте, если этот аффикс получен во время настройки, а не присутствовал при сканировании"
  "勾选该词条可出现的装备部位（全选 = 全部）": "Отметьте слоты снаряжения, на которых может появляться этот аффикс (Выбрать все = Все)"
