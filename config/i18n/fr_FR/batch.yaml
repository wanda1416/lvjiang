  定义主页面右键「按 Profile 排序」用哪个键、什么方向。排完的顺序只属于本次运行，不写回这里: Définit la clé de profil et le sens utilisés par « Trier par profil » dans le menu contextuel de la fenêtre principale. L'ordre trié ne s'applique qu'à cette exécution et n'est pas enregistré ici
  实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流: Lorsqu'une seule unité utilisateur est sélectionnée, exécuter directement les tâches sans appeler les workflows de cycle de vie
  实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流: Lorsqu'une seule unité utilisateur est sélectionnée, exécuter directement les tâches ; les unités par attribut exécutent toujours le workflow de préparation
  对应的任务脚本已不存在；取消勾选并保存即可从列表移除: Le script de tâche correspondant n'existe plus ; décochez-le et enregistrez pour le retirer de la liste
  工作流文件 (*.wf): Fichiers de workflow (*.wf)
  已按 Profile 排序用户: Utilisateurs triés par profil
  异常恢复: Récupération autonome
  ? '当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。'
  : 'Planification par « {key} », mais le workflow de préparation d''élément « {wf} » ne sélectionne ni ne renvoie le nom d''utilisateur de cette unité. Utilisez batch/prepare_item_by_attr.wf ou déclarez #% batch_unit_prepare: true dans votre workflow et renvoyez username.'
  当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。: 'Planification par attribut : configurez d''abord le workflow de préparation d''élément dans « Outils → Configuration par lots ».'
