  区域批量识别: Stapel-Bereichserkennung
  "区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。\n这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。": "Die Stapel-Bereichserkennung fügt mehrere Textbereiche auf einer Leinwand zusammen und ruft OCR nur einmal auf.\nDiese Parameter steuern die Gesamtgröße; Änderungen greifen nach dem Speichern ab der nächsten Erkennung."
  原始文本: Rohtext
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: Die OCR-Einstellungen enthalten ungespeicherte Änderungen. Beenden und verwerfen?
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*): Bilddateien (*.png *.jpg *.jpeg *.bmp *.webp);;Alle Dateien (*)
  已撤销未保存的清洗规则修改: Ungespeicherte Änderungen an den Bereinigungsregeln verworfen
  已撤销未保存的识别配置修改: Ungespeicherte Änderungen an der Erkennungskonfiguration verworfen
  已清除选框: Auswahl aufgehoben
  拼图画布宽、高的最小值。过小会使窄区域被 OCR 检测器大幅放大。: Mindestbreite und -höhe der zusammengefügten Leinwand. Zu kleine Werte führen dazu, dass schmale Bereiche vom OCR-Detektor stark hochskaliert werden.
  撤销清洗规则: Bereinigungsregeln rückgängig machen
  撤销识别配置: Erkennungskonfiguration rückgängig machen
