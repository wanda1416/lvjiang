  "未单独标定点击区域时，落点框从区域中心向四边延伸的比例。0.25 = 落点覆盖区域中间的一半；必须小于 0.5": "Khi chưa hiệu chuẩn riêng vùng nhấp, đây là tỷ lệ khung điểm rơi mở rộng từ tâm vùng ra bốn cạnh. 0.25 = điểm rơi phủ một nửa ở giữa vùng; phải nhỏ hơn 0.5"
