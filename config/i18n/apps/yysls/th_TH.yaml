  "「{target}」在 {level} 级还没有毕业率方案，暂时无法比较最优组合。\n\n现有可用等级：{levels}。": "\"{target}\" ยังไม่มีแผนอัตราจบชุดที่เลเวล {level} จึงยังไม่สามารถเปรียบเทียบชุดที่เหมาะสมที่สุดได้\n\nเลเวลที่ใช้ได้ในขณะนี้: {levels}"
  「{target}」还没有可用的毕业率方案，导入后才能比较最优组合。: '"{target}" ยังไม่มีแผนอัตราจบชุดที่ใช้ได้ โปรดนำเข้าก่อนจึงจะเปรียบเทียบชุดที่เหมาะสมที่สุดได้'
  "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。\n不会改写装备；进入后的调律处理仍使用完整实际词条。": "ละเว้นออฟชันอื่นที่มีอยู่เฉพาะตอนตรวจเกณฑ์ปรับจูน โดยใช้ศักยภาพสูงสุดของออฟชันแรกตัดสินว่าจะเข้าสู่ขั้นตอนปรับจูนหรือไม่\nไม่แก้ไขออฟชันของอุปกรณ์ หลังเข้าสู่ขั้นตอนการจัดการปรับจูนยังคงใช้ออฟชันจริงทั้งหมด"
  "本赛季仍可承音的最低装备等级。低于它的装备本赛季已被抛弃，既不能原地承音也不能承音到下一阶，因此不参与满等级/满承音假设。\n这与等级配置里的「支持承音」不是一回事：后者描述该等级的装备当年是否允许承音。": "เลเวลอุปกรณ์ต่ำสุดที่ยังเฉิงอินได้ในซีซันนี้ อุปกรณ์ที่ต่ำกว่านี้ถูกปลดระวางในซีซันนี้ ไม่สามารถเฉิงอินกับที่หรือขึ้นขั้นถัดไปได้ จึงไม่เข้าร่วมสมมติฐานเลเวลเต็ม/เฉิงอินเต็ม\nค่านี้ไม่เหมือนกับ \"รองรับเฉิงอิน\" ในตั้งค่าเลเวล ซึ่งอธิบายว่าอุปกรณ์เลเวลนั้นเคยอนุญาตให้เฉิงอินในสมัยนั้นหรือไม่"
