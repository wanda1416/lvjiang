  '✅ 支持输入时间线（并发手势）：声明 #% requires: [device_gesture] 的脚本可以运行': '✅ Поддерживается временная шкала ввода (одновременные жесты): скрипты с #% requires: [device_gesture] могут выполняться'
  '❌ 不支持输入时间线：声明 #% requires: [device_gesture] 的脚本会在加载时被拒绝，需要先开启无障碍服务': '❌ Временная шкала ввода не поддерживается: скрипты с #% requires: [device_gesture] будут отклонены при загрузке; сначала включите службу специальных возможностей'
  上一设备操作已完成；当前设备已切换，请刷新状态: Операция с предыдущим устройством завершена; текущее устройство переключено — обновите статус
  "下发全部配置、脚本与用户资料，仅按所选方案过滤布局与图库；保留手机历史、日志和结果。": "Отправляет все конфигурации, скрипты и профили пользователей, фильтруя только макеты и библиотеки эталонов по выбранному плану; история, журналы и результаты на телефоне сохраняются."
