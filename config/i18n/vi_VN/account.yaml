account_dialog:
  上行: Tải lên
  下列用户的数据将以云端快照为准，本机数据会被覆盖：: "Dữ liệu của các người dùng sau sẽ lấy theo bản chụp đám mây; dữ liệu cục bộ sẽ bị ghi đè:"
  下行: Tải xuống
  "云端基线是空的。<br>来源：{origin}<br>时间：{created}<br>条目：0<br><br>继续将用本机当前总览补上基线，不会备份或替换本地用户。": "Mốc cơ sở trên đám mây đang trống.<br>Nguồn: {origin}<br>Thời gian: {created}<br>Số mục: 0<br><br>Tiếp tục sẽ dùng bản tổng quan hiện tại trên máy này để điền mốc cơ sở; sẽ không sao lưu hay thay thế người dùng cục bộ."
  ? "云端已有快照。<br>来源：{origin}<br>时间：{created}<br>条目：{count}{warning}<br><br>继续将先把本地用户、总览定义与总览数据备份到 config/session/_backup-*，再拉取云端数据。"
  : "Đã có bản chụp trên đám mây.<br>Nguồn: {origin}<br>Thời gian: {created}<br>Số mục: {count}{warning}<br><br>Tiếp tục sẽ sao lưu người dùng cục bộ, định nghĩa tổng quan và dữ liệu tổng quan vào config/session/_backup-* trước khi kéo dữ liệu từ đám mây."
  修改密码: Đổi mật khẩu
  修改密码…: Đổi mật khẩu…
  创建快照: Tạo bản chụp
  初始同步: Đồng bộ ban đầu
  在浏览器中打开注册页面: Mở trang đăng ký trong trình duyệt
  在浏览器打开自助操作页：修改密码、导出数据、清除云端数据、注销账号: "Mở trang tự phục vụ trong trình duyệt: đổi mật khẩu, xuất dữ liệu, xóa dữ liệu đám mây, xóa tài khoản"
  定义: Định nghĩa
  密码: Mật khẩu
  ? "将清空云端的定义、用户、文档与总览数据（账号与登录态保留）。\n此操作不可恢复；本地数据不会被删除。"
  : "Thao tác này sẽ xóa sạch định nghĩa, người dùng, tài liệu và dữ liệu tổng quan trên đám mây (tài khoản và trạng thái đăng nhập được giữ lại).\nThao tác không thể hoàn tác; dữ liệu cục bộ sẽ không bị xóa."
  已取消覆盖：本机数据未改动，profile 同步未启用。: "Đã hủy ghi đè: dữ liệu cục bộ không thay đổi, đồng bộ hồ sơ chưa được bật."
  平台: Nền tảng
  当前密码: Mật khẩu hiện tại
  当前设备不是初始同步设备: Thiết bị này không phải thiết bị đồng bộ ban đầu
  总览: Tổng quan
  ? "把本机当前全部角色数据上传为云端总览基线。\n初始同步会自动创建一次；之后需要时手动点。"
  : "Tải toàn bộ dữ liệu nhân vật hiện tại trên máy này lên làm mốc cơ sở tổng quan trên đám mây.\nĐồng bộ ban đầu sẽ tự động tạo một lần; sau đó có thể bấm thủ công khi cần."
  操作未完成: Thao tác chưa hoàn tất
  数据同步: Đồng bộ dữ liệu
  文档: Tài liệu
  新密码至少 8 位: Mật khẩu mới phải có ít nhất 8 ký tự
  新密码（至少 8 位）: Mật khẩu mới (ít nhất 8 ký tự)
  显示密码: Hiện mật khẩu
  "最近同步时间：{}": "Lần đồng bộ gần nhất: {}"
  最近活跃: Hoạt động gần nhất
  未知设备: Thiết bị không xác định
  检测到云端覆盖待确认；点「立即同步」处理。: "Phát hiện yêu cầu ghi đè từ đám mây đang chờ xác nhận; bấm \"Đồng bộ ngay\" để xử lý."
  正在修改密码…: Đang đổi mật khẩu…
  正在同步…: Đang đồng bộ…
  正在备份并应用云端快照…: Đang sao lưu và áp dụng bản chụp đám mây…
  正在清除同步…: Đang xóa đồng bộ…
  正在登录…: Đang đăng nhập…
  注册: Đăng ký
  清除同步: Xóa đồng bộ
  登出: Đăng xuất
  登录: Đăng nhập
  登录后可同步角色名册、文档与总览数据: "Đăng nhập để đồng bộ danh sách nhân vật, tài liệu và dữ liệu tổng quan"
  确定让该设备下线？该设备上的全部会话会立即失效。: "Bạn có chắc muốn đăng xuất thiết bị này? Mọi phiên trên thiết bị sẽ hết hiệu lực ngay lập tức."
  "确认后会先把本机 profile 数据备份到 config/session/_sync-backup-<时间戳>/，再应用云端快照；可在该目录恢复。": "Sau khi xác nhận, dữ liệu hồ sơ cục bộ sẽ được sao lưu vào config/session/_sync-backup-<dấu thời gian>/ trước khi áp dụng bản chụp đám mây; bạn có thể khôi phục từ thư mục đó."
  立即同步: Đồng bộ ngay
  自助服务…: Tự phục vụ…
  设备登出: Đăng xuất thiết bị
  设备管理: Quản lý thiết bị
  复制ID: Sao chép ID
  复制这台设备的 ID；重置密码时管理员凭它核对身份，不要随意泄露: "Sao chép ID của thiết bị này; quản trị viên dùng nó để xác minh danh tính khi đặt lại mật khẩu, không chia sẻ tùy tiện"
  "当前设备ID：{id}": "ID thiết bị hiện tại: {id}"
  （请勿随意向他人泄露该 id，这是重置密码的唯一凭据）: (Không tiết lộ ID này cho người khác; đây là chứng thực duy nhất để đặt lại mật khẩu)
  请先点「初始同步」建立同步状态: "Vui lòng bấm \"Đồng bộ ban đầu\" trước để thiết lập trạng thái đồng bộ"
  请输入密码: Vui lòng nhập mật khẩu
  请输入账户: Vui lòng nhập tài khoản
  "读取本机总览失败：{error}": "Đọc bản tổng quan cục bộ thất bại: {error}"
  账户: Tài khoản
  这是本机：下线后需要重新登录。: "Đây là máy hiện tại: bạn sẽ cần đăng nhập lại sau khi đăng xuất."
  进度: Tiến độ
  退出所有设备: Đăng xuất tất cả thiết bị
  退出登录: Đăng xuất
  通道: Kênh
  隐藏密码: Ẩn mật khẩu
  ? "首次使用：建立本机与云端的同步状态。云端已有数据时，会先把本地\n用户、总览定义与总览数据备份到 config/session/_backup-* 再拉取云端。"
  : "Lần đầu sử dụng: thiết lập trạng thái đồng bộ giữa máy này và đám mây. Nếu đám mây đã có dữ liệu, hệ thống sẽ sao lưu\nngười dùng, định nghĩa tổng quan và dữ liệu tổng quan cục bộ vào config/session/_backup-* trước khi kéo từ đám mây."
  "；等 {} 项": "; và {} mục khác"
  已恢复每分钟自动同步: Đã khôi phục tự động đồng bộ mỗi phút
  已暂停自动同步；手动「立即同步」仍可用: "Đã tạm dừng tự động đồng bộ; nút \"Đồng bộ ngay\" thủ công vẫn khả dụng"
  恢复同步: Tiếp tục đồng bộ
  暂停同步: Tạm dừng đồng bộ
  暂停后不再每分钟自动同步（心跳与在线状态不受影响）。手动「立即同步」仍可用；重启后保持暂停状态。: "Sau khi tạm dừng, sẽ ngừng tự động đồng bộ mỗi phút (tín hiệu hoạt động và trạng thái trực tuyến không bị ảnh hưởng). Nút \"Đồng bộ ngay\" thủ công vẫn khả dụng; trạng thái tạm dừng được giữ sau khi khởi động lại."
common:
  用户: Người dùng
