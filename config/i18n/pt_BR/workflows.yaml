  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: Encerra um aplicativo Android ou PC conforme o registro e confirma o encerramento do processo
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: Inicia um aplicativo Android ou PC conforme o registro e confirma o início do processo
