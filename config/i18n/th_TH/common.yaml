mobile:
  ADB 直传到设备: ส่งตรงไปยังอุปกรณ์ผ่าน ADB
  Android 安装包 (*.apk): แพ็กเกจติดตั้ง Android (*.apk)
  Shizuku: Shizuku
  '{label}回传失败：{message}': 'ส่งกลับ {label} ไม่สำเร็จ: {message}'
  '{label}有 {count} 条旧记录缺少可确认的手机来源，未导入；原记录保留在手机。': '{label} มีบันทึกเก่า {count} รายการที่ไม่มีข้อมูลต้นทางมือถือที่ยืนยันได้ จึงไม่ได้นำเข้า บันทึกต้นฉบับยังคงอยู่บนมือถือ'
  '{label}：新增 {count} 条记录': '{label}: เพิ่มบันทึกใหม่ {count} รายการ'
  '{n} 路': '{n} ช่องทาง'
  ℹ️ shell 通道不可用（Shizuku 未授权）。普通点击与截图不受影响: ℹ️ ช่องทาง shell ไม่พร้อมใช้งาน (Shizuku ยังไม่ได้อนุญาต) การแตะปกติและการจับภาพไม่ได้รับผลกระทบ
  ✅ Shizuku 已授权：shell 通道可用: '✅ อนุญาต Shizuku แล้ว: ช่องทาง shell พร้อมใช้งาน'
  '✅ 支持输入时间线（并发手势）：声明 #% requires: [device_gesture] 的脚本可以运行': '✅ รองรับไทม์ไลน์อินพุต (ท่าทางพร้อมกัน): สคริปต์ที่ประกาศ #% requires: [device_gesture] สามารถรันได้'
