content_version: 3
recognition:
  region_batch:
    min_canvas_side: 736
    max_content_height: 1200
    gap: 16
  # PC 端单次识别的并行度。RapidOCR 出厂的 -1 会让 Det/Cls/Rec 各开满物理核，
  # 多线程池互相争抢：实测同一帧默认 8.44 CPU 秒，限到 2 线程只要 2.38 CPU 秒，
  # 墙钟还更短。界面入口：图像识别 → 识别配置 → 识别性能。
  pc_ocr:
    threads: 2
    inter_threads: 1
  # 检测模型的输入短边上限：调小更快更省，但小字号更容易漏检。
  detect:
    limit_side_len: 736
normalization:
  default:
    replacements: {}
    patterns:
      '[【［]': '['
      '[】］]': ']'
      （: (
      ）: )
  groups:
    equip:
      label: 装备词条
      replacements:
        猜准率: 精准率
        扁武学: 扇武学
        经甲: 胫甲
        腔甲: 胫甲
        背仓: 背包
        缚祷: 缚袴
        率丝: 牵丝
        # 形近字按词组替换：单字「拔: 拨」会误伤任何含「拔」的文本。
        拔山取月: 拨山取月
      patterns:
        '[荐存·]': ''
