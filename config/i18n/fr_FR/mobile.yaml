  手机: Téléphone
  手机内置任务，可独立配置和执行，无需先连接 PC。可向手机下发脚本、配置和 Profile，也可独立回传手机历史与日志。: Tâches intégrées au téléphone, configurables et exécutables sans connexion au PC. Vous pouvez envoyer scripts, configurations et profils au téléphone, et récupérer son historique et ses journaux séparément.
  手机历史、日志和结果保留；回传需单独操作。确认下发？: L'historique, les journaux et les résultats du téléphone sont conservés ; l'importation s'effectue séparément. Confirmer l'envoi ?
  手机执行用户：{user}；最近同步：{time}: 'Utilisateur exécuté sur le téléphone : {user} ; dernière synchronisation : {time}'
  手机缺失 {count} 个附件，相关历史不完整；请检查手机原文件。: Il manque {count} pièces jointes sur le téléphone ; l'historique associé est incomplet. Vérifiez les fichiers d'origine sur le téléphone.
  手机要访问的本机地址。多网卡时选与手机同网段的那个；换地址只改链接，不会中断共享: Adresse locale à laquelle le téléphone se connectera. Avec plusieurs interfaces réseau, choisissez celle du même sous-réseau ; changer d'adresse met simplement à jour le lien sans interrompre le partage
