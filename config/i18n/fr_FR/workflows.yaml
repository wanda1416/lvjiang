  DSL 写入: Écriture DSL
  'color_ratio: 缺少颜色参数': 'color_ratio : paramètres de couleur manquants'
  'find_multi_color: 偏移点应为 [dx, dy, "#rrggbb"]，实际: {v!r}': 'find_multi_color : le point décalé doit être [dx, dy, "#rrggbb"], reçu : {v!r}'
