  点: 점
  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: 읽기 쉽고 직접 편집할 수 있는 WF DSL을 생성합니다. 녹화 중지 시 안전하게 병합할 수 있는 키 누름/유지/해제와 후속 대기를 합치며, 연속 마우스 이동과 짧은 대기는 약 100ms 단위로 정리합니다. 일반 UI 조작과 수동 편집에 적합하며, 원본 입력 이벤트를 정밀하게 재생해야 하는 게임 시점 조작에는 적합하지 않습니다.
  留空 = id: 비워 두면 id 사용
  留空使用默认值: 비워 두면 기본값 사용
  目标位置已有 {path}。继续会覆盖目标，并在成功保存后移除原文件。: 대상 위치에 이미 {path}이(가) 있습니다. 계속하면 대상을 덮어쓰고 저장 성공 후 원본 파일을 제거합니다.
  目标位置已有不同的录制轨迹：{path}: '대상 위치에 다른 녹화 궤적이 이미 존재합니다: {path}'
  确定清除已录制的 DSL 内容吗？: 녹화된 DSL 내용을 지울까요?
  确认保存位置: 저장 위치 확인
  稳定脚本标识；修改后已有引用不会自动更新: 고정 스크립트 식별자입니다. 수정해도 기존 참조는 자동으로 갱신되지 않습니다
  第 {index} 个参数不是字段映射: '{index}번째 매개변수가 필드 매핑이 아닙니다'
  第 {index} 个参数有未支持的字段：{keys}: '{index}번째 매개변수에 지원되지 않는 필드가 있습니다: {keys}'
  第 {index} 个参数的选项包含未支持的字段: '{index}번째 매개변수의 옵션에 지원되지 않는 필드가 포함되어 있습니다'
  第 {line} 行第 {col} 列：语法错误: '{line}행 {col}열: 구문 오류'
  系统 (system): 시스템 (system)
  系统脚本不可删除；不想展示请在「脚本配置」取消勾选: 시스템 스크립트는 삭제할 수 없습니다. 숨기려면 「스크립트 설정」에서 선택을 해제하세요
  系统脚本只读——右键「复制到本地以修改」后才能保存: 시스템 스크립트는 읽기 전용입니다. 우클릭 후 「로컬로 복사하여 수정」을 선택해야 저장할 수 있습니다
  系统脚本只读——右键「复制到本地以修改」后才能编辑: 시스템 스크립트는 읽기 전용입니다. 우클릭 후 「로컬로 복사하여 수정」을 선택해야 편집할 수 있습니다
  系统（只读）: 시스템(읽기 전용)
  脚本 id 不能为空: 스크립트 id는 비워 둘 수 없습니다
  脚本 id 不能以 _ 开头（发现层会把它当临时文件跳过）: 스크립트 id는 _로 시작할 수 없습니다(탐색 계층에서 임시 파일로 간주해 건너뜁니다)
  脚本 id 只能用 Unicode 字母、数字、下划线，且以字母开头: 스크립트 id는 Unicode 문자, 숫자, 밑줄(_)만 사용할 수 있으며 문자로 시작해야 합니다
  脚本 id（文件名）: 스크립트 id(파일 이름)
  脚本 {rel} 已存在，覆盖？: 스크립트 {rel}이(가) 이미 존재합니다. 덮어쓸까요?
  脚本、录制结果或脚本配置有未保存的修改，放弃？: 스크립트, 녹화 결과 또는 스크립트 설정에 저장되지 않은 변경 사항이 있습니다. 버릴까요?
  脚本为空: 스크립트가 비어 있습니다
  脚本声明: 스크립트 선언
  脚本录制: 스크립트 녹화
  脚本性质: 스크립트 유형
  脚本配置: 스크립트 설정
  脚本问题：{reason}: '스크립트 문제: {reason}'
  覆盖目标脚本？: 대상 스크립트를 덮어쓸까요?
  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: 키보드, 마우스 버튼, 휠 및 선택적 마우스 이동의 원본 타임라인을 기록합니다. 스크립트 저장 시 workflows/lvtrace 아래에 연동 궤적 파일이 함께 생성되어 녹화 타이밍에 가깝게 재생되므로 게임 시점 등 정밀한 타이밍이 필요한 상황에 적합합니다. 연동 궤적 파일에 의존하므로 WF 텍스트만 복사해서 옮길 수 없습니다.
  试算: 시험 실행
  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 시험 실행은 실제로 스크립트를 실행한 뒤 이 함수를 호출합니다. 오래 걸리거나 출처가 불명확한 스크립트에는 사용하지 마세요. 반환될 때까지 UI가 멈춥니다.
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: 이 함수는 엔진 주입(_engine/_wf)이 필요하므로 스크립트 실행 중에만 호출할 수 있습니다
  语法检查通过（保存后会再做布局引用校验）: 구문 검사 통과(저장 후 레이아웃 참조 검증을 다시 수행합니다)
  请先在“元数据”页点击“应用到代码”，再保存脚本。: 먼저 “메타데이터” 탭에서 “코드에 적용”을 클릭한 뒤 스크립트를 저장하세요.
  请先在主窗口定位游戏窗口: 먼저 메인 창에서 게임 창을 지정하세요
  请先在主窗口扫描并定位窗口: 먼저 메인 창에서 창을 스캔하고 지정하세요
  请先选择或新建一个可编辑脚本，并保存已有高精度录制: 먼저 편집 가능한 스크립트를 선택하거나 새로 만들고, 기존 고정밀도 녹화를 저장하세요
