  正在匹配参考图...: 参照画像を照合中...
  正在识别文字...: テキストを認識中...
  测试: テスト
  测试清洗效果: クレンジング結果をテスト
  添加替换规则: 置換ルールを追加
  添加正则规则: 正規表現ルールを追加
  清洗结果...: クレンジング結果...
  清洗规则: クレンジングルール
  清洗规则已保存: クレンジングルールを保存しました
  清空画布: キャンバスをクリア
  清除红色选框: 赤色の選択枠をクリア
  清除选择: 選択をクリア
  相邻文字区域在拼图中的间隔。: 結合キャンバス内の隣接するテキスト領域間の間隔です。
  确定删除规则组「{name}」吗？引用它的工作流将无法执行。: ルールグループ「{name}」を削除しますか？これを参照しているワークフローは実行できなくなります。
  确定撤销本次所有未保存的清洗规则更改吗？: 今回未保存のクレンジングルールの変更をすべて取り消しますか？
  确定撤销本次所有未保存的识别配置更改吗？: 今回未保存の認識設定の変更をすべて取り消しますか？
  '行 {n}: 无效的正则表达式': '行 {n}: 無効な正規表現です'
  规则组 key（用于 with 声明）: ルールグループ key（with 句で使用）
  规则组名称: ルールグループ名
  规则组已创建: ルールグループを作成しました
  规则组已删除: ルールグループを削除しました
  规则组已重命名: ルールグループ名を変更しました
  识别失败: 認識に失敗しました
  识别文字: テキストを認識
  识别配置: 認識設定
  识别配置已保存: 認識設定を保存しました
  请先保存或取消当前清洗组的修改: 先に現在のクレンジンググループの変更を保存または破棄してください
  输入测试文本...: テストテキストを入力...
  选择图片: 画像を選択
  选框区域为空: 選択領域が空です
  重命名规则组: ルールグループ名を変更
  ? "默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。\n改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。"
  : "デフォルトルールはすべての OCR にグローバル適用され、scan/find の with 句で選択した業務ルールグループがその上に重ねて適用されます。\n変更後は「保存」をクリックすると再起動不要で即座に反映され、未保存の変更は「元に戻す」で復元できます。"
  默认规则（全局）: デフォルトルール（グローバル）
  ? "识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。\n保存后从下一次识别开始生效，不需要重启。"
  : "認識パフォーマンスはすべての認識呼び出しに適用されます。並列度が高いほど高速ですが、CPU 使用率も比例して上がります。\n保存後の次回認識から有効になり、再起動は不要です。"
  识别性能: 認識パフォーマンス
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: 1回の認識内部で使用するスレッド数です。デフォルトは 2 で、実測上これ以上増やしても高速化せずシステム全体の CPU 負荷だけが上がります。1 にすると最も省 CPU で、バックグラウンド長時間稼働に適しています。
  识别线程数: 認識スレッド数
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: 同時並列実行するオペレーター数です。検出・分類・認識の3モデルそれぞれに専用スレッドプールがあるため、増やすと通常はスケジューリング競合が増えるだけです。デフォルトは 1 です。
  并行算子线程数: 並列オペレータースレッド数
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: 検出前に画面の短辺をこの値に合わせてリサイズします（大きい画像は縮小、小さい画像は拡大）。小さくすると高速・省 CPU になりますが小さい文字を見落としやすくなります。736 が初期値のため、特別な理由がなければ変更しないでください。
  检测输入短边: 検出入力の短辺
