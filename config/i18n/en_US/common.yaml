  "只调整「用户总览」和「用户信息」中刷新工具栏下方的内容字号，包括列表表头；顶部工具栏按钮保持不变。": "Adjusts only the content font size below the refresh toolbar in \"User Overview\" and \"User Info\", including list headers; the top toolbar buttons are unchanged."
