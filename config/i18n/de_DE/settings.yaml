  部分激活码不绑定机器，直接粘贴即可，不需要提供序列号。: Einige Aktivierungscodes sind nicht gerätegebunden – einfach einfügen, eine Seriennummer ist nicht erforderlich.
  重置匿名标识: Anonyme ID zurücksetzen
  重置后服务端会把你当成一个新用户，之前的记录无法再与新标识关联。确定重置吗？: Nach dem Zurücksetzen behandelt der Server Sie als neuen Benutzer; frühere Einträge lassen sich nicht mehr mit der neuen ID verknüpfen. Wirklich zurücksetzen?
  重置标识: ID zurücksetzen
  重试间隔（秒）: Wiederholungsintervall (Sek.)
  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: Wenn Ihr Aktivierungscode gerätegebunden ist, senden Sie diese Seriennummer an den Autor. Sie wird bei jedem Start aus der Mainboard-Kennung berechnet, nicht gespeichert und enthält keine rückführbaren Hardware-Informationen.
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: Dieser Wert gilt sowohl für den initialen Stream-Aufbau als auch für die automatische Wiederherstellung nach Verbindungsabbruch. Nach Aufbrauchen wartet die Aufgabe auf manuelles Eingreifen und bricht nicht selbstständig ab.
  首次窗口定位后可自动获取: Kann nach der ersten Fenstererkennung automatisch übernommen werden
  高级设置: Erweiterte Einstellungen
  ? "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。"
  : "Standardmäßig wird der Videostream 5-mal aufgebaut, danach der Agent 5-mal und ADB 5-mal im Abstand von 2 Sekunden neu verbunden. Bei weiterem Fehlschlag wartet die Aufgabe unbegrenzt auf manuelles Eingreifen: „Ja“ prüft erneut, „Nein“ stoppt die Aufgabe; das Schließen des Hinweises stoppt sie nicht und das Banner bleibt bestehen.\nMehrfinger- und gleichzeitige Gesten werden nicht herabgestuft. Ist unklar, ob eine Aktion bereits ausgeführt wurde, wird die Eingabe nicht automatisch wiederholt. Gilt für nachfolgend gestartete Aufgaben."
  鼠标/触控移动到目标位置的耗时: Dauer für die Bewegung von Maus/Touch zur Zielposition
  鼠标移动时长(秒): Mausbewegungsdauer (Sek.)
  坐标越界处理: Umgang mit Bereichsüberschreitung
  坐标随机偏移(px): Zufälliger Koordinatenversatz (px)
  当前标识: Aktuelle ID
