maps:
  'HUD 场景不存在: {scene}': 'Сцена HUD не существует: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: Привязка HUD minimap_center должна относиться к базовому представлению
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'Привязка HUD minimap_center должна ссылаться на точку координат; не найдено: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: Привязка HUD {attr} должна относиться к представлению full
  HUD 绑定 {attr} 必须属于基础视图: Привязка HUD {attr} должна относиться к базовому представлению
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'Привязка HUD {attr} должна ссылаться на область; не найдено: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: Ключ POI должен начинаться со строчной латинской буквы и содержать только строчные буквы, цифры и подчёркивания
  POI {key} 坐标超出底图范围: Координаты POI {key} выходят за пределы базовой карты
  POI 必须是键值映射: POI должен быть словарём (ключ-значение)
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256 должен быть 64-символьным шестнадцатеричным хешем
  min_area 必须大于 0: min_area должно быть больше 0
  pois 必须是列表: pois должен быть списком
  ui 必须是键值映射: ui должен быть словарём (ключ-значение)
  window_ratio 必须在 0.05–1 之间: window_ratio должно быть в диапазоне от 0.05 до 1
  '{name} 必须是三元整数列表': '{name} должен быть списком из трёх целых чисел'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name} должен соответствовать диапазону H=0–180, S/V=0–255'
  '{name}地图': Карта {name}
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: Ключ карты должен начинаться со строчной латинской буквы и содержать только строчные буквы, цифры и подчёркивания
  '地图不存在: {key}': 'Карта не существует: {key}'
  地图名称不能为空: Название карты не может быть пустым
  '地图名称已存在: {name}': 'Название карты уже существует: {name}'
  地图图片与定义摘要不一致: Изображение карты не соответствует хешу в определении
  地图定义必须是键值映射: Определение карты должно быть словарём (ключ-значение)
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: В файле карты {rel} указан ключ {inner}, который не совпадает с именем файла
  地域名称不能为空，且 key 不得重复: Название региона не может быть пустым, а ключи не должны повторяться
  大地图: Карта мира
  底图数据为空: Данные базовой карты пусты
  底图文件名固定为 base.png: Файл базовой карты должен называться base.png
  探查图片名称不能为空，且 key 不得重复: Название изображения разведки не может быть пустым, а ключи не должны повторяться
  '探查图片引用了不存在的地域: {region}': 'Изображение разведки ссылается на несуществующий регион: {region}'
  探查图片必须有有效的 SHA256 摘要: Изображение разведки должно иметь корректный хеш SHA256
  '探查图片缺失或摘要不匹配: {name}': 'Изображение разведки отсутствует или хеш не совпадает: {name}'
  '未知导航模式: {mode}': 'Неизвестный режим навигации: {mode}'
  '未知朝向识别方法: {method}': 'Неизвестный метод определения направления: {method}'
