  选框区域为空: Выделенная область пуста
  重命名规则组: Переименовать группу правил
  ? '默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。

    改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。'
  : 'Правила по умолчанию действуют глобально для всего OCR; конструкция with в scan/find применяет выбранную группу правил поверх правил по умолчанию.

    Нажмите «Сохранить» для применения без перезапуска; несохранённые изменения можно вернуть кнопкой «Отменить».'
  默认规则（全局）: Правила по умолчанию (глобальные)
  ? '识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。

    保存后从下一次识别开始生效，不需要重启。'
  : 'Настройки производительности действуют на все вызовы распознавания: выше параллелизм — быстрее работа, но пропорционально выше нагрузка на CPU.

    После сохранения применяются со следующего распознавания без перезапуска.'
  识别性能: Производительность
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: 'Число потоков внутри одного вызова распознавания. По умолчанию 2: более высокие значения на практике не ускоряют работу, а лишь повышают общую нагрузку на CPU; значение 1 экономичнее для длительной фоновой работы.'
  识别线程数: Потоки распознавания
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: Число параллельных линий операторов. Модели детекции, классификации и распознавания уже имеют собственные пулы потоков, поэтому увеличение обычно лишь усиливает конкуренцию за ресурсы; по умолчанию 1.
  并行算子线程数: Параллельные потоки операторов
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: Перед детекцией кадр масштабируется по короткой стороне до этого значения (большие кадры уменьшаются, маленькие увеличиваются). Меньшее значение быстрее и экономит CPU, но чаще пропускает мелкий шрифт; 736 — заводское значение, не меняйте без необходимости.
  检测输入短边: Короткая сторона входа детекции
