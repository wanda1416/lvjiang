  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: 生成可讀、可直接編輯的 WF DSL。錄製停止時會合並能夠安全合併的按鍵按下、按住、釋放和後續等待；連續滑鼠移動及短等待按約 100ms粒度歸併。適合普通介面操作和後續手工調整，不適合要求逐個原始輸入事件精確回放的遊戲視角。
