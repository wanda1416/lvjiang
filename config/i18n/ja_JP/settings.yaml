  未单独标定点击区域时，落点框从区域中心向四边延伸的比例。0.25 = 落点覆盖区域中间的一半；必须小于 0.5: タップ領域を個別キャリブレーションしない場合、領域中心から四辺へ広げる落点枠の比率です。0.25 で中央半分をカバーします（0.5 未満にしてください）
