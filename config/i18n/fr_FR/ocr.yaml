  区域批量识别: Reconnaissance de zones par lot
  "区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。\n这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。": "La reconnaissance par lot assemble plusieurs zones de texte sur un seul canevas et n'appelle l'OCR qu'une seule fois.\nCes paramètres contrôlent la taille de l'assemblage ; ils prennent effet dès la prochaine reconnaissance après enregistrement."
  原始文本: Texte brut
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: La configuration OCR contient des modifications non enregistrées. Quitter et les abandonner ?
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*): Fichiers image (*.png *.jpg *.jpeg *.bmp *.webp);;Tous les fichiers (*)
  已撤销未保存的清洗规则修改: Modifications non enregistrées des règles de nettoyage annulées
  已撤销未保存的识别配置修改: Modifications non enregistrées de la configuration de reconnaissance annulées
  已清除选框: Sélection effacée
  拼图画布宽、高的最小值。过小会使窄区域被 OCR 检测器大幅放大。: Largeur et hauteur minimales du canevas assemblé. Une valeur trop petite entraîne un fort agrandissement des zones étroites par le détecteur OCR.
  撤销清洗规则: Annuler les règles de nettoyage
  撤销识别配置: Annuler la configuration de reconnaissance
