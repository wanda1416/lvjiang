map_manager:
  HUD 场景: Escena HUD
  HUD 场景绑定（坐标在场景编辑器里标定）: Enlaces de escena HUD (calibra las coordenadas en el editor de escenas)
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point} está fuera de la región del minimapa; la detección de orientación usará el centro de la región por ahora.'
  ⚠ 缺失：{key}: '⚠ Falta: {key}'
  不能删除: No se puede eliminar
  从当前画面截取: Capturar del fotograma actual
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: También se generará la escena HUD map_<key>; después calibra las regiones del minimapa y del mapa del mundo en el editor de escenas.
  保存当前画面为探查图片: Guardar el fotograma actual como imagen de exploración
  先登记地域: Registra primero una región
  删除地图: Eliminar mapa
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: ¿Eliminar el mapa «{name}» y su mapa base? También se eliminará la escena HUD generada automáticamente map_{key}.
  删除选中 POI: Eliminar POI seleccionado
  删除选中地域: Eliminar regiones seleccionadas
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: Márcalo solo cuando se haya completado realmente todo el mapa; un ensamblado correcto no significa que se haya explorado el mapa entero.
  只读，请先“复制到本地”再修改: Solo lectura; usa primero «Copiar a local» antes de editar
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): Archivos de imagen (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: Haz clic en el mapa base para añadir un POI; haz clic en un marcador existente para seleccionarlo. Las coordenadas están normalizadas al mapa base.
  地图 key: Clave del mapa
  地域与探查: Regiones y exploración
  地域仍被使用: Región aún en uso
  地域名称: Nombre de la región
  坐标必须在 0–1 之间: Las coordenadas deben estar entre 0 y 1
  基本信息: Información básica
  基本信息与绑定: Información básica y enlaces
  复制到本地: Copiar a local
  大地图底图: Mapa base del mundo
  大地图正北朝上: Mapa del mundo orientado al norte
  导入底图文件…: Importar archivo de mapa base…
  导航模式: Modo de navegación
  小写字母开头，字母/数字/下划线: Empieza por minúscula; letras, dígitos o guion bajo
  小地图朝向: Orientación del minimapa
  尖端（退化）: Punta (degenerado)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 'Aún no se ha importado el mapa base: usa primero «Calibrar HUD…» para marcar la región del mapa del mundo y luego impórtalo en la pestaña «Mapa base y POI»'
  展示: Mostrar
  底图与 POI: Mapa base y POI
  底图区域未标定: Región del mapa base sin calibrar
  底图可标注 POI；空白部分尚未探查。: Puedes marcar POI en el mapa base; las zonas en blanco aún no han sido exploradas.
  底图已完成整图探查: Exploración completa del mapa base finalizada
  底图编码失败: Error al codificar el mapa base
  底图：局部探查，待补齐: 'Mapa base: exploración parcial, pendiente de completar'
  底图：整图探查已完成: 'Mapa base: exploración completa finalizada'
  当前地图有未保存的修改，放弃吗？: El mapa actual tiene cambios sin guardar. ¿Descartarlos?
  当前布局不存在，未能定位地图区域。: El diseño actual no existe; no se pudo localizar la región del mapa.
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: El diseño actual aún no ha calibrado {scene}.{point}; la detección de orientación usará el centro del minimapa por ahora.
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: El diseño actual aún no ha calibrado {scene}.{region}; no se puede recortar la región del mapa.
  当前无法读取布局，未能定位地图区域。: No se puede leer el diseño actual; no se pudo localizar la región del mapa.
  当前未选择地图，无法解析地图区域。: No hay ningún mapa seleccionado; no se puede resolver la región del mapa.
  截取当前画面: Capturar fotograma actual
  截图所属地域: Región de esta captura
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: Registra regiones según el selector de zonas del juego. Las imágenes de exploración y el mapa base se guardan por separado y pueden alternarse en la pestaña del mapa base.
  探查: Exploración
  探查图片仅供查看: Las imágenes de exploración son solo de visualización
  探查图片缺失或无法解码: Falta la imagen de exploración o no se puede decodificar
  探查截图用于查看；POI 只在底图上编辑。: Las capturas de exploración son para visualizar; los POI solo se editan en el mapa base.
  搜索窗口（相对短边）: Ventana de búsqueda (relativa al lado corto)
  新地域: Nueva región
  新建地图: Nuevo mapa
  无效的 POI: POI no válido
  无法获取截图: No se puede obtener la captura
  '无法解码图片: {path}': 'No se puede decodificar la imagen: {path}'
  无法读取图片: No se puede leer la imagen
  是否仍然使用整帧作为底图？: ¿Usar igualmente el fotograma completo como mapa base?
  最小面积（像素）: Área mínima (píxeles)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 'Orientación {deg:.1f}°　Confianza {conf:.2f}　Método: {method}　Área {area}px'
  未保存: Sin guardar
  未取得当前画面: No se ha obtenido el fotograma actual
  未找到箭头：检查颜色阈值或小地图区域标定: 'Flecha no encontrada: revisa el umbral de color o la calibración de la región del minimapa'
  来源：{layer}: 'Origen: {layer}'
  标定 HUD…（打开场景编辑器）: Calibrar HUD… (abre el editor de escenas)
  标识: Identificación
  没有地图。点击“新建”创建一张。: No hay mapas. Haz clic en «Nuevo» para crear uno.
  添加地域: Añadir región
  添加失败: Error al añadir
  添加探查图片: Añadir imagen de exploración
  添加探查图片…: Añadir imagen de exploración…
  燕尾缺口: Muesca en cola de golondrina
  留空 = key: Vacío = key
  种类: Tipo
  箭头颜色与搜索参数（保存到地图）: Color de flecha y parámetros de búsqueda (se guardan en el mapa)
  识别结果: Resultado de detección
  该地域已有探查图片，不能直接删除。: Esta región ya tiene imágenes de exploración y no se puede eliminar directamente.
  请选择截图所属地域。: Selecciona la región a la que pertenece la captura.
  读取失败: Error de lectura
  读取当前布局失败，未能定位地图区域。: Error al leer el diseño actual; no se pudo localizar la región del mapa.
  载入截图文件…: Cargar archivo de captura…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: Tras cargar una captura completa del juego, se recorta según la región del minimapa calibrada en el diseño actual y se analiza la flecha amarilla cóncava centrada. 0° = norte (parte superior de la pantalla), sentido horario positivo.
  适应窗口: Ajustar a la ventana
  选择局内截图: Seleccionar captura del juego
  选择底图: Seleccionar mapa base
  重新识别: Volver a detectar
  （尚未载入截图）: (sin captura cargada)
  'POI key 重复: {key}': 'Clave de POI duplicada: {key}'
maps:
  'POI key 重复: {key}': 'Clave de POI duplicada: {key}'
  '地图 key 已存在: {key}': 'La clave del mapa ya existe: {key}'
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: La función de captura no está disponible; localiza primero la ventana o conecta el dispositivo en la ventana principal
