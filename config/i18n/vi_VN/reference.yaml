  空间 key: Khóa không gian
  key 是目录名与方案里的引用，不可修改；要换 key 请新建空间。展示名留空则直接显示 key。: "key là tên thư mục và tham chiếu trong phương án, không thể sửa; muốn đổi key hãy tạo không gian mới. Để trống tên hiển thị sẽ hiển thị trực tiếp key."
  无法创建空间，详见日志: "Không thể tạo không gian, xem chi tiết trong nhật ký"
  空间 key 不能为空: Khóa không gian không được để trống
  空间 key 不能包含路径分隔符或特殊字符: Khóa không gian không được chứa dấu phân cách đường dẫn hoặc ký tự đặc biệt
  同名空间已存在: Không gian cùng tên đã tồn tại
  小写字母、数字与下划线，如 android: "Chữ thường, chữ số và dấu gạch dưới, ví dụ: android"
  key 是目录名与方案里的引用，编辑时不可修改: "key là tên thư mục và tham chiếu trong phương án, không thể sửa khi chỉnh sửa"
  key 是目录名与方案里的引用，创建后不可修改。简体中文与英文必须填写。: "key là tên thư mục và tham chiếu trong phương án, không thể sửa sau khi tạo. Phải điền cả tiếng Trung giản thể và tiếng Anh."
  简体中文与英文都必须填写: Phải điền cả tiếng Trung giản thể và tiếng Anh
