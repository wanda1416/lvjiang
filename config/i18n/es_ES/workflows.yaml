action_catalog:
  0=红 1=绿 2=蓝: 0=Rojo 1=Verde 2=Azul
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / teclas de letra / MOUSE_LEFT; en dispositivo ESC = Atrás
  OCR 扫描区域: Escanear región con OCR
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: En PC, introduce texto mediante portapapeles y Ctrl+V; compatible con modo en segundo plano
  find 结果、矩形或坐标变量: Resultado de find, rectángulo o variable de punto
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: «{label}» no puede contener comillas dobles ni saltos de línea (las cadenas DSL no admiten escapes)
  '「{label}」应为 #rrggbb': '«{label}» debe tener formato #rrggbb'
  「{label}」应为 {n} 个数: «{label}» debe contener {n} números
  「{label}」应为命名延迟（字母或中文开头的名字）: «{label}» debe ser un retardo con nombre (nombre que empiece por letra o carácter chino)
  「{label}」未填写: «{label}» está sin rellenar
  「{label}」的 {n} 个值都必须是数字: Los {n} valores de «{label}» deben ser números
  不带 by 得到文字；带 by 得到命中与否: Sin by devuelve el texto; con by devuelve si hubo coincidencia
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: Introduce una sola clave para «{label}» (p. ej. ok), sin corchetes ni prefijo de escena
  不抖动: Sin vibración
  主导通道: Canal dominante
  交互: Interacción
  亮段计数: Conteo de segmentos brillantes
