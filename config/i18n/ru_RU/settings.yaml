  完全离线模式（暂停全部联网功能）: Полностью автономный режим (отключить все сетевые функции)
  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 'Экспериментальная функция: многие скрипты пока не работают в этом режиме, жалобы на несовместимость не принимаются. Фоновый захват позволяет снимать окно игры, перекрытое другими окнами, но работает немного медленнее; он требует фонового ввода, и при свёрнутом окне оба режима не получают кадр. Здесь задаётся значение по умолчанию: в главном окне «Фоновый захват» включается автоматически только при включённом «Фоновом режиме», и его можно изменить в любой момент.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Экспериментальная функция: на телефоне должно быть установлено приложение LvJiang с включённой службой специальных возможностей; меняется только канал нажатий и свайпов, способ захвата экрана остаётся прежним. При ошибке подключения выполняется откат к ADB shell input.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: Нет данных о подключении этого типа; сначала подключите устройство или выберите окно в главном окне.
