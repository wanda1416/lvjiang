  ? "引擎算出的点击/拖拽坐标跑到画面外时怎么办。\n不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。\n勾选：引擎截断到画面边界并记一条 warning，本次运行继续。\n判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。"
  : "Verhalten, wenn von der Engine berechnete Klick-/Ziehkoordinaten außerhalb des erfassten Bildes liegen.\nDeaktiviert (Standard): Fehler melden und Lauf beenden – eine Überschreitung zeigt, dass die Verschiebungsparameter des Skripts nicht zur aktuellen Bedienfeld-Geometrie passen; stilles Abschneiden würde „zwei Zeilen scrollen“ unbemerkt in „eine Zeile scrollen“ verwandeln.\nAktiviert: Die Engine begrenzt auf den Bildrand, protokolliert eine Warnung und fährt fort.\nDie Prüfung erfolgt in der Engine: Auf dem Gerät lehnen Bedienungshilfegesten solche Koordinaten hart ab, während Desktop-Eingabe und adb shell input sie stillschweigend akzeptieren."
  当前标识：未生成（未开启）: 'Aktuelle ID: Nicht erzeugt (deaktiviert)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: Nach einem Smartphone-Neustart wird der Shizuku-Dienst beendet; Aufgaben, die das Spiel neu starten, sind darauf angewiesen. Bei Aktivierung wird der Dienst beim Verbinden im Geräte-Ausführungsmodus automatisch geprüft und einmalig gestartet (nur falls nicht aktiv).
  执行参数: Ausführungsparameter
  把激活码粘贴到这里，换行和空格会被自动忽略: Aktivierungscode hier einfügen; Zeilenumbrüche und Leerzeichen werden ignoriert
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Empfängt offizielle Konfigurations- und Aufgabenupdates passend zur aktuellen App-Version und wendet sie nach Prüfung beim nächsten Start an. Ihre lokalen Konfigurationen haben stets Vorrang; laufende Aufgaben nutzen weiterhin die bereits geladenen Einstellungen. Bei Deaktivierung oder im Offlinemodus werden beim nächsten Start die Standardinhalte wiederhergestellt und Mitgliedsinhalte entfernt, ohne lokale Daten zu verändern.
