key: fsjs_night
name: 风沙酒肆
views:
- key: base
  name: 客栈房间
- key: watch
  name: 守夜
  kind: page
  owner: /base
- key: settle
  name: 结算
  kind: page
  owner: /base
- key: clue_dialog
  name: 线索弹窗
  kind: modal
  owner: /watch
hide_all_views: true
regions:
- key: quest_track
  name: 任务栏
  type: attr
  is_text: true
  is_clickable: false
  views:
  - base
  - watch
- key: lie_down
  name: 躺下
  type: func
  is_text: true
  is_clickable: true
  view: base
- key: prompt_bar
  name: 顶部提示
  type: attr
  is_text: true
  is_clickable: false
  view: watch
- key: open_btn
  name: 开门
  type: func
  is_text: true
  is_clickable: true
  view: watch
- key: refuse_btn
  name: 不开
  type: func
  is_text: true
  is_clickable: true
  view: watch
- key: listen_btn
  name: 听风辨位
  type: func
  is_text: false
  is_clickable: true
  view: watch
- key: settle_title
  name: 夜话标题
  type: attr
  is_text: true
  is_clickable: false
  view: settle
- key: again_btn
  name: 再来一局
  type: func
  is_text: true
  is_clickable: true
  view: settle
- key: clue_tip
  name: 线索弹窗提示
  type: attr
  is_text: true
  is_clickable: false
  view: clue_dialog
- key: clue_check
  name: 今日不再提醒
  type: func
  is_text: true
  is_clickable: true
  view: clue_dialog
- key: clue_confirm
  name: 弹窗确认
  type: func
  is_text: true
  is_clickable: true
  view: clue_dialog
