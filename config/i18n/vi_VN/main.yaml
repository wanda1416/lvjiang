  : "Tính năng thử nghiệm: nhiều kịch bản hiện chưa chạy ổn định ở chế độ này và không tiếp nhận phản hồi lỗi không dùng được.\nDùng Windows Graphics Capture để lấy khung hình, vẫn chụp được khi cửa sổ trò chơi bị cửa sổ khác che khuất; nhưng vẫn không lấy được hình khi thu nhỏ. Chỉ có hiệu lực trong phiên chạy này"
  ? "局域网内未发现可连接的 ADB 设备。\n\n请确认：\n1. 设备与电脑在同一局域网\n2. 设备已开启无线调试（开发者选项）\n3. 多网卡时可在下拉框改选目标网段，或改用本地扫描"
  : "Không tìm thấy thiết bị ADB nào có thể kết nối trong mạng LAN.\n\nVui lòng kiểm tra:\n1. Thiết bị và máy tính ở cùng mạng LAN\n2. Thiết bị đã bật Gỡ lỗi không dây (Tùy chọn nhà phát triển)\n3. Khi có nhiều card mạng, hãy chọn đúng dải mạng mục tiêu trong danh sách thả xuống hoặc dùng quét cục bộ"
