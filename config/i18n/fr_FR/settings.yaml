  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'Comportement lorsqu''une coordonnée de clic/glissement calculée par le moteur sort du cadre capturé.

    Décoché (par défaut) : génère une erreur et arrête l''exécution — un dépassement indique que le déplacement du script ne correspond pas à la géométrie actuelle du panneau, et une troncature silencieuse transformerait « défiler deux lignes » en « une ligne » sans trace.

    Coché : le moteur tronque au bord du cadre, journalise un avertissement et poursuit l''exécution.

    La vérification se fait au niveau du moteur : sur appareil, les gestes d''accessibilité rejettent strictement ces coordonnées alors que le bureau et adb shell input les acceptent silencieusement.'
  当前标识：未生成（未开启）: 'Identifiant actuel : non généré (désactivé)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: Après redémarrage du téléphone, le processus du service Shizuku s'arrête, alors que les tâches redémarrant le jeu en dépendent. Une fois activé, il est détecté et démarré automatiquement lors de la connexion en mode appareil (uniquement s'il ne tourne pas déjà).
