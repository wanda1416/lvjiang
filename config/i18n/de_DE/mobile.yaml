  "测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。\n请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。": "Der Test hält unten links auf dem Bildschirm gedrückt und tippt währenddessen zweimal unten rechts – wie „Joystick halten und gleichzeitig tippen“.\nÖffnen Sie auf dem Telefon zuerst eine Spielszene, in der Bewegung und Springen sichtbar sind, und klicken Sie dann auf Start."
  版本: Version
  "版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的": "Bei unterschiedlichen Versionen stimmen Protokoll und mitgelieferte Konfigurationen möglicherweise nicht überein. Es wird empfohlen, die ältere Seite zu aktualisieren"
  "用 PC 配置覆盖手机任务参数和用户名册。": "Überschreibt Aufgabenparameter und Benutzerliste auf dem Telefon mit den PC-Konfigurationen."
  "用 PC 配置覆盖手机批量配置。": "Überschreibt die Stapelkonfigurationen auf dem Telefon mit den PC-Konfigurationen."
  "用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。": "Mit dem Telefon scannen, um von diesem PC herunterzuladen und zu installieren. Das Telefon muss im selben LAN sein, benötigt aber keinen Internetzugang."
  "用手机扫码，直接从 GitHub 下载安装。\n手机上不了网时，改用右侧「本机共享」。": "Mit dem Telefon scannen, um direkt von GitHub herunterzuladen und zu installieren.\nWenn das Telefon keinen Internetzugang hat, verwenden Sie rechts „Lokale Freigabe“."
  "由本机提供下载，手机不需要能上网": "Der Download wird von diesem PC bereitgestellt; das Telefon benötigt keinen Internetzugang"
