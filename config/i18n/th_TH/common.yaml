  大地图底图: ภาพฐานแผนที่ใหญ่
  大地图正北朝上: แผนที่ใหญ่หันทิศเหนือขึ้นบน
  导入底图文件…: นำเข้าไฟล์ภาพฐาน…
  导航模式: โหมดนำทาง
  小写字母开头，字母/数字/下划线: ขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก ตามด้วยตัวอักษร/ตัวเลข/ขีดล่าง
  小地图朝向: ทิศทางมินิแมป
  尖端（退化）: ปลายลูกศร (แบบลดรูป)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 'ยังไม่ได้นำเข้าภาพฐาน: กด «กำหนดจุด HUD…» เพื่อระบุพื้นที่แผนที่ใหญ่ก่อน แล้วค่อยนำเข้าในแท็บ «ภาพฐานและ POI»'
  展示: แสดงผล
  底图与 POI: ภาพฐานและ POI
  底图区域未标定: ยังไม่ได้ระบุพื้นที่ภาพฐาน
  底图可标注 POI；空白部分尚未探查。: สามารถปักหมุด POI บนภาพฐานได้ ส่วนพื้นที่ว่างคือบริเวณที่ยังไม่ได้สำรวจ
  底图已完成整图探查: สำรวจภาพฐานครบทั้งแผนที่แล้ว
  底图编码失败: เข้ารหัสภาพฐานไม่สำเร็จ
  底图：局部探查，待补齐: 'ภาพฐาน: สำรวจบางส่วน ยังต้องเก็บเพิ่ม'
  底图：整图探查已完成: 'ภาพฐาน: สำรวจครบทั้งแผนที่แล้ว'
  当前地图有未保存的修改，放弃吗？: แผนที่นี้มีการแก้ไขที่ยังไม่ได้บันทึก ต้องการละทิ้งหรือไม่?
  当前布局不存在，未能定位地图区域。: ไม่พบเลย์เอาต์ปัจจุบัน จึงไม่สามารถระบุตำแหน่งพื้นที่แผนที่ได้
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: เลย์เอาต์ปัจจุบันยังไม่ได้ระบุ {scene}.{point} การตรวจจับทิศทางจะใช้จุดกึ่งกลางมินิแมปแทนชั่วคราว
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: เลย์เอาต์ปัจจุบันยังไม่ได้ระบุ {scene}.{region} จึงไม่สามารถครอปพื้นที่แผนที่ได้
  当前无法读取布局，未能定位地图区域。: ไม่สามารถอ่านเลย์เอาต์ปัจจุบันได้ จึงไม่สามารถระบุตำแหน่งพื้นที่แผนที่ได้
  当前未选择地图，无法解析地图区域。: ยังไม่ได้เลือกแผนที่ จึงไม่สามารถแยกพื้นที่แผนที่ได้
  截取当前画面: จับภาพเฟรมปัจจุบัน
  截图所属地域: พื้นที่ของภาพหน้าจอนี้
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: ลงทะเบียนพื้นที่ตามตัวเลือกพื้นที่ในเกม ภาพสำรวจและภาพฐานจะบันทึกแยกกัน และสลับดูได้ในแท็บภาพฐาน
  探查: สำรวจ
  探查图片仅供查看: ภาพสำรวจดูได้อย่างเดียว
  探查图片缺失或无法解码: ภาพสำรวจสูญหายหรือไม่สามารถถอดรหัสได้
  探查截图用于查看；POI 只在底图上编辑。: ภาพสำรวจใช้สำหรับดูเท่านั้น ส่วน POI แก้ไขได้บนภาพฐานเท่านั้น
  搜索窗口（相对短边）: หน้าต่างค้นหา (เทียบกับด้านสั้น)
  新地域: พื้นที่ใหม่
  新建地图: สร้างแผนที่ใหม่
  无效的 POI: POI ไม่ถูกต้อง
  无法获取截图: ไม่สามารถจับภาพหน้าจอได้
  '无法解码图片: {path}': 'ไม่สามารถถอดรหัสภาพ: {path}'
  无法读取图片: ไม่สามารถอ่านภาพได้
  是否仍然使用整帧作为底图？: ยังคงใช้ทั้งเฟรมเป็นภาพฐานหรือไม่?
  最小面积（像素）: พื้นที่ต่ำสุด (พิกเซล)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 'ทิศทาง {deg:.1f}°　ความเชื่อมั่น {conf:.2f}　วิธี: {method}　พื้นที่ {area}px'
  未保存: ยังไม่ได้บันทึก
  未取得当前画面: ยังไม่ได้รับภาพปัจจุบัน
  未找到箭头：检查颜色阈值或小地图区域标定: 'ไม่พบลูกศร: ตรวจสอบเกณฑ์สีหรือการระบุพื้นที่มินิแมป'
  来源：{layer}: 'แหล่งที่มา: {layer}'
  标定 HUD…（打开场景编辑器）: กำหนดจุด HUD… (เปิดตัวแก้ไขฉาก)
  标识: ตัวระบุ
  没有地图。点击“新建”创建一张。: ยังไม่มีแผนที่ กด «สร้างใหม่» เพื่อสร้างแผนที่
  添加地域: เพิ่มพื้นที่
  添加失败: เพิ่มไม่สำเร็จ
  添加探查图片: เพิ่มภาพสำรวจ
  添加探查图片…: เพิ่มภาพสำรวจ…
  燕尾缺口: รอยบากหางนกนางแอ่น
  留空 = key: เว้นว่าง = key
  种类: ชนิด
  箭头颜色与搜索参数（保存到地图）: สีลูกศรและพารามิเตอร์ค้นหา (บันทึกลงแผนที่)
  识别结果: ผลการรู้จำ
  该地域已有探查图片，不能直接删除。: พื้นที่นี้มีภาพสำรวจอยู่แล้ว ไม่สามารถลบโดยตรงได้
  请选择截图所属地域。: กรุณาเลือกพื้นที่ของภาพหน้าจอนี้
  读取失败: อ่านไม่สำเร็จ
  读取当前布局失败，未能定位地图区域。: อ่านเลย์เอาต์ปัจจุบันไม่สำเร็จ จึงไม่สามารถระบุตำแหน่งพื้นที่แผนที่ได้
  载入截图文件…: โหลดไฟล์ภาพหน้าจอ…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: หลังโหลดภาพหน้าจอในเกมทั้งภาพ ระบบจะครอปตามพื้นที่มินิแมปที่ระบุในเลย์เอาต์ปัจจุบัน แล้ววิเคราะห์ลูกศรสีเหลืองเว้าตรงกลาง 0° = ทิศเหนือ (ด้านบนหน้าจอ) ตามเข็มนาฬิกาเป็นบวก
  适应窗口: พอดีหน้าต่าง
  选择局内截图: เลือกภาพหน้าจอในเกม
  选择底图: เลือกภาพฐาน
  重新识别: ตรวจจับใหม่
  （尚未载入截图）: (ยังไม่ได้โหลดภาพหน้าจอ)
maps:
  'HUD 场景不存在: {scene}': 'ไม่พบฉาก HUD: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: การผูก HUD minimap_center ต้องอยู่ในมุมมองฐาน
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'การผูก HUD minimap_center ต้องอ้างถึงจุดพิกัด แต่ไม่พบ: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: การผูก HUD {attr} ต้องอยู่ในมุมมอง full
  HUD 绑定 {attr} 必须属于基础视图: การผูก HUD {attr} ต้องอยู่ในมุมมองฐาน
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'การผูก HUD {attr} ต้องอ้างถึงพื้นที่ แต่ไม่พบ: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: POI key ต้องขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก และมีได้เฉพาะตัวอักษรพิมพ์เล็ก ตัวเลข และขีดล่าง
  'POI key 重复: {key}': 'POI key ซ้ำ: {key}'
  POI {key} 坐标超出底图范围: พิกัด POI {key} อยู่นอกขอบเขตภาพฐาน
  POI 必须是键值映射: POI ต้องเป็นการจับคู่คีย์-ค่า
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256 ต้องเป็นค่าแฮชฐานสิบหก 64 หลัก
  min_area 必须大于 0: min_area ต้องมากกว่า 0
  pois 必须是列表: pois ต้องเป็นรายการ
  ui 必须是键值映射: ui ต้องเป็นการจับคู่คีย์-ค่า
  window_ratio 必须在 0.05–1 之间: window_ratio ต้องอยู่ระหว่าง 0.05–1
  '{name} 必须是三元整数列表': '{name} ต้องเป็นรายการจำนวนเต็ม 3 ค่า'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name} ต้องมีค่า H=0–180 และ S/V=0–255'
  '{name}地图': แผนที่ {name}
  '地图 key 已存在: {key}': 'คีย์แผนที่มีอยู่แล้ว: {key}'
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: คีย์แผนที่ต้องขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก และมีได้เฉพาะตัวอักษรพิมพ์เล็ก ตัวเลข และขีดล่าง
  '地图不存在: {key}': 'ไม่พบแผนที่: {key}'
  地图名称不能为空: ชื่อแผนที่ต้องไม่ว่างเปล่า
  '地图名称已存在: {name}': 'ชื่อแผนที่มีอยู่แล้ว: {name}'
  地图图片与定义摘要不一致: ภาพแผนที่ไม่ตรงกับค่าแฮชในนิยาม
  地图定义必须是键值映射: นิยามแผนที่ต้องเป็นการจับคู่คีย์-ค่า
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: คีย์ในไฟล์แผนที่ {rel} คือ {inner} ซึ่งไม่ตรงกับชื่อไฟล์
  地域名称不能为空，且 key 不得重复: ชื่อพื้นที่ต้องไม่ว่างเปล่า และคีย์ต้องไม่ซ้ำกัน
  大地图: แผนที่ใหญ่
  底图数据为空: ข้อมูลภาพฐานว่างเปล่า
  底图文件名固定为 base.png: ชื่อไฟล์ภาพฐานต้องเป็น base.png เท่านั้น
  探查图片名称不能为空，且 key 不得重复: ชื่อภาพสำรวจต้องไม่ว่างเปล่า และคีย์ต้องไม่ซ้ำกัน
  '探查图片引用了不存在的地域: {region}': 'ภาพสำรวจอ้างถึงพื้นที่ที่ไม่มีอยู่: {region}'
  探查图片必须有有效的 SHA256 摘要: ภาพสำรวจต้องมีค่าแฮช SHA256 ที่ถูกต้อง
  '探查图片缺失或摘要不匹配: {name}': 'ภาพสำรวจสูญหายหรือค่าแฮชไม่ตรงกัน: {name}'
  '未知导航模式: {mode}': 'ไม่รู้จักโหมดนำทาง: {mode}'
  '未知朝向识别方法: {method}': 'ไม่รู้จักวิธีตรวจจับทิศทาง: {method}'
