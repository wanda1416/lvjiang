  正在校验本地 APK…: Verificando APK local…
  正在结束: Deteniendo
  正在连接设备端代理…: Conectando con el agente del dispositivo…
  正在通过 ADB 安装…: Instalando mediante ADB…
  比例: Proporción
  没有可用的局域网地址: No hay dirección LAN disponible
  没有可用的局域网地址：确认本机已连接网络: 'No hay dirección LAN disponible: comprueba que el equipo esté conectado a la red'
  没有已连接的 ADB 设备: No hay ningún dispositivo ADB conectado
  ? "测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。\n请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。"
  : "La prueba mantendrá pulsada la esquina inferior izquierda durante un momento mientras toca dos veces la esquina inferior derecha (es decir, «mantener el joystick mientras se toca»).\nColoca primero el teléfono en una pantalla del juego donde se aprecien el movimiento y el salto, y luego haz clic en Iniciar."
  版本: Versión
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: Cuando las versiones no coinciden, el protocolo y las configuraciones incluidas pueden ser incompatibles. Se recomienda actualizar el lado más antiguo
  用 PC 配置覆盖手机任务参数和用户名册。: Sobrescribe los parámetros de tareas y la lista de usuarios del teléfono con la configuración del PC.
  用 PC 配置覆盖手机批量配置。: Sobrescribe la configuración de lotes del teléfono con la del PC.
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: Escanea con el teléfono para descargar e instalar desde este PC. El teléfono debe estar en la misma LAN, pero no necesita acceso a Internet.
  ? "用手机扫码，直接从 GitHub 下载安装。\n手机上不了网时，改用右侧「本机共享」。"
  : "Escanea con el teléfono para descargar e instalar directamente desde GitHub.\nSi el teléfono no tiene acceso a Internet, usa «Compartición local» a la derecha."
  由本机提供下载，手机不需要能上网: La descarga se sirve desde este PC; el teléfono no necesita conexión a Internet
  电脑: PC
  确认手机已安装律匠 app、与本机同一局域网或已用 USB 连接，并在 app 内开启无障碍服务: Comprueba que la app de LvJiang esté instalada en el teléfono, en la misma LAN o conectada por USB, y que el servicio de accesibilidad esté activado en la app
  离线任务: Tareas sin conexión
  移动设备（正在停止后台操作…）: Dispositivo móvil (deteniendo operación en segundo plano…)
  落点：按住 {push}，期间点击 {tap}: 'Puntos: mantener {push} mientras se toca {tap}'
  设备体检: Diagnóstico del dispositivo
  设备已切换，请刷新离线任务状态: El dispositivo ha cambiado; actualiza el estado de las tareas sin conexión
  设备序列号: Número de serie del dispositivo
  设备扫描: Escaneo de dispositivos
  设备端收到了指令但执行失败，展开日志看原因: El dispositivo recibió el comando pero falló la ejecución; despliega el registro para ver el motivo
  设备端版本: Versión del dispositivo
  请先更新 APK：旧版本不支持独立保留任务参数和批量配置: 'Actualiza primero el APK: la versión anterior no permite conservar por separado los parámetros de tareas y la configuración de lotes'
  请先选择在线设备: Selecciona primero un dispositivo en línea
  远程执行: Ejecución remota
  选择 APK: Seleccionar APK
  选择本地 APK…: Seleccionar APK local…
  重新扫描: Volver a escanear
  除本窗口外还有 {n} 路连接连着这台手机，可能来自另一个窗口或另一台电脑，操作会互相打断: Además de esta ventana, hay otras {n} conexiones activas con este teléfono (posiblemente de otra ventana u otro equipo); las operaciones se interrumpirán entre sí
  同步布局: Sincronizar diseños
  将更新脚本、布局和用户数据；总览数据不随包下发，由手机账号云端同步。: Se actualizarán los scripts, diseños y datos de usuario; los datos de resumen no se envían en el paquete y se sincronizan mediante la nube de la cuenta móvil.
