[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lvjiang"
version = "0.10.3"
description = "通用视觉 RPA 引擎（支持插件扩展，燕云十六声装备调律工具）"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6,<6.8; sys_platform == 'darwin'",  # 6.8+ 需 macOS 13+
    "PyQt6>=6.6; sys_platform != 'darwin'",
    "mss>=9.0",
    "pynput>=1.7",
    "rapidocr-onnxruntime>=1.2",
    "onnxruntime>=1.19,<1.21",  # 1.20+ 需 macOS 13+；macOS 12 自动回退到 1.19
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "lark>=1.1",  # DSL 解析器
    "loguru>=0.7",
    "av>=12.0",  # PyAV — H.264 解码（scrcpy 模式需要）
    "opencv-python==4.10.0.84; sys_platform == 'darwin'",  # 4.11+/5.x 需 macOS 13-14+，macOS 12 用 4.10
    "fasteners>=0.19",  # 跨平台文件锁（session.json 多进程安全）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "pytest-xdist>=3.5",
    "pytest-testmon>=2.2,<3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pygls>=1.3,<2.0",  # Language Server for VS Code extension (2.x API changed)
]

# src-layout：`src/` 只是源根，不是包；可导入的包是 src/lvjiang/。
# 这样打包边界可枚举（源根下只有 lvjiang 一个子项），Android 侧 Chaquopy 的
# srcDir 才能直接指向 src/ 而不会把 config/ data/ docs/ 一并卷进 APK。
[tool.setuptools.packages.find]
where = ["src"]

# grammar.lark 是 DSL 解析器运行时要读的文件，不声明的话非 editable 安装会缺它
[tool.setuptools.package-data]
lvjiang = ["workflows/grammar/*.lark"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# 让裸检出（未 pip install -e .）也能直接跑 pytest：把源根加进 sys.path
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
# 机器上可能同时存在 PySide6，固定 pytest-qt 用项目依赖的 PyQt6，避免 Qt DLL 冲突
qt_api = "pyqt6"
# 把未处理警告升级为错误，保障回归基线干净（具体需要时再单独放行）
filterwarnings = ["error"]
# 自定义 marker：slow 标记耗时测试（Excel 转换等），本地迭代可用 -m "not slow" 跳过
markers = ["slow: 耗时测试（Excel 转换等），本地迭代可用 -m 'not slow' 跳过"]

# 覆盖率当前只做度量，不设 fail_under。CI 输出分支覆盖率与 XML 报告，
# 本地默认 pytest 不自动开启，避免拖慢日常快速验证。
[tool.coverage.run]
branch = true
source = ["lvjiang"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# E501：存量长行较多，避免一次性全仓重排；新代码自觉控制行宽
ignore = ["E501"]

# mypy 覆盖全部 src 代码
[tool.mypy]
files = ["src"]
ignore_missing_imports = true
# 钉住版本，不跟开发机解释器走。不钉这一条，开发机用 3.13 就看不见
# 「只在 3.13 存在的 stdlib 参数」——Android 侧 Chaquopy 固定 3.10，
# 这类调用在那里是运行期 TypeError，本地却全绿（见 versioning 的
# read_text(newline=)）。
# 取 3.12 与 CI 对齐：真正的下限是 3.10，但 numpy 自带的 .pyi 要求
# >=3.12，钉 3.10 会卡在 numpy 存根上检查不下去。3.12 已能挡住
# 3.13-only 的 API；3.10/3.11 特有的差异仍需靠 CI 与实机覆盖。
python_version = "3.12"
# attr-defined/has-type：Mixin 拆分架构下宿主属性在组装类才存在，
# 单文件视角必然报未定义，属架构噪音；待 Protocol 声明宿主接口后再启用
disable_error_code = ["attr-defined", "has-type", "annotation-unchecked"]
