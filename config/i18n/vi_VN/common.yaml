  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'Mặc định thử thiết lập luồng video 5 lần, thất bại sẽ kết nối lại tác nhân 5 lần và ADB 5 lần, cách nhau 2 giây. Nếu vẫn không khả dụng sẽ chờ xử lý thủ công vô thời hạn: chọn Có để kiểm tra lại, chọn Không để dừng tác vụ tương ứng; đóng thông báo không dừng tác vụ và thanh thông báo trên cùng vẫn giữ nguyên.

    Không hạ cấp đa điểm và cử chỉ đồng thời. Không tự động lặp lại thao tác khi chưa chắc chắn đã thực thi hay chưa. Cài đặt áp dụng cho các tác vụ khởi chạy sau đó.'
