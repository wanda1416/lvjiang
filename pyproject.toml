[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lvjiang"
version = "0.1.0"
description = "燕云十六声手游装备调律自动化工具"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "mss>=9.0",
    "pynput>=1.7",
    "rapidocr-onnxruntime>=1.2",
    "onnxruntime>=1.20,<1.21",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "av>=12.0",  # PyAV — H.264 解码（scrcpy 模式需要）
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[tool.setuptools.packages.find]
include = ["lvjiang*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
# 把未处理警告升级为错误，保障回归基线干净（具体需要时再单独放行）
filterwarnings = ["error"]
