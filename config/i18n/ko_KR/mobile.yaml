  "测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。\n请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。": "테스트는 화면 왼쪽 아래를 일정 시간 길게 누르면서 오른쪽 아래를 두 번 탭합니다(즉, 「조이스틱을 밀면서 연속 탭」).\n휴대폰을 이동과 점프 동작을 확인할 수 있는 게임 화면에 둔 뒤 시작을 누르세요."
  版本: 버전
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: 버전이 일치하지 않으면 프로토콜과 내장 설정이 맞지 않을 수 있습니다. 낮은 쪽 버전을 높은 쪽에 맞춰 업그레이드하는 것을 권장합니다
  用 PC 配置覆盖手机任务参数和用户名册。: PC 설정으로 모바일 작업 매개변수와 사용자 명단을 덮어씁니다.
