# 工作流注册配置
#
# 简单工作流只需在此声明 wf_file 和所需场景，即可在 GUI 下拉列表中选择执行。
# 复杂工作流通过 Python Workflow 实例在代码启动时自注册，不在此文件中声明。

flows:
  - id: equip_analysis
    name: 毕业率分析
    wf_file: equip_analysis.wf
    required_scenes:
      - equip_bag_detail
      - equip_weapon_detail
      - equip_armor_detail

  - id: single_tuning
    name: 单装备调律
    wf_file: single_tuning.wf
    required_scenes:
      - game_main_page
      - game_menu_page
      - equip_bag_detail
      - equip_weapon_detail
      - equip_tune_detail
      - equip_tune_result

  - id: move_forward_test
    name: 向前移动测试
    wf_file: move_forward_test.wf
    required_scenes:
      - game_main_page
