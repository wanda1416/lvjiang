  标定样本，不需要尺寸: Калибровочный образец, размер не требуется
  删除模板: Удалить шаблон
  删除失败，详见日志: Не удалось удалить; подробности в журнале
  未登记（同分辨率专用）: Не зарегистрирован (только для того же разрешения)
