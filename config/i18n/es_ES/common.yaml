  "实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。": "Función experimental: muchos scripts aún no funcionan en este modo y no se aceptan informes de fallo al respecto. La captura en segundo plano permite capturar la ventana del juego incluso cubierta por otras ventanas, aunque es algo más lenta; requiere que la entrada de ventana también sea en segundo plano, y ninguna funciona si la ventana está minimizada. Esto define el valor predeterminado: la ventana principal solo marca automáticamente «Captura en segundo plano» al activar «Modo en segundo plano», y puedes cambiarlo en cualquier momento durante la ejecución."
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Función experimental: el móvil debe tener instalada la app LvJiang con el servicio de accesibilidad activado; solo cambia el canal de toques y deslizamientos, no el método de captura. Si falla la conexión, vuelve a ADB shell input.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: Aún no hay información de conexión de este tipo; conecta un dispositivo o localiza una ventana en la ventana principal primero.
