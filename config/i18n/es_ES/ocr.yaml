  "区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。\n这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。": "El reconocimiento por lotes combina varias regiones de texto en un solo lienzo y ejecuta OCR una sola vez.\nEstos parámetros controlan el tamaño del lienzo combinado; tras guardar, se aplican a partir del siguiente reconocimiento."
  原始文本: Texto original
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: Hay cambios sin guardar en la configuración de OCR. ¿Seguro que quieres salir y descartarlos?
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*): Archivos de imagen (*.png *.jpg *.jpeg *.bmp *.webp);;Todos los archivos (*)
