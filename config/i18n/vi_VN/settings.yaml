  完全离线模式（暂停全部联网功能）: Chế độ hoàn toàn ngoại tuyến (tạm dừng mọi tính năng mạng)
  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : "Tính năng thử nghiệm: nhiều script tạm thời chưa chạy được ở chế độ này và không tiếp nhận phản hồi lỗi. Chụp nền sau cho phép chụp cửa sổ trò chơi ngay cả khi bị cửa sổ khác che khuất nhưng chậm hơn một chút; yêu cầu đầu vào cửa sổ cũng ở chế độ nền sau và không lấy được hình khi cửa sổ bị thu nhỏ. Đây là giá trị mặc định: giao diện chính chỉ tự động chọn \"Chụp nền sau\" sau khi bạn bật \"Chế độ nền sau\", và vẫn có thể đổi bất cứ lúc nào trong phiên chạy."
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: "Tính năng thử nghiệm: điện thoại cần cài ứng dụng LvJiang và bật dịch vụ Trợ năng; chỉ thay đổi kênh thực thi chạm và vuốt, không thay đổi cách chụp màn hình. Tự động quay về ADB shell input khi kết nối thất bại."
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: "Chưa có thông tin kết nối thuộc loại này, vui lòng kết nối thiết bị hoặc định vị cửa sổ trong cửa sổ chính trước."
