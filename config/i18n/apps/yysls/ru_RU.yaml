  首次识别时使用的额外大律准石数量门槛。: Дополнительный порог больших камней настройки при первом распознавании.
  "默认使用去重遍历（dedup）；启用后改用位置校验遍历（positional）。": "По умолчанию используется обход с дедупликацией (dedup); при включении переключается на позиционную проверку (positional)."
