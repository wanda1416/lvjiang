  : '실험 기능: 많은 스크립트가 아직 이 모드에서 정상 동작하지 않으며 이 기능의 미동작 피드백은 접수하지 않습니다. 백그라운드 캡처는 게임 창이 다른 창에 가려져도 캡처할 수 있지만 포그라운드 캡처보다 다소 느리며, 창 입력도 백그라운드 입력이어야 하고 창이 최소화되면 둘 다 화면을 가져올 수 없습니다. 여기서는 기본값만 설정하며, 메인 화면에서 「백그라운드 모드」를 체크해야 「백그라운드 캡처」가 자동으로 체크되고 실행 중에도 언제든 변경할 수 있습니다.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: '실험 기능: 휴대폰에 LvJiang 앱을 설치하고 접근성 서비스를 켜야 합니다. 터치와 스와이프의 실행 채널만 변경하며 스크린샷 방식은 바뀌지 않습니다. 연결 실패 시 ADB shell input으로 대체됩니다.'
