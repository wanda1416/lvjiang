static_check:
  区域未绑定模板: Aucun modèle lié à la zone
  场景未绑定任何坐标: Aucune coordonnée liée à la scène
  场景未绑定任何子场景引用: Aucune référence de sous-scène liée à la scène
  子场景引用未定义: Référence de sous-scène non définie
  子场景引用未绑定坐标: Aucune coordonnée liée à la référence de sous-scène
  引用目标不是子场景: La cible référencée n'est pas une sous-scène
  请核对脚本里的 key 拼写（DSL 只认 key，不认中文名），或在场景布局编辑器中绑定: Vérifiez l'orthographe de la clé dans le script (le DSL ne reconnaît que les clés, pas les noms chinois), ou liez-la dans l'éditeur de scènes
