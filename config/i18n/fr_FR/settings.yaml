  "菜单快捷键": "Raccourcis de menu"
  "仅在窗口内生效，窗口失焦时不抢游戏按键。": "Actifs uniquement lorsque la fenêtre a le focus, sans interférer avec le jeu."
  界面语言: Langue de l'interface
