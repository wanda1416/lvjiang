  ? "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。"
  : "Standardmäßig 5 Versuche für den Videostream, danach 5 Wiederverbindungen für den Agent und 5 für ADB im Abstand von 2 Sek. Bleibt die Verbindung aus, wartet die Aufgabe unbegrenzt auf manuelles Eingreifen: „Ja“ prüft erneut, „Nein“ stoppt die Aufgabe; das Schließen des Hinweises stoppt nicht und das Banner bleibt sichtbar.\nMehrfinger- und parallele Gesten werden nicht herabgestuft. Unklare Aktionen werden nicht automatisch wiederholt. Gilt für künftig gestartete Aufgaben."
