  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: 読みやすく直接編集可能な WF DSL を生成します。録画停止時に安全に統合できるキー押下・長押し・解放および後続待機をまとめ、連続マウス移動と短い待機は約 100ms 粒度で集約します。通常の UI 操作や後からの手動調整に適していますが、生の入力イベント単位で厳密な再現が必要なゲーム視点操作には向きません。
