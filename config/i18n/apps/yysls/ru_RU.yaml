  "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。\n不会改写装备；进入后的调律处理仍使用完整实际词条。": "Игнорирует прочие аффиксы только при проверке порога настройки; решение о запуске принимается по максимальному потенциалу первого аффикса.\nСнаряжение не изменяется; после входа в настройку используются полные фактические аффиксы."
  "本赛季仍可承音的最低装备等级。低于它的装备本赛季已被抛弃，既不能原地承音也不能承音到下一阶，因此不参与满等级/满承音假设。\n这与等级配置里的「支持承音」不是一回事：后者描述该等级的装备当年是否允许承音。": "Минимальный уровень снаряжения, доступный для Чэнъинь в этом сезоне. Всё, что ниже, в этом сезоне устарело (нельзя ни на месте, ни на следующий ранг) и исключается из допущений полного уровня и Чэнъинь.\nЭто не то же самое, что «Поддержка Чэнъинь» в настройках уровней: там указано, допускало ли это снаряжение Чэнъинь изначально."
