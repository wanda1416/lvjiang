# 律匠默认配置

# 场景加载顺序（决定 FIELD_GROUPS 遍历顺序、区域编辑器 Tab 顺序）
layout_scenes:
  - equip_bag_detail
  - equip_weapon_detail
  - equip_armor_detail
  - equip_tune_detail
  - equip_tune_result

# 当前目标流派
target_flow: "会心双刀"

# 顶级装备自动保护
auto_protect_top_tier: true

# 保留策略: top1 / top2 / top3
keep_strategy: "top2"

# 投屏窗口标题（留空则自动检测）
window_title: ""

# 调律预算
budget:
  max_tunes_per_equip: 20
  material_threshold: 10

# 延迟参数（模拟人类操作）
delay:
  click_interval: [0.1, 0.3]
  after_click_wait: [0.1, 0.2]
  after_tune_wait: 1.5
