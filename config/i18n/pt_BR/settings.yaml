  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'O que fazer quando uma coordenada de clique/arrasto calculada pelo motor sai do quadro capturado.

    Desmarcado (padrão): gera erro e encerra a execução — sair dos limites indica que o deslocamento do script não bate com a geometria atual do painel, e truncar silenciosamente transformaria "rolar duas linhas" em "rolar uma linha" sem aparecer no script nem no log.

    Marcado: o motor trunca na borda do quadro, registra um aviso (warning) e continua executando.

    A verificação ocorre na camada do motor: gestos de acessibilidade no dispositivo rejeitam coordenadas fora do limite, enquanto a entrada no desktop e adb shell input aceitam silenciosamente.'
  当前标识：未生成（未开启）: 'ID atual: não gerado (desativado)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: Após reiniciar o celular, o processo do serviço Shizuku é encerrado, e tarefas que reiniciam o jogo dependem dele. Quando ativado, ao conectar no modo no dispositivo, detecta e inicia o serviço automaticamente uma vez (apenas se não estiver em execução).
