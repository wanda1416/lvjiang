  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : '엔진이 계산한 클릭/드래그 좌표가 화면 밖으로 벗어났을 때의 처리 방식입니다.

    선택 해제(기본값): 오류를 발생시키고 실행을 종료합니다. 범위 초과는 스크립트의 이동 매개변수가 현재 패널 구조와 맞지 않음을 의미하며, 자동 잘라내기를 하면 「2줄 스크롤」이 조용히 「1줄 스크롤」로 바뀌어 스크립트와 로그에서 파악하기 어렵습니다.

    선택: 엔진이 화면 경계로 좌표를 자르고 warning 로그를 남긴 뒤 계속 실행합니다.

    판정은 엔진 계층에서 수행됩니다. 동일한 범위 초과 좌표라도 기기 접근성 제스처는 즉시 거부하는 반면, 데스크톱과 adb shell input은 조용히 허용하므로 백엔드에만 의존할 수 없습니다.'
  当前标识：未生成（未开启）: '현재 식별자: 생성되지 않음(비활성화)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: 휴대폰을 재부팅하면 Shizuku 서비스 프로세스가 종료되며, 게임을 재시작하는 작업은 이에 의존합니다. 활성화하면 기기 내 실행 연결 시 자동으로 감지해 1회 시작합니다(미실행 상태일 때만).
  执行参数: 실행 매개변수
  把激活码粘贴到这里，换行和空格会被自动忽略: 여기에 활성화 코드를 붙여넣으세요. 줄바꿈과 공백은 자동으로 무시됩니다
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: 현재 앱 버전과 일치하는 공식 설정 및 작업 업데이트를 수신하며, 검증 통과 후 다음 실행 시 적용됩니다. 로컬 설정이 항상 우선하며 실행 중인 작업은 현재 프로세스에 로드된 설정을 계속 사용합니다. 이 옵션을 끄거나 오프라인 모드로 전환하면 다음 실행 시 기본 내장 설정으로 복원되고 멤버십 콘텐츠가 해제되며 로컬 데이터에는 영향을 주지 않습니다.
  接收在线配置更新: 온라인 설정 업데이트 수신
  新方案: 새 연결 프로필
