  安装完成：{out}: 'Instalación completada: {out}'
  尚未扫描: Aún no escaneado
  ? "局域网扫描用于发现已开启无线 ADB 的设备；本机端口扫描用于发现只监听 127.0.0.1 的模拟器。\n扫描只建立 ADB 连接，不会切换主界面的执行目标。"
  : "El escaneo LAN detecta dispositivos con ADB inalámbrico activado; el escaneo de puertos locales detecta emuladores que solo escuchan en 127.0.0.1.\nEl escaneo solo establece conexiones ADB y no cambia el destino de ejecución de la ventana principal."
