  移除头像失败：{error}: 移除頭像失敗：{error}
  移除当前头像: 移除當前頭像
  编辑“{name}”的头像: 編輯“{name}”的頭像
  编辑头像: 編輯頭像
  缩放: 縮放
  ? '该头像正被以下用户使用，不能删除：

    {users}


    请先为这些用户更换或移除头像。'
  : '該頭像正被以下使用者使用，不能刪除：

    {users}


    請先為這些使用者更換或移除頭像。'
  选择之前保存的头像，或导入一张新图片: 選擇之前儲存的頭像，或匯入一張新圖片
user_manager:
  保存属性: 儲存屬性
  删除属性: 刪除屬性
  同步全部头像: 同步全部頭像
  属性 Key 不能为空: 屬性 Key 不能為空
  属性 Key 不能重复：{key}: 屬性 Key 不能重複：{key}
  悬浮点击编辑，或双击头像: 懸浮點選編輯，或雙擊頭像
  把本机与云端的头像做一次双向合并；不参与日常自动同步: 把本機與雲端的頭像做一次雙向合併；不參與日常自動同步
  新增属性: 新增屬性
  新建用户: 新建使用者
  无法删除该用户: 無法刪除該使用者
  正在同步头像…: 正在同步頭像…
