  相邻文字区域在拼图中的间隔。: Khoảng cách giữa các vùng văn bản liền kề trong ảnh ghép.
  "确定删除规则组「{name}」吗？引用它的工作流将无法执行。": "Bạn có chắc muốn xóa nhóm quy tắc \"{name}\" không? Các quy trình đang tham chiếu đến nhóm này sẽ không thể chạy."
  确定撤销本次所有未保存的清洗规则更改吗？: "Bạn có chắc muốn hoàn tác tất cả thay đổi quy tắc làm sạch chưa lưu trong phiên này không?"
  确定撤销本次所有未保存的识别配置更改吗？: "Bạn có chắc muốn hoàn tác tất cả thay đổi cấu hình nhận diện chưa lưu trong phiên này không?"
  "行 {n}: 无效的正则表达式": "Dòng {n}: biểu thức chính quy không hợp lệ"
  规则组 key（用于 with 声明）: Khóa nhóm quy tắc (dùng trong mệnh đề with)
