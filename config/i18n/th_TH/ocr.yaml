  清洗组: กลุ่มการล้างข้อความ
  画布最小边长: ความยาวด้านต่ำสุดของแคนวาส
  识别结果（已应用清洗规则）: ผลการรู้จำ (ใช้กฎการล้างข้อความแล้ว)
main_window:
  就绪: พร้อมใช้งาน
menu_ops:
  图像识别: การรู้จำภาพ (OCR)
ocr_dialog:
  (无匹配): (ไม่พบรายการที่ตรงกัน)
  Ctrl+V 粘贴截图，或点击「上传图片」加载文件: กด Ctrl+V เพื่อวางภาพหน้าจอ หรือคลิก "อัปโหลดรูปภาพ" เพื่อโหลดไฟล์
  key 不能为空: key ต้องไม่ว่างเปล่า
  一批区域内容允许的最大总高度，超过后拆分为下一批识别。: ความสูงรวมสูงสุดที่อนุญาตสำหรับพื้นที่ในหนึ่งชุด หากเกินจะแยกเป็นชุดถัดไปในการรู้จำ
  上传图片: อัปโหลดรูปภาพ
  从设备获取最新截图: จับภาพหน้าจอล่าสุดจากอุปกรณ์
  创建规则组: สร้างกลุ่มกฎ
  删除规则组: ลบกลุ่มกฎ
  刷新截图不可用：未连接设备或未传入回调: 'ไม่สามารถรีเฟรชภาพหน้าจอได้: ยังไม่ได้เชื่อมต่ออุปกรณ์หรือไม่ได้ส่งค่าคอลแบ็ก'
  刷新截图失败: รีเฟรชภาพหน้าจอไม่สำเร็จ
  匹配参考图: จับคู่ภาพอ้างอิง
  区域批量识别: การรู้จำหลายพื้นที่แบบกลุ่ม
  ? '区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。

    这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。'
  : 'การรู้จำหลายพื้นที่แบบกลุ่มจะรวมพื้นที่ข้อความหลายจุดเข้าเป็นแคนวาสเดียวเพื่อเรียกใช้ OCR เพียงครั้งเดียว

    พารามิเตอร์เหล่านี้ใช้ควบคุมขนาดภาพที่นำมารวมกัน โดยจะมีผลตั้งแต่การรู้จำครั้งถัดไปหลังบันทึก'
  原始文本: ข้อความต้นฉบับ
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: การตั้งค่าการรู้จำภาพมีการเปลี่ยนแปลงที่ยังไม่ได้บันทึก ยืนยันที่จะออกและละทิ้งการเปลี่ยนแปลงหรือไม่?
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*): ไฟล์รูปภาพ (*.png *.jpg *.jpeg *.bmp *.webp);;ไฟล์ทั้งหมด (*)
  已撤销未保存的清洗规则修改: ยกเลิกการแก้ไขกฎการล้างข้อความที่ยังไม่ได้บันทึกแล้ว
  已撤销未保存的识别配置修改: ยกเลิกการแก้ไขการตั้งค่าการรู้จำที่ยังไม่ได้บันทึกแล้ว
  已清除选框: ล้างกรอบที่เลือกแล้ว
  拼图画布宽、高的最小值。过小会使窄区域被 OCR 检测器大幅放大。: ค่าความกว้างและความสูงต่ำสุดของแคนวาสรวมภาพ หากเล็กเกินไปอาจทำให้พื้นที่แคบถูกตัวตรวจจับ OCR ขยายมากเกินไป
  撤销清洗规则: ย้อนกลับกฎการล้างข้อความ
  撤销识别配置: ย้อนกลับการตั้งค่าการรู้จำ
  文本替换（精确匹配）: แทนที่ข้อความ (ตรงกันทุกตัวอักษร)
  无图片: ไม่มีรูปภาพ
  无法读取剪贴板图片: ไม่สามารถอ่านรูปภาพจากคลิปบอร์ดได้
  替换为: แทนที่ด้วย
  未匹配到参考图: ไม่พบภาพอ้างอิงที่ตรงกัน
  未识别到文字: ไม่พบข้อความที่รู้จำได้
  正则替换: แทนที่ด้วย Regex
  正则表达式: นิพจน์ทั่วไป (Regex)
  正在刷新截图...: กำลังรีเฟรชภาพหน้าจอ...
  正在匹配参考图...: กำลังจับคู่ภาพอ้างอิง...
  正在识别文字...: กำลังรู้จำข้อความ...
  测试: ทดสอบ
  测试清洗效果: ทดสอบผลการล้างข้อความ
  添加替换规则: เพิ่มกฎการแทนที่
  添加正则规则: เพิ่มกฎ Regex
  清洗结果...: ผลการล้างข้อความ...
  清洗规则: กฎการล้างข้อความ
  清洗规则已保存: บันทึกกฎการล้างข้อความแล้ว
  清空画布: ล้างแคนวาส
  清除红色选框: ล้างกรอบเลือกสีแดง
  清除选择: ล้างการเลือก
  相邻文字区域在拼图中的间隔。: ระยะห่างระหว่างพื้นที่ข้อความที่อยู่ติดกันบนแคนวาสรวมภาพ
  确定删除规则组「{name}」吗？引用它的工作流将无法执行。: ยืนยันที่จะลบกลุ่มกฎ "{name}" หรือไม่? เวิร์กโฟลว์ที่อ้างอิงกลุ่มกฎนี้จะไม่สามารถทำงานได้
  确定撤销本次所有未保存的清洗规则更改吗？: ยืนยันที่จะย้อนกลับการเปลี่ยนแปลงกฎการล้างข้อความที่ยังไม่ได้บันทึกทั้งหมดในครั้งนี้หรือไม่?
  确定撤销本次所有未保存的识别配置更改吗？: ยืนยันที่จะย้อนกลับการเปลี่ยนแปลงการตั้งค่าการรู้จำที่ยังไม่ได้บันทึกทั้งหมดในครั้งนี้หรือไม่?
  '行 {n}: 无效的正则表达式': 'แถวที่ {n}: นิพจน์ทั่วไป (Regex) ไม่ถูกต้อง'
  规则组 key（用于 with 声明）: key ของกลุ่มกฎ (ใช้สำหรับคำสั่ง with)
  规则组名称: ชื่อกลุ่มกฎ
  规则组已创建: สร้างกลุ่มกฎแล้ว
  规则组已删除: ลบกลุ่มกฎแล้ว
  规则组已重命名: เปลี่ยนชื่อกลุ่มกฎแล้ว
  识别失败: การรู้จำไม่สำเร็จ
  识别文字: รู้จำข้อความ
  识别配置: การตั้งค่าการรู้จำ
  识别配置已保存: บันทึกการตั้งค่าการรู้จำแล้ว
  请先保存或取消当前清洗组的修改: กรุณาบันทึกหรือยกเลิกการแก้ไขกลุ่มการล้างข้อความปัจจุบันก่อน
  输入测试文本...: ป้อนข้อความทดสอบ...
  选择图片: เลือกรูปภาพ
  选框区域为空: พื้นที่กรอบที่เลือกว่างเปล่า
  重命名规则组: เปลี่ยนชื่อกลุ่มกฎ
  ? '默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。

    改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。'
  : 'กฎเริ่มต้นจะมีผลกับการรู้จำ OCR ทั้งหมดทั่วระบบ ส่วนคำสั่ง with ใน scan/find จะใช้กลุ่มกฎธุรกิจที่เลือกต่อจากกฎเริ่มต้น

    คลิก "บันทึก" เพื่อใช้งานได้ทันทีโดยไม่ต้องรีสตาร์ต และสามารถใช้ "ย้อนกลับ" เพื่อกู้คืนการแก้ไขที่ยังไม่ได้บันทึกได้'
  默认规则（全局）: กฎเริ่มต้น (ทั้งระบบ)
  ? '识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。

    保存后从下一次识别开始生效，不需要重启。'
  : 'ประสิทธิภาพการรู้จำมีผลกับการเรียกใช้การรู้จำทั้งหมด ยิ่งทำงานแบบขนานสูงยิ่งเร็วขึ้น แต่จะใช้ CPU เพิ่มขึ้นตามสัดส่วน

    มีผลตั้งแต่การรู้จำครั้งถัดไปหลังบันทึกโดยไม่ต้องรีสตาร์ต'
  识别性能: ประสิทธิภาพการรู้จำ
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: จำนวนเธรดที่ใช้ภายในการรู้จำหนึ่งครั้ง ค่าเริ่มต้นคือ 2 จากการทดสอบการตั้งค่าสูงกว่านี้ไม่ทำให้เร็วขึ้น แต่จะเพิ่มการใช้ CPU ของเครื่อง หากตั้งเป็น 1 จะประหยัด CPU ที่สุด เหมาะสำหรับการรันเบื้องหลังระยะยาว
  识别线程数: จำนวนเธรดการรู้จำ
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: จำนวนเธรดตัวดำเนินการที่รันขนานกัน โมเดลตรวจจับ จำแนก และรู้จำต่างมีเธรดพูลของตนเองอยู่แล้ว การเพิ่มค่ามักทำให้เกิดการแย่งทรัพยากร ค่าเริ่มต้นคือ 1
  并行算子线程数: จำนวนเธรดตัวดำเนินการขนาน
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: ปรับขนาดภาพตามด้านสั้นเป็นค่านี้ก่อนการตรวจจับ (ภาพใหญ่ย่อลง ภาพเล็กขยายขึ้น) ค่าที่น้อยลงจะเร็วและประหยัด CPU กว่า แต่อาจตรวจจับตัวอักษรขนาดเล็กพลาดได้ ค่าโรงงานคือ 736 ไม่ควรเปลี่ยนหากไม่จำเป็น
  检测输入短边: ขนาดด้านสั้นของภาพขาเข้าสำหรับการตรวจจับ
