  每个应用可同时绑定 Android 与 Windows。运行时按当前实际连接目标选择绑定，与工作流环境无关；连接后可用对应的「获取连接信息」自动回填。: 各アプリは Android と Windows の両方を同時バインドできます。実行時はワークフロー環境とは無関係に実際の接続先に応じて選択されます。接続後は対応する「接続情報を取得」で自動入力できます。
