  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'Cách xử lý khi tọa độ nhấp/kéo do công cụ tính toán nằm ngoài khung hình.

    Bỏ chọn (mặc định): báo lỗi và kết thúc phiên chạy — vượt biên nghĩa là tham số dịch chuyển của kịch bản không khớp với hình học bảng hiện tại; tự động cắt sẽ âm thầm biến "cuộn hai dòng" thành "cuộn một dòng" mà cả kịch bản lẫn nhật ký đều không thấy.

    Chọn: công cụ cắt về biên khung hình, ghi một cảnh báo và tiếp tục chạy.

    Kiểm tra diễn ra ở tầng công cụ: cùng một tọa độ vượt biên, cử chỉ trợ năng trên thiết bị sẽ từ chối cứng còn máy tính và adb shell input lại âm thầm chấp nhận, không thể trông chờ tầng phụ trợ chặn giúp.'
  当前标识：未生成（未开启）: 'Mã định danh hiện tại: chưa tạo (chưa bật)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: Sau khi điện thoại khởi động lại, tiến trình dịch vụ Shizuku sẽ dừng, trong khi các tác vụ cần khởi động lại trò chơi phụ thuộc vào nó. Khi bật, lúc kết nối chế độ chạy trên thiết bị sẽ tự động kiểm tra và khởi chạy một lần (chỉ khởi chạy nếu chưa chạy).
