  每个应用可同时绑定 Android 与 Windows。运行时按当前实际连接目标选择绑定，与工作流环境无关；连接后可用对应的「获取连接信息」自动回填。: Jede App kann gleichzeitig an Android und Windows gebunden werden. Zur Laufzeit wird die Bindung passend zum tatsächlich verbundenen Ziel gewählt, unabhängig von der Workflow-Umgebung; nach der Verbindung lässt sie sich per „Verbindungsinfo abrufen“ automatisch ausfüllen.
