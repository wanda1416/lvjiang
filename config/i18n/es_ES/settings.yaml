  连接方案: Planes de conexión
  连接端侧执行时自动启动 Shizuku 服务: Iniciar automáticamente el servicio Shizuku al conectar en modo en dispositivo
  部分激活码不绑定机器，直接粘贴即可，不需要提供序列号。: 'Algunos códigos de activación no se vinculan al equipo: basta con pegarlos sin proporcionar número de serie.'
  重置匿名标识: Restablecer ID anónimo
  重置后服务端会把你当成一个新用户，之前的记录无法再与新标识关联。确定重置吗？: Tras restablecerlo, el servidor te tratará como un usuario nuevo y los registros anteriores no podrán vincularse al nuevo ID. ¿Seguro que quieres restablecerlo?
  重置标识: Restablecer ID
  重试间隔（秒）: Intervalo entre reintentos (s)
  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: Si necesitas un código vinculado a este equipo, envía este número de serie al autor. Se calcula a partir de la placa base en cada inicio, no se guarda en disco ni contiene información de hardware reversible.
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: Este número se comparte entre el establecimiento inicial del vídeo y la recuperación automática tras una desconexión; si se agota, la tarea espera intervención manual sin abandonarse automáticamente.
  首次窗口定位后可自动获取: Se puede obtener automáticamente tras la primera localización de ventana
  高级设置: Configuración avanzada
  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'Por defecto se intenta iniciar el flujo de vídeo 5 veces; si falla, se reconecta el agente 5 veces y ADB 5 veces con intervalos de 2 s. Si sigue sin estar disponible, espera indefinidamente intervención manual: «Sí» vuelve a comprobar y «No» detiene la tarea; cerrar el aviso no detiene la tarea y el banner superior permanece visible.

    Los gestos multitáctiles y concurrentes no se degradan. Si no es seguro que una acción se haya ejecutado, no se repite automáticamente. Se aplica a las tareas iniciadas después.'
  鼠标/触控移动到目标位置的耗时: Tiempo que tarda el ratón o toque en desplazarse a la posición objetivo
