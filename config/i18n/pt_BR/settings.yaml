  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: Usado tanto na criação inicial do fluxo de vídeo quanto na recuperação automática após desconexão; ao esgotar, a tarefa aguarda intervenção manual e não é abandonada automaticamente.
