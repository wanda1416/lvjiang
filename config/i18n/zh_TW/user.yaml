  头像库: 頭像庫
  头像文件不存在或文件名无效: 頭像檔案不存在或檔名無效
  头像正在使用: 頭像正在使用
  导入图片或从剪贴板粘贴: 匯入圖片或從剪貼簿貼上
  导入头像图片: 匯入頭像圖片
  当前使用: 當前使用
  截图失败: 截圖失敗
  无法更新用户头像引用: 無法更新使用者頭像引用
  无法粘贴: 無法貼上
  无法读取图片：{error}: 無法讀取圖片：{error}
  没有可保存的裁剪图片: 沒有可儲存的裁剪圖片
  没有读取到有效图片: 沒有讀取到有效圖片
