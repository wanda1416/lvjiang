maps:
  'HUD 场景不存在: {scene}': 'ไม่พบฉาก HUD: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: การผูก HUD minimap_center ต้องอยู่ในมุมมองพื้นฐาน
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'การผูก HUD minimap_center ต้องอ้างอิงจุดพิกัด แต่ไม่พบ: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: การผูก HUD {attr} ต้องอยู่ในมุมมอง full
  HUD 绑定 {attr} 必须属于基础视图: การผูก HUD {attr} ต้องอยู่ในมุมมองพื้นฐาน
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'การผูก HUD {attr} ต้องอ้างอิงพื้นที่ แต่ไม่พบ: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: คีย์ POI ต้องขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก และมีได้เฉพาะตัวอักษรพิมพ์เล็ก ตัวเลข หรือขีดล่าง
  POI {key} 坐标超出底图范围: พิกัดของ POI {key} อยู่นอกขอบเขตแผนที่ฐาน
  POI 必须是键值映射: POI ต้องเป็นคู่คีย์-ค่า (mapping)
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256 ต้องเป็นค่าแฮชฐานสิบหก 64 หลัก
  min_area 必须大于 0: min_area ต้องมากกว่า 0
  pois 必须是列表: pois ต้องเป็นรายการ (list)
  ui 必须是键值映射: ui ต้องเป็นคู่คีย์-ค่า (mapping)
  window_ratio 必须在 0.05–1 之间: window_ratio ต้องอยู่ระหว่าง 0.05–1
  '{name} 必须是三元整数列表': '{name} ต้องเป็นรายการจำนวนเต็ม 3 ค่า'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name} ต้องเป็นไปตามเงื่อนไข H=0–180, S/V=0–255'
  '{name}地图': แผนที่ {name}
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: คีย์แผนที่ต้องขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก และมีได้เฉพาะตัวอักษรพิมพ์เล็ก ตัวเลข หรือขีดล่าง
  '地图不存在: {key}': 'ไม่พบแผนที่: {key}'
  地图名称不能为空: ชื่อแผนที่ต้องไม่ว่างเปล่า
  '地图名称已存在: {name}': 'มีชื่อแผนที่นี้อยู่แล้ว: {name}'
  地图图片与定义摘要不一致: รูปภาพแผนที่ไม่ตรงกับค่าแฮชในนิยาม
  地图定义必须是键值映射: นิยามแผนที่ต้องเป็นคู่คีย์-ค่า (mapping)
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: คีย์ในไฟล์แผนที่ {rel} คือ {inner} ซึ่งไม่ตรงกับชื่อไฟล์
  地域名称不能为空，且 key 不得重复: ชื่อภูมิภาคต้องไม่ว่างเปล่า และคีย์ต้องไม่ซ้ำกัน
  大地图: แผนที่โลก
  底图数据为空: ข้อมูลแผนที่ฐานว่างเปล่า
  底图文件名固定为 base.png: ชื่อไฟล์แผนที่ฐานต้องเป็น base.png เท่านั้น
  探查图片名称不能为空，且 key 不得重复: ชื่อรูปภาพสำรวจต้องไม่ว่างเปล่า และคีย์ต้องไม่ซ้ำกัน
  '探查图片引用了不存在的地域: {region}': 'รูปภาพสำรวจอ้างอิงภูมิภาคที่ไม่มีอยู่จริง: {region}'
  探查图片必须有有效的 SHA256 摘要: รูปภาพสำรวจต้องมีค่าแฮช SHA256 ที่ถูกต้อง
  '探查图片缺失或摘要不匹配: {name}': 'ไม่พบรูปภาพสำรวจหรือค่าแฮชไม่ตรงกัน: {name}'
  '未知导航模式: {mode}': 'ไม่รู้จักโหมดนำทาง: {mode}'
  '未知朝向识别方法: {method}': 'ไม่รู้จักวิธีตรวจจับทิศทาง: {method}'
