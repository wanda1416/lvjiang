  该场景所有 YAML 坐标点都已放置，无法再复制新坐标。: จุดพิกัด YAML ทั้งหมดของฉากนี้ถูกวางครบแล้ว ไม่สามารถคัดลอกจุดพิกัดใหม่เพิ่มได้
  该坐标被方向引用，请先删除关联的方向。: จุดพิกัดนี้ถูกทิศทางอ้างอิงอยู่ กรุณาลบทิศทางที่เกี่ยวข้องก่อน
  请先在当前布局中放置该实体，或将其标记为禁用后设置按键: กรุณาวางเอนทิตีนี้ในเลย์เอาต์ปัจจุบันก่อน หรือทำเครื่องหมายปิดใช้งานก่อนตั้งค่าปุ่มกด
  请先在画布上或坐标列表中选中一个已放置的坐标点，再创建方向。: กรุณาเลือกจุดพิกัดที่วางไว้แล้วบนผืนภาพหรือในรายการพิกัดก่อน แล้วค่อยสร้างทิศทาง
  请先在目标场景的「场景管理」中标记为引用子场景。: กรุณาทำเครื่องหมายฉากเป้าหมายเป็นฉากย่อยที่อ้างอิงได้ใน «จัดการฉาก» ของฉากนั้นก่อน
  请先处理未保存的改动: กรุณาจัดการการแก้ไขที่ยังไม่ได้บันทึกก่อน
  请先导入或刷新当前场景截图。: กรุณานำเข้าหรือรีเฟรชภาพหน้าจอของฉากปัจจุบันก่อน
  请先新建或加载布局: กรุณาสร้างหรือโหลดเลย์เอาต์ก่อน
  请先选中一个已绑定坐标的区域: กรุณาเลือกพื้นที่ที่ผูกพิกัดแล้วก่อน
  请先选中坐标: กรุณาเลือกจุดพิกัดก่อน
  请先选择一个网格定义。: กรุณาเลือกนิยามตารางก่อน
  请先选择已绑定模板且有截图的区域: กรุณาเลือกพื้นที่ที่ผูกเทมเพลตแล้วและมีภาพหน้าจอก่อน
  请先选择布局。: กรุณาเลือกเลย์เอาต์ก่อน
  请填写名称；Key 以小写字母开头，仅含小写字母、数字、下划线。: กรุณากรอกชื่อ โดย Key ต้องขึ้นต้นด้วยตัวอักษรพิมพ์เล็กและมีได้เฉพาะตัวอักษรพิมพ์เล็ก ตัวเลข และขีดล่าง
  请检查日志: กรุณาตรวจสอบบันทึก
  调用方: ผู้เรียกใช้
  跳转: เปลี่ยนหน้าไป
  输入 DSL 脚本内容...: กรอกเนื้อหาสคริปต์ DSL...
  输入不完整: กรอกข้อมูลไม่ครบ
  输入方向 key（小写字母开头，可含数字/下划线）：: 'กรอกคีย์ทิศทาง (ขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก ใช้ตัวเลข/ขีดล่างได้):'
  迁移失败: ย้ายข้อมูลไม่สำเร็จ
  运行脚本: รันสคริปต์
  返回值：(无): 'ค่าที่ส่งคืน: (ไม่มี)'
  还原位置: คืนค่าตำแหน่ง
  追加截图失败: เพิ่มภาพหน้าจอต่อท้ายไม่สำเร็จ
  退出点击标定: ออกจากการกำหนดจุดคลิก
  退出画布编辑: ออกจากการแก้ไขผืนภาพ
  退出裁剪画布: ออกจากการครอปผืนภาพ
  选中截图以预览: เลือกภาพหน้าจอเพื่อดูตัวอย่าง
  选择脚本文件: เลือกไฟล์สคริปต์
  通过: ผ่าน
  重命名场景: เปลี่ยนชื่อฉาก
  重命名失败: เปลี่ยนชื่อไม่สำเร็จ
  重命名方向: เปลี่ยนชื่อทิศทาง
  重命名视图: เปลี่ยนชื่อมุมมอง
  重载失败: โหลดใหม่ไม่สำเร็จ
  '阈值 ': 'เกณฑ์ '
  限定参考图识别的分组范围: จำกัดขอบเขตกลุ่มสำหรับการรู้จำภาพอ้างอิง
  隐藏「全部」选项，打开场景时直接展示基底视图: ซ่อนตัวเลือก «ทั้งหมด» เพื่อแสดงมุมมองฐานโดยตรงเมื่อเปิดฉาก
  隐藏全部视图: ซ่อนมุมมองทั้งหมด
scrcpy_capture:
  5 秒内未收到首帧（手机息屏、锁屏或当前画面无法编码时会出现）；请点亮屏幕后重试: ไม่ได้รับเฟรมแรกภายใน 5 วินาที (อาจเกิดจากหน้าจอมือถือดับ ล็อกหน้าจอ หรือภาพปัจจุบันเข้ารหัสไม่ได้) กรุณาเปิดหน้าจอแล้วลองใหม่
  scrcpy server 启动失败（返回码 {rc}）：{detail}: 'เริ่ม scrcpy server ไม่สำเร็จ (รหัสออก {rc}): {detail}'
  scrcpy 协议版本变化，不符合预期：客户端按 {version} 实现，{detail}: 'เวอร์ชันโปรโตคอล scrcpy เปลี่ยนแปลงผิดจากที่คาดไว้: ไคลเอนต์รองรับ {version}, {detail}'
  启动 scrcpy server 失败：{error}: 'เริ่ม scrcpy server ไม่สำเร็จ: {error}'
  启动视频流失败：{error}: 'เริ่มสตรีมวิดีโอไม่สำเร็จ: {error}'
  找不到 scrcpy-server.jar：{path}: 'ไม่พบ scrcpy-server.jar: {path}'
  推送 scrcpy-server.jar 失败：{detail}: 'ส่งไฟล์ scrcpy-server.jar ไม่สำเร็จ: {detail}'
  无法建立 scrcpy 视频端口转发: ไม่สามารถตั้งค่าพอร์ตฟอร์เวิร์ดวิดีโอของ scrcpy ได้
  未安装 PyAV，无法解码视频流（请安装 av 依赖）: ไม่ได้ติดตั้ง PyAV จึงไม่สามารถถอดรหัสสตรีมวิดีโอได้ (กรุณาติดตั้งแพ็กเกจ av)
  画面流不可用: สตรีมหน้าจอไม่พร้อมใช้งาน
  等待新画面超时: หมดเวลารอเฟรมใหม่
  视频流连接已被对端关闭（scrcpy 会话结束或被其他程序清理）: การเชื่อมต่อสตรีมวิดีโอถูกปิดจากอีกฝั่ง (เซสชัน scrcpy สิ้นสุดหรือถูกโปรแกรมอื่นปิด)
  视频流连接被中断：{error}: 'การเชื่อมต่อสตรีมวิดีโอถูกตัดขาด: {error}'
  读取视频流异常：{error}: 'เกิดข้อผิดพลาดขณะอ่านสตรีมวิดีโอ: {error}'
  连接 scrcpy 视频端口超时（端口 {port}）: หมดเวลาเชื่อมต่อพอร์ตวิดีโอ scrcpy (พอร์ต {port})
scripts:
  ADB 模式暂不支持录制: โหมด ADB ยังไม่รองรับการบันทึก
  Unicode 字母/数字/下划线: ตัวอักษร Unicode/ตัวเลข/ขีดล่าง
  '{path} 已存在。覆盖该位置的脚本？': '{path} มีอยู่แล้ว ต้องการเขียนทับสคริปต์ที่ตำแหน่งนี้หรือไม่?'
  '{rel} 是系统脚本。要改它请在树里右键「复制到本地以修改」。': '{rel} เป็นสคริปต์ระบบ หากต้องการแก้ไขให้คลิกขวาในรายการแล้วเลือก «คัดลอกลงเครื่องเพื่อแก้ไข»'
  ■ 停止录制: ■ หยุดบันทึก
  ● 录制脚本: ● บันทึกสคริปต์
  ? '⚠ 脚本元数据无法识别，该脚本不会出现在运行列表中：

    '
  : '⚠ ไม่สามารถอ่านเมทาดาทาของสคริปต์ได้ สคริปต์นี้จะไม่แสดงในรายการรัน:

    '
  上移选项: เลื่อนตัวเลือกขึ้น
  下移选项: เลื่อนตัวเลือกลง
  不会被录制: จะไม่ถูกบันทึก
  不勾选: ไม่ติ๊ก
  不支持：{kind}（请选择有效类型）: 'ไม่รองรับ: {kind} (กรุณาเลือกประเภทที่ถูกต้อง)'
  与内置函数重名，脚本运行时会被拒绝: ชื่อซ้ำกับฟังก์ชันในตัว สคริปต์จะถูกปฏิเสธตอนรัน
  丢弃 {name} 的本地修改，恢复{target}版本？此操作不可恢复。: ละทิ้งการแก้ไขในเครื่องของ {name} และคืนค่าเป็นเวอร์ชัน {target} หรือไม่? การกระทำนี้ย้อนกลับไม่ได้
  主窗口有工作流在运行，先停止它: หน้าต่างหลักมีเวิร์กโฟลว์กำลังทำงานอยู่ กรุณาหยุดก่อน
  仅用于脚本展示分组，不改变脚本性质或执行顺序: ใช้เพื่อจัดกลุ่มแสดงผลสคริปต์เท่านั้น ไม่เปลี่ยนลักษณะหรือลำดับการรันของสคริปต์
  从代码重新加载: โหลดใหม่จากโค้ด
  代码: โค้ด
  代码中的元数据已变化，重新加载会丢弃元数据页尚未应用的修改。重新加载？: เมทาดาทาในโค้ดเปลี่ยนแปลงแล้ว การโหลดใหม่จะละทิ้งการแก้ไขในแท็บเมทาดาทาที่ยังไม่นำไปใช้ โหลดใหม่หรือไม่?
  低精度: ความละเอียดต่ำ
  低精度录制中…连续移动将合并: กำลังบันทึกแบบความละเอียดต่ำ… การเคลื่อนที่ต่อเนื่องจะถูกรวมเข้าด้วยกัน
  保存为工作流文件: บันทึกเป็นไฟล์เวิร์กโฟลว์
  保存到 workflows/{dir}: บันทึกลง workflows/{dir}
  保存到 workflows/{dir}；显示名留空则用 id: บันทึกลง workflows/{dir} หากเว้นชื่อที่แสดงไว้จะใช้ id
  修改会写回代码缓冲区，仍需点击“保存”才会落盘。: การแก้ไขจะเขียนกลับไปยังบัฟเฟอร์โค้ด ยังต้องกด «บันทึก» เพื่อบันทึกลงดิสก์
  值: ค่า
  停在第 {n} 行（单步 = 执行这一行）: หยุดที่บรรทัด {n} (ทีละขั้น = รันบรรทัดนี้)
  停止中…: กำลังหยุด…
  元数据: เมทาดาทา
  元数据与代码均已修改: ทั้งเมทาดาทาและโค้ดมีการแก้ไข
  元数据尚未应用: ยังไม่ได้นำเมทาดาทาไปใช้
  元数据无效: เมทาดาทาไม่ถูกต้อง
  元数据根节点必须是键值映射: โหนดรากของเมทาดาทาต้องเป็นการจับคู่คีย์-ค่า
  元数据表单不可编辑：{error}: 'ไม่สามารถแก้ไขฟอร์มเมทาดาทาได้: {error}'
  内置: ในตัว
  内置函数: ฟังก์ชันในตัว
  写入编辑区域: เขียนลงพื้นที่แก้ไข
  切换类型会移除旧类型专属的设置。继续？: การสลับประเภทจะลบการตั้งค่าเฉพาะของประเภทเดิม ดำเนินการต่อหรือไม่?
  删除脚本: ลบสคริปต์
  删除脚本 {rel}？此操作不可恢复。: ลบสคริปต์ {rel} หรือไม่? การกระทำนี้ย้อนกลับไม่ได้
  删除选项: ลบตัวเลือก
  勾选: ติ๊กเลือก
  '区域 ': 'พื้นที่ '
  单步: ทีละขั้น
  单步…: ทีละขั้น…
  单步模式：在第一条语句前停住: 'โหมดทีละขั้น: หยุดก่อนคำสั่งแรก'
  占位提示: ข้อความตัวอย่าง
  参数名: ชื่อพารามิเตอร์
  参数定义: นิยามพารามิเตอร์
  参数数: จำนวนพารามิเตอร์
  参数解析失败: แยกวิเคราะห์พารามิเตอร์ไม่สำเร็จ
  取画布: ดึงผืนภาพ
  变量: ตัวแปร
  变量名（不用写 $）: ชื่อตัวแปร (ไม่ต้องใส่ $)
  可批量运行: รันแบบกลุ่มได้
  可独立运行: รันเดี่ยวได้
  同路径脚本已存在于 local。新建 system 文件后仍由 local 版本生效，继续？: มีสคริปต์พาธเดียวกันอยู่ใน local แล้ว หลังสร้างไฟล์ system เวอร์ชัน local จะยังคงมีผล ดำเนินการต่อหรือไม่?
  同路径脚本已存在于另一保存位置。新建 local 文件会覆盖其运行效果，继续？: มีสคริปต์พาธเดียวกันอยู่ในตำแหน่งบันทึกอื่นแล้ว การสร้างไฟล์ local จะเขียนทับผลตอนรัน ดำเนินการต่อหรือไม่?
  含义: ความหมาย
  启动失败: เริ่มไม่สำเร็จ
  '启动失败: {e}': 'เริ่มไม่สำเร็จ: {e}'
  声明默认值: ประกาศค่าเริ่มต้น
  复制到本地以修改: คัดลอกลงเครื่องเพื่อแก้ไข
  复制录制结果: คัดลอกผลการบันทึก
  多个条件（每行一个，全部满足）: หลายเงื่อนไข (บรรทัดละ 1 เงื่อนไข ต้องเป็นจริงทั้งหมด)
  存在尚未支持的声明：{keys}；请先在代码页处理: 'มีการประกาศที่ยังไม่รองรับ: {keys} กรุณาจัดการในแท็บโค้ดก่อน'
  '完成，返回值: {rv}': 'เสร็จสิ้น ค่าที่ส่งคืน: {rv}'
  定位到脚本: ไปยังตำแหน่งในสคริปต์
  将在下一条语句前暂停: จะหยุดชั่วคราวก่อนคำสั่งถัดไป
  展开: ขยาย
  属性单元准备工作流: เวิร์กโฟลว์เตรียมหน่วยคุณสมบัติ
  工作流运行中，无法录制: เวิร์กโฟลว์กำลังทำงานอยู่ ไม่สามารถบันทึกได้
  左侧选择脚本，或点「新建」: เลือกสคริปต์ทางซ้าย หรือกด «สร้างใหม่»
  ? '已保存 {path}，但校验未通过：

    '
  : 'บันทึก {path} แล้ว แต่ตรวจสอบไม่ผ่าน:

    '
  已保存 {path}，语法与布局引用校验通过: บันทึก {path} แล้ว ตรวจสอบไวยากรณ์และการอ้างอิงเลย์เอาต์ผ่าน
  已写入目标位置，但无法移除原文件：{error}。请检查两份脚本。: 'เขียนไปยังตำแหน่งปลายทางแล้ว แต่ไม่สามารถลบไฟล์เดิมได้: {error} กรุณาตรวจสอบสคริปต์ทั้งสองไฟล์'
  已写入编辑区域；请在编辑器中保存脚本: เขียนลงพื้นที่แก้ไขแล้ว กรุณาบันทึกสคริปต์ในตัวแก้ไข
  已创建 {path}: สร้าง {path} แล้ว
  已删除 {rel}: ลบ {rel} แล้ว
  已复制到剪贴板: คัดลอกลงคลิปบอร์ดแล้ว
  已复制到本地，现在可以编辑: คัดลอกลงเครื่องแล้ว สามารถแก้ไขได้ทันที
  已存在: มีอยู่แล้ว
  已截图 {w}×{h}（画布裁剪后）: จับภาพแล้ว {w}×{h} (หลังครอปผืนภาพ)
  已改名；原名：{name}: 'เปลี่ยนชื่อแล้ว ชื่อเดิม: {name}'
  已有未清除的录制内容，请清除后再次点击「录制脚本」，避免覆盖丢失。: มีผลการบันทึกที่ยังไม่ได้ล้าง กรุณาล้างก่อนกด «บันทึกสคริปต์» อีกครั้งเพื่อป้องกันการเขียนทับจนสูญหาย
  已清除: ล้างแล้ว
  已用外部编辑器打开: เปิดด้วยตัวแก้ไขภายนอกแล้ว
  已还原为{target}版本: คืนค่าเป็นเวอร์ชัน {target} แล้ว
  应用到代码: นำไปใช้กับโค้ด
  开启后记录鼠标移动轨迹；关闭时只忽略单纯移动，点击、按住、拖拽和滚轮仍会正常录制。普通界面通常无需开启；需要还原游戏视角转动或其他连续移动时再开启。: เมื่อเปิดจะบันทึกเส้นทางการเลื่อนเมาส์ หากปิดจะข้ามเฉพาะการเลื่อนเมาส์เปล่า ๆ แต่การคลิก กดค้าง ลาก และเลื่อนลูกกลิ้งยังบันทึกตามปกติ งานหน้าจอทั่วไปมักไม่ต้องเปิด เปิดเฉพาะเมื่อต้องการจำลองการหมุนมุมกล้องเกมหรือการเลื่อนต่อเนื่อง
  异常退出: ออกเมื่อเกิดข้อยกเว้น
  当前脚本不可编辑（系统脚本请先复制到本地），或已带有高精度轨迹: สคริปต์ปัจจุบันแก้ไขไม่ได้ (สคริปต์ระบบต้องคัดลอกลงเครื่องก่อน) หรือมีแทร็กความละเอียดสูงอยู่แล้ว
  录制: บันทึก
  录制内容尚未保存或复制到剪贴板，确定要关闭吗？: เนื้อหาที่บันทึกยังไม่ได้เซฟหรือคัดลอกลงคลิปบอร์ด ต้องการปิดหรือไม่?
  录制结束，可修改结果后「写入编辑区域」或「复制录制结果」: บันทึกเสร็จสิ้น สามารถแก้ไขผลลัพธ์แล้วกด «เขียนลงพื้นที่แก้ไข» หรือ «คัดลอกผลการบันทึก»
  录制结束，可编辑后保存为 .wf: บันทึกเสร็จสิ้น สามารถแก้ไขแล้วบันทึกเป็น .wf ได้
  录制结束，未捕获到有效操作: บันทึกเสร็จสิ้น ไม่พบการทำงานที่บันทึกได้
  录制结果: ผลการบันทึก
  ? '录制结果尚未写入开始录制时的脚本。

    切换脚本将清除这份录制结果，是否继续？'
  : 'ผลการบันทึกยังไม่ได้เขียนลงสคริปต์ที่เริ่มบันทึก

    การสลับสคริปต์จะล้างผลการบันทึกนี้ ดำเนินการต่อหรือไม่?'
  录制轨迹引用超出工作流目录：{ref}: 'การอ้างอิงแทร็กบันทึกอยู่นอกโฟลเดอร์ workflows: {ref}'
  录制鼠标移动: บันทึกการเคลื่อนที่ของเมาส์
  待机 | 点击「录制脚本」: สแตนด์บาย | คลิก «บันทึกสคริปต์»
  待机 | 点击「录制脚本」或按: สแตนด์บาย | คลิก «บันทึกสคริปต์» หรือกด
  或点击停止: หรือคลิกหยุด
  所需能力: ความสามารถที่ต้องการ
  执行: รัน
  执行结果显示在这里: ผลลัพธ์การรันจะแสดงที่นี่
  批量检查: ตรวจสอบแบบกลุ่ม
  找不到录制轨迹：{path}: 'ไม่พบแทร็กบันทึก: {path}'
  找不到该函数: ไม่พบฟังก์ชันนี้
  找不到过程 {name} 的定义: ไม่พบนิยามของขั้นตอน {name}
  把录制结果按语句插入代码编辑器的光标处: แทรกผลการบันทึกเป็นคำสั่งที่ตำแหน่งเคอร์เซอร์ในตัวแก้ไขโค้ด
  ? '把系统脚本 {name} 复制到本地后才能修改。

    复制之后这个文件不再跟随系统更新，确定？'
  : 'ต้องคัดลอกสคริปต์ระบบ {name} ลงเครื่องก่อนจึงจะแก้ไขได้

    หลังคัดลอกไฟล์นี้จะไม่อัปเดตตามระบบอีก ดำเนินการต่อหรือไม่?'
  指令: คำสั่ง
  插件: ปลั๊กอิน
  插入到脚本: แทรกลงสคริปต์
  插入区域: แทรกพื้นที่
  插入坐标: แทรกพิกัด
  插入颜色: แทรกสี
  搜索函数名或说明: ค้นหาชื่อฟังก์ชันหรือคำอธิบาย
