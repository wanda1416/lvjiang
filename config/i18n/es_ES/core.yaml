about:
  仅限非商业使用: Solo para uso no comercial
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: Este proyecto es únicamente para aprendizaje e investigación técnica. El uso de herramientas de automatización en juegos puede infringir sus términos de servicio; el usuario asume toda la responsabilidad de las consecuencias.
  本项目源码公开、免费使用: Código abierto y uso gratuito
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: Captura de ventana → anotación de regiones → OCR → ejecución de flujos
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: El software se proporciona tal cual, sin garantía de ningún tipo; el autor no se hace responsable de ninguna pérdida derivada de su uso.
  通用视觉 RPA 引擎: Motor RPA visual de propósito general
