map_manager:
  HUD 场景: HUD 씬
  HUD 场景绑定（坐标在场景编辑器里标定）: HUD 씬 바인딩 (좌표는 씬 편집기에서 보정)
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point}이(가) 미니맵 영역 밖에 있어 방향 인식은 우선 영역 중심을 사용합니다.'
  ⚠ 缺失：{key}: '⚠ 누락: {key}'
  不能删除: 삭제 불가
  从当前画面截取: 현재 화면에서 캡처
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: HUD 씬 map_<key>도 함께 생성됩니다. 이후 씬 편집기에서 미니맵과 전체 지도 영역을 보정하세요.
  保存当前画面为探查图片: 현재 화면을 탐사 이미지로 저장
  先登记地域: 먼저 지역 등록
  删除地图: 지도 삭제
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: 지도 「{name}」 및 기본 지도를 삭제하시겠습니까? 자동 생성된 HUD 씬 map_{key}도 함께 삭제됩니다.
  删除选中 POI: 선택한 POI 삭제
  删除选中地域: 선택한 지역 삭제
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: 실제로 전체 지도를 모두 채운 경우에만 선택하세요. 이어붙이기 성공이 전체 지도 수집 완료를 의미하지는 않습니다.
  只读，请先“复制到本地”再修改: 읽기 전용입니다. 먼저 「로컬로 복사」한 뒤 수정하세요
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): 이미지 파일 (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: 기본 지도를 클릭하여 새 POI를 추가하고, 기존 마커를 클릭하여 선택하세요. 좌표는 기본 지도 정규화 좌표입니다.
  地图 key: 지도 key
  地域与探查: 지역 및 탐사
  地域仍被使用: 지역이 아직 사용 중입니다
  地域名称: 지역 이름
  坐标必须在 0–1 之间: 좌표는 0–1 사이여야 합니다
  基本信息: 기본 정보
  基本信息与绑定: 기본 정보 및 바인딩
  复制到本地: 로컬로 복사
  大地图底图: 전체 지도 기본 이미지
  大地图正北朝上: 전체 지도 정북 방향 위쪽
  导入底图文件…: 기본 지도 파일 가져오기…
  导航模式: 내비게이션 모드
  小写字母开头，字母/数字/下划线: 소문자로 시작, 영문자/숫자/밑줄(_)
  小地图朝向: 미니맵 방향
  尖端（退化）: 꼭짓점 (축퇴)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 아직 기본 지도를 가져오지 않았습니다. 먼저 「HUD 보정…」에서 전체 지도 영역을 지정한 뒤 「기본 지도 및 POI」 탭에서 가져오세요
  展示: 표시
  底图与 POI: 기본 지도 및 POI
  底图区域未标定: 기본 지도 영역 미보정
  底图可标注 POI；空白部分尚未探查。: 기본 지도에 POI를 표시할 수 있습니다. 빈 영역은 아직 탐사되지 않았습니다.
  底图已完成整图探查: 기본 지도 전체 탐사 완료
  底图编码失败: 기본 지도 인코딩 실패
  底图：局部探查，待补齐: '기본 지도: 부분 탐사 완료, 추가 탐사 필요'
  底图：整图探查已完成: '기본 지도: 전체 탐사 완료'
  当前地图有未保存的修改，放弃吗？: 현재 지도에 저장되지 않은 변경 사항이 있습니다. 취소하시겠습니까?
  当前布局不存在，未能定位地图区域。: 현재 레이아웃이 존재하지 않아 지도 영역을 찾을 수 없습니다.
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: 현재 레이아웃에 {scene}.{point}이(가) 보정되지 않아 방향 인식은 우선 미니맵 영역 중심을 사용합니다.
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: 현재 레이아웃에 {scene}.{region}이(가) 보정되지 않아 지도 영역을 자를 수 없습니다.
  当前无法读取布局，未能定位地图区域。: 현재 레이아웃을 읽을 수 없어 지도 영역을 찾을 수 없습니다.
  当前未选择地图，无法解析地图区域。: 선택된 지도가 없어 지도 영역을 분석할 수 없습니다.
  截取当前画面: 현재 화면 캡처
  截图所属地域: 스크린샷 소속 지역
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: 게임 지역 선택기에 따라 지역을 등록합니다. 탐사 이미지와 기본 지도는 별도로 저장되며 기본 지도 탭에서 전환해 볼 수 있습니다.
  探查: 탐사
  探查图片仅供查看: 탐사 이미지는 보기 전용입니다
  探查图片缺失或无法解码: 탐사 이미지가 누락되었거나 디코딩할 수 없습니다
  探查截图用于查看；POI 只在底图上编辑。: 탐사 스크린샷은 보기 전용이며 POI는 기본 지도에서만 편집할 수 있습니다.
  搜索窗口（相对短边）: 검색 창 (짧은 변 대비 비율)
  新地域: 새 지역
  新建地图: 새 지도
  无效的 POI: 유효하지 않은 POI
  无法获取截图: 스크린샷을 가져올 수 없습니다
  '无法解码图片: {path}': '이미지를 디코딩할 수 없습니다: {path}'
  无法读取图片: 이미지를 읽을 수 없습니다
  是否仍然使用整帧作为底图？: 그래도 전체 프레임을 기본 지도로 사용하시겠습니까?
  最小面积（像素）: 최소 면적 (픽셀)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: '방향 {deg:.1f}°　신뢰도 {conf:.2f}　방법: {method}　면적 {area}px'
  未保存: 저장되지 않음
  未取得当前画面: 현재 화면을 가져오지 못했습니다
  未找到箭头：检查颜色阈值或小地图区域标定: 화살표를 찾을 수 없습니다. 색상 임계값이나 미니맵 영역 보정을 확인하세요
  来源：{layer}: '출처: {layer}'
  标定 HUD…（打开场景编辑器）: HUD 보정… (씬 편집기 열기)
  标识: 식별자
  没有地图。点击“新建”创建一张。: 지도가 없습니다. 「새로 만들기」를 클릭해 추가하세요.
  添加地域: 지역 추가
  添加失败: 추가 실패
  添加探查图片: 탐사 이미지 추가
  添加探查图片…: 탐사 이미지 추가…
  燕尾缺口: 제비꼬리 홈
  留空 = key: 비워 두면 = key
  种类: 종류
  箭头颜色与搜索参数（保存到地图）: 화살표 색상 및 검색 매개변수 (지도에 저장)
  识别结果: 인식 결과
  该地域已有探查图片，不能直接删除。: 이 지역에는 탐사 이미지가 있어 바로 삭제할 수 없습니다.
  请选择截图所属地域。: 스크린샷이 속한 지역을 선택하세요.
  读取失败: 읽기 실패
  读取当前布局失败，未能定位地图区域。: 현재 레이아웃 읽기에 실패하여 지도 영역을 찾을 수 없습니다.
  载入截图文件…: 스크린샷 파일 불러오기…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: 전체 인게임 스크린샷을 불러온 뒤 현재 레이아웃에 보정된 미니맵 영역으로 잘라 중앙의 노란색 오목 화살표를 분석합니다. 0° = 정북(화면 위쪽), 시계 방향이 양수입니다.
  适应窗口: 창에 맞춤
  选择局内截图: 인게임 스크린샷 선택
  选择底图: 기본 지도 선택
  重新识别: 다시 인식
  （尚未载入截图）: (스크린샷 미로드)
  'POI key 重复: {key}': '중복된 POI key: {key}'
maps:
  'POI key 重复: {key}': '중복된 POI key: {key}'
  '地图 key 已存在: {key}': '지도 key가 이미 존재합니다: {key}'
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: 스크린샷 기능을 사용할 수 없습니다. 먼저 메인 창에서 창을 지정하거나 기기를 연결하세요
