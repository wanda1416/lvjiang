  定义主页面右键「按 Profile 排序」用哪个键、什么方向。排完的顺序只属于本次运行，不写回这里: Define qual chave e direção o menu de contexto "Ordenar por Profile" na tela principal usa. A ordem resultante vale apenas para esta execução e não é salva aqui
  实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流: Quando apenas uma unidade de usuário for selecionada, executa as tarefas diretamente sem chamar os fluxos de ciclo de vida
  实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流: Quando apenas uma unidade de usuário for selecionada, executa as tarefas diretamente; unidades por atributo sempre executam o fluxo de preparação
  对应的任务脚本已不存在；取消勾选并保存即可从列表移除: O script da tarefa correspondente não existe mais; desmarque e salve para removê-lo da lista
  工作流文件 (*.wf): Arquivos de fluxo de trabalho (*.wf)
  已按 Profile 排序用户: Usuários ordenados por Profile
  异常恢复: Recuperação de falhas
  ? '当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。'
  : 'Agendando por "{key}", mas o fluxo de preparação de item "{wf}" não seleciona nem retorna o nome de usuário desta unidade. Use batch/prepare_item_by_attr.wf ou declare #% batch_unit_prepare: true no seu fluxo e retorne username.'
  当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。: Agendando por atributo; configure primeiro o fluxo de preparação de item em "Ferramentas → Configuração em lote".
  恢复默认顺序: Restaurar ordem padrão
