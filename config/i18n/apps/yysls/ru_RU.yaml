  "「{target}」在 {level} 级还没有毕业率方案，暂时无法比较最优组合。\n\n现有可用等级：{levels}。": "Для «{target}» на ур. {level} ещё нет плана готовности; сравнение оптимальной комбинации недоступно.\n\nДоступные уровни: {levels}."
