  "把本机当前全部角色数据上传为云端总览基线。\n初始同步会自动创建一次；之后需要时手动点。": "この端末の全キャラクターデータをクラウド概要ベースラインとしてアップロードします。\n初回同期時に自動で1回作成されます。その後は必要に応じて手動で実行してください。"
  操作未完成: 操作が完了しませんでした
