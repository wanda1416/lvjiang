  "启动时会再次核对判定范围，并执行当前选中的设备；不会改变默认选择。": "Khi khởi chạy sẽ kiểm tra lại phạm vi phán định và thực thi trên thiết bị đang chọn; không làm thay đổi lựa chọn mặc định."
