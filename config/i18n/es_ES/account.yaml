  ? "首次使用：建立本机与云端的同步状态。云端已有数据时，会先把本地\n用户、总览定义与总览数据备份到 config/session/_backup-* 再拉取云端。"
  : "Primer uso: establece el estado de sincronización entre este equipo y la nube. Si ya hay datos en la nube, primero se respaldarán\nlos usuarios locales, las definiciones y los datos de resumen en config/session/_backup-* antes de descargarlos."
  ；等 {} 项: ; y {} elementos más
  已恢复每分钟自动同步: Sincronización automática cada minuto reanudada
  已暂停自动同步；手动「立即同步」仍可用: Sincronización automática en pausa; la opción manual «Sincronizar ahora» sigue disponible
  恢复同步: Reanudar sincronización
  暂停同步: Pausar sincronización
  暂停后不再每分钟自动同步（心跳与在线状态不受影响）。手动「立即同步」仍可用；重启后保持暂停状态。: Al pausar, se detiene la sincronización automática cada minuto (el latido y el estado en línea no se ven afectados). La opción manual «Sincronizar ahora» sigue disponible y el estado en pausa se mantiene tras reiniciar.
