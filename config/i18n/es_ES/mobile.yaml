  正在扫描…: Escaneando…
  正在扫描局域网设备…: Escaneando dispositivos en la LAN…
  正在扫描本机模拟器端口…: Escaneando puertos de emulador locales…
  正在操作…: Procesando…
  正在暂停: Pausando
