  同步配置: Sincronizar configuración
  回传到电脑: Subir al PC
  回传完成；重复记录已跳过，手机原件保留。: Subida completada; se omitieron los registros duplicados y se conservan los originales en el teléfono.
  回传已处理，但刷新手机状态失败：{message}: 'Subida procesada, pero falló la actualización del estado del teléfono: {message}'
  在线下载（GitHub）: Descarga en línea (GitHub)
  在运行但未授权: En ejecución pero sin autorización
  复制诊断报告: Copiar informe de diagnóstico
