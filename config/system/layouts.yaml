schema_version: 2
layouts:
  android:
    name: 安卓布局
    desc: 安卓设备，横屏无边框 20:9
    canvas:
      x_ratio: 0.0
      y_ratio: 0.0
      w_ratio: 1.0
      h_ratio: 1.0
    # 全画布布局：画布覆盖整张截图，没有边框像素参与，用默认容差 0.5%
    aspect: "20:9"
  android_cast:
    name: 投屏布局
    extends: android
    desc: 模拟器/投屏窗口，画面带边框
    canvas:
      x_ratio: 0.0
      y_ratio: 0.040113312207636344
      w_ratio: 1.0
      h_ratio: 0.9214251493308252
  desktop:
    name: 桌面布局
    desc: PC 端游，建议窗口模式 1920*1080
    canvas:
      x_ratio: 0.0041322314049587
      y_ratio: 0.0277033065236819
      w_ratio: 0.9917355371900827
      h_ratio: 0.9651474530831099
    aspect: "16:9"
    # 带边框的布局放宽到 2%：画布是比例、边框却是固定像素（左右各 8、顶 31、底 8），
    # 所以只有标定用的 1920x1080 裁出来正好是客户区，其余分辨率会漂——2560x1440 偏
    # 0.67%、3840x2160 偏 1.35%、1280x720 偏 1.31%。漂的是画布本身，不是屏幕：
    # 2560x1440 下画布算成 2554.7x1427.5，而真实客户区是 2560x1440。2% 放得下
    # 1280x720~4K 这一段，同时仍拦得住形态错配（窗口模式配「桌面全屏」偏 2.7%）。
    # 截图口径改成直接抓客户区后漂移消失，届时可回到默认 0.5%。
    aspect_tolerance: 0.02
  desktop_fullscreen:
    name: 桌面全屏
    extends: desktop
    desc: PC 端游全屏，画面无标题栏与边框
    canvas:
      x_ratio: 0.0
      y_ratio: 0.0
      w_ratio: 1.0
      h_ratio: 1.0
    # 全画布布局：画布就是整张截图，任何 16:9 分辨率都精确命中，用默认容差 0.5%
    aspect: "16:9"
