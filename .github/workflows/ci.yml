name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows 视觉自动化工具，与目标平台保持一致；Qt offscreen 开箱即用
    # windows-latest 已升至 Server 2025，ONNX Runtime 不支持；锁定 2022
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8  # runner 默认 GBK 代码页，避免中文日志 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      # ruff 覆盖源码、测试与仍受支持的仓库辅助脚本。
      - name: Lint (ruff)
        run: python -m ruff check src tests scripts

      # mypy 覆盖 src；Mixin 架构的全局错误码豁免见 pyproject.toml。
      - name: Type check (mypy)
        run: python -m mypy

      # 并发跑（windows-2022 为 4 核）；pytest-cov 会自行合并各 worker 的覆盖数据。
      # 代价是 Qt 后台线程类用例必须确定性 join 线程，不能只靠 waitUntil 轮询
      # UI 状态：满载并发下主线程可能先处理 deleteLater 而工作线程未退出，
      # 销毁运行中的 QThread 会让整个 worker 进程崩溃。
      - name: Run tests
        id: tests
        continue-on-error: true
        run: >-
          python -m pytest tests
          -n auto
          --cov=lvjiang
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --junitxml=pytest-results.xml

      - name: Annotate test failures
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          [xml]$report = Get-Content pytest-results.xml
          $failures = Select-Xml -Xml $report -XPath '//testcase[failure or error]'
          foreach ($item in $failures) {
            $case = $item.Node
            $failure = if ($case.failure) { $case.failure } else { $case.error }
            $details = "$($case.classname)::$($case.name)`n$($failure.InnerText)"
            if ($details.Length -gt 4000) {
              $details = $details.Substring($details.Length - 4000)
            }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pytest failure::$details"
          }
          exit 1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore

  # Kotlin 侧改动此前完全没有自动验证——只能靠眼睛看。这里编一次 debug 变体，
  # 语法、API 误用、Gradle 脚本错误都会当场暴露。
  #
  # 只编不打包：assembleDebug 要走 Chaquopy 的 pip 安装（numpy/opencv/rapidocr 含
  # 15.8MB 模型）再过一遍打包，CI 每次推送都跑代价太大；compileDebugKotlin 覆盖的
  # 正是"改了 Kotlin 编不过"这个真实缺口。release 变体的完整构建由发布流水线负责。
  #
  # 不配签名密钥：debug 变体不需要，而 release 构建现在缺密钥就直接失败——这正是
  # 期望行为，不该在 CI 里绕过。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 的 buildPython 必须是 3.10，且 build.gradle.kts 在配置阶段就会
      # 检查它存在，所以任何 gradle 调用都得先把它备好。
      - uses: actions/setup-python@v5
        id: buildpython
        with:
          python-version: "3.10"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin (debug)
        env:
          LVJIANG_BUILD_PYTHON: ${{ steps.buildpython.outputs.python-path }}
        run: |
          cd android
          ./gradlew --no-daemon :app:compileDebugKotlin
