  ? '区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。

    这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。'
  : 'O reconhecimento em lote une várias regiões de texto em uma única tela e chama o OCR uma só vez.

    Estes parâmetros controlam o tamanho da tela combinada; passam a valer no próximo reconhecimento após salvar.'
  原始文本: Texto original
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: As configurações de OCR têm alterações não salvas. Deseja sair e descartá-las?
