  '传律石提升:': 'Mejora por Piedra Chuanlv:'
  "一次传律只提升一条词条，增量是该词条在当前等级普通满值的这个百分比。装备「养成」里按它估算承音喂满还需要几个传律石。": "Cada transmutación mejora un solo afijo en este porcentaje de su tope normal del nivel actual. En «Desarrollo» de equipo se usa para estimar cuántas Piedras Chuanlv faltan para maximizar Chengyin."
