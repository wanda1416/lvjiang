  "筛选已生效，但保存到用户资料失败：{error}\n\n本次浏览不受影响，下次操作会再尝试保存。": "Фильтр применён, но сохранить в профиль пользователя не удалось: {error}\n\nТекущий просмотр не затронут, сохранение повторится при следующем действии."
  "紫装区\n回收累计返还": "Фиолетовая зона\nСуммарный возврат при разборе"
