  配置名称已存在: Ce nom de configuration existe déjà
  重命名配置: Renommer la configuration
  随机打乱顺序: Mélanger l'ordre
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: 'Configurez d''abord le « workflow de récupération » de ce groupe dans « Outils → Configuration par lots » : le mode autonome en a besoin pour ramener le jeu à l''écran de connexion après une pause anormale'
  默认执行: Exécuter par défaut
  配置名称: Nom de la configuration
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: Pour les cibles Android, un lot peut démarrer en mode portrait tant que l'inversion largeur/hauteur correspond au ratio du canevas. Après le démarrage, le « workflow de récupération » du groupe ramène le jeu à l'écran de connexion, puis le « workflow de préparation d'élément » remet le joueur en jeu. Les deux workflows se configurent dans Outils → Configuration par lots.
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: 'Configurez d''abord le « workflow de récupération » et le « workflow de préparation d''élément » pour ce groupe dans Outils → Configuration par lots : le démarrage en portrait ramène d''abord le jeu à l''écran de connexion, et sans préparation d''élément il est impossible de revenir en jeu.'
  允许竖屏需要先配置条目准备工作流: Le démarrage en portrait nécessite un workflow de préparation d'élément
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: « Autoriser le portrait » utilise d'abord le workflow de récupération pour ramener le client à l'écran de connexion, puis le workflow de préparation d'élément pour remettre le joueur en jeu. Configurez d'abord un workflow de préparation d'élément pour ce groupe dans Outils → Configuration par lots.
