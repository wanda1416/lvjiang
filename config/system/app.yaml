agents:
  server_name: 律匠(lvjiang)
  download_agent:
    url: https://www.workbuddy.cn/events/invite?inviteCode=4a8tfecmv97mi3j9
  items:
  - key: workbuddy
    name: WorkBuddy
    export_path: ~/.workbuddy/mcp.json
    transport: streamable-http
  - key: qoderwork
    name: QoderWork
    export_path: ~/.qoderwork/mcp.json
    transport: streamable-http
input_simulation:
  before_click_wait:
  - 0.1
  - 0.3
  after_click_wait:
  - 0.1
  - 0.3
  mouse_move_duration:
  - 0.5
  - 0.7
  click_random_offset: 5
  region_jitter_ratio: 0.25
  clamp_out_of_bounds: false
delay_params:
  step_interval:
    label:
      zh_CN: 操作间隔
      en_US: Step Interval
    range:
    - 1.0
    - 1.2
  click_interval:
    label:
      zh_CN: 点击间隔
      en_US: Click Interval
    range:
    - 1.0
    - 1.2
  page_refresh:
    label:
      zh_CN: 页面刷新等待
      en_US: Page Refresh Wait
    range:
    - 2.0
    - 3.0
  scroll_settle:
    label:
      zh_CN: 滚动惯性等待
      en_US: Scroll Settle Wait
    range:
    - 3.0
    - 4.0
  secondary_confirm:
    label:
      zh_CN: 二次确认等待（包括装备冷却）
      en_US: Secondary Confirm Wait (incl. gear cooldown)
    range:
    - 6.0
    - 7.0
envs:
- key: android
  name:
    zh_CN: 安卓
    en_US: Android
- key: desktop
  name:
    zh_CN: 桌面
    en_US: Desktop
apps:
  yyslscn:
    android:
      package: com.netease.yyslscn
      activity: com.netease.ntunisdk.external.protocol.ProtocolLauncher
      orientation: landscape
    windows:
      executable: ''
      window_title: ''
plans:
- id: 13626639a4d5427588e1b620e855c3fc
  name:
    zh_CN: 手游
    en_US: Mobile
  space: 手游
  env: android
  layout: android
  requires_admin: false
  modes:
  - adb
- id: 5deb7222def5486bb5431fd3b541a950
  name:
    zh_CN: 端游
    en_US: PC
  space: 端游
  env: desktop
  layout: desktop
  requires_admin: true
  modes:
  - windows
- id: f29e8e838d2a40d8b22aa48627a1c14f
  name:
    zh_CN: 手游投屏
    en_US: Mobile Mirroring
  space: 手游
  env: android
  layout: android_cast
  requires_admin: false
  modes:
  - windows
- id: 7ce5dc50d0c547f8963ff5f834e1b6de
  name:
    zh_CN: 端游全屏
    en_US: PC Fullscreen
  space: 端游
  env: desktop
  layout: desktop_fullscreen
  requires_admin: true
  modes:
  - windows
