  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: จำนวนครั้งนี้ใช้ร่วมกันทั้งการสร้างสตรีมวิดีโอครั้งแรกและการกู้คืนอัตโนมัติหลังขาดการเชื่อมต่อ เมื่อครบจำนวนจะรอให้ผู้ใช้จัดการโดยไม่ยกเลิกงานอัตโนมัติ
  首次窗口定位后可自动获取: ดึงข้อมูลอัตโนมัติได้หลังระบุตำแหน่งหน้าต่างครั้งแรก
  高级设置: การตั้งค่าขั้นสูง
  "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。": "ค่าเริ่มต้นคือสร้างสตรีมวิดีโอ 5 ครั้ง หากไม่สำเร็จจะเชื่อมต่อเอเจนต์ใหม่ 5 ครั้ง และ ADB 5 ครั้ง ห่างกันครั้งละ 2 วินาที หากยังไม่พร้อมใช้งานจะรอผู้ใช้จัดการโดยไม่จำกัดเวลา: เลือก ใช่ เพื่อตรวจสอบใหม่ เลือก ไม่ เพื่อหยุดงานนั้น การปิดหน้าต่างแจ้งเตือนจะไม่หยุดงานและแบนเนอร์ด้านบนจะยังคงอยู่\nไม่ลดระดับท่าทางหลายนิ้วและท่าทางพร้อมกัน หากไม่แน่ใจว่าการกระทำถูกส่งไปแล้วหรือไม่ ระบบจะไม่ส่งซ้ำอัตโนมัติ การตั้งค่านี้มีผลกับงานที่เริ่มหลังจากนี้"
