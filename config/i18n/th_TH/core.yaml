about:
  仅限非商业使用: สำหรับการใช้งานที่ไม่ใช่เชิงพาณิชย์เท่านั้น
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: โปรเจกต์นี้จัดทำขึ้นเพื่อการเรียนรู้และวิจัยทางเทคนิคเท่านั้น การใช้เครื่องมืออัตโนมัติควบคุมเกมอาจละเมิดข้อตกลงผู้ใช้ของเกมที่เกี่ยวข้อง ผลที่ตามมาทั้งหมดผู้ใช้ต้องรับผิดชอบเอง
  本项目源码公开、免费使用: โอเพนซอร์สและใช้งานฟรี
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: จับภาพหน้าต่าง → กำหนดพื้นที่ → รู้จำข้อความ OCR → รันเวิร์กโฟลว์
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: ซอฟต์แวร์นี้ให้บริการตามสภาพโดยไม่มีการรับประกันใด ๆ ผู้พัฒนาไม่รับผิดชอบต่อความเสียหายใด ๆ ที่เกิดจากการใช้งานซอฟต์แวร์นี้
  通用视觉 RPA 引擎: เอนจิน Visual RPA อเนกประสงค์
