  保留各用户的任务设置（含插件任务）和手机独有用户；脚本、布局和 Profile DB 仍更新。: Conserve les réglages de tâches de chaque utilisateur (y compris les tâches de plugins) et les utilisateurs propres au téléphone ; les scripts, dispositions et la base Profile DB restent mis à jour.
  保留手机任务参数: Conserver les paramètres de tâches du téléphone
  保留手机任务参数及手机独有用户。: Conserve les paramètres de tâches du téléphone et les utilisateurs propres au téléphone.
