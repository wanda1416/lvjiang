  按住(秒/区间): Halten (Sek./Bereich)
  按区域绑定找图: Bild über Bereichsbindung suchen
  按压按键/鼠标键: Taste oder Maustaste drücken
  按布局中 Region 绑定的模板匹配，返回首个命中的区域 key: Gleicht Vorlagen ab, die im Layout an eine Region gebunden sind, und gibt den Key des ersten Treffers zurück
  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: Beendet eine Android- oder PC-App gemäß Registrierungstyp und prüft, dass der Prozess beendet ist
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: Startet eine Android- oder PC-App gemäß Registrierungstyp und prüft, dass der Prozess erscheint
  控制流: Steuerfluss
  搜索范围: Suchbereich
  操作后等待: Nach Aktion warten
  收集到输出: In Ausgabe sammeln
  数据与输出: Daten & Ausgabe
  文字: Text
  文本/变量: Text/Variable
  暂停等人工: Für manuelle Eingabe pausieren
  最低分(0-1): Mindestwert (0–1)
  最长等待(秒): Max. Wartezeit (Sek.)
  模板匹配区域: Vorlagenabgleich-Bereich
  模板区域: Vorlagenbereich
  模板场景: Vorlagenszene
  滑动时长(秒/区间): Wischdauer (Sek./Bereich)
  激活区域: Bereich aktivieren
  激活布局实体；默认点击中心，布局可改为按键: Aktiviert ein Layout-Element; standardmäßig Klick in die Mitte, im Layout auf Taste umstellbar
  点击变量: Variable anklicken
  点击坐标: Koordinate anklicken
  点击画布归一化坐标: Normalisierte Leinwandkoordinate anklicken
  画布上点一下取值: Auf Leinwand klicken, um Wert zu übernehmen
  画布框选取值: Auf Leinwand aufziehen, um Wert zu übernehmen
  画布框选的区域存成变量，之后 click / 图色函数都能用: Speichert den auf der Leinwand markierten Bereich als Variable für spätere click- oder Pixelfarb-Funktionen
  目标色: Zielfarbe
  等待画面稳定: Auf stabiles Bild warten
  等待（命名延迟）: Warten (benannte Verzögerung)
  等待（秒）: Warten (Sek.)
  粘贴文本: Text einfügen
  级别: Stufe
  终点: Endpunkt
  行/列数: Zeilen/Spalten
  读取当前布局的 Region 模板绑定，并在指定范围或全画布定位: Liest die Region-Vorlagenbindungen des aktuellen Layouts und lokalisiert im angegebenen Bereich oder auf der gesamten Leinwand
  调用子过程: Unterprozedur aufrufen
  赋值: Zuweisen
  起点: Startpunkt
  起点→终点向量放大/缩小，如 2 或 0.5: Skalierung des Vektors Start→Ziel, z. B. 2 oder 0.5
  超时(秒): Zeitüberschreitung (Sek.)
  输出键名: Ausgabeschlüssel
  过程名: Prozedurname
  返回列表，按面积降序；$first = $icons[0] 后可 click: Gibt eine nach Fläche absteigend sortierte Liste zurück; $first = $icons[0] kann anschließend angeklickt werden
  进入亮段阈值: Schwelle für hellen Abschnitt
  退出阈值: Austrittsschwelle
  通道下限: Kanal-Untergrenze
  遍历列表: Liste durchlaufen
  重复 N 次: N-mal wiederholen
  重复直到…: Wiederholen bis…
  错误变量: Fehlervariable
  键名: Schlüsselname
  限定区域: Auf Bereich beschränken
  面板/区域: Bedienfeld/Bereich
  颜色占比: Farbanteil
  高出其他通道: Abstand über anderen Kanälen
