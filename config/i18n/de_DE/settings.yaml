  目标环境决定 DSL 中 env() 的返回值，用于区分 PC 游戏与手游的导航策略。指游戏运行的目标环境，非本机系统环境。: Die Zielumgebung bestimmt den Rückgabewert von env() in der DSL, um die Navigationsstrategie zwischen PC- und Mobilspielen zu unterscheiden. Gemeint ist die Laufzeitumgebung des Spiels, nicht das Betriebssystem dieses Computers.
  确定删除方案「{name}」吗？: Plan „{name}“ wirklich löschen?
  空串不自动定位窗口: Leere Zeichenkette deaktiviert die automatische Fenstererkennung
