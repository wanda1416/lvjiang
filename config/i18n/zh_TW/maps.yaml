# maps.yaml — 按模块段落组织
maps:
  'HUD 场景不存在: {scene}': 'HUD 場景不存在: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: HUD 繫結 minimap_center 必須屬於基礎檢視
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'HUD 繫結 minimap_center 必須引用座標點，未找到: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: HUD 繫結 {attr} 必須屬於 full 檢視
  HUD 绑定 {attr} 必须属于基础视图: HUD 繫結 {attr} 必須屬於基礎檢視
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'HUD 繫結 {attr} 必須引用區域，未找到: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: POI key 必須以小寫字母開頭，僅含小寫字母/數字/下劃線
  POI {key} 坐标超出底图范围: POI {key} 座標超出底圖範圍
  POI 必须是键值映射: POI 必須是鍵值對映
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256 必須是 64 位十六進位制摘要
  min_area 必须大于 0: min_area 必須大於 0
  pois 必须是列表: pois 必須是列表
  ui 必须是键值映射: ui 必須是鍵值對映
  window_ratio 必须在 0.05–1 之间: window_ratio 必須在 0.05–1 之間
  '{name} 必须是三元整数列表': '{name} 必須是三元整數列表'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name} 必須滿足 H=0–180、S/V=0–255'
  '{name}地图': '{name}地圖'
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: 地圖 key 必須以小寫字母開頭，僅含小寫字母/數字/下劃線
  '地图不存在: {key}': '地圖不存在: {key}'
  地图名称不能为空: 地圖名稱不能為空
  '地图名称已存在: {name}': '地圖名稱已存在: {name}'
  地图图片与定义摘要不一致: 地圖圖片與定義摘要不一致
  地图定义必须是键值映射: 地圖定義必須是鍵值對映
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: 地圖檔案 {rel} 內的 key 為 {inner}，與檔名不一致
  地域名称不能为空，且 key 不得重复: 地域名稱不能為空，且 key 不得重複
  大地图: 大地圖
  底图数据为空: 底圖資料為空
  底图文件名固定为 base.png: 底圖檔名固定為 base.png
  探查图片名称不能为空，且 key 不得重复: 探查圖片名稱不能為空，且 key 不得重複
  '探查图片引用了不存在的地域: {region}': '探查圖片引用了不存在的地域: {region}'
  探查图片必须有有效的 SHA256 摘要: 探查圖片必須有有效的 SHA256 摘要
  '探查图片缺失或摘要不匹配: {name}': '探查圖片缺失或摘要不匹配: {name}'
  '未知导航模式: {mode}': '未知導航模式: {mode}'
  '未知朝向识别方法: {method}': '未知朝向識別方法: {method}'
