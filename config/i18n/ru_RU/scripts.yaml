  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Записывает исходную временную шкалу клавиатуры, кнопок мыши, колеса прокрутки и (при желании) движения курсора. При сохранении создаётся сопутствующий файл трассы в workflows/lvtrace для точного воспроизведения таймингов, что подходит для управления камерой. Скрипт зависит от файла трассы — нельзя переносить только текст WF.
  试算: Пробный запуск
  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 'Пробный запуск реально выполняет скрипт перед вызовом этой функции: не запускайте им долгие или ненадёжные скрипты — интерфейс будет заблокирован до завершения.'
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: Этой функции требуется внедрение движка (_engine/_wf); её можно вызывать только во время выполнения скрипта
  语法检查通过（保存后会再做布局引用校验）: Проверка синтаксиса пройдена (проверка ссылок макета выполнится при сохранении)
  请先在“元数据”页点击“应用到代码”，再保存脚本。: Сначала нажмите «Применить к коду» на вкладке «Метаданные», затем сохраните скрипт.
  请先在主窗口定位游戏窗口: Сначала выберите окно игры в главном окне
  请先在主窗口扫描并定位窗口: Сначала просканируйте и выберите окно в главном окне
  请先选择或新建一个可编辑脚本，并保存已有高精度录制: Сначала выберите или создайте редактируемый скрипт и сохраните текущую запись высокой точности
