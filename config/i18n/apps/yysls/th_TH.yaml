  卡片显示原始装备数值，计算假设标注在卡片上方: การ์ดแสดงค่าอุปกรณ์เดิม โดยระบุสมมติฐานการคำนวณไว้ด้านบนการ์ด
  原地承音：等级不变，词条数值落到承音上限: 'เฉิงอินกับที่: เลเวลไม่เปลี่ยน ค่าออฟชันปรับขึ้นเป็นขีดจำกัดเฉิงอิน'
  原词条: ออฟชันเดิม
  及以上装备: และอุปกรณ์ที่สูงกว่า
  双击「规则说明」列可编辑，选中一行后可复制/删除该规则组: ดับเบิลคลิกคอลัมน์ "คำอธิบายกฎ" เพื่อแก้ไข เลือกแถวเพื่อคัดลอกหรือลบกลุ่มกฎนี้
  双击单元格即可逐项编辑；灰色单元格由流派决定: ดับเบิลคลิกเซลล์เพื่อแก้ไขทีละรายการ เซลล์สีเทากำหนดโดยสายการเล่น
  "发现 {count} 处部位/品阶无启用规则覆盖：": "พบตำแหน่ง/ระดับคุณภาพที่ไม่มีกฎเปิดใช้งานครอบคลุม {count} จุด:"
  发现同时配置 动态属攻和真实属攻，建议修正: พบการตั้งค่าโจมตีธาตุแบบไดนามิกและแบบจริงพร้อมกัน แนะนำให้แก้ไข
  取最大值: ใช้ค่าสูงสุด
  "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。": "ละเว้นออฟชันอื่นที่มีอยู่เฉพาะตอนตรวจเกณฑ์ปรับจูน โดยใช้ศักยภาพสูงสุดของออฟชันแรกตัดสินว่าจะเข้าสู่ขั้นตอนปรับจูนหรือไม่"
  不会改写装备；进入后的调律处理仍使用完整实际词条。: ไม่แก้ไขออฟชันของอุปกรณ์ หลังเข้าสู่ขั้นตอนการจัดการปรับจูนยังคงใช้ออฟชันจริงทั้งหมด
  只影响本次计算，不会写进搭配: มีผลเฉพาะการคำนวณครั้งนี้ จะไม่เขียนลงในชุดอุปกรณ์
  只有主实例可以启动 MCP 服务: เฉพาะอินสแตนซ์หลักเท่านั้นที่เริ่มบริการ MCP ได้
  只有开发模式可以指定保存位置: เฉพาะโหมดนักพัฒนาเท่านั้นที่ระบุตำแหน่งบันทึกได้
  "只检查部位和金/紫品阶是否有启用规则；判定结果和首词条条件需在实际运行时确定。": "ตรวจสอบเฉพาะว่าตำแหน่งและระดับคุณภาพทอง/ม่วงมีกฎที่เปิดใช้งานหรือไม่ ส่วนผลการตัดสินและเงื่อนไขออฟชันแรกจะตัดสินขณะทำงานจริง"
  "只能从可用词条库里、且各流派转律词条库允许转出的词条中选择；动态类四个词条只要在可用词条库中即可选。": "เลือกได้เฉพาะออฟชันที่อยู่ในคลังออฟชันที่ใช้ได้และคลังออฟชันโอนของแต่ละสายการเล่นอนุญาต ส่วนออฟชันหมวดไดนามิกทั้งสี่รายการเลือกได้ทันทีหากอยู่ในคลังออฟชันที่ใช้ได้"
  "只评估本次自动调律实际勾选的规则与玩法，避免为本次不打算培养的方案消耗材料。": "ประเมินเฉพาะกฎและสายการเล่นที่ติ๊กไว้จริงสำหรับการปรับจูนอัตโนมัติครั้งนี้ เพื่อเลี่ยงการสิ้นเปลืองวัสดุกับแผนที่ไม่ได้ตั้งใจพัฒนาในรอบนี้"
  只读实例不能停用 MCP 服务，请在主实例操作: อินสแตนซ์แบบอ่านอย่างเดียวไม่สามารถปิดบริการ MCP ได้ โปรดดำเนินการในอินสแตนซ์หลัก
  可交换: แลกเปลี่ยนได้
  可用词条库（全局，各部位词条混放）: คลังออฟชันที่ใช้ได้ (ส่วนกลาง รวมทุกตำแหน่ง)
  可转律（取消后不做转律模拟）: โอนออฟชันได้ (ยกเลิกเพื่อไม่จำลองการโอนออฟชัน)
  "可输入装备提供的直接属性和原始五维，以验证天赋阈值。不要填角色最终面板，也不要重复填写五维转换后的攻击。此处输入仅用于本次预览，不写入内置来源。": "สามารถกรอกค่าสถานะโดยตรงและห้ามิติตั้งต้นจากอุปกรณ์เพื่อตรวจสอบเกณฑ์พรสวรรค์ ห้ามกรอกค่าหน้าต่างสุดท้ายของตัวละคร และอย่ากรอกค่าโจมตีที่แปลงจากห้ามิติซ้ำ ข้อมูลนี้ใช้ดูตัวอย่างครั้งนี้เท่านั้น ไม่บันทึกลงแหล่งที่มาในตัว"
  合并本组: รวมกลุ่มนี้
  合计（白字）: รวม (ตัวเลขขาว)
  同名叠加: ซ้อนทับชื่อเดียวกัน
  同步接入配置: ซิงก์การตั้งค่าการเชื่อมต่อ
  名称已存在: มีชื่อนี้อยู่แล้ว
  "启动 MCP 后，在 WorkBuddy 等外部 Agent 中交流流派和养成目标。AI 可以了解当前用户与全部用户、查询装备、扫描备战方案、生成新配置并启动调律。启用后每次主实例启动时自动开启服务并同步接入配置。": "หลังเริ่ม MCP สามารถคุยเรื่องสายการเล่นและเป้าหมายการพัฒนาใน Agent ภายนอก เช่น WorkBuddy ได้ AI จะดูผู้ใช้ปัจจุบันและผู้ใช้ทั้งหมด ค้นหาอุปกรณ์ สแกนแผนเตรียมพร้อม สร้างการตั้งค่าใหม่ และเริ่มปรับจูน เมื่อเปิดใช้งานระบบจะเปิดบริการและซิงก์การตั้งค่าอัตโนมัติทุกครั้งที่เปิดอินสแตนซ์หลัก"
  启动大律准石数量检查: เปิดตรวจสอบจำนวนหินปรับจูนใหญ่
  "启动时会再次核对判定范围，并执行当前选中的设备；不会改变默认选择。": "เมื่อเริ่มต้นจะตรวจสอบขอบเขตการตัดสินอีกครั้งและรันบนอุปกรณ์ที่เลือกอยู่ปัจจุบัน โดยไม่เปลี่ยนค่าเริ่มต้น"
  启动选中方案: เริ่มแผนที่เลือก
  启用判定: เปิดใช้การตัดสิน
  "启用后，扫描到已锁定装备时直接保留，不进入调律、重置或回收流程。": "เมื่อเปิดใช้งาน หากสแกนพบอุปกรณ์ที่ล็อกอยู่จะเก็บไว้ทันที โดยไม่เข้าสู่ขั้นตอนปรับจูน รีเซ็ต หรือย่อย"
  "启用后，每实际开始调律 5 件装备时重新读取律准石；有效读数与缓存相差超过 1 个大律准石时记录错误日志。": "เมื่อเปิดใช้งาน จะอ่านจำนวนหินปรับจูนใหม่ทุกๆ 5 ชิ้นที่เริ่มปรับจูนจริง หากค่าที่อ่านได้ต่างจากแคชเกิน 1 ก้อนจะบันทึกข้อผิดพลาดในล็อก"
  启用后，首次识别数量低于设定值时要求人工确认。: เมื่อเปิดใช้งาน หากจำนวนที่ตรวจพบครั้งแรกต่ำกว่าค่าที่ตั้งไว้จะขอให้ผู้ใช้ยืนยัน
