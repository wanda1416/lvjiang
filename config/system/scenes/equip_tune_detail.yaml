- key: affix_shang
  name: 词条商
  type: attr
  is_text: true
  is_clickable: false
- key: affix_jue
  name: 词条角
  type: attr
  is_text: true
  is_clickable: false
- key: affix_zhi
  name: 词条徵
  type: attr
  is_text: true
  is_clickable: false
- key: affix_yu
  name: 词条羽
  type: attr
  is_text: true
  is_clickable: false
- key: auto_add
  name: 一键添加
  type: func
  is_text: true
  is_clickable: true
- key: tune_btn
  name: 调律
  type: func
  is_text: true
  is_clickable: true
