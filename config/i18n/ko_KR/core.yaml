  等待 {seconds} 秒仍无法读取视频流协议头（scrcpy server 启动失败或版本不符）: '{seconds}초 대기 후에도 비디오 스트림 프로토콜 헤더를 읽을 수 없습니다(scrcpy server 시작 실패 또는 버전 불일치)'
