  手机内置任务，可独立配置和执行，无需先连接 PC。可向手机下发脚本、配置和 Profile，也可独立回传手机历史与日志。: Задачи встроены в телефон и могут настраиваться и выполняться автономно без подключения к ПК. Можно отправлять на телефон скрипты, конфигурации и Profile, а также отдельно передавать историю и журналы с телефона.
  手机历史、日志和结果保留；回传需单独操作。确认下发？: История, журналы и результаты на телефоне сохранятся; их передача выполняется отдельно. Подтвердить отправку?
  手机执行用户：{user}；最近同步：{time}: 'Пользователь на телефоне: {user}; последняя синхронизация: {time}'
  手机缺失 {count} 个附件，相关历史不完整；请检查手机原文件。: 'На телефоне отсутствует вложений: {count}, связанная история неполна; проверьте исходные файлы на телефоне.'
  手机要访问的本机地址。多网卡时选与手机同网段的那个；换地址只改链接，不会中断共享: Локальный адрес ПК, по которому подключится телефон. При нескольких адаптерах выберите тот, что в одной подсети с телефоном; смена адреса обновляет только ссылку и не прерывает раздачу
