  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: Planifier par nom d'utilisateur ou par un attribut du profil. Cela détermine la liste des candidats dans la fenêtre principale, le contrat de cycle de vie et la validité du flux de préparation — c'est une définition de groupe de configuration
