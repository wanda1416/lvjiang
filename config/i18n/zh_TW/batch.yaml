  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: 按屬性排程時不適用：一個屬性值可能對應多名使用者，必須由條目準備工作流選定並回傳使用者名稱，所以生命週期始終執行。切回「使用者名稱」會恢復你原來的選擇
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: 按使用者名稱排程，還是按使用者資料的某個屬性排程。它決定主頁面候選列表的內容、生命週期契約和條目準備工作流的合法性，所以屬於配置組定義
