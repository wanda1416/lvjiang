  ? '默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。

    改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。'
  : 'As regras padrão valem globalmente para todo OCR; as cláusulas with de scan/find aplicam o grupo de regras selecionado após as regras padrão.

    Clique em "Salvar" para aplicar sem reiniciar; use "Desfazer" para reverter alterações não salvas.'
  默认规则（全局）: Regras padrão (Global)
  ? '识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。

    保存后从下一次识别开始生效，不需要重启。'
  : 'O desempenho de reconhecimento se aplica a todas as chamadas: maior paralelismo acelera, mas consome CPU proporcionalmente.

    As alterações salvas valem a partir do próximo reconhecimento, sem reiniciar.'
  识别性能: Desempenho
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: 'Número de threads usadas em cada reconhecimento. Padrão 2: aumentar não acelera na prática e só eleva o uso de CPU; use 1 para economizar CPU em execuções longas em segundo plano.'
  识别线程数: Threads de reconhecimento
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: Número de operadores executados em paralelo. Detecção, classificação e reconhecimento já possuem pools próprios de threads; aumentar costuma apenas gerar disputa de agendamento (padrão 1).
  并行算子线程数: Threads de operadores paralelos
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: Antes da detecção, o quadro é redimensionado pelo lado menor para este valor (imagens grandes reduzem, pequenas ampliam). Valores menores são mais rápidos e leves na CPU, mas podem perder textos pequenos; 736 é o padrão de fábrica — só altere se necessário.
  检测输入短边: Lado menor de entrada da detecção
