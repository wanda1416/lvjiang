  '{what}: 需要坐标引用（$var = [scene].[region]、find 结果或 (x, y[, w, h]) 字面量），实际: {t}': '{what}: ต้องการการอ้างอิงพิกัด ($var = [scene].[region], ผลลัพธ์จาก find หรือค่า (x, y[, w, h])) แต่ได้รับ: {t}'
