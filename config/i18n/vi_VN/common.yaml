  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: Số lần này dùng chung cho cả thiết lập luồng video lần đầu và tự động khôi phục sau khi mất kết nối; khi hết lượt sẽ chờ xử lý thủ công chứ không tự bỏ tác vụ.
