  "默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。\n改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。": "Las reglas predeterminadas se aplican globalmente a todo el OCR; las cláusulas with de scan/find aplican el grupo de reglas seleccionado sobre las predeterminadas.\nHaz clic en «Guardar» para aplicar sin reiniciar; usa «Deshacer» para revertir los cambios sin guardar."
  默认规则（全局）: Reglas predeterminadas (global)
  "识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。\n保存后从下一次识别开始生效，不需要重启。": "El rendimiento de reconocimiento se aplica a todas las llamadas de OCR: a mayor paralelismo, más rapidez, pero también mayor uso proporcional de CPU.\nTras guardar, se aplica a partir del siguiente reconocimiento sin reiniciar."
  识别性能: Rendimiento
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: 'Número de hilos usados internamente en cada reconocimiento. Por defecto 2: en la práctica aumentarlo no acelera y solo eleva el uso total de CPU; usar 1 ahorra más CPU en ejecuciones largas en segundo plano.'
  识别线程数: Hilos de reconocimiento
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: Número de hilos de operadores en paralelo. Los modelos de detección, clasificación y reconocimiento ya cuentan con su propio grupo de hilos, por lo que aumentarlo suele añadir contención de planificación; por defecto 1.
  并行算子线程数: Hilos de operadores
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: Antes de la detección, la imagen se escala para que su lado corto coincida con este valor (las grandes se reducen y las pequeñas se amplían). Un valor menor es más rápido y consume menos CPU, pero puede omitir texto pequeño; 736 es el valor de fábrica, no lo cambies sin motivo.
  检测输入短边: Lado corto de entrada para detección
