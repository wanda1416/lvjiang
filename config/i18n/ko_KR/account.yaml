  ? '把本机当前全部角色数据上传为云端总览基线。

    初始同步会自动创建一次；之后需要时手动点。'
  : '이 기기의 모든 캐릭터 데이터를 클라우드 개요 기준선으로 업로드합니다.

    초기 동기화 시 자동으로 한 번 생성되며, 이후 필요할 때 수동으로 클릭할 수 있습니다.'
  操作未完成: 작업이 완료되지 않았습니다
  数据同步: 데이터 동기화
  文档: 문서
  新密码至少 8 位: 새 비밀번호는 8자 이상이어야 합니다
  新密码（至少 8 位）: 새 비밀번호 (8자 이상)
  显示密码: 비밀번호 표시
  最近同步时间：{}: '최근 동기화 시간: {}'
  最近活跃: 최근 활동
  未知设备: 알 수 없는 기기
  检测到云端覆盖待确认；点「立即同步」处理。: 확인 대기 중인 클라우드 덮어쓰기가 감지되었습니다. 「지금 동기화」를 클릭하여 처리하세요.
  正在修改密码…: 비밀번호 변경 중…
  正在同步…: 동기화 중…
  正在备份并应用云端快照…: 백업 및 클라우드 스냅샷 적용 중…
  正在清除同步…: 동기화 초기화 중…
  正在登录…: 로그인 중…
  注册: 회원가입
  清除同步: 동기화 초기화
  登出: 로그아웃
  登录: 로그인
  登录后可同步角色名册、文档与总览数据: 로그인하면 캐릭터 명단, 문서 및 개요 데이터를 동기화할 수 있습니다
  确定让该设备下线？该设备上的全部会话会立即失效。: 이 기기를 로그아웃하시겠습니까? 해당 기기의 모든 세션이 즉시 만료됩니다.
  确认后会先把本机 profile 数据备份到 config/session/_sync-backup-<时间戳>/，再应用云端快照；可在该目录恢复。: 확인하면 먼저 로컬 profile 데이터를 config/session/_sync-backup-<타임스탬프>/에 백업한 뒤 클라우드 스냅샷을 적용합니다. 해당 폴더에서 복구할 수 있습니다.
  立即同步: 지금 동기화
  自助服务…: 셀프 서비스…
  设备登出: 기기 로그아웃
  设备管理: 기기 관리
  复制ID: ID 복사
  复制这台设备的 ID；重置密码时管理员凭它核对身份，不要随意泄露: 이 기기의 ID를 복사합니다. 비밀번호 재설정 시 관리자가 본인 확인에 사용하므로 타인에게 함부로 공유하지 마세요
  当前设备ID：{id}: '현재 기기 ID: {id}'
  （请勿随意向他人泄露该 id，这是重置密码的唯一凭据）: (이 ID를 타인에게 공유하지 마세요. 비밀번호 재설정의 유일한 확인 수단입니다)
  请先点「初始同步」建立同步状态: 먼저 「초기 동기화」를 클릭하여 동기화 상태를 설정하세요
  请输入密码: 비밀번호를 입력하세요
  请输入账户: 계정을 입력하세요
  读取本机总览失败：{error}: '로컬 개요 읽기 실패: {error}'
  账户: 계정
  这是本机：下线后需要重新登录。: 현재 사용 중인 기기입니다. 로그아웃하면 다시 로그인해야 합니다.
  进度: 진행률
  退出所有设备: 모든 기기에서 로그아웃
  退出登录: 로그아웃
  通道: 채널
  隐藏密码: 비밀번호 숨기기
  ? '首次使用：建立本机与云端的同步状态。云端已有数据时，会先把本地

    用户、总览定义与总览数据备份到 config/session/_backup-* 再拉取云端。'
  : '최초 사용: 이 기기와 클라우드 간의 동기화 상태를 설정합니다. 클라우드에 이미 데이터가 있으면 먼저 로컬

    사용자, 개요 정의 및 개요 데이터를 config/session/_backup-*에 백업한 뒤 클라우드 데이터를 가져옵니다.'
  ；等 {} 项: ' 외 {}개 항목'
  已恢复每分钟自动同步: 1분마다 자동 동기화가 재개되었습니다
  已暂停自动同步；手动「立即同步」仍可用: 자동 동기화가 일시정지되었습니다. 수동 「지금 동기화」는 계속 사용할 수 있습니다
  恢复同步: 동기화 재개
  暂停同步: 동기화 일시정지
  暂停后不再每分钟自动同步（心跳与在线状态不受影响）。手动「立即同步」仍可用；重启后保持暂停状态。: 일시정지하면 1분마다 자동 동기화를 중단합니다(하트비트와 온라인 상태에는 영향 없음). 수동 「지금 동기화」는 계속 사용할 수 있으며 재시작 후에도 일시정지 상태가 유지됩니다.
