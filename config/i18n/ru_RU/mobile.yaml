  保留手机批量配置。: Сохраняет пакетные конфигурации телефона.
  保留手机整份批量配置组；取消后使用电脑配置组。本次运行草稿仍保留。: Сохраняет все группы пакетной конфигурации телефона; при снятии флажка используются группы с ПК. Черновик текущего запуска сохраняется.
  先「下载 APK 到本机」或选择一个本地安装包: Сначала нажмите «Скачать APK на ПК» или выберите локальный пакет
