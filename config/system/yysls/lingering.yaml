# 袅袅之音清单：所有地区一份文件，随版本下发。
# 顶层每个键（除 content_version/default_target 等元信息外）就是一个地区：
# 地区只是条目的属性分组（左侧列表用于筛选），不套 regions 容器。
# 条目 id 是无属性纯随机 uuid8（生成后永不变更，与地区/分类/条目名/类型解耦），
# 用户记录的键 = 条目 id；label 只用于展示。改任何字段都不断用户记录。
# 类型：kind = single / roster / periodic；periodic 必须绑 target: quota:<key>，
# 其余类型的 target 由页面顶部的「同步模型」决定，不必写在这里。
# 用户的增删改写进 config/local/yysls/lingering.yaml（同名同结构、只存改动），
# 不写回本文件；隐藏某条写 items 里该条的 hidden: true。
