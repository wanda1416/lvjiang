action_catalog:
  0=红 1=绿 2=蓝: 0=Rot 1=Grün 2=Blau
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / Buchstabentasten / MOUSE_LEFT; auf dem Gerät ESC = Zurück
  OCR 扫描区域: OCR-Scanbereich
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: Auf dem PC wird Text über die Zwischenablage und Strg+V eingegeben; unterstützt Hintergrundmodus
  find 结果、矩形或坐标变量: find-Ergebnis, Rechteck oder Punktvariable
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: „{label}“ darf keine geraden doppelten Anführungszeichen oder Zeilenumbrüche enthalten (DSL-Zeichenketten unterstützen kein Escaping)
  '「{label}」应为 #rrggbb': '„{label}“ muss im Format #rrggbb sein'
  「{label}」应为 {n} 个数: „{label}“ muss aus {n} Zahlen bestehen
  「{label}」应为命名延迟（字母或中文开头的名字）: „{label}“ muss eine benannte Verzögerung sein (Name, der mit einem Buchstaben oder chinesischen Zeichen beginnt)
  「{label}」未填写: „{label}“ ist nicht ausgefüllt
  「{label}」的 {n} 个值都必须是数字: Alle {n} Werte von „{label}“ müssen Zahlen sein
  不带 by 得到文字；带 by 得到命中与否: Ohne by wird der Text zurückgegeben; mit by, ob ein Treffer vorliegt
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: Bitte für „{label}“ einen einzelnen Key angeben (z. B. ok), ohne eckige Klammern oder Szenenpräfix
  不抖动: Kein Jitter
  主导通道: Hauptkanal
  交互: Interaktion
  亮段计数: Anzahl heller Abschnitte
  值/表达式: Wert / Ausdruck
  停止应用: App beenden
  内容: Inhalt
  出错也继续: Bei Fehler fortfahren
  列表: Liste
  到达后按住(秒): Nach Erreichen halten (Sek.)
  匹配: Abgleich
  区域/点: Bereich/Punkt
  区域里接近目标色的像素比例 0–1，判断按钮亮没亮/在哪个界面: Anteil (0–1) der Pixel im Bereich nahe der Zielfarbe; dient zur Prüfung, ob eine Schaltfläche aktiv ist oder welcher Bildschirm angezeigt wird
  取点亮度: Punkthelligkeit erfassen
  取点颜色: Punktfarbe erfassen
  只判断是否含: Nur auf Enthaltensein prüfen
  只看某区域: Nur bestimmten Bereich prüfen
  向量倍数: Vektormultiplikator
  启动应用: App starten
  命名延迟，留空则不等待: Benannte Verzögerung; leer lassen, um nicht zu warten
  图库识别（分类）: Galerie-Erkennung (Klassifizierung)
  图色: Pixelfarbe
  声明全局变量: Globale Variable deklarieren
  声明后可在主流程与所有子过程中共享读写: Nach der Deklaration im Hauptablauf und allen Unterprozeduren gemeinsam les- und schreibbar
  失败退出: Bei Fehler abbrechen
  如 $x > 0.5 / $v contains "ok" / not $hit: z. B. $x > 0.5 / $v contains "ok" / not $hit
  如果…: Wenn…
  如果…否则…: Wenn… Sonst…
  字符串写双引号，或使用 $变量: Zeichenketten in doppelten Anführungszeichen schreiben oder $Variablen verwenden
  存入变量: In Variable speichern
  定义区域变量: Bereichsvariable definieren
  定义子过程: Unterprozedur definieren
  容差: Toleranz
  应用名: App-Name
  延迟: Verzögerung
  当…时重复: Wiederholen solange…
  形如 [scene].[region]: 'Format: [scene].[region]'
  形如 [scene].[region]，留空全画布: 'Format: [scene].[region]; leer für gesamte Leinwand'
  形如 [scene].[region]；留空则搜索整个画布: 'Format: [scene].[region]; leer durchsucht die gesamte Leinwand'
  循环变量: Schleifenvariable
  感知: Erkennung
  截图存档: Screenshot archivieren
  打日志: Protokolleintrag schreiben
  找同色图标: Gleichfarbiges Symbol suchen
  找图（模板定位）: Bild suchen (Vorlagenabgleich)
  找文字（可点击）: Text suchen (klickbar)
  拖拽区域翻页: Bereich zum Blättern ziehen
