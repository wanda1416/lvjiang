  完全离线模式（暂停全部联网功能）: Vollständiger Offlinemodus (alle Netzwerkfunktionen pausieren)
  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 'Experimentelle Funktion: Viele Skripte funktionieren in diesem Modus derzeit noch nicht; Fehlermeldungen zur Nichtverfügbarkeit werden nicht bearbeitet. Die Hintergrundaufnahme ermöglicht Screenshots auch dann, wenn das Spielfenster verdeckt ist, ist jedoch etwas langsamer als die Vordergrundaufnahme; sie erfordert zudem Hintergrundeingabe, und bei minimiertem Fenster liefert keine von beiden ein Bild. Dies legt den Standardwert fest: Im Hauptfenster wird „Hintergrundaufnahme“ erst nach Aktivieren von „Hintergrundmodus“ automatisch gesetzt und kann während des Laufs jederzeit geändert werden.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Experimentelle Funktion: Auf dem Smartphone muss die LvJiang-App installiert und der Bedienungshilfedienst aktiviert sein; geändert wird nur der Ausführungskanal für Tippen und Wischen, nicht die Screenshot-Methode. Bei Verbindungsfehler erfolgt ein Fallback auf ADB shell input.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: Noch keine Verbindungsinformationen dieses Typs vorhanden; verbinden Sie zuerst ein Gerät oder erfassen Sie ein Fenster im Hauptfenster.
