template:
  模板按分组存放，与图库空间无关: เทมเพลตถูกจัดเก็บตามกลุ่มและไม่ขึ้นกับพื้นที่คลังภาพ
  新增图像: เพิ่มรูปภาพ
  参考图管理: จัดการภาพอ้างอิง
  参考图元数据: เมทาดาทาภาพอ้างอิง
  模板图管理: จัดการภาพเทมเพลต
  参考图: ภาพอ้างอิง
  模板图: ภาพเทมเพลต
  写入目标: เป้าหมายการบันทึก
  在画布上框选一个矩形即为模板图。分组留空写入 common；布局分组的模板由场景管理截取，这里不能写。: ลากกรอบสี่เหลี่ยมบนแคนวาสเพื่อสร้างภาพเทมเพลต หากเว้นชื่อกลุ่มว่างจะบันทึกลงใน common ส่วนเทมเพลตของกลุ่มเลย์เอาต์จะถูกจับภาพจากตัวจัดการฉาก จึงไม่สามารถบันทึกที่นี่ได้
  模板名（不含分组）: ชื่อเทมเพลต (ไม่รวมชื่อกลุ่ม)
  测试匹配: ทดสอบการจับคู่
  保存到模板库: บันทึกลงคลังเทมเพลต
  未导入图片: ยังไม่ได้นำเข้ารูปภาพ
  裁剪模板: ครอบตัดเทมเพลต
  模板至少需要 4×4 像素，请调整框选: เทมเพลตต้องมีขนาดอย่างน้อย 4×4 พิกเซล กรุณาปรับกรอบที่เลือก
  请先填写模板名: กรุณากรอกชื่อเทมเพลตก่อน
  模板名不能包含路径分隔符: ชื่อเทมเพลตต้องไม่มีตัวคั่นพาธ
  用法: การใช้งาน
  像素 {w}×{h} ｜ 录制画布 {rw}×{rh}: พิกเซล {w}×{h} ｜ แคนวาสที่บันทึก {rw}×{rh}
  分数 {score:.3f}（阈值 {threshold:.2f}）: คะแนน {score:.3f} (เกณฑ์ {threshold:.2f})
  「{group}」是布局分组，模板由场景管理截取: '"{group}" เป็นกลุ่มเลย์เอาต์ เทมเพลตจะถูกจับภาพจากตัวจัดการฉาก'
  模板「{name}」已存在，覆盖？: เทมเพลต "{name}" มีอยู่แล้ว ต้องการเขียนทับหรือไม่?
  搜索模板名: ค้นหาชื่อเทมเพลต
  复制名字: คัดลอกชื่อ
  未被引用: ไม่ได้ถูกอ้างอิง
  标定样本：运行时按颜色比例判定，不参与模板匹配，永久保留: 'ตัวอย่างการปรับเทียบ: ตัดสินด้วยสัดส่วนสีขณะทำงาน ไม่ใช้ในการจับคู่เทมเพลต และเก็บไว้ถาวร'
  布局分组的模板由场景管理截取/删除，这里只读: เทมเพลตของกลุ่มเลย์เอาต์ถูกจับภาพหรือลบผ่านตัวจัดการฉาก ที่นี่อ่านได้เท่านั้น
  重命名模板: เปลี่ยนชื่อเทมเพลต
  像素尺寸: ขนาดพิกเซล
  录制画布: แคนวาสที่บันทึก
  来源层: เลเยอร์ต้นทาง
  共享: แชร์ร่วมกัน
  标定样本，不参与匹配: ตัวอย่างการปรับเทียบ ไม่ใช้ในการจับคู่
  标定样本，不需要尺寸: ตัวอย่างการปรับเทียบ ไม่ต้องระบุขนาด
  删除模板: ลบเทมเพลต
  删除失败，详见日志: ลบไม่สำเร็จ ดูรายละเอียดในบันทึก
  未登记（同分辨率专用）: ยังไม่ได้ลงทะเบียน (ใช้เฉพาะความละเอียดเดียวกัน)
  绑定 {n} 处: ผูกไว้ {n} จุด
  脚本引用 {n} 处: อ้างอิงในสคริปต์ {n} จุด
  确定删除模板「{name}」？{detail}: ยืนยันที่จะลบเทมเพลต "{name}" หรือไม่?{detail}
  模板详情: รายละเอียดเทมเพลต
