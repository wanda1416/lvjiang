  "引擎算出的点击/拖拽坐标跑到画面外时怎么办。\n不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。\n勾选：引擎截断到画面边界并记一条 warning，本次运行继续。\n判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。": "Действие при выходе вычисленных координат клика/перетаскивания за границы кадра.\nСнято (по умолчанию): выдать ошибку и остановить запуск — выход за пределы означает несоответствие параметров смещения геометрии панели, а тихое обрезание незаметно превратит прокрутку двух строк в одну.\nОтмечено: обрезать координаты до границы кадра, записать предупреждение и продолжить.\nПроверка выполняется на уровне движка, так как бэкенды ведут себя по-разному."
