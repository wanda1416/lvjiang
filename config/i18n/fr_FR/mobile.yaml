  二维码来源: Source du code QR
  二维码生成失败，请手动打开上面的链接: Échec de la génération du code QR ; ouvrez le lien ci-dessus manuellement
  仅合并已结束的手机记录；参数、Profile 和插件业务数据不回传。重复回传不会重复导入。: Seuls les enregistrements terminés du téléphone sont fusionnés ; les paramètres, profils et données métier de plugins ne sont pas renvoyés. Un nouvel envoi ne crée pas de doublons.
