  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: ลากเพื่อปรับลำดับการทำงานจริง คลิกขวาเพื่อคืนค่าเริ่มต้น สุ่มสลับ หรือเรียงตามโปรไฟล์ ลำดับในการตั้งค่าแบบชุดใช้เป็นลำดับเริ่มต้นเท่านั้น
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: ลากเพื่อปรับลำดับการทำงานจริง คลิกขวาเพื่อคืนค่าเริ่มต้นหรือสุ่มสลับลำดับ ลำดับในการตั้งค่าแบบชุดใช้เป็นลำดับเริ่มต้นเท่านั้น
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: ลากเพื่อปรับลำดับการทำงานจริง คลิกขวาเพื่อคืนค่าเริ่มต้นหรือสุ่มสลับ ลำดับในการตั้งค่าแบบชุดใช้เป็นลำดับเริ่มต้นเท่านั้น
  指定顺序排序: เรียงตามลำดับที่กำหนด
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: ใช้ไม่ได้เมื่อจัดคิวตามคุณสมบัติ เนื่องจากค่าคุณสมบัติหนึ่งอาจตรงกับผู้ใช้หลายคน เวิร์กโฟลว์เตรียมรายการจึงต้องเลือกและส่งคืนชื่อผู้ใช้ วงจรชีวิตจึงต้องทำงานเสมอ หากสลับกลับเป็น «ชื่อผู้ใช้» จะคืนค่าตัวเลือกเดิมของคุณ
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: เลือกว่าจะจัดคิวตามชื่อผู้ใช้หรือตามคุณสมบัติในโปรไฟล์ผู้ใช้ สิ่งนี้กำหนดรายการตัวเลือกในหน้าหลัก ข้อตกลงวงจรชีวิต และความถูกต้องของเวิร์กโฟลว์เตรียมรายการ จึงถือเป็นนิยามของกลุ่มการตั้งค่า
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: คีย์การเรียงเป็นนิยามของกลุ่มการตั้งค่า คลิกขวาที่รายชื่อผู้ใช้แล้วเลือก «เรียงตามโปรไฟล์» เพื่อเรียงหนึ่งครั้ง ลำดับที่ได้จะใช้เฉพาะการรันรอบนี้เท่านั้น
  新建配置: สร้างการตั้งค่าใหม่
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: ใช้ดึงเกมกลับไปยังหน้าเข้าสู่ระบบเมื่อโหมดอัตโนมัติพบการหยุดชั่วคราวผิดปกติ ต้องตั้งค่าที่นี่ให้เรียบร้อยก่อนจึงจะติ๊ก «ทำงานอัตโนมัติ» ในหน้าหลักได้
  无法开始批量任务: ไม่สามารถเริ่มงานแบบชุดได้
  暂无启用的单元，请到「单元」页勾选: ยังไม่มีหน่วยที่เปิดใช้งาน กรุณาไปเลือกที่แท็บ «หน่วย»
  暂无配置组，请先通过「工具 → 批量配置」添加: ยังไม่มีกลุ่มการตั้งค่า กรุณาเพิ่มผ่าน «เครื่องมือ → ตั้งค่าแบบชุด» ก่อน
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: 'ติ๊กเมื่อปล่อยทำงานอัตโนมัติเป็นเวลานาน: เมื่อพบการหยุดชั่วคราวผิดปกติ งานจะไม่รอผู้ใช้ แต่จะบันทึกว่าล้มเหลวแล้วข้ามไป จากนั้น «เวิร์กโฟลว์กู้คืน» ของกลุ่มการตั้งค่าจะดึงเกมกลับหน้าเข้าสู่ระบบแล้วทำงานถัดไปต่อ ส่วนการยืนยัน การกรอกข้อมูล และการเลือกยังคงรอการโต้ตอบจากผู้ใช้'
  条目准备: เตรียมรายการ
  条目准备工作流不支持当前属性调度，请到批量配置中修改: เวิร์กโฟลว์เตรียมรายการไม่รองรับการจัดคิวตามคุณสมบัติปัจจุบัน กรุณาแก้ไขในการตั้งค่าแบบชุด
  条目收尾: ปิดท้ายรายการ
