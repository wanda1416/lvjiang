template:
  模板按分组存放，与图库空间无关: "Mẫu được lưu theo nhóm, không liên quan đến không gian thư viện ảnh"
  新增图像: Thêm ảnh
  参考图管理: Quản lý ảnh tham chiếu
  参考图元数据: Siêu dữ liệu ảnh tham chiếu
  模板图管理: Quản lý ảnh mẫu
  参考图: Ảnh tham chiếu
  模板图: Ảnh mẫu
  写入目标: Đích ghi
  在画布上框选一个矩形即为模板图。分组留空写入 common；布局分组的模板由场景管理截取，这里不能写。: "Khoanh một hình chữ nhật trên khung vẽ để làm ảnh mẫu. Để trống nhóm sẽ ghi vào common; mẫu thuộc nhóm bố cục do trình quản lý cảnh chụp, không thể ghi tại đây."
  模板名（不含分组）: Tên mẫu (không gồm nhóm)
  测试匹配: Kiểm thử khớp
  保存到模板库: Lưu vào thư viện mẫu
  未导入图片: Chưa nhập ảnh
  裁剪模板: Cắt mẫu
  模板至少需要 4×4 像素，请调整框选: "Mẫu cần tối thiểu 4×4 pixel, vui lòng điều chỉnh khung chọn"
  请先填写模板名: Vui lòng nhập tên mẫu trước
  模板名不能包含路径分隔符: Tên mẫu không được chứa dấu phân cách đường dẫn
  用法: Cách dùng
  "像素 {w}×{h} ｜ 录制画布 {rw}×{rh}": "Pixel {w}×{h} ｜ Khung vẽ ghi {rw}×{rh}"
  "分数 {score:.3f}（阈值 {threshold:.2f}）": "Điểm {score:.3f} (ngưỡng {threshold:.2f})"
  "「{group}」是布局分组，模板由场景管理截取": "\"{group}\" là nhóm bố cục, mẫu do trình quản lý cảnh chụp"
  "模板「{name}」已存在，覆盖？": "Mẫu \"{name}\" đã tồn tại, ghi đè?"
  搜索模板名: Tìm tên mẫu
  复制名字: Sao chép tên
  未被引用: Chưa được tham chiếu
  标定样本：运行时按颜色比例判定，不参与模板匹配，永久保留: "Mẫu hiệu chuẩn: phán đoán theo tỷ lệ màu khi chạy, không tham gia khớp mẫu, được giữ vĩnh viễn"
  布局分组的模板由场景管理截取/删除，这里只读: "Mẫu thuộc nhóm bố cục do trình quản lý cảnh chụp/xóa, tại đây chỉ đọc"
  重命名模板: Đổi tên mẫu
  像素尺寸: Kích thước pixel
  录制画布: Khung vẽ ghi
  来源层: Lớp nguồn
  共享: Dùng chung
  标定样本，不参与匹配: "Mẫu hiệu chuẩn, không tham gia khớp"
  标定样本，不需要尺寸: "Mẫu hiệu chuẩn, không cần kích thước"
  删除模板: Xóa mẫu
  删除失败，详见日志: "Xóa thất bại, xem chi tiết trong nhật ký"
  未登记（同分辨率专用）: Chưa đăng ký (chỉ dùng cùng độ phân giải)
  "绑定 {n} 处": "Liên kết {n} chỗ"
  "脚本引用 {n} 处": "Script tham chiếu {n} chỗ"
  "确定删除模板「{name}」？{detail}": "Xóa mẫu \"{name}\"?{detail}"
  模板详情: Chi tiết mẫu
