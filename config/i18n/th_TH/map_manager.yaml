map_manager:
  HUD 场景: ฉาก HUD
  HUD 场景绑定（坐标在场景编辑器里标定）: การผูกฉาก HUD (ปรับเทียบพิกัดในตัวจัดการฉาก)
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point} อยู่นอกพื้นที่มินิแมป การตรวจจับทิศทางจะใช้จุดกึ่งกลางพื้นที่ชั่วคราว'
  ⚠ 缺失：{key}: '⚠ ขาดหาย: {key}'
  不能删除: ไม่สามารถลบได้
  从当前画面截取: จับภาพจากหน้าจอปัจจุบัน
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: จะสร้างฉาก HUD ชื่อ map_<key> ไปพร้อมกัน จากนั้นปรับเทียบพื้นที่มินิแมปและแผนที่โลกในตัวจัดการฉาก
  保存当前画面为探查图片: บันทึกหน้าจอปัจจุบันเป็นรูปภาพสำรวจ
  先登记地域: ลงทะเบียนภูมิภาคก่อน
  删除地图: ลบแผนที่
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: ต้องการลบแผนที่ «{name}» พร้อมแผนที่ฐานหรือไม่? ฉาก HUD ที่สร้างอัตโนมัติ map_{key} จะถูกลบไปด้วย
  删除选中 POI: ลบ POI ที่เลือก
  删除选中地域: ลบภูมิภาคที่เลือก
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: ติ๊กเฉพาะเมื่อเก็บข้อมูลครบทั้งแผนที่แล้วเท่านั้น การต่อภาพสำเร็จไม่ได้หมายความว่าสำรวจครบทั้งแผนที่
  只读，请先“复制到本地”再修改: อ่านอย่างเดียว กรุณา «คัดลอกลงเครื่อง» ก่อนแก้ไข
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): ไฟล์รูปภาพ (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: คลิกบนแผนที่ฐานเพื่อเพิ่ม POI หรือคลิกหมุดที่มีอยู่เพื่อเลือก พิกัดเป็นพิกัดปรับมาตรฐานของแผนที่ฐาน
  地图 key: คีย์แผนที่
  地域与探查: ภูมิภาคและการสำรวจ
  地域仍被使用: ภูมิภาคนี้ยังถูกใช้งานอยู่
  地域名称: ชื่อภูมิภาค
  坐标必须在 0–1 之间: พิกัดต้องอยู่ระหว่าง 0–1
  基本信息: ข้อมูลพื้นฐาน
  基本信息与绑定: ข้อมูลพื้นฐานและการผูกค่า
  复制到本地: คัดลอกลงเครื่อง
  大地图底图: แผนที่ฐานของแผนที่โลก
  大地图正北朝上: แผนที่โลกหันทิศเหนือขึ้นด้านบน
  导入底图文件…: นำเข้าไฟล์แผนที่ฐาน…
  导航模式: โหมดนำทาง
  小写字母开头，字母/数字/下划线: ขึ้นต้นด้วยตัวอักษรพิมพ์เล็ก ใช้ได้เฉพาะตัวอักษร ตัวเลข และขีดล่าง
  小地图朝向: ทิศทางมินิแมป
  尖端（退化）: ปลายแหลม (กรณีลดรูป)
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: 'ยังไม่ได้นำเข้าแผนที่ฐาน: กด «ปรับเทียบ HUD…» เพื่อระบุพื้นที่แผนที่โลกก่อน แล้วจึงนำเข้าในหน้า «แผนที่ฐานและ POI»'
  展示: การแสดงผล
  底图与 POI: แผนที่ฐานและ POI
  底图区域未标定: ยังไม่ได้ปรับเทียบพื้นที่แผนที่ฐาน
  底图可标注 POI；空白部分尚未探查。: สามารถปักหมุด POI บนแผนที่ฐานได้ ส่วนพื้นที่ว่างคือบริเวณที่ยังไม่ได้สำรวจ
  底图已完成整图探查: สำรวจแผนที่ฐานครบทั้งแผนที่แล้ว
  底图编码失败: เข้ารหัสแผนที่ฐานไม่สำเร็จ
  底图：局部探查，待补齐: 'แผนที่ฐาน: สำรวจแล้วบางส่วน รอเพิ่มเติม'
  底图：整图探查已完成: 'แผนที่ฐาน: สำรวจครบทั้งแผนที่แล้ว'
  当前地图有未保存的修改，放弃吗？: แผนที่ปัจจุบันมีการแก้ไขที่ยังไม่บันทึก ต้องการละทิ้งหรือไม่?
  当前布局不存在，未能定位地图区域。: ไม่มีเลย์เอาต์ปัจจุบัน จึงไม่สามารถระบุพื้นที่แผนที่ได้
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: เลย์เอาต์ปัจจุบันยังไม่ได้ปรับเทียบ {scene}.{point} การตรวจจับทิศทางจะใช้จุดกึ่งกลางมินิแมปชั่วคราว
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: เลย์เอาต์ปัจจุบันยังไม่ได้ปรับเทียบ {scene}.{region} ไม่สามารถครอปพื้นที่แผนที่ได้
  当前无法读取布局，未能定位地图区域。: ไม่สามารถอ่านเลย์เอาต์ได้ในขณะนี้ จึงไม่สามารถระบุพื้นที่แผนที่ได้
  当前未选择地图，无法解析地图区域。: ยังไม่ได้เลือกแผนที่ ไม่สามารถวิเคราะห์พื้นที่แผนที่ได้
  截取当前画面: จับภาพหน้าจอปัจจุบัน
  截图所属地域: ภูมิภาคของภาพหน้าจอนี้
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: ลงทะเบียนภูมิภาคตามตัวเลือกพื้นที่ในเกม รูปภาพสำรวจและแผนที่ฐานจะถูกบันทึกแยกกัน สามารถสลับดูได้ในหน้าแผนที่ฐาน
  探查: สำรวจ
  探查图片仅供查看: รูปภาพสำรวจใช้สำหรับดูเท่านั้น
  探查图片缺失或无法解码: ไม่พบรูปภาพสำรวจหรือไม่สามารถถอดรหัสได้
  探查截图用于查看；POI 只在底图上编辑。: ภาพสำรวจใช้สำหรับดูเท่านั้น การแก้ไข POI ทำได้บนแผนที่ฐานเท่านั้น
  搜索窗口（相对短边）: หน้าต่างค้นหา (เทียบกับด้านสั้น)
  新地域: ภูมิภาคใหม่
  新建地图: สร้างแผนที่ใหม่
  无效的 POI: POI ไม่ถูกต้อง
  无法获取截图: ไม่สามารถจับภาพหน้าจอได้
  '无法解码图片: {path}': 'ไม่สามารถถอดรหัสรูปภาพ: {path}'
  无法读取图片: ไม่สามารถอ่านรูปภาพได้
  是否仍然使用整帧作为底图？: ต้องการใช้ภาพทั้งเฟรมเป็นแผนที่ฐานหรือไม่?
  最小面积（像素）: พื้นที่ขั้นต่ำ (พิกเซล)
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 'ทิศทาง {deg:.1f}°　ความเชื่อมั่น {conf:.2f}　วิธี: {method}　พื้นที่ {area}px'
  未保存: ยังไม่บันทึก
  未取得当前画面: ยังไม่ได้จับภาพหน้าจอปัจจุบัน
  未找到箭头：检查颜色阈值或小地图区域标定: 'ไม่พบลูกศร: ตรวจสอบเกณฑ์สีหรือการปรับเทียบพื้นที่มินิแมป'
  来源：{layer}: 'แหล่งที่มา: {layer}'
  标定 HUD…（打开场景编辑器）: ปรับเทียบ HUD… (เปิดตัวจัดการฉาก)
  标识: ข้อมูลระบุตัวตน
  没有地图。点击“新建”创建一张。: ยังไม่มีแผนที่ คลิก «สร้างใหม่» เพื่อสร้างแผนที่
  添加地域: เพิ่มภูมิภาค
  添加失败: เพิ่มไม่สำเร็จ
  添加探查图片: เพิ่มรูปภาพสำรวจ
  添加探查图片…: เพิ่มรูปภาพสำรวจ…
  燕尾缺口: รอยบากหางนกแอ่น
  留空 = key: เว้นว่าง = key
  种类: ประเภท
  箭头颜色与搜索参数（保存到地图）: สีลูกศรและพารามิเตอร์การค้นหา (บันทึกไว้ในแผนที่)
  识别结果: ผลการตรวจจับ
  该地域已有探查图片，不能直接删除。: ภูมิภาคนี้มีรูปภาพสำรวจอยู่แล้ว ไม่สามารถลบโดยตรงได้
  请选择截图所属地域。: กรุณาเลือกภูมิภาคที่ภาพหน้าจอนี้สังกัด
  读取失败: อ่านข้อมูลไม่สำเร็จ
  读取当前布局失败，未能定位地图区域。: อ่านเลย์เอาต์ปัจจุบันไม่สำเร็จ จึงไม่สามารถระบุพื้นที่แผนที่ได้
  载入截图文件…: โหลดไฟล์ภาพหน้าจอ…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: หลังโหลดภาพหน้าจอในเกมทั้งภาพ ระบบจะครอปตามพื้นที่มินิแมปที่ปรับเทียบในเลย์เอาต์ปัจจุบัน แล้ววิเคราะห์ลูกศรสีเหลืองเว้าเข้าตรงกลาง 0° = ทิศเหนือ (ด้านบนหน้าจอ) และเพิ่มค่าตามเข็มนาฬิกา
  适应窗口: พอดีหน้าต่าง
  选择局内截图: เลือกภาพหน้าจอในเกม
  选择底图: เลือกแผนที่ฐาน
  重新识别: ตรวจจับใหม่
  （尚未载入截图）: (ยังไม่ได้โหลดภาพหน้าจอ)
  'POI key 重复: {key}': 'คีย์ POI ซ้ำ: {key}'
maps:
  'POI key 重复: {key}': 'คีย์ POI ซ้ำ: {key}'
  '地图 key 已存在: {key}': 'มีคีย์แผนที่นี้อยู่แล้ว: {key}'
user_avatar:
  截图功能不可用，请先在主窗口定位窗口或连接设备: ฟังก์ชันจับภาพหน้าจอไม่พร้อมใช้งาน กรุณาระบุตำแหน่งหน้าต่างหรือเชื่อมต่ออุปกรณ์ในหน้าต่างหลักก่อน
