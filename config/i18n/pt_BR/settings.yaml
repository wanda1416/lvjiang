  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Recebe atualizações oficiais de configuração e tarefas compatíveis com a versão atual do aplicativo, aplicadas na próxima inicialização após verificação. Suas configurações locais têm sempre prioridade; tarefas em execução continuam usando o que já foi carregado. Desativar esta opção ou entrar em modo offline restaura o conteúdo integrado e remove o conteúdo de membro na próxima inicialização, sem afetar os dados locais.
