  手机内置任务，可独立配置和执行，无需先连接 PC。可向手机下发脚本、配置和 Profile，也可独立回传手机历史与日志。: Tarefas integradas ao celular, configuráveis e executáveis sem precisar conectar ao PC. É possível enviar scripts, configurações e Profile para o celular, e retornar histórico e registros do celular de forma independente.
  手机历史、日志和结果保留；回传需单独操作。确认下发？: O histórico, registros e resultados do celular serão mantidos; o envio de volta é uma ação separada. Confirmar o envio?
