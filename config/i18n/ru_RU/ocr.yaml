  确定删除规则组「{name}」吗？引用它的工作流将无法执行。: Удалить группу правил «{name}»? Рабочие процессы, ссылающиеся на неё, не смогут выполняться.
  确定撤销本次所有未保存的清洗规则更改吗？: Отменить все несохранённые изменения правил очистки в этой сессии?
  确定撤销本次所有未保存的识别配置更改吗？: Отменить все несохранённые изменения настроек распознавания в этой сессии?
  '行 {n}: 无效的正则表达式': 'Строка {n}: некорректное регулярное выражение'
  规则组 key（用于 with 声明）: Ключ группы правил (используется в конструкции with)
