  "启动时会再次核对判定范围，并执行当前选中的设备；不会改变默认选择。": "При запуске область оценки проверяется повторно и выполняется на текущем выбранном устройстве; выбор по умолчанию не меняется."
  启动选中方案: Запустить выбранный план
  启用判定: Включить оценку
  "启用后，扫描到已锁定装备时直接保留，不进入调律、重置或回收流程。": "При включении найденное при сканировании заблокированное снаряжение сохраняется как есть и не проходит настройку, сброс или разбор."
  "启用后，每实际开始调律 5 件装备时重新读取律准石；有效读数与缓存相差超过 1 个大律准石时记录错误日志。": "При включении повторно считывает камни настройки каждые 5 фактически настраиваемых предметов; если показание отличается от кэша более чем на 1 большой камень, записывает ошибку в журнал."
  "启用后，首次识别数量低于设定值时要求人工确认。": "При включении требует подтверждения, если при первом сканировании распознано меньше заданного значения."
