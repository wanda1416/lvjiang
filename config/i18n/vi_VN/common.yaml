  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Tạo mã WF DSL dễ đọc và chỉnh sửa trực tiếp. Khi dừng ghi, các thao tác nhấn/giữ/thả phím và thời gian chờ tiếp theo sẽ được gộp khi an toàn; di chuyển chuột liên tục và khoảng chờ ngắn được gộp theo độ mịn khoảng 100ms. Phù hợp với thao tác giao diện thông thường và chỉnh sửa thủ công, không phù hợp với xoay góc nhìn trò chơi đòi hỏi phát lại chính xác từng sự kiện đầu vào gốc.
