  清除选择: Effacer la sélection
  相邻文字区域在拼图中的间隔。: Espacement entre les zones de texte adjacentes sur le canevas assemblé.
  确定删除规则组「{name}」吗？引用它的工作流将无法执行。: Supprimer le groupe de règles « {name} » ? Les workflows qui y font référence ne pourront plus s'exécuter.
  确定撤销本次所有未保存的清洗规则更改吗？: Annuler toutes les modifications non enregistrées des règles de nettoyage de cette session ?
  确定撤销本次所有未保存的识别配置更改吗？: Annuler toutes les modifications non enregistrées de la configuration de reconnaissance de cette session ?
