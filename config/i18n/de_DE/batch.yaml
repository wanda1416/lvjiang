batch:
  "* 表示当前用户使用独立参数\n": "* bedeutet, dass dieser Benutzer eigene Parameter verwendet\n"
  <b>选择执行单元</b>: <b>Ausführungseinheiten auswählen</b>
  <b>选择执行脚本</b>: <b>Skripte auswählen</b>
  Profile 定义不可用: Profildefinitionen nicht verfügbar
  Profile 定义已不存在: Profildefinitionen existieren nicht mehr
  "[批量] 以下已勾选脚本当前不可用，本次不会执行：": "[Stapel] Die folgenden ausgewählten Skripte sind derzeit nicht verfügbar und werden nicht ausgeführt:"
  '{name}（已失效）': '{name} (veraltet)'
  不指定: Nicht festgelegt
  人: Benutzer
  人无数值，置于末尾: Benutzer ohne Wert werden ans Ende gestellt
  全局任务参数: Globale Aufgabenparameter
  "单个执行单元时跳过上述生命周期工作流": "Obige Lebenszyklus-Workflows bei nur einer Ausführungseinheit überspringen"
  单元: Einheiten
  单元候选: Einheitenkandidaten
  单元候选（{key}）: Einheitenkandidaten ({key})
  单元候选（用户名）: Einheitenkandidaten (Benutzername)
  可见任务: Sichtbare Aufgaben
  可见用户: Sichtbare Benutzer
  "定义主页面右键「按 Profile 排序」用哪个键、什么方向。排完的顺序只属于本次运行，不写回这里": "Legt fest, welchen Profilschlüssel und welche Richtung „Nach Profil sortieren“ im Kontextmenü des Hauptfensters verwendet. Die sortierte Reihenfolge gilt nur für diesen Lauf und wird hier nicht zurückgeschrieben"
  "实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流": "Wenn tatsächlich nur eine Benutzereinheit ausgewählt ist, Aufgaben direkt ohne Lebenszyklus-Workflows ausführen"
  "实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流": "Wenn tatsächlich nur eine Benutzereinheit ausgewählt ist, Aufgaben direkt ausführen; Attributeinheiten führen immer den Vorbereitungs-Workflow aus"
  "对应的任务脚本已不存在；取消勾选并保存即可从列表移除": "Das zugehörige Aufgabenskript existiert nicht mehr; Häkchen entfernen und speichern, um es aus der Liste zu entfernen"
  工作流文件 (*.wf): Workflow-Dateien (*.wf)
  已按 Profile 排序用户: Benutzer nach Profil sortiert
  异常恢复: Fehlerwiederherstellung
  "当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。": "Planung nach „{key}“, aber der Eintragsvorbereitungs-Workflow „{wf}“ wählt keinen Benutzernamen für diese Einheit aus und gibt ihn nicht zurück. Verwenden Sie batch/prepare_item_by_attr.wf oder deklarieren Sie #% batch_unit_prepare: true in Ihrem eigenen Workflow und geben Sie username zurück."
  "当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。": "Planung nach Attribut aktiv; konfigurieren Sie zuerst den Eintragsvorbereitungs-Workflow unter „Werkzeuge → Stapelkonfiguration“."
  恢复默认顺序: Standardreihenfolge wiederherstellen
  "手机端正在执行任务，请暂停或者结束任务": "Auf dem Telefon läuft gerade eine Aufgabe; bitte pausieren oder beenden Sie sie zuerst"
  "手机端正在执行任务，请暂停或者结束任务。\n\n设备返回：{detail}": "Auf dem Telefon läuft gerade eine Aufgabe; bitte pausieren oder beenden Sie sie zuerst.\n\nGeräteantwort: {detail}"
  "执行用户：{username}\n参数来源：{source}": "Ausgeführter Benutzer: {username}\nParameterquelle: {source}"
  "执行用户：{username}\n点击查看本轮任务参数": "Ausgeführter Benutzer: {username}\nKlicken, um die Aufgabenparameter dieser Runde anzuzeigen"
  执行顺序: Ausführungsreihenfolge
  批量设置: Stapeleinstellungen
  批量配置: Stapelkonfiguration
  "拖动可临时调整实际执行顺序": "Ziehen, um die tatsächliche Ausführungsreihenfolge vorübergehend anzupassen"
  "拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序": "Ziehen, um die tatsächliche Ausführungsreihenfolge anzupassen; Rechtsklick zum Wiederherstellen der Standardreihenfolge, Mischen oder Sortieren nach Profil; die Reihenfolge in der Stapelkonfiguration dient nur als Startreihenfolge"
  "拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序": "Ziehen, um die tatsächliche Ausführungsreihenfolge anzupassen; Rechtsklick zum Wiederherstellen der Standardreihenfolge oder zum zufälligen Mischen; die Reihenfolge in der Stapelkonfiguration dient nur als Startreihenfolge"
  "拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序": "Ziehen, um die tatsächliche Ausführungsreihenfolge anzupassen; Rechtsklick zum Wiederherstellen der Standardreihenfolge oder zum Mischen; die Reihenfolge in der Stapelkonfiguration dient nur als Startreihenfolge"
  指定顺序排序: Nach festgelegter Reihenfolge sortieren
  "按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择": "Bei Planung nach Attribut nicht anwendbar: Ein Attributwert kann mehreren Benutzern entsprechen, daher muss der Eintragsvorbereitungs-Workflow den Benutzernamen auswählen und zurückgeben, sodass der Lebenszyklus immer ausgeführt wird. Ein Wechsel zurück zu „Benutzername“ stellt Ihre ursprüngliche Auswahl wieder her"
  "按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义": "Legt fest, ob nach Benutzername oder nach einem Profilattribut geplant wird. Dies bestimmt die Kandidatenliste im Hauptfenster, den Lebenszyklus-Vertrag und die Gültigkeit des Vorbereitungs-Workflows – gehört daher zur Konfigurationsgruppe"
  "排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行": "Der Sortierschlüssel gehört zur Konfigurationsgruppe; im Kontextmenü der Benutzerliste „Nach Profil sortieren“ einmalig ausführen – die sortierte Reihenfolge gilt nur für diesen Lauf"
  新建配置: Neue Konfiguration
  "无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选": "Bringt das Spiel nach einer unerwarteten Pause im unbeaufsichtigten Betrieb zurück zum Anmeldebildschirm. Das Kontrollkästchen „Unbeaufsichtigt“ im Hauptfenster kann erst nach dieser Konfiguration aktiviert werden"
  无法开始批量任务: Stapellauf kann nicht gestartet werden
  "暂无启用的单元，请到「单元」页勾选": "Keine aktivierten Einheiten; wählen Sie auf der Seite „Einheiten“ welche aus"
  "暂无配置组，请先通过「工具 → 批量配置」添加": "Keine Konfigurationsgruppen vorhanden; fügen Sie zuerst eine unter „Werkzeuge → Stapelkonfiguration“ hinzu"
  "本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互": "Aktivieren, wenn das Gerät längere Zeit unbeaufsichtigt läuft: Bei einer unerwarteten Pause wartet die Aufgabe nicht mehr, sondern wird als fehlgeschlagen erfasst und übersprungen; anschließend bringt der Wiederherstellungs-Workflow der Gruppe das Spiel zum Anmeldebildschirm zurück und die nächste Aufgabe startet. Bestätigungen, Eingaben und Auswahlen warten weiterhin auf Benutzereingaben"
  条目准备: Eintragsvorbereitung
  "条目准备工作流不支持当前属性调度，请到批量配置中修改": "Der Eintragsvorbereitungs-Workflow unterstützt die aktuelle Attributplanung nicht; bitte in der Stapelkonfiguration ändern"
  条目收尾: Eintragsabschluss
  浏览...: Durchsuchen...
  点击查看本轮任务参数: Klicken, um die Aufgabenparameter dieser Runde anzuzeigen
  用户独立参数: Benutzerspezifische Parameter
  确定删除当前批量配置吗？: Aktuelle Stapelkonfiguration wirklich löschen?
  "第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序": "Die erste Spalte bestimmt die Sichtbarkeit im Hauptfenster, die zweite legt fest, ob der Eintrag beim ersten Laden oder bei „Standard wiederherstellen“ ausgewählt ist; ziehen zum Anpassen der Startreihenfolge"
  脚本: Skript
  脚本候选: Skriptkandidaten
  "请到「单元」页至少勾选一个执行单元": "Wählen Sie auf der Seite „Einheiten“ mindestens eine Ausführungseinheit aus"
  请到「脚本」页至少勾选一个脚本: Wählen Sie auf der Seite „Skripte“ mindestens ein Skript aus
  "请在「工具 → 批量配置」中配置条目准备工作流": "Konfigurieren Sie den Eintragsvorbereitungs-Workflow unter „Werkzeuge → Stapelkonfiguration“"
  请至少勾选一个脚本: Bitte mindestens ein Skript auswählen
  请选择 workflows 目录下的 .wf 文件: Bitte eine .wf-Datei im Verzeichnis workflows auswählen
  "调度单元属于配置组定义，在「工具 → 批量配置」中修改": "Die Planungseinheit gehört zur Konfigurationsgruppe und wird unter „Werkzeuge → Stapelkonfiguration“ geändert"
  选择工作流文件: Workflow-Datei auswählen
  配置名称已存在: Konfigurationsname existiert bereits
  重命名配置: Konfiguration umbenennen
  随机打乱顺序: Reihenfolge mischen
  "需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页": "Konfigurieren Sie zuerst den „Wiederherstellungs-Workflow“ für diese Gruppe unter „Werkzeuge → Stapelkonfiguration“: Der unbeaufsichtigte Modus benötigt ihn, um das Spiel nach einer unerwarteten Pause zum Anmeldebildschirm zurückzubringen"
  默认执行: Standardmäßig ausführen
  配置名称: Konfigurationsname
  "安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置": "Bei Android-Zielen darf ein Stapellauf im Hochformat starten, sofern Breite und Höhe vertauscht dem Seitenverhältnis der Layout-Leinwand entsprechen. Nach dem Start bringt der „Wiederherstellungs-Workflow“ der Gruppe das Spiel zum Anmeldebildschirm zurück, danach führt der „Eintragsvorbereitungs-Workflow“ wieder ins Spiel. Beide Workflows werden unter „Werkzeuge → Stapelkonfiguration“ eingerichtet"
  "需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏": "Konfigurieren Sie zuerst sowohl den „Wiederherstellungs-Workflow“ als auch den „Eintragsvorbereitungs-Workflow“ für diese Gruppe unter „Werkzeuge → Stapelkonfiguration“: Ein Start im Hochformat bringt das Spiel zuerst zum Anmeldebildschirm zurück; ohne Eintragsvorbereitung kann nicht wieder ins Spiel gewechselt werden"
  允许竖屏需要先配置条目准备工作流: Start im Hochformat erfordert einen Eintragsvorbereitungs-Workflow
  "「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。": "„Hochformat erlauben“ lässt den Client beim Start zuerst über den Wiederherstellungs-Workflow zum Anmeldebildschirm zurückkehren und benötigt anschließend den Eintragsvorbereitungs-Workflow, um wieder ins Spiel zu gelangen. Konfigurieren Sie zuerst den Eintragsvorbereitungs-Workflow für diese Gruppe unter „Werkzeuge → Stapelkonfiguration“."
  上一轮: Vorherige Runde
  下一轮: Nächste Runde
  第 {round}/{rounds} 轮: Runde {round}/{rounds}
  "跳到最新一轮并持续跟随；按下表示正在跟随": "Zur neuesten Runde springen und weiter folgen; gedrückt bedeutet aktives Folgen"
  全局参数: Globale Parameter
  编辑范围: Bearbeitungsbereich
  用户：{name}: 'Benutzer: {name}'
  勾选的脚本没有可配置的任务参数: Die ausgewählten Skripte haben keine konfigurierbaren Aufgabenparameter
  "改动立即生效，与日常任务共用同一份参数": "Änderungen gelten sofort und teilen dieselben Parameter mit den täglichen Aufgaben"
