  "筛选已生效，但保存到用户资料失败：{error}\n\n本次浏览不受影响，下次操作会再尝试保存。": "การกรองมีผลแล้ว แต่บันทึกลงโปรไฟล์ผู้ใช้ไม่สำเร็จ: {error}\n\nการดูครั้งนี้ไม่ได้รับผลกระทบ การทำงานครั้งถัดไปจะลองบันทึกใหม่"
  "紫装区\n回收累计返还": "โซนอุปกรณ์สีม่วง\nยอดคืนสะสมจากการย่อย"
