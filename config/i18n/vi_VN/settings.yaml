  "总览设置": "Cài đặt tổng quan"
  "用户总览内容字号": "Cỡ chữ nội dung tổng quan"
  "用户信息内容字号": "Cỡ chữ nội dung thông tin người dùng"
  "全局热键": "Phím tắt toàn cục"
  "系统级全局热键，保存后立即生效。": "Phím tắt toàn cục cấp hệ thống, có hiệu lực ngay sau khi lưu."
  "菜单快捷键": "Phím tắt menu"
  "仅在窗口内生效，窗口失焦时不抢游戏按键。": "Chỉ hoạt động khi cửa sổ đang được chọn, không chiếm phím game khi mất tiêu điểm."
  界面语言: Ngôn ngữ giao diện
  留空自动解析 Launcher: Để trống để tự động phân giải Launcher
  目标环境决定 DSL 中 env() 的返回值，用于区分 PC 游戏与手游的导航策略。指游戏运行的目标环境，非本机系统环境。: "Môi trường đích quyết định giá trị trả về của env() trong DSL, dùng để phân biệt chiến lược điều hướng giữa game PC và game di động. Đây là môi trường nơi trò chơi chạy, không phải hệ điều hành của máy này."
  "确定删除方案「{name}」吗？": "Bạn có chắc muốn xóa phương án \"{name}\" không?"
  空串不自动定位窗口: Để trống để tắt tự động định vị cửa sổ
  竖屏: Dọc
  等待参数: Tham số chờ
  等待范围(秒): Khoảng chờ (giây)
  管理员权限: Quyền quản trị viên
  系统参数: Tham số hệ thống
  网络与隐私: "Mạng & Quyền riêng tư"
  获取信息: Lấy thông tin
  获取连接信息: Lấy thông tin kết nối
  该热键只在「脚本编辑」工作台打开期间临时全局注册，对话框关闭后立即注销；其余热键在软件运行期间始终生效。: "Phím tắt này chỉ được đăng ký toàn cục tạm thời khi bàn làm việc \"Chỉnh sửa script\" đang mở và hủy ngay khi đóng hộp thoại; các phím tắt khác luôn có hiệu lực khi phần mềm đang chạy."
  请先粘贴激活码: Vui lòng dán mã kích hoạt trước
  读不到硬件标识（非 Windows 平台）: Không đọc được định danh phần cứng (không phải nền tảng Windows)
  越界坐标自动截断: Tự động cắt tọa độ vượt biên
  连接方案: Phương án kết nối
  连接端侧执行时自动启动 Shizuku 服务: Tự động khởi chạy dịch vụ Shizuku khi kết nối ở chế độ trên thiết bị
  部分激活码不绑定机器，直接粘贴即可，不需要提供序列号。: "Một số mã kích hoạt không ràng buộc máy, chỉ cần dán trực tiếp mà không cần cung cấp số sê-ri."
  重置匿名标识: Đặt lại định danh ẩn danh
  重置后服务端会把你当成一个新用户，之前的记录无法再与新标识关联。确定重置吗？: "Sau khi đặt lại, máy chủ sẽ coi bạn như người dùng mới và các bản ghi trước đó không thể liên kết với định danh mới nữa. Bạn có chắc muốn đặt lại không?"
  重置标识: Đặt lại định danh
  重试间隔（秒）: Khoảng cách thử lại (giây)
  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: "Khi cần mã kích hoạt ràng buộc máy này, hãy gửi chuỗi số sê-ri này cho tác giả. Mã được tính từ định danh bo mạch chủ mỗi lần khởi động, không lưu vào đĩa và không chứa thông tin phần cứng nào có thể đảo ngược."
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: "Số lần này dùng chung cho lần thiết lập luồng video đầu tiên và tự động khôi phục sau khi ngắt kết nối; khi dùng hết sẽ chờ xử lý thủ công, không tự hủy tác vụ."
  首次窗口定位后可自动获取: Có thể tự động lấy sau lần định vị cửa sổ đầu tiên
  高级设置: Cài đặt nâng cao
  ? "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。"
  : "Mặc định thử tạo luồng video 5 lần, nếu thất bại sẽ kết nối lại tác nhân 5 lần và ADB 5 lần, cách nhau 2 giây. Nếu vẫn không khả dụng sẽ chờ xử lý thủ công không giới hạn: chọn Có để kiểm tra lại, chọn Không để dừng tác vụ tương ứng; đóng hộp thoại sẽ không dừng tác vụ và biểu ngữ phía trên vẫn giữ nguyên.\nKhông hạ cấp cử chỉ đa điểm và cử chỉ đồng thời. Không tự động gửi lại thao tác khi không chắc đã thực thi hay chưa. Cài đặt áp dụng cho các tác vụ khởi chạy sau."
  鼠标/触控移动到目标位置的耗时: Thời gian di chuyển chuột/chạm tới vị trí mục tiêu
  鼠标移动时长(秒): Thời lượng di chuyển chuột (giây)
  坐标越界处理: Xử lý tọa độ vượt biên
  坐标随机偏移(px): Độ lệch tọa độ ngẫu nhiên (px)
  当前标识: Định danh hiện tại
