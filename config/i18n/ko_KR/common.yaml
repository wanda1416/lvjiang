  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: 읽고 직접 편집할 수 있는 WF DSL을 생성합니다. 녹화 중지 시 안전하게 병합할 수 있는 키 누름/유지/해제와 후속 대기가 병합되며, 연속 마우스 이동과 짧은 대기는 약 100ms 단위로 묶입니다. 일반 UI 조작과 추후 수동 조정에 적합하며, 원본 입력 이벤트의 정밀 재생이 필요한 게임 카메라 회전에는 적합하지 않습니다.
