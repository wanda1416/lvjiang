  当前设备ID：{id}: 現在の端末 ID：{id}
  （请勿随意向他人泄露该 id，这是重置密码的唯一凭据）: （この ID を他人に教えないでください。パスワードリセット時の唯一の認証情報です）
  请先点「初始同步」建立同步状态: 先に「初回同期」をクリックして同期状態を確立してください
  请输入密码: パスワードを入力してください
  请输入账户: アカウントを入力してください
  读取本机总览失败：{error}: ローカル概要の読み込みに失敗しました：{error}
  账户: アカウント
  这是本机：下线后需要重新登录。: これはこの端末です：ログアウト後は再ログインが必要です。
  进度: 進捗
  退出所有设备: すべての端末からログアウト
  退出登录: ログアウト
  通道: チャンネル
  隐藏密码: パスワードを隠す
  "首次使用：建立本机与云端的同步状态。云端已有数据时，会先把本地\n用户、总览定义与总览数据备份到 config/session/_backup-* 再拉取云端。": "初回利用：この端末とクラウドの同期状態を確立します。クラウドに既存データがある場合は、先にローカルの\nユーザー、概要定義、概要データを config/session/_backup-* にバックアップしてからクラウドを取得します。"
  ；等 {} 项: ；ほか {} 件
  已恢复每分钟自动同步: 毎分の自動同期を再開しました
  已暂停自动同步；手动「立即同步」仍可用: 自動同期を一時停止しました。手動の「今すぐ同期」は引き続き利用できます
  恢复同步: 同期を再開
  暂停同步: 同期を一時停止
  暂停后不再每分钟自动同步（心跳与在线状态不受影响）。手动「立即同步」仍可用；重启后保持暂停状态。: 一時停止すると毎分の自動同期が停止します（ハートビートとオンライン状態には影響しません）。手動の「今すぐ同期」は引き続き利用でき、再起動後も一時停止状態が維持されます。
