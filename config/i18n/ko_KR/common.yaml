  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: 최초 비디오 스트림 설정과 연결 끊김 후 자동 복구가 이 횟수를 공유합니다. 모두 소진되면 작업을 자동으로 포기하지 않고 수동 처리를 기다립니다.
  首次窗口定位后可自动获取: 최초 창 위치 지정 후 자동으로 채워집니다
  高级设置: 고급 설정
  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : '기본값은 비디오 스트림 연결 5회이며 실패 시 에이전트 5회, ADB 5회를 2초 간격으로 재연결합니다. 그래도 연결되지 않으면 시간 제한 없이 수동 처리를 기다립니다(''예''로 다시 확인, ''아니요''로 해당 작업 중지; 알림을 닫아도 작업은 중지되지 않으며 상단 배너가 유지됩니다).

    멀티터치와 동시 제스처는 강등되지 않으며, 실행 여부가 불확실한 입력은 자동으로 재전송하지 않습니다. 설정은 이후 시작되는 작업부터 적용됩니다.'
