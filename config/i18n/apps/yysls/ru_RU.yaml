  "装备至少完成一轮调律后，若词条已满且明确命中\n“继续调律或锁定”规则，并且传入规则的最终评级达到\n优秀或顶级，返回装备详情页后自动锁定。\n无规则命中只结束并保留，不会自动锁定。\n已锁定装备不会再点击，避免误解锁。": "После хотя бы одного раунда настройки, если аффиксы заполнены и чётко сработало\nправило «Продолжить настройку или заблокировать», а итоговая оценка переданных правил\nдостигла «Отлично» или «Топ», предмет автоматически блокируется на странице деталей.\nБез совпадения правил предмет просто оставляется без блокировки.\nЗаблокированное снаряжение повторно не нажимается во избежание случайной разблокировки."
