  建立流式传输尝试次数: Попытки запуска видеопотока
  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'Что делать, если вычисленные движком координаты нажатия или перетаскивания выходят за пределы кадра.

    Снято (по умолчанию): выдать ошибку и остановить запуск — выход за границы означает несоответствие параметров сдвига геометрии панели, а тихое обрезание превратит «прокрутку на две строки» в «одну строку» незаметно для скрипта и журнала.

    Включено: движок обрезает координаты по границе кадра, записывает предупреждение и продолжает выполнение.

    Проверка выполняется на уровне движка: жесты на устройстве жёстко отклоняют такие координаты, а ввод на ПК и adb shell input молча их принимают.'
  当前标识：未生成（未开启）: 'Текущий ID: не создан (отключено)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: После перезагрузки телефона служба Shizuku останавливается, а задачи с перезапуском игры зависят от неё. При включении служба автоматически проверяется и запускается один раз при подключении в режиме на устройстве (только если ещё не запущена).
  执行参数: Параметры выполнения
  把激活码粘贴到这里，换行和空格会被自动忽略: Вставьте код активации сюда; переносы строк и пробелы игнорируются
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Получать официальные обновления конфигураций и задач для текущей версии приложения; после проверки они применяются при следующем запуске. Локальные настройки всегда имеют приоритет; текущие задачи продолжают использовать уже загруженную конфигурацию. При отключении или переходе в автономный режим при следующем запуске восстановятся встроенные настройки, а контент участника будет скрыт без удаления локальных данных.
