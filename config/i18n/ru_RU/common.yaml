about:
  仅限非商业使用: Только для некоммерческого использования
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: Этот проект предназначен исключительно для обучения и технических исследований. Использование инструментов автоматизации в играх может нарушать пользовательское соглашение соответствующей игры; пользователь несёт полную ответственность за последствия.
  本项目源码公开、免费使用: Открытый исходный код и бесплатное использование
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: Захват окна → разметка областей → OCR → выполнение рабочего процесса
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: ПО предоставляется «как есть», без каких-либо гарантий; автор не несёт ответственности за любой ущерб, вызванный его использованием.
  通用视觉 RPA 引擎: Универсальный визуальный движок RPA
