  区域批量识别: Пакетное распознавание областей
  ? '区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。

    这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。'
  : 'Пакетное распознавание объединяет несколько текстовых областей на одном холсте и вызывает OCR один раз.

    Эти параметры задают размер холста; после сохранения они применяются со следующего распознавания.'
  原始文本: Исходный текст
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: В настройках распознавания есть несохранённые изменения. Выйти и отменить их?
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*): Изображения (*.png *.jpg *.jpeg *.bmp *.webp);;Все файлы (*)
  已撤销未保存的清洗规则修改: Несохранённые изменения правил очистки отменены
  已撤销未保存的识别配置修改: Несохранённые изменения настроек распознавания отменены
  已清除选框: Выделение снято
  拼图画布宽、高的最小值。过小会使窄区域被 OCR 检测器大幅放大。: Минимальная ширина и высота объединённого холста. При слишком малом значении узкие области сильно масштабируются детектором OCR.
  撤销清洗规则: Отменить изменения правил очистки
  撤销识别配置: Отменить изменения настроек распознавания
