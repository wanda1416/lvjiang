  每个应用可同时绑定 Android 与 Windows。运行时按当前实际连接目标选择绑定，与工作流环境无关；连接后可用对应的「获取连接信息」自动回填。: Cada aplicación puede vincular Android y Windows a la vez. En ejecución se elige la vinculación según el objetivo conectado, independientemente del entorno del flujo; tras conectar, puedes rellenarlo automáticamente con «Obtener información de conexión».
  每次点击前的随机等待，模拟人类反应时间: Espera aleatoria antes de cada clic para simular el tiempo de reacción humano
