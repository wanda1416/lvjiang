# 工作流注册配置
#
# 简单工作流只需在此声明 wf_file 和所需场景，即可在 GUI 下拉列表中选择执行。
# 复杂工作流通过 Python Workflow 实例在代码启动时自注册，不在此文件中声明。

flows:
  - id: equip_analysis
    name: 毕业率分析
    wf_file: equip_analysis.wf
    required_scenes:
      - bag_equip_detail
      - equip_weapon_detail
      - equip_armor_detail

  - id: single_tuning
    name: 单件装备调律
    wf_file: single_tuning.wf
    required_scenes:
      - game_main_page
      - game_menu_page
      - bag_equip_detail
      - equip_weapon_detail
      - equip_armor_detail
      - equip_tune_detail
      - equip_tune_result
    parameters:
      - name: target_material
        label: 目标材料
        type: select
        default: "紫色狗粮"
        options:
          - { value: "", label: "不添加" }
          - { value: "紫色狗粮", label: "紫色狗粮" }
          - { value: "金色狗粮", label: "金色狗粮" }
          - { value: "彩色狗粮", label: "彩色狗粮" }
      - name: equip_slot
        label: 装备部位
        type: select
        default: "slot_main_weapon"
        options:
          - { value: "slot_main_weapon", label: "主武器" }
          - { value: "slot_sub_weapon", label: "副武器" }
          - { value: "slot_ring", label: "戒指" }
          - { value: "slot_pendant", label: "吊坠" }
          - { value: "slot_head", label: "头部" }
          - { value: "slot_chest", label: "胸部" }
          - { value: "slot_leg", label: "腿部" }
          - { value: "slot_wrist", label: "腕部" }
      - name: bag_row
        label: 背包行号
        type: select
        default: "1"
        options: ["1", "2", "3"]
      - name: bag_col
        label: 背包列号
        type: select
        default: "1"
        options: ["1", "2", "3", "4", "5", "6"]

  - id: move_forward_test
    name: 向前移动测试
    wf_file: move_forward_test.wf
    required_scenes:
      - game_main_page
