  获取连接信息: Verbindungsinfo abrufen
  该热键只在「脚本编辑」工作台打开期间临时全局注册，对话框关闭后立即注销；其余热键在软件运行期间始终生效。: Dieser Hotkey wird nur temporär global registriert, solange die „Skript-Editor“-Arbeitsfläche geöffnet ist, und beim Schließen sofort deregistriert; alle übrigen Hotkeys bleiben während der gesamten Laufzeit aktiv.
  请先粘贴激活码: Bitte fügen Sie zuerst einen Aktivierungscode ein
