name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows 视觉自动化工具，与目标平台保持一致；Qt offscreen 开箱即用
    # windows-latest 已升至 Server 2025，ONNX Runtime 不支持；锁定 2022
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8  # runner 默认 GBK 代码页，避免中文日志 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      # ruff 覆盖源码、测试与仍受支持的仓库辅助脚本。
      - name: Lint (ruff)
        run: python -m ruff check src tests scripts

      # mypy 覆盖 src；Mixin 架构的全局错误码豁免见 pyproject.toml。
      - name: Type check (mypy)
        run: python -m mypy

      - name: Run tests
        run: >-
          python -m pytest tests
          --cov=lvjiang
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
