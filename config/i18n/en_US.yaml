  输入参数: Input Parameters
  越界坐标自动截断: Auto-truncate out-of-bounds coordinates
  '坐标越界处理:': 'Out-of-bounds handling:'
  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'What to do when a click/drag coordinate computed by the engine falls outside the captured frame.

    Unchecked (default): raise an error and end the run — out of bounds means the script''s drag distance does not match the current panel geometry, and silently truncating turns "scroll two rows" into "scroll one row" with nothing in the script or the log to show it.

    Checked: the engine truncates to the frame edge, logs a warning and keeps running.

    The check lives in the engine: on-device gestures reject such coordinates outright while desktop input and adb shell input accept them silently, so the backends cannot be relied on.'
  'Android 连接设置': 'Android Connection Settings'
  '建立流式传输尝试次数': 'Video Stream Attempts'
  '首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。': 'Used for both the initial stream setup and automatic recovery after a disconnect. Once exhausted the task waits for manual handling and never gives up by itself.'
  "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。": "By default the video stream is set up 5 times, then the agent is reconnected 5 times and ADB 5 times, 2 s apart. If it still fails, the task waits for manual handling with no timeout: Yes re-checks, No stops the task; closing the prompt does not stop it and the banner stays.\nMulti-touch and concurrent gestures are not downgraded. Inputs that may already have been sent are never replayed automatically. Applies to tasks started afterwards."
