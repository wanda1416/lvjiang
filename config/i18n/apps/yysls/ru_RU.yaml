  判定精准: Расчётная точность
  "判定精准、判定会心、判定会意取面板黄字；直接会心、直接会意不受抗性。": "Расчётные точность, крит и созвучие берутся из жёлтых значений панели; прямой крит и прямое созвучие не зависят от сопротивления."
  "判定顺序：垃圾 → 一般 → 优秀 → 顶级，命中即定档": "Порядок оценки: Мусор → Обычное → Отлично → Топ; первое совпадение задаёт ранг"
