  执行被停止: Thực thi đã bị dừng
  批次准备: Chuẩn bị lô
  批次收尾: Kết thúc lô
  批量可执行性子过程必须返回 dict: Thủ tục con kiểm tra khả năng chạy hàng loạt phải trả về dict
  批量可执行性检查只支持 DSL 工作流: Kiểm tra khả năng chạy hàng loạt chỉ hỗ trợ quy trình DSL
  生命周期 wf 必须返回 dict 或 null: Quy trình vòng đời phải trả về dict hoặc null
