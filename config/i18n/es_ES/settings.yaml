  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'Qué hacer cuando una coordenada de clic o arrastre calculada por el motor queda fuera del fotograma.

    Sin marcar (predeterminado): lanza un error y detiene la ejecución; salir de límites indica que el desplazamiento del script no coincide con la geometría actual del panel, y recortar en silencio convertiría «desplazar dos filas» en «desplazar una» sin dejar rastro.

    Marcado: el motor recorta al borde de la pantalla, registra una advertencia y continúa.

    La comprobación se hace en el motor: los gestos de accesibilidad en dispositivo rechazan la coordenada, mientras que el escritorio y adb shell input la aceptan en silencio.'
  当前标识：未生成（未开启）: 'ID actual: no generado (desactivado)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: Al reiniciar el móvil se detiene el servicio Shizuku, del que dependen las tareas que reinician el juego. Si está activado, al conectar en modo en dispositivo lo detecta e inicia automáticamente una vez (solo si no está en ejecución).
  执行参数: Parámetros de ejecución
  把激活码粘贴到这里，换行和空格会被自动忽略: Pega aquí el código de activación; los saltos de línea y espacios se ignoran automáticamente
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Recibe actualizaciones oficiales de configuración y tareas compatibles con la versión actual de la app; tras verificarse se aplican al próximo inicio. Tu configuración local siempre tiene prioridad y las tareas en curso siguen usando lo ya cargado. Al desactivar esta opción o activar el modo sin conexión, el próximo inicio restaurará el contenido preinstalado y retirará el de miembro sin tocar tus datos locales.
