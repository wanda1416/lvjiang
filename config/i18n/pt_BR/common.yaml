  ⚠ 画面流中断：处理后点「重新检查」继续；无法恢复请按 F10 停止任务: '⚠ Transmissão de tela interrompida: resolva e clique em "Verificar novamente" para continuar; se não puder recuperar, pressione F10 para parar a tarefa'
  ⚠ 画面流已中断：点「重新检查」重试，或断开重连设备: '⚠ Transmissão de tela interrompida: clique em "Verificar novamente" para tentar de novo ou desconecte e reconecte o dispositivo'
