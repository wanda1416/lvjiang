  同步布局: Layouts synchronisieren
  "将更新脚本、布局和用户数据；总览数据不随包下发，由手机账号云端同步。": "Aktualisiert Skripte, Layouts und Benutzerdaten; Übersichtsdaten werden nicht im Paket übertragen, sondern über die Cloud des Telefonkontos synchronisiert."
