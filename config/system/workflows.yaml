# 工作流注册配置
#
# 简单工作流只需在此声明 wf_file 和所需场景，即可在 GUI 下拉列表中选择执行。
# 复杂工作流通过 Python Workflow 实例在代码启动时自注册，不在此文件中声明。

flows:
  - id: equip_analysis
    name: 当前装备分析
    wf_file: equip_analysis.wf
    required_scenes:
      - bag_equip_detail
      - equip_weapon_detail
      - equip_armor_detail

  - id: single_tuning
    name: 单件装备调律
    wf_file: single_tuning.wf
    required_scenes:
      - game_main_page
      - game_menu_page
      - bag_equip_detail
      - equip_weapon_detail
      - equip_armor_detail
      - equip_tune_detail
      - equip_tune_result
    parameters:
      - name: target_material
        label: 目标材料
        type: select
        default: "紫狗粮"
        options:
          - { value: "", label: "不添加" }
          - { value: "紫狗粮", label: "紫狗粮" }
          - { value: "金狗粮", label: "金狗粮" }
          - { value: "彩狗粮", label: "彩狗粮" }
      - name: equip_slot
        label: 装备部位
        type: select
        default: "main_weapon"
        options:
          - { value: "main_weapon", label: "主武器" }
          - { value: "sub_weapon", label: "副武器" }
          - { value: "ring", label: "环" }
          - { value: "pendant", label: "佩" }
          - { value: "head", label: "头部" }
          - { value: "chest", label: "胸部" }
          - { value: "leg", label: "腿部" }
          - { value: "wrist", label: "腕部" }
      - name: bag_row
        label: 背包行号
        type: select
        default: "1"
        options: ["1", "2", "3"]
      - name: bag_col
        label: 背包列号
        type: select
        default: "1"
        options: ["1", "2", "3", "4", "5", "6"]

  - id: move_forward_test
    name: 向前移动测试
    wf_file: move_forward_test.wf
    required_scenes:
      - game_main_page

  - id: mengzhuzhengfeng
    name: 盟主争锋
    wf_file: mengzhuzhengfeng.wf
    required_scenes:
      - activity_mengzhu
    parameters:
      - name: execute_times
        label: 执行次数
        type: number
        default: 10
        min: 1
        max: 999
