  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Enregistre la chronologie brute du clavier, des boutons de souris, de la molette et des mouvements de souris optionnels. L'enregistrement crée aussi un fichier trace associé dans workflows/lvtrace pour un timing fidèle, adapté aux mouvements de caméra précis. Le texte WF dépend de ce fichier trace et ne peut pas être déplacé seul.
