  : 'ฟีเจอร์ทดลอง: สคริปต์จำนวนมากยังไม่สามารถรันผ่านในโหมดนี้ได้ จึงไม่รับแจ้งปัญหาใช้งานไม่ได้ การจับภาพพื้นหลังช่วยให้จับภาพหน้าต่างเกมได้แม้ถูกหน้าต่างอื่นบัง แต่ช้ากว่าการจับภาพเบื้องหน้าเล็กน้อย ต้องใช้อินพุตพื้นหลังร่วมกัน และทั้งสองแบบจะจับภาพไม่ได้เมื่อย่อหน้าต่าง ค่าที่นี่เป็นค่าเริ่มต้น: หน้าหลักจะติ๊ก «จับภาพพื้นหลัง» อัตโนมัติหลังติ๊ก «โหมดพื้นหลัง» เท่านั้น และยังเปลี่ยนได้ตลอดเวลาในรอบการรัน'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'ฟีเจอร์ทดลอง: มือถือต้องติดตั้งแอป LvJiang และเปิดบริการการเข้าถึง เปลี่ยนเฉพาะช่องทางคลิกและปัด ไม่เปลี่ยนวิธีจับภาพ หากเชื่อมต่อไม่สำเร็จจะย้อนกลับไปใช้ ADB shell input'
