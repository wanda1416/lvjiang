  其他连接: Otras conexiones
  协议: Protocolo
  协议不匹配会直接连不上。{newer}端较新，请升级另一边: Una incompatibilidad de protocolo impide la conexión. El lado de {newer} es más reciente; actualiza el otro extremo
  协议版本: Versión del protocolo
  协议版本不匹配，无法执行手势测试: La versión del protocolo no coincide; no se puede ejecutar la prueba de gestos
  取消下载: Cancelar descarga
  只影响 shell 通道；手势与无障碍截图不需要它: Solo afecta al canal shell; los gestos y las capturas de accesibilidad no lo necesitan
  可选能力，不装也能用无障碍通道: Función opcional; el canal de accesibilidad funciona sin instalarlo
