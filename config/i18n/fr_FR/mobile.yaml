  没有可用的局域网地址：确认本机已连接网络: 'Aucune adresse réseau local disponible : vérifiez que ce PC est connecté au réseau'
  没有已连接的 ADB 设备: Aucun appareil ADB connecté
  ? '测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。

    请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。'
  : 'Le test maintient un appui en bas à gauche de l''écran tout en appuyant deux fois en bas à droite — comme « maintenir le joystick en sautant ».

    Placez le téléphone sur un écran de jeu où le déplacement et le saut sont visibles, puis cliquez sur Lancer le test.'
  版本: Version
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: En cas d'écart de version, le protocole et les configurations intégrées risquent de ne pas correspondre. Mettez à niveau le côté le plus ancien
  用 PC 配置覆盖手机任务参数和用户名册。: Remplace les paramètres de tâches et la liste d'utilisateurs du téléphone par la configuration du PC.
  用 PC 配置覆盖手机批量配置。: Remplace les configurations par lots du téléphone par celles du PC.
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: Scannez avec le téléphone pour télécharger et installer depuis ce PC. Le téléphone doit être sur le même réseau local, sans accès Internet requis.
  ? '用手机扫码，直接从 GitHub 下载安装。

    手机上不了网时，改用右侧「本机共享」。'
  : 'Scannez avec le téléphone pour télécharger et installer directement depuis GitHub.

    Si le téléphone n''a pas accès à Internet, utilisez « Partage local » à droite.'
  由本机提供下载，手机不需要能上网: Le téléchargement est servi par ce PC ; le téléphone n'a pas besoin d'Internet
  电脑: Ordinateur
  确认手机已安装律匠 app、与本机同一局域网或已用 USB 连接，并在 app 内开启无障碍服务: Vérifiez que l'application LvJiang est installée sur le téléphone, connectée au même réseau local ou en USB, et que le service d'accessibilité y est activé
  离线任务: Tâches hors ligne
