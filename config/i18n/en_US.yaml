  '等待画面恢复': 'Waiting for Screen Recovery'
  "{name} 的画面流中断，自动恢复没有成功。\n{error}\n\n请检查手机（是否息屏、游戏是否被切走、USB／无线是否正常）后选择是重新检查；选择否停止该目标任务。关掉本提示不会停止任务，顶部横幅会一直保留。": "The screen stream of {name} was interrupted and automatic recovery failed.\n{error}\n\nCheck the phone (screen off, game switched away, USB or wireless link) and choose Yes to re-check, or No to stop this task. Closing this prompt does not stop the task; the banner stays."
