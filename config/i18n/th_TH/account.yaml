  下列用户的数据将以云端快照为准，本机数据会被覆盖：: 'ข้อมูลของผู้ใช้ต่อไปนี้จะยึดตามสแนปช็อตบนคลาวด์ และข้อมูลในเครื่องจะถูกเขียนทับ:'
  下行: ดาวน์โหลด
  云端基线是空的。<br>来源：{origin}<br>时间：{created}<br>条目：0<br><br>继续将用本机当前总览补上基线，不会备份或替换本地用户。: 'ฐานข้อมูลตั้งต้นบนคลาวด์ว่างเปล่า<br>แหล่งที่มา: {origin}<br>เวลา: {created}<br>รายการ: 0<br><br>หากดำเนินการต่อ จะใช้ภาพรวมปัจจุบันของเครื่องนี้เติมเป็นฐานข้อมูลตั้งต้น โดยไม่สำรองหรือแทนที่ผู้ใช้ในเครื่อง'
  ? 云端已有快照。<br>来源：{origin}<br>时间：{created}<br>条目：{count}{warning}<br><br>继续将先把本地用户、总览定义与总览数据备份到 config/session/_backup-*，再拉取云端数据。
  : 'มีสแนปช็อตบนคลาวด์อยู่แล้ว<br>แหล่งที่มา: {origin}<br>เวลา: {created}<br>รายการ: {count}{warning}<br><br>หากดำเนินการต่อ ระบบจะสำรองผู้ใช้ในเครื่อง นิยามภาพรวม และข้อมูลภาพรวมไปที่ config/session/_backup-* ก่อน แล้วจึงดึงข้อมูลจากคลาวด์'
  修改密码: เปลี่ยนรหัสผ่าน
  修改密码…: กำลังเปลี่ยนรหัสผ่าน…
  创建快照: สร้างสแนปช็อต
  初始同步: ซิงก์เริ่มต้น
  在浏览器中打开注册页面: เปิดหน้าลงทะเบียนในเบราว์เซอร์
  在浏览器打开自助操作页：修改密码、导出数据、清除云端数据、注销账号: 'เปิดหน้าบริการตนเองในเบราว์เซอร์: เปลี่ยนรหัสผ่าน ส่งออกข้อมูล ล้างข้อมูลบนคลาวด์ ลบบัญชี'
  定义: นิยาม
  密码: รหัสผ่าน
  ? '将清空云端的定义、用户、文档与总览数据（账号与登录态保留）。

    此操作不可恢复；本地数据不会被删除。'
  : 'จะล้างข้อมูลนิยาม ผู้ใช้ เอกสาร และภาพรวมบนคลาวด์ทั้งหมด (บัญชีและสถานะเข้าสู่ระบบจะยังคงอยู่)

    การดำเนินการนี้ไม่สามารถย้อนกลับได้ ข้อมูลในเครื่องจะไม่ถูกลบ'
  已取消覆盖：本机数据未改动，profile 同步未启用。: 'ยกเลิกการเขียนทับแล้ว: ข้อมูลในเครื่องไม่เปลี่ยนแปลง และยังไม่ได้เปิดใช้งานการซิงก์โปรไฟล์'
  平台: แพลตฟอร์ม
  当前密码: รหัสผ่านปัจจุบัน
  当前设备不是初始同步设备: อุปกรณ์นี้ไม่ใช่อุปกรณ์ซิงก์เริ่มต้น
  总览: ภาพรวม
  ? '把本机当前全部角色数据上传为云端总览基线。

    初始同步会自动创建一次；之后需要时手动点。'
  : 'อัปโหลดข้อมูลตัวละครทั้งหมดในเครื่องนี้เป็นฐานข้อมูลภาพรวมบนคลาวด์

    การซิงก์เริ่มต้นจะสร้างให้อัตโนมัติหนึ่งครั้ง หลังจากนั้นกดสร้างเองเมื่อต้องการ'
  操作未完成: การดำเนินการไม่เสร็จสมบูรณ์
  数据同步: การซิงก์ข้อมูล
  文档: เอกสาร
  新密码至少 8 位: รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร
  新密码（至少 8 位）: รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)
  显示密码: แสดงรหัสผ่าน
  最近同步时间：{}: 'ซิงก์ล่าสุด: {}'
  最近活跃: ใช้งานล่าสุด
  未知设备: อุปกรณ์ที่ไม่รู้จัก
  检测到云端覆盖待确认；点「立即同步」处理。: ตรวจพบการเขียนทับจากคลาวด์ที่รอยืนยัน กด «ซิงก์ทันที» เพื่อดำเนินการ
  正在修改密码…: กำลังเปลี่ยนรหัสผ่าน…
  正在同步…: กำลังซิงก์…
  正在备份并应用云端快照…: กำลังสำรองข้อมูลและนำสแนปช็อตบนคลาวด์มาใช้…
  正在清除同步…: กำลังล้างการซิงก์…
  正在登录…: กำลังเข้าสู่ระบบ…
  注册: ลงทะเบียน
  清除同步: ล้างการซิงก์
  登出: ออกจากระบบ
  登录: เข้าสู่ระบบ
  登录后可同步角色名册、文档与总览数据: เข้าสู่ระบบเพื่อซิงก์รายชื่อตัวละคร เอกสาร และข้อมูลภาพรวม
  确定让该设备下线？该设备上的全部会话会立即失效。: ต้องการให้อุปกรณ์นี้ออฟไลน์หรือไม่? เซสชันทั้งหมดบนอุปกรณ์นี้จะหมดอายุทันที
  确认后会先把本机 profile 数据备份到 config/session/_sync-backup-<时间戳>/，再应用云端快照；可在该目录恢复。: หลังยืนยัน ระบบจะสำรองข้อมูลโปรไฟล์ในเครื่องไปที่ config/session/_sync-backup-<timestamp>/ ก่อนนำสแนปช็อตบนคลาวด์มาใช้ สามารถกู้คืนจากโฟลเดอร์นั้นได้
  立即同步: ซิงก์ทันที
  自助服务…: บริการตนเอง…
  设备登出: ออกจากระบบอุปกรณ์
  设备管理: จัดการอุปกรณ์
  复制ID: คัดลอก ID
  复制这台设备的 ID；重置密码时管理员凭它核对身份，不要随意泄露: คัดลอก ID ของอุปกรณ์นี้ ผู้ดูแลระบบจะใช้ตรวจสอบตัวตนเมื่อรีเซ็ตรหัสผ่าน ห้ามเปิดเผยแก่ผู้อื่นโดยพลการ
  当前设备ID：{id}: 'ID อุปกรณ์ปัจจุบัน: {id}'
  （请勿随意向他人泄露该 id，这是重置密码的唯一凭据）: (ห้ามเปิดเผย ID นี้แก่ผู้อื่นโดยพลการ นี่เป็นหลักฐานเดียวสำหรับรีเซ็ตรหัสผ่าน)
  请先点「初始同步」建立同步状态: กรุณากด «ซิงก์เริ่มต้น» ก่อนเพื่อสร้างสถานะการซิงก์
  请输入密码: กรุณากรอกรหัสผ่าน
  请输入账户: กรุณากรอกบัญชีผู้ใช้
  读取本机总览失败：{error}: 'อ่านข้อมูลภาพรวมในเครื่องไม่สำเร็จ: {error}'
  账户: บัญชีผู้ใช้
  这是本机：下线后需要重新登录。: 'นี่คือเครื่องปัจจุบัน: หลังออฟไลน์แล้วจะต้องเข้าสู่ระบบใหม่อีกครั้ง'
  进度: ความคืบหน้า
  退出所有设备: ออกจากระบบทุกอุปกรณ์
  退出登录: ออกจากระบบ
  通道: ช่องทาง
  隐藏密码: ซ่อนรหัสผ่าน
  ? '首次使用：建立本机与云端的同步状态。云端已有数据时，会先把本地

    用户、总览定义与总览数据备份到 config/session/_backup-* 再拉取云端。'
  : 'ใช้งานครั้งแรก: สร้างสถานะการซิงก์ระหว่างเครื่องนี้กับคลาวด์ หากบนคลาวด์มีข้อมูลอยู่แล้ว ระบบจะสำรอง

    ผู้ใช้ในเครื่อง นิยามภาพรวม และข้อมูลภาพรวมไปที่ config/session/_backup-* ก่อนดึงข้อมูลจากคลาวด์'
  ；等 {} 项: ' และอีก {} รายการ'
  已恢复每分钟自动同步: กลับมาซิงก์อัตโนมัติทุกนาทีแล้ว
  已暂停自动同步；手动「立即同步」仍可用: หยุดซิงก์อัตโนมัติชั่วคราวแล้ว ยังสามารถกด «ซิงก์ทันที» เองได้
  恢复同步: ซิงก์ต่อ
  暂停同步: หยุดซิงก์ชั่วคราว
  暂停后不再每分钟自动同步（心跳与在线状态不受影响）。手动「立即同步」仍可用；重启后保持暂停状态。: หลังหยุดชั่วคราว ระบบจะไม่ซิงก์อัตโนมัติทุกนาที (ฮาร์ตบีตและสถานะออนไลน์ไม่ได้รับผลกระทบ) ยังกด «ซิงก์ทันที» เองได้ และจะคงสถานะหยุดชั่วคราวหลังรีสตาร์ท
