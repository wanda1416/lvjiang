maps:
  'HUD 场景不存在: {scene}': 'Cena HUD não existe: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: O vínculo HUD minimap_center deve pertencer à visão base
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'O vínculo HUD minimap_center deve referenciar um ponto; não encontrado: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: O vínculo HUD {attr} deve pertencer à visão completa (full)
  HUD 绑定 {attr} 必须属于基础视图: O vínculo HUD {attr} deve pertencer à visão base
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'O vínculo HUD {attr} deve referenciar uma região; não encontrada: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: A chave de POI deve começar com letra minúscula e conter apenas letras minúsculas, números e sublinhados
  POI {key} 坐标超出底图范围: As coordenadas do POI {key} estão fora dos limites do mapa base
  POI 必须是键值映射: POI deve ser um mapeamento chave-valor
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256 deve ser um hash hexadecimal de 64 caracteres
  min_area 必须大于 0: min_area deve ser maior que 0
  pois 必须是列表: pois deve ser uma lista
  ui 必须是键值映射: ui deve ser um mapeamento chave-valor
  window_ratio 必须在 0.05–1 之间: window_ratio deve estar entre 0,05 e 1
  '{name} 必须是三元整数列表': '{name} deve ser uma lista de três inteiros'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name} deve atender a H=0–180, S/V=0–255'
  '{name}地图': Mapa {name}
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: A chave do mapa deve começar com letra minúscula e conter apenas letras minúsculas, números e sublinhados
  '地图不存在: {key}': 'Mapa não existe: {key}'
  地图名称不能为空: O nome do mapa não pode ficar vazio
  '地图名称已存在: {name}': 'O nome do mapa já existe: {name}'
  地图图片与定义摘要不一致: A imagem do mapa não corresponde ao hash da definição
  地图定义必须是键值映射: A definição do mapa deve ser um mapeamento chave-valor
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: O arquivo de mapa {rel} declara a chave {inner}, que difere do nome do arquivo
  地域名称不能为空，且 key 不得重复: O nome da região não pode ficar vazio e as chaves não podem se repetir
  大地图: Mapa-múndi
  底图数据为空: Os dados do mapa base estão vazios
  底图文件名固定为 base.png: O arquivo do mapa base deve se chamar base.png
  探查图片名称不能为空，且 key 不得重复: O nome da imagem de reconhecimento não pode ficar vazio e as chaves não podem se repetir
  '探查图片引用了不存在的地域: {region}': 'A imagem de reconhecimento referencia uma região inexistente: {region}'
  探查图片必须有有效的 SHA256 摘要: As imagens de reconhecimento devem ter um hash SHA256 válido
  '探查图片缺失或摘要不匹配: {name}': 'Imagem de reconhecimento ausente ou hash incompatível: {name}'
  '未知导航模式: {mode}': 'Modo de navegação desconhecido: {mode}'
  '未知朝向识别方法: {method}': 'Método de detecção de direção desconhecido: {method}'
