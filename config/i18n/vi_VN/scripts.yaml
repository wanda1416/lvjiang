  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: "Tạo WF DSL dễ đọc và chỉnh sửa trực tiếp. Khi dừng ghi sẽ gộp an toàn các thao tác nhấn/giữ/nhả phím và thời gian chờ liền sau; chuyển động chuột liên tục và khoảng chờ ngắn được gộp theo mức ~100ms. Phù hợp thao tác giao diện thông thường và tinh chỉnh thủ công, không phù hợp xoay góc nhìn trò chơi cần phát lại từng sự kiện đầu vào gốc."
