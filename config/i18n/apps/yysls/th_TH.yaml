  "装备至少完成一轮调律后，若词条已满且明确命中\n“继续调律或锁定”规则，并且传入规则的最终评级达到\n优秀或顶级，返回装备详情页后自动锁定。\n无规则命中只结束并保留，不会自动锁定。\n已锁定装备不会再点击，避免误解锁。": "หลังอุปกรณ์ผ่านการปรับจูนอย่างน้อยหนึ่งรอบ หากออฟชันเต็มแล้วและตรงกฎ\n“ปรับจูนต่อหรือล็อก” อย่างชัดเจน และระดับสุดท้ายของกฎที่ส่งเข้ามาถึง\nยอดเยี่ยมหรือระดับสูงสุด จะล็อกอัตโนมัติเมื่อกลับสู่หน้ารายละเอียดอุปกรณ์\nหากไม่ตรงกฎจะจบและเก็บไว้เท่านั้น ไม่ล็อกอัตโนมัติ\nอุปกรณ์ที่ล็อกแล้วจะไม่ถูกคลิกซ้ำเพื่อป้องกันการปลดล็อกโดยไม่ตั้งใจ"
  "金装区\n回收累计返还": "โซนอุปกรณ์สีทอง\nยอดคืนสะสมจากการย่อย"
