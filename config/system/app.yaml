input_simulation:
  before_click_wait:
  - 0.1
  - 0.3
  after_click_wait:
  - 0.1
  - 0.3
  mouse_move_duration:
  - 0.5
  - 0.7
  click_random_offset: 5
  region_jitter_ratio: 0.25
delay_params:
  step_interval:
    label: 步骤间等待
    range:
    - 1.0
    - 1.2
  click_interval:
    label: 连续点击间隔
    range:
    - 1.0
    - 1.2
  page_refresh:
    label: 页面刷新等待
    range:
    - 2.0
    - 3.0
  scroll_settle:
    label: 滚动惯性等待
    range:
    - 3.0
    - 4.0
