layout_transfer:
  覆盖远端页面结构？: Перезаписать облачную структуру страниц?
  下载排版: Загрузить структуру
  确认替换本机结构: Подтвердите замену локальной структуры
  "本机当前的页面结构将被云端结构替换，本机结构不会自动保留副本。\n\n确认替换？": "Структура страниц на этом устройстве будет заменена структурой из облака; текущая структура не сохраняется автоматически.\n\nЗаменить сейчас?"
  '{} 个分组 / {} 列': '{} групп / {} столбцов'
  无法解析: Не удалось разобрать
  "远端已有页面结构，且不是本机写入的：\n\n{remote}\n远端结构：{remote_size}\n本机结构：{local_size}\n\n覆盖后，其它设备下载将得到本机结构。": "В облаке уже есть структура страниц, записанная не с этого устройства:\n\n{remote}\nОблачная структура: {remote_size}\nЛокальная структура: {local_size}\n\nПосле перезаписи другие устройства загрузят структуру с этого ПК."
  上传排版: Выгрузить структуру
  页面结构以 PC 为准，手机端只支持下载。: Структура страниц задаётся на ПК; мобильное приложение поддерживает только загрузку.
  请先在「账号」里登录后再上传页面结构。: Сначала войдите в разделе «Аккаунт», затем выгрузите структуру страниц.
  云端与本机一致，无需上传。: Облачная структура совпадает с локальной; выгрузка не требуется.
  请先在「账号」里登录后再下载页面结构。: Сначала войдите в разделе «Аккаунт», затем загрузите структуру страниц.
  云端还没有页面结构，先在编辑端点一次「上传排版」。: В облаке ещё нет структуры страниц; сначала нажмите «Выгрузить структуру» на ПК.
  "将使用云端的页面结构：\n\n{remote}\n云端结构：{size}\n本机结构：{local}\n\n继续后还需再确认一次才会替换本机结构。": "Будет применена облачная структура страниц:\n\n{remote}\nОблачная структура: {size}\nЛокальная структура: {local}\n\nПосле продолжения потребуется ещё одно подтверждение перед заменой локальной структуры."
  "已下载页面结构。\n{detail}": "Структура страниц загружена.\n{detail}"
  "已上传页面结构。\n{detail}": "Структура страниц выгружена.\n{detail}"
  云端页面结构在你确认期间被其它设备改写，请先下载或稍后重试。: Пока вы подтверждали действие, облачная структура страниц была изменена другим устройством; сначала загрузите её или повторите позже.
  读取本机页面结构失败：{error}: 'Не удалось прочитать локальную структуру страниц: {error}'
  下载失败，本机结构未改变：{error}: 'Ошибка загрузки; локальная структура не изменена: {error}'
  写入本机页面结构失败：{error}: 'Не удалось записать локальную структуру страниц: {error}'
  把本机的分组、列与列宽上传到云端；远端已有其它设备写入的结构时会先询问是否覆盖: Выгружает локальные группы, столбцы и их ширину в облако; если в облаке уже есть структура с другого устройства, сначала запросит подтверждение перезаписи
  用云端的页面结构替换本机结构，需要两次确认: Заменяет локальную структуру страниц облачной; требуется двойное подтверждение
  快照只支持在 PC 端创建。: Снимки можно создавать только на ПК.
  请先在「账号」里登录后再创建快照。: Сначала войдите в разделе «Аккаунт», затем создайте снимок.
  创建快照失败：{error}: 'Не удалось создать снимок: {error}'
  "已创建快照。\n{detail}": "Снимок создан.\n{detail}"
