  使用此头像: 使用此頭像
  保存头像失败：{error}: 儲存頭像失敗：{error}
  保存并使用: 儲存並使用
  删除历史头像: 刪除歷史頭像
  删除历史头像失败：{error}: 刪除歷史頭像失敗：{error}
