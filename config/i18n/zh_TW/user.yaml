# user.yaml — 按模块段落组织
common:
  cancel: cancel
  current: current
  empty: empty
  paste: paste
  remove: remove
  reset: reset
  title: title
  请输入用户名: 請輸入使用者名稱
user_avatar:
  从剪贴板粘贴: 從剪貼簿貼上
