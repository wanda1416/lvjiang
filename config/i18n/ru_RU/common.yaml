  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Записывает исходную временную шкалу клавиш, кнопок мыши, колеса и (опционально) движений курсора. При сохранении создаётся сопутствующий файл трека в workflows/lvtrace для точного воспроизведения таймингов, что подходит для управления камерой. Скрипт зависит от файла трека и не может переноситься только как текст WF.
