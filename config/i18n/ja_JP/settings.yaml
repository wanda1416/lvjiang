  建立流式传输尝试次数: 映像ストリーム接続試行回数
  "引擎算出的点击/拖拽坐标跑到画面外时怎么办。\n不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。\n勾选：引擎截断到画面边界并记一条 warning，本次运行继续。\n判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。": "エンジンが算出したクリック／ドラッグ座標が画面外に出た際の挙動です。\nオフ（デフォルト）：エラーを出して実行を終了します。画面外への逸脱はスクリプトの移動量パラメータと現在のパネル形状の不一致を意味し、自動切り詰めを行うと「2行スクロール」が気付かないうちに「1行スクロール」へ変わり、スクリプトからもログからも原因が追えなくなります。\nオン：画面境界に切り詰めて warning を記録し、実行を続行します。\n判定はエンジン層で行われます。同じ範囲外座標でも端末側のユーザー補助ジェスチャーは明確に拒否しますが、デスクトップ入力や adb shell input は黙って受理するため、バックエンド任せにはできません。"
  当前标识：未生成（未开启）: 現在の ID：未生成（無効）
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: 端末再起動後は Shizuku サービスプロセスが停止するため、ゲーム再起動が必要なタスクが依存します。オンにすると端末側実行への接続時に自動検出し、未起動の場合のみ1回起動します。
  执行参数: 実行パラメータ
  把激活码粘贴到这里，换行和空格会被自动忽略: アクティベーションコードをここに貼り付けてください（改行と空白は自動無視されます）
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: 現在のアプリバージョンに適合する公式設定とタスク更新を受信し、検証通過後の次回起動時に反映します。ローカル設定が常に優先され、実行中のタスクは読み込み済みの設定を使い続けます。オフまたはオフラインモードにすると、次回起動時にプリセットへ戻りメンバー限定コンテンツは取り下げられます（ローカルデータには影響しません）。
