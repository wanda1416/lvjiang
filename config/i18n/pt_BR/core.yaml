about:
  仅限非商业使用: Apenas para uso não comercial
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: Este projeto destina-se apenas a aprendizado e pesquisa técnica. Usar ferramentas de automação em jogos pode violar os termos de uso do jogo correspondente; quaisquer consequências são de inteira responsabilidade do usuário.
  本项目源码公开、免费使用: Código aberto e gratuito para uso
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: Captura de janela → anotação de regiões → reconhecimento OCR → execução de fluxos
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: O software é fornecido no estado em que se encontra, sem garantias de qualquer tipo; o autor não se responsabiliza por quaisquer perdas causadas pelo seu uso.
  通用视觉 RPA 引擎: Motor RPA visual de uso geral
