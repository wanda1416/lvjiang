  "引擎算出的点击/拖拽坐标跑到画面外时怎么办。\n不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。\n勾选：引擎截断到画面边界并记一条 warning，本次运行继续。\n判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。": "วิธีจัดการเมื่อพิกัดคลิก/ลากที่เอนจินคำนวณออกนอกขอบเขตภาพ\nไม่ติ๊ก (ค่าเริ่มต้น): แจ้งข้อผิดพลาดและจบการทำงานทันที เพราะพิกัดเกินขอบเขตแสดงว่าพารามิเตอร์การเลื่อนของสคริปต์ไม่ตรงกับขนาดแผงปัจจุบัน การตัดทอนอัตโนมัติจะทำให้ \"เลื่อนสองแถว\" กลายเป็น \"เลื่อนหนึ่งแถว\" อย่างเงียบ ๆ โดยมองไม่เห็นในสคริปต์หรือบันทึก\nติ๊กเลือก: เอนจินจะตัดทอนพิกัดให้อยู่ในขอบภาพ บันทึก warning แล้วทำงานต่อ\nการตรวจสอบทำในชั้นเอนจิน เนื่องจากพิกัดที่เกินขอบเขตจะถูกปฏิเสธบนบริการการเข้าถึงของอุปกรณ์ แต่บนเดสก์ท็อปและ adb shell input จะยอมรับแบบเงียบ จึงพึ่งพาแบ็กเอนด์ไม่ได้"
  当前标识：未生成（未开启）: 'รหัสปัจจุบัน: ยังไม่ได้สร้าง (ปิดใช้งาน)'
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: หลังจากรีสตาร์ตโทรศัพท์ โพรเซสบริการ Shizuku จะหยุดทำงาน ซึ่งงานที่ต้องรีสตาร์ตเกมจำเป็นต้องใช้บริการนี้ เมื่อเปิดใช้งาน ระบบจะตรวจจับและเริ่มบริการให้อัตโนมัติหนึ่งครั้งเมื่อเชื่อมต่อโหมดรันบนอุปกรณ์ (เฉพาะเมื่อยังไม่ทำงาน)
  执行参数: พารามิเตอร์การทำงาน
  把激活码粘贴到这里，换行和空格会被自动忽略: วางรหัสเปิดใช้งานที่นี่ ระบบจะข้ามการขึ้นบรรทัดใหม่และช่องว่างโดยอัตโนมัติ
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: รับการอัปเดตการตั้งค่าและงานอย่างเป็นทางการที่ตรงกับเวอร์ชันแอปปัจจุบัน โดยมีผลในการเปิดโปรแกรมครั้งถัดไปหลังตรวจสอบผ่าน การตั้งค่าในเครื่องของคุณจะมีลำดับความสำคัญสูงสุดเสมอ และงานที่กำลังทำงานอยู่จะใช้การตั้งค่าที่โหลดไว้แล้วต่อไป หากปิดตัวเลือกนี้หรือเข้าสู่โหมดออฟไลน์ การเปิดโปรแกรมครั้งถัดไปจะคืนค่าเริ่มต้นและนำเนื้อหาสมาชิกออกโดยไม่กระทบข้อมูลในเครื่อง
