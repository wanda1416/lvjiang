  : 実験的機能：多くのスクリプトはこのモードでまだ動作せず、利用不可に関するフィードバックは受け付けていません。バックグラウンドキャプチャはゲームウィンドウが他ウィンドウに隠れていても画面を取得できますが、フォアグラウンドよりやや遅くなります。ウィンドウ入力もバックグラウンド入力である必要があり、最小化時はどちらも画面を取得できません。ここでの設定はデフォルト値であり、メイン画面で「バックグラウンドモード」にチェックを入れた場合にのみ「バックグラウンドキャプチャ」が自動でオンになります（実行中も随時変更可能）。
