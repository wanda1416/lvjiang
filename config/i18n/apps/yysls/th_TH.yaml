  "扫描装备的既定属性不可修改  ·  仅支持转律、承音和词条数值培养": "คุณสมบัติคงที่ของอุปกรณ์ที่สแกนแก้ไขไม่ได้ · รองรับเฉพาะการโอนออฟชัน เฉิงอิน และการเสริมค่าออฟชัน"
  此装备没有可培养的定音词条: อุปกรณ์นี้ไม่มีออฟชันปรับเสียงที่สามารถพัฒนาได้
  当前装备不支持继续承音，或没有更高的已配置等级: อุปกรณ์นี้ไม่รองรับการเฉิงอินต่อ หรือไม่มีเลเวลที่ตั้งค่าไว้สูงกว่านี้
  培养只能提高词条数值，不能降低: การพัฒนาสามารถเพิ่มค่าออฟชันได้เท่านั้น ไม่สามารถลดลงได้
  一次转律只能修改一个词条: การโอนออฟชันหนึ่งครั้งแก้ไขได้เพียงหนึ่งออฟชัน
  宫为首词条，不能转律: ออฟชันแรกไม่สามารถโอนออฟชันได้
  已有转律词条时，只能继续转律原固定槽位: เมื่อมีออฟชันที่โอนไว้แล้ว จะสามารถโอนต่อได้เฉพาะช่องเดิมที่ล็อกไว้
  承音只能提升到下一个已配置等级: การเฉิงอินสามารถอัปเกรดไปยังเลเวลที่ตั้งค่าไว้ถัดไปได้เท่านั้น
  承音状态不能撤销: สถานะเฉิงอินไม่สามารถยกเลิกได้
  未对装备进行任何养成修改: ยังไม่มีการเปลี่ยนแปลงการพัฒนาอุปกรณ์
  装备养成: การพัฒนาอุปกรณ์
  配置跨等级、跨装备类型共用的游戏规则。: ตั้งค่ากฎของเกมที่ใช้ร่วมกันข้ามเลเวลและข้ามประเภทอุปกรณ์
  '冷却时间:': 'เวลาคูลดาวน์:'
  扫描装备发生转律后的冷却天数: จำนวนวันคูลดาวน์หลังการโอนออฟชันอุปกรณ์ที่สแกน
  冷却到期后累计一次: สะสมเพิ่ม 1 ครั้งเมื่อคูลดาวน์ครบกำหนด
  '逾期进度:': 'ความคืบหน้าเลยกำหนด:'
  "逾期时间会抵扣下一轮冷却，最多保留一次可重置次数": "เวลาที่เลยกำหนดจะนำไปหักลบคูลดาวน์รอบถัดไป เก็บสะสมสิทธิ์รีเซ็ตได้สูงสุด 1 ครั้ง"
  '传律石提升:': 'ค่าเพิ่มของหินถ่ายทอดจังหวะ:'
  "一次传律只提升一条词条，增量是该词条在当前等级普通满值的这个百分比。装备「养成」里按它估算承音喂满还需要几个传律石。": "การถ่ายทอดจังหวะหนึ่งครั้งจะเพิ่มออฟชันหนึ่งแถวตามเปอร์เซ็นต์นี้ของค่าสูงสุดปกติในเลเวลปัจจุบัน หน้า \"พัฒนา\" อุปกรณ์จะใช้ค่านี้ประเมินจำนวนหินที่ต้องใช้เพื่อป้อนเฉิงอินให้เต็ม"
  "当前装备承音喂满需要 {count} 个传律石（{level} 阶承音上限）": "อุปกรณ์นี้ต้องใช้หินถ่ายทอดจังหวะอีก {count} ก้อนเพื่อเต็มค่าเฉิงอิน (ขีดจำกัดเฉิงอินขั้น {level})"
  "当前装备承音词条已满，无需传律石（{level} 阶承音上限）": "ออฟชันเฉิงอินของอุปกรณ์นี้เต็มแล้ว ไม่ต้องใช้หินถ่ายทอดจังหวะ (ขีดจำกัดเฉิงอินขั้น {level})"
  按 {level} 阶承音上限估算：: 'ประเมินตามขีดจำกัดเฉิงอินขั้น {level}:'
