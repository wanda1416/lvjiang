action_catalog:
  0=红 1=绿 2=蓝: 0=Vermelho 1=Verde 2=Azul
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / teclas de letra / MOUSE_LEFT; no dispositivo, ESC = Voltar
  OCR 扫描区域: Região de varredura OCR
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: No PC, insere texto via área de transferência e Ctrl+V; suporta modo em segundo plano
  find 结果、矩形或坐标变量: Resultado de find, retângulo ou variável de coordenada
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: '"{label}" não pode conter aspas duplas nem quebras de linha (strings DSL não suportam escape)'
  '「{label}」应为 #rrggbb': '"{label}" deve estar no formato #rrggbb'
  「{label}」应为 {n} 个数: '"{label}" deve conter {n} números'
  「{label}」应为命名延迟（字母或中文开头的名字）: '"{label}" deve ser um atraso nomeado (nome iniciado por letra ou caractere chinês)'
  「{label}」未填写: '"{label}" não foi preenchido'
  「{label}」的 {n} 个值都必须是数字: Todos os {n} valores de "{label}" devem ser números
  不带 by 得到文字；带 by 得到命中与否: Sem by, retorna o texto; com by, retorna se houve correspondência
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: 'Informe uma única chave para "{label}" (ex.: ok), sem colchetes nem prefixo de cena'
