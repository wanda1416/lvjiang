  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Создаёт читаемый и редактируемый WF DSL. При остановке безопасно объединяет нажатия, удержания, отпускания и ожидания; непрерывные движения мыши и короткие паузы группируются с шагом ~100 мс. Подходит для обычных действий в интерфейсе и ручной правки, но не для точного воспроизведения поворота камеры.
