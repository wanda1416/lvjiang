map_manager:
  HUD 场景: HUD シーン
  HUD 场景绑定（坐标在场景编辑器里标定）: HUD シーンバインド（座標はシーンエディタでキャリブレーション）
  '{scene}.{point} 不在小地图区域内，朝向识别暂用区域中心。': '{scene}.{point} はミニマップ領域外のため、向き認識には一時的に領域中心を使用します。'
  ⚠ 缺失：{key}: ⚠ 欠落：{key}
  不能删除: 削除できません
  从当前画面截取: 現在の画面からキャプチャ
  会同时生成 HUD 场景 map_<key>，之后在场景编辑器里标定小地图与大地图区域。: HUD シーン map_<key> も同時に生成されます。後でシーンエディタにてミニマップとワールドマップ領域をキャリブレーションしてください。
  保存当前画面为探查图片: 現在の画面を探索画像として保存
  先登记地域: 先にエリアを登録してください
  删除地图: マップを削除
  删除地图「{name}」及其底图？自动生成的 HUD 场景 map_{key} 也会一并删除。: マップ「{name}」とそのベースマップを削除しますか？自動生成された HUD シーン map_{key} も一緒に削除されます。
  删除选中 POI: 選択中の POI を削除
  删除选中地域: 選択中のエリアを削除
  只有实际补齐整张地图后才勾选；拼接成功不代表已采集整图。: マップ全体を実際に補完した後にのみチェックしてください。結合成功は全体探索の完了を意味しません。
  只读，请先“复制到本地”再修改: 読み取り専用です。先に「ローカルにコピー」してから編集してください
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp): 画像ファイル (*.png *.jpg *.jpeg *.bmp *.webp)
  在底图上点击新增 POI；点击已有标记选中它。坐标为底图归一化坐标。: ベースマップ上をクリックして POI を追加、既存マーカーをクリックして選択します。座標はベースマップの正規化座標です。
  地图 key: マップ key
  地域与探查: エリアと探索
  地域仍被使用: エリアは使用中です
  地域名称: エリア名
  坐标必须在 0–1 之间: 座標は 0–1 の範囲である必要があります
  基本信息: 基本情報
  基本信息与绑定: 基本情報とバインド
  复制到本地: ローカルにコピー
  大地图底图: ワールドマップのベースマップ
  大地图正北朝上: ワールドマップは北が上
  导入底图文件…: ベースマップ画像をインポート…
  导航模式: ナビゲーションモード
  小写字母开头，字母/数字/下划线: 小文字英字で始まり、英字・数字・アンダースコアのみ
  小地图朝向: ミニマップの向き
  尖端（退化）: 先端（縮退）
  尚未导入底图：先「标定 HUD…」标出大地图区域，再在“底图与 POI”页导入: ベースマップ未インポート：先に「HUD キャリブレーション…」でワールドマップ領域を指定し、「ベースマップと POI」タブからインポートしてください
  展示: 表示
  底图与 POI: ベースマップと POI
  底图区域未标定: ベースマップ領域が未キャリブレーションです
  底图可标注 POI；空白部分尚未探查。: ベースマップ上に POI を配置できます。空白部分は未探索です。
  底图已完成整图探查: ベースマップの全体探索が完了済み
  底图编码失败: ベースマップのエンコードに失敗しました
  底图：局部探查，待补齐: ベースマップ：部分探索済み、補完待ち
  底图：整图探查已完成: ベースマップ：全体探索完了済み
  当前地图有未保存的修改，放弃吗？: 現在のマップには未保存の変更があります。破棄しますか？
  当前布局不存在，未能定位地图区域。: 現在のレイアウトが存在しないため、マップ領域を特定できませんでした。
  当前布局尚未标定 {scene}.{point}，朝向识别暂用小地图区域中心。: 現在のレイアウトでは {scene}.{point} が未キャリブレーションのため、向き認識には一時的にミニマップ領域中心を使用します。
  当前布局尚未标定 {scene}.{region}，无法裁剪地图区域。: 現在のレイアウトでは {scene}.{region} が未キャリブレーションのため、マップ領域を切り抜けません。
  当前无法读取布局，未能定位地图区域。: 現在のレイアウトを読み込めないため、マップ領域を特定できませんでした。
  当前未选择地图，无法解析地图区域。: マップが選択されていないため、マップ領域を解析できません。
  截取当前画面: 現在の画面をキャプチャ
  截图所属地域: スクリーンショットの所属エリア
  按游戏区域选择器登记地域。探查图片与底图分别保存，可在底图页切换查看。: ゲームのエリア選択に合わせてエリアを登録します。探索画像とベースマップは別々に保存され、ベースマップタブで切り替え表示できます。
  探查: 探索
  探查图片仅供查看: 探索画像は閲覧専用です
  探查图片缺失或无法解码: 探索画像が見つからないかデコードできません
  探查截图用于查看；POI 只在底图上编辑。: 探索スクリーンショットは閲覧専用です。POI の編集はベースマップ上でのみ行います。
  搜索窗口（相对短边）: 探索ウィンドウ（短辺に対する比率）
  新地域: 新規エリア
  新建地图: 新規マップ
  无效的 POI: 無効な POI
  无法获取截图: スクリーンショットを取得できません
  '无法解码图片: {path}': '画像をデコードできません: {path}'
  无法读取图片: 画像を読み込めません
  是否仍然使用整帧作为底图？: それでもフレーム全体をベースマップとして使用しますか？
  最小面积（像素）: 最小面積（ピクセル）
  朝向 {deg:.1f}°　置信度 {conf:.2f}　方法：{method}　面积 {area}px: 向き {deg:.1f}°　信頼度 {conf:.2f}　方式：{method}　面積 {area}px
  未保存: 未保存
  未取得当前画面: 現在の画面を取得できませんでした
  未找到箭头：检查颜色阈值或小地图区域标定: 矢印が見つかりません：色しきい値またはミニマップ領域のキャリブレーションを確認してください
  来源：{layer}: ソース：{layer}
  标定 HUD…（打开场景编辑器）: HUD キャリブレーション…（シーンエディタを開く）
  标识: 識別子
  没有地图。点击“新建”创建一张。: マップがありません。「新規」をクリックして作成してください。
  添加地域: エリアを追加
  添加失败: 追加に失敗しました
  添加探查图片: 探索画像を追加
  添加探查图片…: 探索画像を追加…
  燕尾缺口: ツバメ尾ノッチ
  留空 = key: 空欄 = key
  种类: 種類
  箭头颜色与搜索参数（保存到地图）: 矢印の色と探索パラメータ（マップに保存）
  识别结果: 認識結果
  该地域已有探查图片，不能直接删除。: このエリアには探索画像があるため直接削除できません。
  请选择截图所属地域。: スクリーンショットの所属エリアを選択してください。
  读取失败: 読み込みに失敗しました
  读取当前布局失败，未能定位地图区域。: 現在のレイアウトの読み込みに失敗したため、マップ領域を特定できませんでした。
  载入截图文件…: スクリーンショットファイルを読み込む…
  载入整张局内截图后，按当前布局标定的小地图区域裁剪，解析居中的黄色内凹箭头。0° = 正北（屏幕上方），顺时针为正。: ゲーム内スクリーンショット全体を読み込むと、現在のレイアウトでキャリブレーションされたミニマップ領域を切り抜き、中央の黄色い凹み矢印を解析します。0° = 北（画面上方向）、時計回りが正です。
  适应窗口: ウィンドウに合わせる
  选择局内截图: ゲーム内スクリーンショットを選択
  选择底图: ベースマップを選択
  重新识别: 再認識
  （尚未载入截图）: （スクリーンショット未読み込み）
  'POI key 重复: {key}': 'POI key が重複しています: {key}'
maps:
  'POI key 重复: {key}': 'POI key が重複しています: {key}'
