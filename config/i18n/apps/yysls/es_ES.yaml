  按 {level} 阶承音上限估算：: 'Estimación según tope Chengyin de nivel {level}:'
  "勾选表示该装备已承音；承音后词条数值上限变为承音上限": "Marcado indica que el equipo tiene Chengyin; tras Chengyin, el tope de los afijos pasa al tope Chengyin"
