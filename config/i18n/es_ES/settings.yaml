  该热键只在「脚本编辑」工作台打开期间临时全局注册，对话框关闭后立即注销；其余热键在软件运行期间始终生效。: Este atajo solo se registra globalmente de forma temporal mientras el espacio «Editor de scripts» está abierto y se anula al cerrarlo; los demás atajos permanecen activos mientras la aplicación está en ejecución.
