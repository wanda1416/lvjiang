  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'Comportement lorsque des coordonnées de clic/glissement calculées par le moteur sortent du cadre.

    Décoché (par défaut) : lève une erreur et arrête l''exécution — un dépassement indique une inadéquation entre le script et la géométrie du panneau, et tronquer transformerait silencieusement « faire défiler deux lignes » en « une ligne ».

    Coché : tronque au bord du cadre, journalise un avertissement et continue.

    La vérification se fait dans le moteur : les gestes d''accessibilité refusent strictement ces coordonnées tandis que le bureau et adb shell input les acceptent silencieusement.'
