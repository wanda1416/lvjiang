  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Zeichnet die rohe Zeitachse von Tastatur, Maustasten, Mausrad und optionalen Mausbewegungen auf. Beim Speichern wird unter workflows/lvtrace eine zugehörige Spurdatei erstellt, sodass das Timing bei der Wiedergabe der Aufnahme sehr nahekommt – geeignet für zeitkritische Kamerasteuerungen. Das Skript hängt von dieser Spurdatei ab und darf nicht ohne sie kopiert werden.
  试算: Testlauf
  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 'Der Testlauf führt das Skript tatsächlich aus, bevor diese Funktion aufgerufen wird: Verwenden Sie ihn nicht für langsame oder nicht vertrauenswürdige Skripte, da die Oberfläche bis zur Rückkehr blockiert bleibt.'
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: Diese Funktion erfordert eine Engine-Injektion (_engine/_wf) und kann nur während der Skriptausführung aufgerufen werden
