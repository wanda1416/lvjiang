  未安装 PyAV，无法解码视频流（请安装 av 依赖）: PyAV가 설치되지 않아 비디오 스트림을 디코딩할 수 없습니다 (av 종속성을 설치하세요)
  画面流不可用: 화면 스트림을 사용할 수 없습니다
