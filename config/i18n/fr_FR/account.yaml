  当前设备ID：{id}: 'ID de l''appareil : {id}'
  （请勿随意向他人泄露该 id，这是重置密码的唯一凭据）: '(Ne partagez pas cet ID : c''est le seul justificatif pour réinitialiser le mot de passe.)'
  请先点「初始同步」建立同步状态: Cliquez d'abord sur « Synchronisation initiale » pour établir l'état de synchronisation
  请输入密码: Saisissez votre mot de passe
  请输入账户: Saisissez votre compte
  读取本机总览失败：{error}: 'Impossible de lire la vue d''ensemble locale : {error}'
  账户: Compte
  这是本机：下线后需要重新登录。: 'Il s''agit de cet appareil : vous devrez vous reconnecter après sa déconnexion.'
  进度: Progression
  退出所有设备: Déconnecter tous les appareils
  退出登录: Se déconnecter
  通道: Canal
  隐藏密码: Masquer le mot de passe
  ? '首次使用：建立本机与云端的同步状态。云端已有数据时，会先把本地

    用户、总览定义与总览数据备份到 config/session/_backup-* 再拉取云端。'
  : 'Première utilisation : établit la synchronisation entre cet appareil et le cloud. Si le cloud contient déjà des données, les

    utilisateurs, définitions et données de vue d''ensemble locaux sont sauvegardés dans config/session/_backup-* avant la récupération.'
  ；等 {} 项: ' ; et {} autres éléments'
  已恢复每分钟自动同步: Synchronisation automatique toutes les minutes reprise
  已暂停自动同步；手动「立即同步」仍可用: Synchronisation automatique en pause ; « Synchroniser maintenant » reste disponible
  恢复同步: Reprendre la synchronisation
  暂停同步: Mettre la synchronisation en pause
  暂停后不再每分钟自动同步（心跳与在线状态不受影响）。手动「立即同步」仍可用；重启后保持暂停状态。: Une fois en pause, la synchronisation automatique toutes les minutes s'arrête (le signal de vie et le statut en ligne ne sont pas affectés). « Synchroniser maintenant » reste disponible ; l'état en pause persiste après redémarrage.
