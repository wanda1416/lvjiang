  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 'Tính năng thử nghiệm: nhiều kịch bản tạm thời chưa chạy ổn trong chế độ này và không tiếp nhận phản hồi lỗi không dùng được. Chụp nền cho phép chụp cửa sổ trò chơi ngay cả khi bị cửa sổ khác che khuất nhưng chậm hơn một chút; yêu cầu nhập liệu cửa sổ cũng ở chế độ nền và cả hai đều không lấy được khung hình khi cửa sổ bị thu nhỏ. Đây là giá trị mặc định: cửa sổ chính chỉ tự động chọn "Chụp nền" sau khi bật "Chế độ nền", và bạn vẫn có thể đổi bất cứ lúc nào trong phiên chạy.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Tính năng thử nghiệm: điện thoại cần cài ứng dụng LvJiang và bật dịch vụ trợ năng; chỉ thay đổi kênh thực thi cho thao tác chạm và vuốt, không đổi cách chụp màn hình. Nếu kết nối thất bại sẽ lùi về ADB shell input.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: Chưa có thông tin kết nối thuộc loại tương ứng, vui lòng kết nối thiết bị hoặc định vị cửa sổ ở cửa sổ chính trước.
