  "启用后，扫描到已锁定装备时直接保留，不进入调律、重置或回收流程。": "Khi bật, trang bị đã khóa gặp lúc quét sẽ được giữ nguyên, không vào quy trình Điều Luật, đặt lại hay thu hồi."
  "启用后，每实际开始调律 5 件装备时重新读取律准石；有效读数与缓存相差超过 1 个大律准石时记录错误日志。": "Khi bật, cứ mỗi 5 trang bị thực tế bắt đầu Điều Luật sẽ đọc lại Luật Chuẩn Thạch; nếu giá trị hợp lệ lệch bộ nhớ đệm quá 1 Đại Luật Chuẩn Thạch sẽ ghi nhật ký lỗi."
  "启用后，首次识别数量低于设定值时要求人工确认。": "Khi bật, sẽ yêu cầu xác nhận thủ công nếu số lượng nhận diện ban đầu thấp hơn giá trị này."
