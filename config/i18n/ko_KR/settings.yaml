  正在验证激活码；一次性码将联网绑定本机…: 활성화 코드를 확인하는 중입니다. 일회용 코드는 온라인으로 이 기기에 바인딩됩니다…
  每个应用可同时绑定 Android 与 Windows。运行时按当前实际连接目标选择绑定，与工作流环境无关；连接后可用对应的「获取连接信息」自动回填。: 각 앱은 Android와 Windows를 동시에 바인딩할 수 있습니다. 실행 시 워크플로 환경과 무관하게 실제 연결 대상에 따라 바인딩을 선택하며, 연결 후 해당 「연결 정보 가져오기」로 자동 입력할 수 있습니다.
