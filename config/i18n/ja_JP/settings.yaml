  "界面语言修改已保存，需重启律匠后生效。\n\n是否立即重启？选择「稍后重启」不会撤销已保存的修改，下次启动程序时自动生效。": "表示言語の変更を保存しました。適用するには律匠の再起動が必要です。\n\n今すぐ再起動しますか？「後で再起動」を選んでも保存済みの変更は取り消されず、次回起動時に自動で適用されます。"
