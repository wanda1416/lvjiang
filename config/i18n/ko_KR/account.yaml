account_dialog:
  上行: 업로드
  下列用户的数据将以云端快照为准，本机数据会被覆盖：: '다음 사용자의 데이터는 클라우드 스냅샷을 기준으로 하며 로컬 데이터는 덮어쓰여집니다:'
  下行: 다운로드
  云端基线是空的。<br>来源：{origin}<br>时间：{created}<br>条目：0<br><br>继续将用本机当前总览补上基线，不会备份或替换本地用户。: '클라우드 기준선이 비어 있습니다.<br>출처: {origin}<br>시간: {created}<br>항목: 0<br><br>계속하면 이 기기의 현재 개요 데이터로 기준선을 채우며, 로컬 사용자는 백업되거나 교체되지 않습니다.'
  ? 云端已有快照。<br>来源：{origin}<br>时间：{created}<br>条目：{count}{warning}<br><br>继续将先把本地用户、总览定义与总览数据备份到 config/session/_backup-*，再拉取云端数据。
  : '클라우드에 이미 스냅샷이 있습니다.<br>출처: {origin}<br>시간: {created}<br>항목: {count}{warning}<br><br>계속하면 먼저 로컬 사용자, 개요 정의 및 개요 데이터를 config/session/_backup-*에 백업한 뒤 클라우드 데이터를 가져옵니다.'
  修改密码: 비밀번호 변경
  修改密码…: 비밀번호 변경 중…
  创建快照: 스냅샷 생성
  初始同步: 초기 동기화
  在浏览器中打开注册页面: 브라우저에서 회원가입 페이지 열기
  在浏览器打开自助操作页：修改密码、导出数据、清除云端数据、注销账号: '브라우저에서 셀프 서비스 페이지 열기: 비밀번호 변경, 데이터 내보내기, 클라우드 데이터 삭제, 계정 탈퇴'
  定义: 정의
  密码: 비밀번호
  ? '将清空云端的定义、用户、文档与总览数据（账号与登录态保留）。

    此操作不可恢复；本地数据不会被删除。'
  : '클라우드의 정의, 사용자, 문서 및 개요 데이터를 모두 삭제합니다(계정과 로그인 상태는 유지됨).

    이 작업은 되돌릴 수 없으며 로컬 데이터는 삭제되지 않습니다.'
  已取消覆盖：本机数据未改动，profile 同步未启用。: 덮어쓰기가 취소되었습니다. 로컬 데이터는 변경되지 않았으며 profile 동기화는 활성화되지 않았습니다.
  平台: 플랫폼
  当前密码: 현재 비밀번호
