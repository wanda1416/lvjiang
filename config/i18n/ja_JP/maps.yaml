maps:
  'HUD 场景不存在: {scene}': 'HUD シーンが存在しません: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: HUD バインド minimap_center はベースビューに属している必要があります
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'HUD バインド minimap_center は座標点を参照する必要があります。見つかりません: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: HUD バインド {attr} は full ビューに属している必要があります
  HUD 绑定 {attr} 必须属于基础视图: HUD バインド {attr} はベースビューに属している必要があります
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'HUD バインド {attr} は領域を参照する必要があります。見つかりません: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: POI key は小文字英字で始まり、小文字英字・数字・アンダースコアのみ使用できます
  POI {key} 坐标超出底图范围: POI {key} の座標がベースマップの範囲外です
  POI 必须是键值映射: POI はキー値マッピングである必要があります
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256 は64文字の16進ダイジェストである必要があります
  min_area 必须大于 0: min_area は 0 より大きい必要があります
  pois 必须是列表: pois はリストである必要があります
  ui 必须是键值映射: ui はキー値マッピングである必要があります
  window_ratio 必须在 0.05–1 之间: window_ratio は 0.05–1 の範囲である必要があります
  '{name} 必须是三元整数列表': '{name} は3要素の整数リストである必要があります'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name} は H=0–180、S/V=0–255 を満たす必要があります'
  '{name}地图': '{name}マップ'
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: マップ key は小文字英字で始まり、小文字英字・数字・アンダースコアのみ使用できます
  '地图不存在: {key}': 'マップが存在しません: {key}'
  地图名称不能为空: マップ名は空にできません
  '地图名称已存在: {name}': 'マップ名は既に存在します: {name}'
  地图图片与定义摘要不一致: マップ画像と定義のダイジェストが一致しません
  地图定义必须是键值映射: マップ定義はキー値マッピングである必要があります
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: マップファイル {rel} 内の key が {inner} で、ファイル名と一致しません
  地域名称不能为空，且 key 不得重复: エリア名は空にできず、key は重複できません
  大地图: ワールドマップ
  底图数据为空: ベースマップデータが空です
  底图文件名固定为 base.png: ベースマップのファイル名は base.png に固定されています
  探查图片名称不能为空，且 key 不得重复: 探索画像名は空にできず、key は重複できません
  '探查图片引用了不存在的地域: {region}': '探索画像が存在しないエリアを参照しています: {region}'
  探查图片必须有有效的 SHA256 摘要: 探索画像には有効な SHA256 ダイジェストが必要です
  '探查图片缺失或摘要不匹配: {name}': '探索画像が見つからないか、ダイジェストが一致しません: {name}'
  '未知导航模式: {mode}': '不明なナビゲーションモード: {mode}'
  '未知朝向识别方法: {method}': '不明な向き認識方式: {method}'
