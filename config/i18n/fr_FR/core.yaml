about:
  仅限非商业使用: Usage non commercial uniquement
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: Ce projet est destiné uniquement à l'apprentissage et à la recherche technique. L'utilisation d'outils d'automatisation dans des jeux peut enfreindre leurs conditions d'utilisation ; l'utilisateur en assume l'entière responsabilité.
  本项目源码公开、免费使用: Open source et gratuit
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: Capture de fenêtre → annotation de zones → OCR → exécution de workflow
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: Ce logiciel est fourni en l'état, sans aucune garantie ; l'auteur décline toute responsabilité en cas de perte liée à son utilisation.
  通用视觉 RPA 引擎: Moteur RPA visuel polyvalent
