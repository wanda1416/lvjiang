  图色函数：截图失败: 'ฟังก์ชันสีพิกเซล: จับภาพหน้าจอไม่สำเร็จ'
  图色函数：画布裁剪为空（检查布局 canvas 配置）: 'ฟังก์ชันสีพิกเซล: พื้นที่ครอบตัดแคนวาสว่างเปล่า (ตรวจสอบการตั้งค่า canvas ในเลย์เอาต์)'
