  没有可用的局域网地址：确认本机已连接网络: 'Нет доступного адреса в локальной сети: убедитесь, что ПК подключён к сети'
  没有已连接的 ADB 设备: Нет подключённых устройств ADB
  "测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。\n请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。": "Тест удерживает левый нижний угол экрана и дважды нажимает в правом нижнем — имитация «удержания джойстика с нажатиями».\nОткройте на телефоне игровой экран, где видны движение и прыжок, затем нажмите «Начать тест»."
  版本: Версия
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: При разных версиях протокол и встроенные конфигурации могут не совпадать. Рекомендуется обновить более старую сторону
  用 PC 配置覆盖手机任务参数和用户名册。: Перезаписывает параметры задач и список пользователей на телефоне конфигурацией ПК.
  用 PC 配置覆盖手机批量配置。: Перезаписывает пакетные конфигурации на телефоне конфигурацией ПК.
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: Отсканируйте телефоном для загрузки и установки с этого ПК. Телефон должен быть в одной локальной сети с ПК, доступ в интернет не нужен.
  "用手机扫码，直接从 GitHub 下载安装。\n手机上不了网时，改用右侧「本机共享」。": "Отсканируйте телефоном для прямой загрузки и установки с GitHub.\nЕсли на телефоне нет интернета, используйте «Локальную раздачу» справа."
  由本机提供下载，手机不需要能上网: Загрузка раздаётся с этого ПК; интернет на телефоне не требуется
  电脑: ПК
  确认手机已安装律匠 app、与本机同一局域网或已用 USB 连接，并在 app 内开启无障碍服务: Убедитесь, что на телефоне установлено приложение LvJiang, он находится в одной локальной сети или подключён по USB, а в приложении включена служба специальных возможностей
  离线任务: Автономные задачи
  移动设备（正在停止后台操作…）: Мобильное устройство (остановка фоновой операции…)
  落点：按住 {push}，期间点击 {tap}: 'Точки: удержание {push}, нажатия {tap}'
  设备体检: Диагностика устройства
  设备已切换，请刷新离线任务状态: Устройство переключено; обновите статус автономных задач
  设备序列号: Серийный номер
  设备扫描: Поиск устройств
  设备端收到了指令但执行失败，展开日志看原因: Устройство получило команду, но выполнение завершилось ошибкой; раскройте журнал для подробностей
  设备端版本: Версия на устройстве
  请先更新 APK：旧版本不支持独立保留任务参数和批量配置: 'Сначала обновите APK: старая версия не поддерживает раздельное сохранение параметров задач и пакетных конфигураций'
  请先选择在线设备: Сначала выберите устройство в сети
  远程执行: Удалённый запуск
  选择 APK: Выбор APK
  选择本地 APK…: Выбрать локальный APK…
  重新扫描: Сканировать снова
  除本窗口外还有 {n} 路连接连着这台手机，可能来自另一个窗口或另一台电脑，操作会互相打断: Помимо этого окна к телефону подключено ещё {n} сеансов (возможно, из другого окна или другого ПК); операции могут мешать друг другу
  同步方案: План синхронизации
  将更新脚本、布局和用户数据；总览数据不随包下发，由手机账号云端同步。: Обновляются скрипты, макеты и данные пользователей; данные обзора в пакет не входят и синхронизируются через облачный аккаунт на телефоне.
