  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : '엔진이 계산한 클릭/드래그 좌표가 화면 밖으로 벗어났을 때의 처리 방식입니다.

    체크 해제(기본값): 오류를 발생시키고 이번 실행을 종료합니다. 범위 초과는 스크립트의 이동 매개변수가 현재 패널 기하 구조와 맞지 않음을 의미하며, 자동 잘라내기는 「두 줄 스크롤」을 조용히 「한 줄 스크롤」로 바꿔 스크립트나 로그에서 알아차리기 어렵게 만듭니다.

    체크: 엔진이 화면 경계로 잘라내고 warning을 기록한 뒤 실행을 계속합니다.

    판정은 엔진 레이어에서 수행됩니다: 동일한 범위 초과 좌표라도 장치 측 접근성 제스처는 즉시 거부하는 반면, 데스크톱 입력과 adb shell input은 조용히 수용하므로 백엔드에 의존할 수 없습니다.'
