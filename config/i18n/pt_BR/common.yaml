  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'Por padrão, tenta estabelecer o fluxo de vídeo 5 vezes; se falhar, reconecta o agente 5 vezes e o ADB 5 vezes, com intervalo de 2 s. Se continuar indisponível, aguarda intervenção manual sem tempo limite: Sim verifica novamente, Não para a tarefa; fechar o aviso não para a tarefa e o banner superior permanece.

    Multitoque e gestos simultâneos não sofrem degradação. Entradas cuja execução seja incerta nunca são repetidas automaticamente. Aplica-se a tarefas iniciadas depois.'
