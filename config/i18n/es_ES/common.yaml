  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Registra la línea temporal sin procesar del teclado, botones del ratón, rueda y movimiento opcional del ratón. Al guardar el script también se genera el archivo de traza asociado en workflows/lvtrace, con una cadencia más fiel a la grabación original, ideal para giros de cámara y escenas sensibles al tiempo. El script depende de esa traza y no puede migrarse copiando solo el texto WF.
