  保留手机批量配置。: Conserve les configurations par lots du téléphone.
  保留手机整份批量配置组；取消后使用电脑配置组。本次运行草稿仍保留。: Conserve l'ensemble des groupes de configuration par lots du téléphone ; décochez pour utiliser ceux du PC. Le brouillon de cette exécution est conservé.
