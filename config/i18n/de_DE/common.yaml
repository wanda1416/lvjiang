about:
  仅限非商业使用: Nur für nicht-kommerzielle Nutzung
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: Dieses Projekt dient ausschließlich Lern- und technischen Forschungszwecken. Die Verwendung von Automatisierungswerkzeugen in Spielen kann gegen die Nutzungsbedingungen des jeweiligen Spiels verstoßen; die Folgen trägt der Benutzer selbst.
  本项目源码公开、免费使用: Open Source und kostenlos nutzbar
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: Fenstererfassung → Bereichsmarkierung → OCR-Erkennung → Workflow-Ausführung
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: Die Software wird ohne jegliche Gewährleistung wie besehen bereitgestellt; der Autor haftet nicht für Schäden, die durch ihre Nutzung entstehen.
  通用视觉 RPA 引擎: Allgemeine visuelle RPA-Engine
