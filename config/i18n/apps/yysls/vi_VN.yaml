  "启动 MCP 后，在 WorkBuddy 等外部 Agent 中交流流派和养成目标。AI 可以了解当前用户与全部用户、查询装备、扫描备战方案、生成新配置并启动调律。启用后每次主实例启动时自动开启服务并同步接入配置。": "Sau khi khởi chạy MCP, bạn có thể trao đổi lưu phái và mục tiêu bồi dưỡng trong các Agent ngoài như WorkBuddy. AI có thể xem người dùng hiện tại và toàn bộ người dùng, tra cứu trang bị, quét phương án xuất chiến, tạo cấu hình mới và bắt đầu Điều Luật. Khi bật, dịch vụ sẽ tự khởi động và đồng bộ cấu hình kết nối mỗi lần mở phiên bản chính."
