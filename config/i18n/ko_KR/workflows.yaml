static_check:
  区域未绑定模板: 영역에 템플릿이 바인딩되지 않았습니다
  场景未绑定任何坐标: 씬에 바인딩된 좌표가 없습니다
  场景未绑定任何子场景引用: 씬에 바인딩된 하위 씬 참조가 없습니다
  子场景引用未定义: 하위 씬 참조가 정의되지 않았습니다
  子场景引用未绑定坐标: 하위 씬 참조에 바인딩된 좌표가 없습니다
  引用目标不是子场景: 참조 대상이 하위 씬이 아닙니다
  请核对脚本里的 key 拼写（DSL 只认 key，不认中文名），或在场景布局编辑器中绑定: 스크립트의 key 철자를 확인하거나(DSL은 중국어 이름이 아니라 key만 인식함) 씬 레이아웃 편집기에서 바인딩하세요
workflow_references:
  区域/坐标点/面板: 영역/좌표점/패널
  区域/面板: 영역/패널
  坐标点: 좌표점
  方向/区域: 방향/영역
