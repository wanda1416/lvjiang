  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : '기본적으로 영상 스트림 연결을 5회 시도하며, 실패 시 에이전트 5회, ADB 5회를 2초 간격으로 재연결합니다. 그래도 연결되지 않으면 수동 처리를 무기한 대기합니다. 예를 선택하면 다시 확인하고 아니오를 선택하면 해당 작업을 중지합니다. 알림을 닫아도 작업은 중지되지 않으며 상단 배너가 유지됩니다.

    멀티터치 및 동시 제스처는 대체되지 않습니다. 동작 실행 여부가 불확실할 때는 입력을 자동 재시도하지 않습니다. 설정은 이후 시작되는 작업부터 적용됩니다.'
