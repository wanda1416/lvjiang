about:
  仅限非商业使用: ใช้เพื่อการไม่แสวงหากำไรเท่านั้น
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: โปรเจกต์นี้จัดทำขึ้นเพื่อการศึกษาและวิจัยทางเทคนิคเท่านั้น การใช้เครื่องมืออัตโนมัติกับเกมอาจละเมิดข้อตกลงผู้ใช้ของเกมนั้น ๆ ผลที่ตามมาทั้งหมดผู้ใช้เป็นผู้รับผิดชอบเอง
  本项目源码公开、免费使用: ซอร์สโค้ดเปิดเผยและใช้งานฟรี
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: จับภาพหน้าต่าง → ระบุกรอบพื้นที่ → OCR → รันเวิร์กโฟลว์
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: ซอฟต์แวร์นี้ให้บริการตามสภาพโดยไม่มีการรับประกันใด ๆ ผู้พัฒนาไม่รับผิดชอบต่อความเสียหายใด ๆ ที่เกิดจากการใช้งานซอฟต์แวร์นี้
  通用视觉 RPA 引擎: เอนจิน Visual RPA อเนกประสงค์
