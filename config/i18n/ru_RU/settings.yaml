  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: Если код активации привязывается к ПК, отправьте этот серийный номер автору. Он вычисляется по ID материнской платы при каждом запуске, не сохраняется на диск и не содержит восстанавливаемых данных об оборудовании.
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: Это число попыток используется и для первого запуска видеопотока, и для автовосстановления после разрыва. Когда попытки исчерпаны, задача ждёт ручного вмешательства и не отменяется сама.
  首次窗口定位后可自动获取: Заполняется автоматически после первого выбора окна
  高级设置: Расширенные настройки
  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'По умолчанию выполняется 5 попыток запуска видеопотока, затем 5 переподключений агента и 5 — ADB с интервалом 2 с. Если связь не восстановлена, задача бессрочно ждёт ручного вмешательства: «Да» — проверить снова, «Нет» — остановить задачу; закрытие окна не останавливает задачу, верхний баннер остаётся.

    Мультитач и параллельные жесты не понижаются. При неопределённом результате ввод не повторяется автоматически. Настройки применяются к новым запускам.'
