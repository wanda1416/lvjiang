  "配置每个装备等级的等阶名称，用于校验装备名称并识别原始等级；承音不改变等阶名称，无法匹配时原始等级为 0。": "กำหนดชื่อระดับขั้นสำหรับแต่ละเลเวลอุปกรณ์เพื่อตรวจสอบชื่อและระบุเลเวลเดิม การเฉิงอินจะไม่เปลี่ยนชื่อระดับขั้น หากจับคู่ไม่ได้เลเวลเดิมจะเป็น 0"
