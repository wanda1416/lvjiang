# 来源类别: 心法
#
# 条目 id 用「心法名·重数」，求值时按用户实际上的心法筛选（selected）。
#
# 游戏事实：心法给出的「一整条词条」按 1:2 拆成最小/最大，两者之和
# 等于该等级该词条的满值。所以这类条目只写 full_affix，数值由
# game_config.yaml 的 affix_caps[等级] 生成，换赛季只改 affix_caps。
# 已在 96 级（25.9 + 51.9 = 77.8）与 110 级（40.5 + 80.9 = 121.4）
# 两个独立数据点上验证。
#
# 不符合该规律的重数直接写 stats 常数；未测量的条目留 modeled: false，
# 贡献 0 并计入 UI 的建模进度，缺口由反解兜底。
