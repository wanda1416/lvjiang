  '[提示] 方案「{name}」的 {missing} 已不存在，未能全部套用': '[แจ้งเตือน] {missing} ของโปรไฟล์ «{name}» ไม่มีอยู่แล้ว จึงไม่สามารถนำมาใช้ได้ทั้งหมด'
