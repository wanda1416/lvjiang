  异常恢复: Khôi phục sự cố
  ? "当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。"
  : "Hiện đang điều phối theo \"{key}\", nhưng quy trình chuẩn bị mục \"{wf}\" không chọn và trả về tên người dùng của đơn vị này. Vui lòng đổi sang batch/prepare_item_by_attr.wf, hoặc khai báo #% batch_unit_prepare: true và trả về username trong quy trình tự viết."
  当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。: "Hiện đang điều phối theo thuộc tính, vui lòng cấu hình quy trình chuẩn bị mục trong \"Công cụ → Cấu hình hàng loạt\" trước."
  恢复默认顺序: Khôi phục thứ tự mặc định
  手机端正在执行任务，请暂停或者结束任务: "Điện thoại đang chạy tác vụ, vui lòng tạm dừng hoặc kết thúc tác vụ trước"
  ? "手机端正在执行任务，请暂停或者结束任务。\n\n设备返回：{detail}"
  : "Điện thoại đang chạy tác vụ, vui lòng tạm dừng hoặc kết thúc tác vụ trước.\n\nThiết bị phản hồi: {detail}"
  ? "执行用户：{username}\n参数来源：{source}"
  : "Người dùng thực thi: {username}\nNguồn tham số: {source}"
  ? "执行用户：{username}\n点击查看本轮任务参数"
  : "Người dùng thực thi: {username}\nNhấp để xem tham số tác vụ lượt này"
  执行顺序: Thứ tự thực thi
  批量设置: Cài đặt hàng loạt
  批量配置: Cấu hình hàng loạt
  拖动可临时调整实际执行顺序: Kéo để tạm thời điều chỉnh thứ tự thực thi thực tế
  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: "Kéo để điều chỉnh thứ tự thực thi thực tế; nhấp chuột phải để khôi phục mặc định, xáo trộn ngẫu nhiên hoặc sắp xếp theo Profile; thứ tự trong cấu hình hàng loạt chỉ là thứ tự ban đầu"
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: Kéo để điều chỉnh thứ tự thực thi thực tế; nhấp chuột phải để khôi phục mặc định hoặc xáo trộn ngẫu nhiên; thứ tự trong cấu hình hàng loạt chỉ là thứ tự ban đầu
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: Kéo để điều chỉnh thứ tự thực thi thực tế; nhấp chuột phải để khôi phục mặc định hoặc xáo trộn ngẫu nhiên; thứ tự trong cấu hình hàng loạt chỉ là thứ tự ban đầu
  指定顺序排序: Sắp xếp theo thứ tự chỉ định
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: "Không áp dụng khi điều phối theo thuộc tính: một giá trị thuộc tính có thể ứng với nhiều người dùng, nên quy trình chuẩn bị mục bắt buộc phải chọn và trả về tên người dùng, do đó vòng đời luôn chạy. Chuyển lại \"Tên người dùng\" sẽ khôi phục lựa chọn ban đầu của bạn"
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: "Điều phối theo tên người dùng hay theo một thuộc tính hồ sơ. Tùy chọn này quyết định nội dung danh sách ứng viên ở trang chính, giao ước vòng đời và tính hợp lệ của quy trình chuẩn bị mục, nên thuộc định nghĩa nhóm cấu hình"
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: "Khóa sắp xếp thuộc định nghĩa nhóm cấu hình; nhấp chuột phải vào danh sách người dùng và chọn \"Sắp xếp theo Profile\" để chạy một lần — thứ tự sau khi sắp xếp chỉ áp dụng cho lượt chạy này"
  新建配置: Tạo cấu hình mới
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: "Dùng để đưa trò chơi về màn hình đăng nhập sau khi chế độ không giám sát gặp tạm dừng bất thường. Cần cấu hình mục này trước mới bật được \"Không giám sát\" ở trang chính"
  无法开始批量任务: Không thể bắt đầu tác vụ hàng loạt
  暂无启用的单元，请到「单元」页勾选: "Chưa có đơn vị nào được bật, vui lòng chọn ở trang \"Đơn vị\""
  暂无配置组，请先通过「工具 → 批量配置」添加: "Chưa có nhóm cấu hình nào, vui lòng thêm qua \"Công cụ → Cấu hình hàng loạt\" trước"
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: "Đánh dấu khi để máy chạy lâu không người trông: khi tác vụ gặp tạm dừng bất thường sẽ không chờ người dùng mà ghi nhận thất bại và bỏ qua, sau đó \"quy trình khôi phục sự cố\" của nhóm cấu hình sẽ đưa trò chơi về màn hình đăng nhập rồi chạy tác vụ tiếp theo. Các hộp thoại xác nhận, nhập liệu và lựa chọn vẫn chờ người dùng tương tác"
  条目准备: Chuẩn bị mục
  条目准备工作流不支持当前属性调度，请到批量配置中修改: "Quy trình chuẩn bị mục không hỗ trợ kiểu điều phối thuộc tính hiện tại, vui lòng chỉnh sửa trong Cấu hình hàng loạt"
  条目收尾: Kết thúc mục
  浏览...: Duyệt...
  点击查看本轮任务参数: Nhấp để xem tham số tác vụ lượt này
  用户独立参数: Tham số riêng của người dùng
  确定删除当前批量配置吗？: "Bạn có chắc muốn xóa cấu hình hàng loạt hiện tại không?"
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: "Cột đầu quyết định có hiển thị ở trang chính hay không; cột thứ hai quyết định có được chọn sẵn khi trang chính tải lần đầu hoặc khi bấm \"Khôi phục mặc định\" hay không; kéo để điều chỉnh thứ tự ban đầu"
  脚本: Kịch bản
  脚本候选: Danh sách kịch bản
  请到「单元」页至少勾选一个执行单元: "Vui lòng chọn ít nhất một đơn vị thực thi ở trang \"Đơn vị\""
  请到「脚本」页至少勾选一个脚本: "Vui lòng chọn ít nhất một kịch bản ở trang \"Kịch bản\""
  请在「工具 → 批量配置」中配置条目准备工作流: "Vui lòng cấu hình quy trình chuẩn bị mục trong \"Công cụ → Cấu hình hàng loạt\""
  请至少勾选一个脚本: Vui lòng chọn ít nhất một kịch bản
  请选择 workflows 目录下的 .wf 文件: Vui lòng chọn tệp .wf trong thư mục workflows
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: "Đơn vị điều phối thuộc định nghĩa nhóm cấu hình, hãy chỉnh sửa trong \"Công cụ → Cấu hình hàng loạt\""
  选择工作流文件: Chọn tệp quy trình
  配置名称已存在: Tên cấu hình đã tồn tại
  重命名配置: Đổi tên cấu hình
  随机打乱顺序: Xáo trộn thứ tự
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: "Cần cấu hình \"quy trình khôi phục sự cố\" cho nhóm cấu hình này trong \"Công cụ → Cấu hình hàng loạt\" trước: chế độ không giám sát cần nó để đưa trò chơi về màn hình đăng nhập khi gặp tạm dừng bất thường"
  默认执行: Chạy mặc định
  配置名称: Tên cấu hình
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: "Khi mục tiêu Android đang ở màn hình dọc lúc bắt đầu chạy hàng loạt, vẫn cho phép khởi chạy miễn là tỷ lệ sau khi hoán đổi rộng/cao khớp với khung bố cục; sau khi khởi chạy, \"quy trình khôi phục sự cố\" của nhóm sẽ đưa về màn hình đăng nhập trước, rồi \"quy trình chuẩn bị mục\" đưa nhân vật trở lại trò chơi. Cả hai quy trình đều cấu hình trong \"Công cụ → Cấu hình hàng loạt\""
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: "Cần cấu hình cả \"quy trình khôi phục sự cố\" và \"quy trình chuẩn bị mục\" cho nhóm cấu hình này trong \"Công cụ → Cấu hình hàng loạt\" trước: cho phép khởi chạy màn hình dọc sẽ đưa trò chơi về màn hình đăng nhập trước, nếu không có quy trình chuẩn bị mục thì không thể đưa nhân vật quay lại trò chơi"
  允许竖屏需要先配置条目准备工作流: Cho phép màn hình dọc yêu cầu cấu hình quy trình chuẩn bị mục trước
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: "\"Cho phép màn hình dọc\" khi khởi chạy sẽ dùng quy trình khôi phục sự cố để đưa ứng dụng về màn hình đăng nhập, sau đó cần quy trình chuẩn bị mục đưa nhân vật trở lại trò chơi. Vui lòng cấu hình quy trình chuẩn bị mục cho nhóm này trong \"Công cụ → Cấu hình hàng loạt\" trước."
  上一轮: Lượt trước
  下一轮: Lượt sau
  "第 {round}/{rounds} 轮": "Lượt {round}/{rounds}"
  跳到最新一轮并持续跟随；按下表示正在跟随: Nhảy tới lượt mới nhất và tiếp tục theo dõi; đang nhấn nghĩa là đang theo dõi
  全局参数: Tham số toàn cục
  编辑范围: Phạm vi chỉnh sửa
