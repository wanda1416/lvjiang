scripts:
  ADB 模式暂不支持录制: โหมด ADB ยังไม่รองรับการบันทึก
  Unicode 字母/数字/下划线: ตัวอักษร Unicode / ตัวเลข / ขีดล่าง
  '{path} 已存在。覆盖该位置的脚本？': มี {path} อยู่แล้ว ต้องการเขียนทับสคริปต์ในตำแหน่งนี้หรือไม่?
  '{rel} 是系统脚本。要改它请在树里右键「复制到本地以修改」。': '{rel} เป็นสคริปต์ระบบ หากต้องการแก้ไขให้คลิกขวาในรายการแล้วเลือก "คัดลอกไปยังเครื่องเพื่อแก้ไข"'
  ■ 停止录制: ■ หยุดการบันทึก
  ● 录制脚本: ● บันทึกสคริปต์
  "⚠ 脚本元数据无法识别，该脚本不会出现在运行列表中：\n": "⚠ ไม่สามารถระบุเมทาดาทาของสคริปต์ได้ สคริปต์นี้จะไม่ปรากฏในรายการทำงาน:\n"
  上移选项: เลื่อนตัวเลือกขึ้น
  下移选项: เลื่อนตัวเลือกลง
  不会被录制: จะไม่ถูกบันทึก
  不勾选: ไม่ติ๊กเลือก
  不支持：{kind}（请选择有效类型）: 'ไม่รองรับ: {kind} (กรุณาเลือกประเภทที่ถูกต้อง)'
  与内置函数重名，脚本运行时会被拒绝: ชื่อซ้ำกับฟังก์ชันในตัว สคริปต์จะถูกปฏิเสธขณะทำงาน
  丢弃 {name} 的本地修改，恢复{target}版本？此操作不可恢复。: ละทิ้งการแก้ไขในเครื่องของ {name} และกู้คืนเป็นเวอร์ชัน{target}หรือไม่? การดำเนินการนี้ไม่สามารถย้อนกลับได้
  主窗口有工作流在运行，先停止它: หน้าต่างหลักมีเวิร์กโฟลว์กำลังทำงานอยู่ กรุณาหยุดก่อน
  仅用于脚本展示分组，不改变脚本性质或执行顺序: ใช้สำหรับจัดกลุ่มการแสดงผลสคริปต์เท่านั้น ไม่เปลี่ยนลักษณะหรือลำดับการทำงานของสคริปต์
  从代码重新加载: โหลดใหม่จากโค้ด
  代码: โค้ด
  代码中的元数据已变化，重新加载会丢弃元数据页尚未应用的修改。重新加载？: เมทาดาทาในโค้ดมีการเปลี่ยนแปลง การโหลดใหม่จะละทิ้งการแก้ไขที่ยังไม่ได้นำไปใช้ในหน้าเมทาดาทา ต้องการโหลดใหม่หรือไม่?
  低精度: ความละเอียดต่ำ
  低精度录制中…连续移动将合并: กำลังบันทึกแบบความละเอียดต่ำ… การเคลื่อนไหวต่อเนื่องจะถูกรวมเข้าด้วยกัน
  保存为工作流文件: บันทึกเป็นไฟล์เวิร์กโฟลว์
  保存到 workflows/{dir}: บันทึกลงใน workflows/{dir}
  保存到 workflows/{dir}；显示名留空则用 id: บันทึกลงใน workflows/{dir} หากเว้นชื่อที่แสดงว่างไว้จะใช้ id แทน
  修改会写回代码缓冲区，仍需点击“保存”才会落盘。: การแก้ไขจะถูกเขียนกลับไปยังบัฟเฟอร์โค้ด แต่ยังต้องคลิก "บันทึก" เพื่อบันทึกลงดิสก์
  值: ค่า
  停在第 {n} 行（单步 = 执行这一行）: หยุดที่บรรทัด {n} (ทีละขั้น = รันบรรทัดนี้)
  停止中…: กำลังหยุด…
  元数据: เมทาดาทา
  元数据与代码均已修改: แก้ไขทั้งเมทาดาทาและโค้ดแล้ว
  元数据尚未应用: ยังไม่ได้นำเมทาดาทาไปใช้
  元数据无效: เมทาดาทาไม่ถูกต้อง
  元数据根节点必须是键值映射: โหนดรากของเมทาดาทาต้องเป็นการจับคู่คีย์-ค่า
  元数据表单不可编辑：{error}: 'ไม่สามารถแก้ไขแบบฟอร์มเมทาดาทาได้: {error}'
  内置: ในตัว
  内置函数: ฟังก์ชันในตัว
  写入编辑区域: เขียนลงในพื้นที่แก้ไข
  切换类型会移除旧类型专属的设置。继续？: การเปลี่ยนประเภทจะลบการตั้งค่าเฉพาะของประเภทเดิม ต้องการดำเนินการต่อหรือไม่?
  删除脚本: ลบสคริปต์
  删除脚本 {rel}？此操作不可恢复。: ยืนยันที่จะลบสคริปต์ {rel} หรือไม่? การดำเนินการนี้ไม่สามารถย้อนกลับได้
  删除选项: ลบตัวเลือก
  勾选: ติ๊กเลือก
  单步: ทีละขั้น
  单步…: ทีละขั้น…
  单步模式：在第一条语句前停住: 'โหมดทีละขั้น: หยุดก่อนคำสั่งแรก'
  占位提示: ข้อความตัวอย่าง
  参数名: ชื่อพารามิเตอร์
  参数定义: คำนิยามพารามิเตอร์
  参数数: จำนวนพารามิเตอร์
  参数解析失败: แยกวิเคราะห์พารามิเตอร์ไม่สำเร็จ
  取画布: จับภาพแคนวาส
  变量名（不用写 $）: ชื่อตัวแปร (ไม่ต้องใส่ $)
  可批量运行: รันแบบกลุ่มได้
  可独立运行: รันแบบเดี่ยวได้
  同路径脚本已存在于 local。新建 system 文件后仍由 local 版本生效，继续？: มีสคริปต์พาธเดียวกันอยู่ใน local แล้ว หลังจากสร้างไฟล์ system เวอร์ชัน local จะยังคงมีผลแทน ต้องการดำเนินการต่อหรือไม่?
  同路径脚本已存在于另一保存位置。新建 local 文件会覆盖其运行效果，继续？: มีสคริปต์พาธเดียวกันอยู่ในตำแหน่งบันทึกอื่นแล้ว การสร้างไฟล์ local จะเขียนทับผลการทำงานของไฟล์เดิม ต้องการดำเนินการต่อหรือไม่?
  含义: ความหมาย
  '启动失败: {e}': 'เริ่มต้นไม่สำเร็จ: {e}'
  声明默认值: ค่าเริ่มต้นที่ประกาศ
  复制到本地以修改: คัดลอกไปยังเครื่องเพื่อแก้ไข
  复制录制结果: คัดลอกผลการบันทึก
  多个条件（每行一个，全部满足）: หลายเงื่อนไข (บรรทัดละหนึ่งเงื่อนไข ต้องเป็นจริงทั้งหมด)
  存在尚未支持的声明：{keys}；请先在代码页处理: 'มีคำประกาศที่ยังไม่รองรับ: {keys} กรุณาจัดการในหน้าโค้ดก่อน'
  '完成，返回值: {rv}': 'เสร็จสิ้น ค่าที่ส่งคืน: {rv}'
  定位到脚本: ระบุตำแหน่งในสคริปต์
  将在下一条语句前暂停: จะหยุดชั่วคราวก่อนคำสั่งถัดไป
  展开: ขยาย
  属性单元准备工作流: เวิร์กโฟลว์เตรียมหน่วยคุณสมบัติ
  工作流运行中，无法录制: เวิร์กโฟลว์กำลังทำงานอยู่ ไม่สามารถบันทึกได้
  左侧选择脚本，或点「新建」: เลือกสคริปต์ทางด้านซ้าย หรือคลิก "สร้างใหม่"
  "已保存 {path}，但校验未通过：\n": "บันทึก {path} แล้ว แต่การตรวจสอบไม่ผ่าน:\n"
  已保存 {path}，语法与布局引用校验通过: บันทึก {path} แล้ว ผ่านการตรวจสอบไวยากรณ์และการอ้างอิงเลย์เอาต์
  已写入目标位置，但无法移除原文件：{error}。请检查两份脚本。: 'เขียนไปยังตำแหน่งเป้าหมายแล้ว แต่ไม่สามารถลบไฟล์เดิมได้: {error} กรุณาตรวจสอบสคริปต์ทั้งสองไฟล์'
  已写入编辑区域；请在编辑器中保存脚本: เขียนลงในพื้นที่แก้ไขแล้ว กรุณาบันทึกสคริปต์ในตัวแก้ไข
  已创建 {path}: สร้าง {path} แล้ว
  已删除 {rel}: ลบ {rel} แล้ว
  已复制到剪贴板: คัดลอกไปยังคลิปบอร์ดแล้ว
  已复制到本地，现在可以编辑: คัดลอกไปยังเครื่องแล้ว สามารถแก้ไขได้ตอนนี้
  已存在: มีอยู่แล้ว
  已截图 {w}×{h}（画布裁剪后）: จับภาพแล้ว {w}×{h} (หลังครอบตัดแคนวาส)
  已改名；原名：{name}: 'เปลี่ยนชื่อแล้ว ชื่อเดิม: {name}'
  已有未清除的录制内容，请清除后再次点击「录制脚本」，避免覆盖丢失。: มีเนื้อหาที่บันทึกไว้ยังไม่ได้ล้าง กรุณาล้างก่อนคลิก "บันทึกสคริปต์" อีกครั้งเพื่อป้องกันการเขียนทับจนสูญหาย
  已清除: ล้างแล้ว
  已用外部编辑器打开: เปิดในตัวแก้ไขภายนอกแล้ว
  已还原为{target}版本: กู้คืนเป็นเวอร์ชัน{target}แล้ว
  应用到代码: นำไปใช้กับโค้ด
  开启后记录鼠标移动轨迹；关闭时只忽略单纯移动，点击、按住、拖拽和滚轮仍会正常录制。普通界面通常无需开启；需要还原游戏视角转动或其他连续移动时再开启。: เมื่อเปิดจะบันทึกเส้นทางการเคลื่อนเมาส์ เมื่อปิดจะข้ามเฉพาะการเลื่อนเมาส์เปล่า แต่ยังบันทึกการคลิก กดค้าง ลาก และเลื่อนล้อเมาส์ตามปกติ สำหรับหน้าจอทั่วไปมักไม่จำเป็นต้องเปิด ควรเปิดเมื่อต้องจำลองการหมุนมุมกล้องเกมหรือการเคลื่อนไหวต่อเนื่อง
  异常退出: ออกเนื่องจากข้อยกเว้น
  当前脚本不可编辑（系统脚本请先复制到本地），或已带有高精度轨迹: สคริปต์ปัจจุบันไม่สามารถแก้ไขได้ (สคริปต์ระบบต้องคัดลอกไปยังเครื่องก่อน) หรือมีเส้นทางความละเอียดสูงอยู่แล้ว
  录制: บันทึก
  录制内容尚未保存或复制到剪贴板，确定要关闭吗？: เนื้อหาที่บันทึกไว้ยังไม่ได้บันทึกหรือคัดลอกไปยังคลิปบอร์ด ยืนยันที่จะปิดหรือไม่?
  录制结束，可修改结果后「写入编辑区域」或「复制录制结果」: การบันทึกเสร็จสิ้น สามารถแก้ไขผลลัพธ์แล้วเลือก "เขียนลงในพื้นที่แก้ไข" หรือ "คัดลอกผลการบันทึก"
  录制结束，可编辑后保存为 .wf: การบันทึกเสร็จสิ้น สามารถแก้ไขแล้วบันทึกเป็น .wf ได้
  录制结束，未捕获到有效操作: การบันทึกเสร็จสิ้น ไม่พบการทำงานที่ถูกต้อง
  录制结果: ผลการบันทึก
  "录制结果尚未写入开始录制时的脚本。\n切换脚本将清除这份录制结果，是否继续？": "ยังไม่ได้เขียนผลการบันทึกลงในสคริปต์ที่เริ่มบันทึก\nการสลับสคริปต์จะล้างผลการบันทึกนี้ ต้องการดำเนินการต่อหรือไม่?"
  录制轨迹引用超出工作流目录：{ref}: 'การอ้างอิงเส้นทางการบันทึกอยู่นอกโฟลเดอร์เวิร์กโฟลว์: {ref}'
  录制鼠标移动: บันทึกการเคลื่อนเมาส์
  待机 | 点击「录制脚本」: พร้อมใช้งาน | คลิก "บันทึกสคริปต์"
  待机 | 点击「录制脚本」或按: พร้อมใช้งาน | คลิก "บันทึกสคริปต์" หรือกด
  或点击停止: หรือคลิกหยุด
  所需能力: ความสามารถที่ต้องการ
  执行: รัน
  执行结果显示在这里: ผลลัพธ์การทำงานจะแสดงที่นี่
  批量检查: ตรวจสอบแบบกลุ่ม
  找不到录制轨迹：{path}: 'ไม่พบเส้นทางการบันทึก: {path}'
  找不到该函数: ไม่พบฟังก์ชันนี้
  找不到过程 {name} 的定义: ไม่พบคำนิยามของโพรซีเดอร์ {name}
  把录制结果按语句插入代码编辑器的光标处: แทรกผลการบันทึกเป็นคำสั่งลงที่ตำแหน่งเคอร์เซอร์ในตัวแก้ไขโค้ด
  "把系统脚本 {name} 复制到本地后才能修改。\n复制之后这个文件不再跟随系统更新，确定？": "ต้องคัดลอกสคริปต์ระบบ {name} ไปยังเครื่องก่อนจึงจะแก้ไขได้\nหลังจากคัดลอกแล้ว ไฟล์นี้จะไม่อัปเดตตามระบบอีกต่อไป ยืนยันหรือไม่?"
  指令: คำสั่ง
  插件: ปลั๊กอิน
  插入到脚本: แทรกลงในสคริปต์
  插入区域: แทรกพื้นที่
  插入坐标: แทรกพิกัด
  插入颜色: แทรกสี
  搜索函数名或说明: ค้นหาชื่อฟังก์ชันหรือคำอธิบาย
  搜索指令：点击 / 等待 / 找图 / 颜色…: 'ค้นหาคำสั่ง: คลิก / รอ / ค้นหาภาพ / สี…'
  收起: ย่อ
  放弃修改？: ละทิ้งการแก้ไขหรือไม่?
  放弃录制结果？: ละทิ้งผลการบันทึกหรือไม่?
  新增选项: เพิ่มตัวเลือก
  新建脚本: สร้างสคริปต์ใหม่
  无主窗口，无法截图: ไม่มีหน้าต่างหลัก ไม่สามารถจับภาพหน้าจอได้
