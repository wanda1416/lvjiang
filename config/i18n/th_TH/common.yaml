  '[截图] 后台截图不可用：': '[จับภาพ] การจับภาพพื้นหลังไม่พร้อมใช้งาน:'
  '[截图] 后台截图启动失败，保留原截图方式': '[จับภาพ] เริ่มการจับภาพพื้นหลังไม่สำเร็จ คงวิธีจับภาพเดิมไว้'
  '[截图] 后台截图启动失败，已退回前台截图（窗口最小化时用不了）': '[จับภาพ] เริ่มการจับภาพพื้นหลังไม่สำเร็จ ย้อนกลับไปใช้การจับภาพเบื้องหน้าแล้ว (ใช้ไม่ได้เมื่อย่อหน้าต่าง)'
  '[执行目标] 已切换到 {name}': '[เป้าหมายการรัน] สลับไปยัง {name} แล้ว'
  '[扫描] 局域网内未发现可连接的 ADB 设备': '[สแกน] ไม่พบอุปกรณ์ ADB ที่เชื่อมต่อได้ใน LAN'
  '[扫描] 本机未发现开放的模拟器 ADB 端口': '[สแกน] ไม่พบพอร์ต ADB ของอีมูเลเตอร์ที่เปิดอยู่ในเครื่องนี้'
  '[扫描] 正在探测本机模拟器 ADB 端口...': '[สแกน] กำลังตรวจหาพอร์ต ADB ของอีมูเลเตอร์ในเครื่อง...'
  '[拒绝] 无法读取 {serial} 的稳定设备标识，它可能与已连接的「{name}」是同一台设备。请先断开该目标再连接。': '[ปฏิเสธ] ไม่สามารถอ่านตัวระบุอุปกรณ์แบบคงที่ของ {serial} ได้ อาจเป็นเครื่องเดียวกับ «{name}» ที่เชื่อมต่ออยู่ กรุณาตัดการเชื่อมต่อเป้าหมายนั้นก่อน'
  '[提示] 当前平台不支持窗口投屏模式，请使用「扫描设备」': '[แจ้งเตือน] แพลตฟอร์มปัจจุบันไม่รองรับโหมดฉายหน้าต่าง กรุณาใช้ «สแกนอุปกรณ์»'
  '[提示] 未发现 USB 连接的 ADB 设备': '[แจ้งเตือน] ไม่พบอุปกรณ์ ADB ที่เชื่อมต่อผ่าน USB'
  '[提示] 窗口目标正在执行任务，不能重新定位': '[แจ้งเตือน] เป้าหมายหน้าต่างกำลังรันงานอยู่ ไม่สามารถระบุตำแหน่งใหม่ได้'
  '[提示] 该目标正在执行任务，不能切换截图方式': '[แจ้งเตือน] เป้าหมายนี้กำลังรันงานอยู่ ไม่สามารถสลับวิธีจับภาพได้'
  '[提示] 该目标正在执行任务，不能切换输入方式': '[แจ้งเตือน] เป้าหมายนี้กำลังรันงานอยู่ ไม่สามารถสลับวิธีอินพุตได้'
  '[提示] 该目标正在执行任务，不能断开': '[แจ้งเตือน] เป้าหมายนี้กำลังรันงานอยู่ ไม่สามารถตัดการเชื่อมต่อได้'
  '[模式] {name} 已切换到{mode}': '[โหมด] {name} สลับไปยัง {mode} แล้ว'
  '[警告] 该设备未提供稳定标识，USB 与无线连接会被当成两个目标': '[คำเตือน] อุปกรณ์นี้ไม่ได้ส่งตัวระบุแบบคงที่ การเชื่อมต่อ USB และไร้สายจะถูกมองเป็น 2 เป้าหมาย'
  '[设备端执行] App 不可达或设备端执行通道未就绪，回退 adb shell input': '[รันบนอุปกรณ์] ติดต่อแอปไม่ได้หรือช่องทางรันบนอุปกรณ์ไม่พร้อม ย้อนกลับไปใช้ adb shell input'
  '[错误] {method} 截图后端不可用，保留原截图方式': '[ข้อผิดพลาด] แบ็กเอนด์จับภาพ {method} ไม่พร้อมใช้งาน คงวิธีจับภาพเดิมไว้'
  '[错误] 未找到可见窗口': '[ข้อผิดพลาด] ไม่พบหน้าต่างที่มองเห็นได้'
  '{input_mode} · {capture_mode}': '{input_mode} · {capture_mode}'
  '{method} 截图后端不可用': แบ็กเอนด์จับภาพ {method} ไม่พร้อมใช้งาน
