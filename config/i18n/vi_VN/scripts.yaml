  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: "Ghi lại dòng thời gian gốc của bàn phím, nút chuột, con lăn và tùy chọn di chuyển chuột. Khi lưu script sẽ đồng thời tạo tệp quỹ đạo đi kèm trong workflows/lvtrace để phát lại sát thời gian thực, phù hợp cảnh đòi hỏi thời gian chính xác như xoay góc nhìn. Script phụ thuộc tệp quỹ đạo đi kèm, không thể chỉ sao chép văn bản WF để di chuyển."
  试算: Chạy thử
  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: "Chạy thử sẽ thực sự thực thi script trước khi gọi hàm này: không dùng với script tốn thời gian hoặc không rõ nguồn gốc vì giao diện sẽ bị treo cho đến khi trả về."
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: Hàm này cần công cụ tiêm vào (_engine/_wf) và chỉ có thể gọi khi script đang chạy
