  升级规则: Правила улучшения
  单击查看词条详情: Нажмите для просмотра деталей аффиксов
  "卡片显示原始装备数值，计算假设标注在卡片上方": "Карточки показывают исходные значения снаряжения; допущения расчёта указаны над карточкой"
  "原地承音：等级不变，词条数值落到承音上限": "Чэнъинь на месте: уровень не меняется, значения аффиксов поднимаются до лимита Чэнъинь"
  原词条: Исходный аффикс
  及以上装备: и выше
  "双击「规则说明」列可编辑，选中一行后可复制/删除该规则组": "Дважды щёлкните столбец «Описание правила» для редактирования; выберите строку, чтобы копировать или удалить группу"
  "双击单元格即可逐项编辑；灰色单元格由流派决定": "Дважды щёлкните ячейку для редактирования; серые ячейки определяются школой"
  "发现 {count} 处部位/品阶无启用规则覆盖：": "Найдено {count} комбинаций слот/качество без покрытия активными правилами:"
  "发现同时配置 动态属攻和真实属攻，建议修正": "Обнаружена одновременная настройка динамической и истинной стихийной атаки — рекомендуется исправить"
  取最大值: Брать максимум
  "只在调律门槛判定时忽略已有的其他词条，以首词条胚子的最大潜力决定是否进入调律流程。": "Игнорирует прочие аффиксы только при проверке порога настройки; решение о запуске принимается по максимальному потенциалу первого аффикса."
  "不会改写装备；进入后的调律处理仍使用完整实际词条。": "Снаряжение не изменяется; после входа в настройку используются полные фактические аффиксы."
  只影响本次计算，不会写进搭配: Влияет только на этот расчёт и не записывается в сборку
