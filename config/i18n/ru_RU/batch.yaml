  定义主页面右键「按 Profile 排序」用哪个键、什么方向。排完的顺序只属于本次运行，不写回这里: Задаёт ключ и направление для пункта «Сортировать по Profile» в контекстном меню главного окна. Полученный порядок действует только для текущего запуска и сюда не сохраняется
  实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流: Если выбрана только одна пользовательская единица, задачи выполняются напрямую без процессов жизненного цикла
  实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流: Если выбрана только одна пользовательская единица, задачи выполняются напрямую; для единиц по атрибуту всегда запускается подготовительный процесс
  对应的任务脚本已不存在；取消勾选并保存即可从列表移除: Соответствующий скрипт задачи больше не существует; снимите флажок и сохраните, чтобы убрать его из списка
  工作流文件 (*.wf): Файлы рабочих процессов (*.wf)
  已按 Profile 排序用户: Пользователи отсортированы по Profile
  异常恢复: Аварийное восстановление
  "当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。": "Сейчас планирование идёт по «{key}», но рабочий процесс подготовки элемента «{wf}» не выбирает и не возвращает имя пользователя этой единицы. Используйте batch/prepare_item_by_attr.wf или объявите #% batch_unit_prepare: true в своём процессе и верните username."
  当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。: Сейчас планирование идёт по атрибуту; сначала настройте рабочий процесс подготовки элемента в «Инструменты → Пакетная конфигурация».
  恢复默认顺序: Восстановить порядок по умолчанию
  手机端正在执行任务，请暂停或者结束任务: На телефоне выполняется задача; сначала приостановите или остановите её
  "手机端正在执行任务，请暂停或者结束任务。\n\n设备返回：{detail}": "На телефоне выполняется задача; сначала приостановите или остановите её.\n\nОтвет устройства: {detail}"
  "执行用户：{username}\n参数来源：{source}": "Пользователь: {username}\nИсточник параметров: {source}"
  "执行用户：{username}\n点击查看本轮任务参数": "Пользователь: {username}\nНажмите, чтобы посмотреть параметры задач этого раунда"
  执行顺序: Порядок выполнения
  批量设置: Настройки пакета
  批量配置: Пакетная конфигурация
  拖动可临时调整实际执行顺序: Перетащите, чтобы временно изменить порядок выполнения
  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: Перетащите для изменения порядка выполнения; правый клик — сброс, перемешивание или сортировка по Profile; порядок в пакетной конфигурации служит лишь начальным
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: Перетащите для изменения порядка выполнения; правый клик — сброс порядка или перемешивание; порядок в пакетной конфигурации служит лишь начальным
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: Перетащите для изменения порядка выполнения; правый клик — сброс порядка или перемешивание; порядок в пакетной конфигурации служит лишь начальным
  指定顺序排序: Сортировка по заданному порядку
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: 'Неприменимо при планировании по атрибуту: одному значению атрибута могут соответствовать несколько пользователей, поэтому процесс подготовки должен выбрать и вернуть имя пользователя, и жизненный цикл выполняется всегда. При переключении обратно на «Имя пользователя» прежний выбор восстановится'
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: Планировать по имени пользователя или по атрибуту профиля. Это определяет список кандидатов в главном окне, контракт жизненного цикла и допустимость процесса подготовки, поэтому относится к определению группы конфигурации
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: Ключ сортировки относится к определению группы конфигурации; нажмите правой кнопкой по списку пользователей и выберите «Сортировать по Profile» — полученный порядок действует только для текущего запуска
  新建配置: Новая конфигурация
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: Возвращает игру на экран входа после аварийной паузы в автономном режиме. Флажок «Без присмотра» в главном окне станет доступен после настройки этого параметра
  无法开始批量任务: Не удалось запустить пакет
  暂无启用的单元，请到「单元」页勾选: Нет включённых единиц; выберите их на вкладке «Единицы»
  暂无配置组，请先通过「工具 → 批量配置」添加: Нет групп конфигурации; сначала добавьте группу в «Инструменты → Пакетная конфигурация»
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: 'Включите при длительной работе без присмотра: при аварийной паузе задача не ждёт пользователя, помечается как неудачная и пропускается, затем процесс восстановления группы возвращает игру на экран входа и запускается следующая задача. Подтверждения, ввод и выбор по-прежнему ждут участия пользователя'
  条目准备: Подготовка элемента
  条目准备工作流不支持当前属性调度，请到批量配置中修改: Рабочий процесс подготовки элемента не поддерживает текущее планирование по атрибуту; измените его в пакетной конфигурации
  条目收尾: Завершение элемента
  浏览...: Обзор...
  点击查看本轮任务参数: Нажмите, чтобы посмотреть параметры задач этого раунда
  用户独立参数: Индивидуальные параметры пользователя
  确定删除当前批量配置吗？: Удалить текущую пакетную конфигурацию?
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: Первый столбец определяет видимость в главном окне, второй — будет ли пункт отмечен при первой загрузке или сбросе по умолчанию; перетащите для изменения начального порядка
  脚本: Скрипт
  脚本候选: Кандидаты скриптов
  请到「单元」页至少勾选一个执行单元: Выберите хотя бы одну единицу выполнения на вкладке «Единицы»
  请到「脚本」页至少勾选一个脚本: Выберите хотя бы один скрипт на вкладке «Скрипты»
  请在「工具 → 批量配置」中配置条目准备工作流: Настройте рабочий процесс подготовки элемента в «Инструменты → Пакетная конфигурация»
  请至少勾选一个脚本: Выберите хотя бы один скрипт
  请选择 workflows 目录下的 .wf 文件: Выберите файл .wf в каталоге workflows
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: Единица планирования относится к определению группы конфигурации; измените её в «Инструменты → Пакетная конфигурация»
  选择工作流文件: Выбор файла рабочего процесса
  配置名称已存在: Имя конфигурации уже существует
  重命名配置: Переименовать конфигурацию
  随机打乱顺序: Перемешать порядок
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: 'Сначала настройте для этой группы «Процесс восстановления» в «Инструменты → Пакетная конфигурация»: режим без присмотра использует его для возврата игры на экран входа после аварийной паузы'
  默认执行: Выполнять по умолчанию
  配置名称: Имя конфигурации
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: Если Android-цель при старте пакета находится в портретной ориентации, запуск разрешён при совпадении пропорций холста макета после обмена ширины и высоты. После запуска «Процесс восстановления» группы вернёт игру на экран входа, а «Процесс подготовки элемента» вернёт персонажа в игру. Оба процесса настраиваются в «Инструменты → Пакетная конфигурация»
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: 'Сначала настройте для этой группы «Процесс восстановления» и «Процесс подготовки элемента» в «Инструменты → Пакетная конфигурация»: запуск в портретной ориентации сначала возвращает игру на экран входа, и без подготовки элемента невозможно вернуться в игру'
  允许竖屏需要先配置条目准备工作流: Для запуска в портретной ориентации требуется рабочий процесс подготовки элемента
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: При запуске с опцией «Разрешить портрет» процесс восстановления сначала возвращает клиент на экран входа, а затем процесс подготовки элемента возвращает персонажа в игру. Сначала настройте процесс подготовки элемента для этой группы в «Инструменты → Пакетная конфигурация».
