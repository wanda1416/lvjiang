  已删除规则 {key}: ลบกฎ {key} แล้ว
  "已合并 {count} 份旧装备快照，方案引用已迁移。可继续选择其他候选；取消合并仅关闭窗口，不撤销已完成操作。": "รวมภาพบันทึกอุปกรณ์เก่า {count} รายการและย้ายการอ้างอิงแผนเรียบร้อยแล้ว สามารถเลือกตัวเลือกอื่นต่อได้ การยกเลิกการรวมจะปิดหน้าต่างเท่านั้น ไม่ย้อนกลับรายการที่รวมเสร็จแล้ว"
