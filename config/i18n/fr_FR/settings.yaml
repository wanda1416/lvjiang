  目标环境决定 DSL 中 env() 的返回值，用于区分 PC 游戏与手游的导航策略。指游戏运行的目标环境，非本机系统环境。: L'environnement cible détermine la valeur renvoyée par env() dans le DSL afin de distinguer la navigation PC et mobile. Il s'agit de l'environnement d'exécution du jeu, pas de l'OS local.
  确定删除方案「{name}」吗？: Supprimer le plan « {name} » ?
  空串不自动定位窗口: 'Chaîne vide : désactive la localisation automatique de la fenêtre'
  竖屏: Portrait
