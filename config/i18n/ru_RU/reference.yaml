  key 是目录名与方案里的引用，创建后不可修改。简体中文与英文必须填写。: Ключ — это имя каталога и ссылка в планах, после создания его нельзя изменить. Обязательно заполните упрощённый китайский и английский.
  简体中文与英文都必须填写: Необходимо заполнить и упрощённый китайский, и английский
