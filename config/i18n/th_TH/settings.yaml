  已复制: คัดลอกแล้ว
  已开放: เปิดใช้งานแล้ว
  已暂停公告检查、版本检查、在线配置更新和匿名数据上报；关闭离线模式后，将恢复之前的选择。: หยุดการตรวจสอบประกาศ การตรวจสอบเวอร์ชัน การอัปเดตการตั้งค่าออนไลน์ และการส่งข้อมูลแบบไม่ระบุตัวตนชั่วคราวแล้ว เมื่อปิดโหมดออฟไลน์จะคืนค่าที่เลือกไว้ก่อนหน้า
