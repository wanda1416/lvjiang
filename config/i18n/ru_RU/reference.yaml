  模板至少需要 4×4 像素，请调整框选: Размер шаблона должен быть не менее 4×4 пикселей; скорректируйте выделение
  请先填写模板名: Сначала введите имя шаблона
  模板名不能包含路径分隔符: Имя шаблона не может содержать разделители пути
  用法: Использование
  像素 {w}×{h} ｜ 录制画布 {rw}×{rh}: Пиксели {w}×{h} ｜ Холст записи {rw}×{rh}
  分数 {score:.3f}（阈值 {threshold:.2f}）: Оценка {score:.3f} (порог {threshold:.2f})
  「{group}」是布局分组，模板由场景管理截取: «{group}» — группа макета; её шаблоны создаются в редакторе сцен
  模板「{name}」已存在，覆盖？: Шаблон «{name}» уже существует. Перезаписать?
  搜索模板名: Поиск по имени шаблона
  复制名字: Копировать имя
  未被引用: Не используется
  标定样本：运行时按颜色比例判定，不参与模板匹配，永久保留: 'Калибровочный образец: оценивается по соотношению цветов во время работы, не участвует в поиске по шаблону, хранится постоянно'
  布局分组的模板由场景管理截取/删除，这里只读: Шаблоны групп макета создаются и удаляются в редакторе сцен; здесь они только для чтения
