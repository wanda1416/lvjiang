  完全离线模式（暂停全部联网功能）: 完全オフラインモード（全ネットワーク機能を一時停止）
  "实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。": "実験的機能：多くのスクリプトはまだこのモードで正常動作せず、動作不可の報告は受け付けていません。バックグラウンドキャプチャは他ウィンドウに隠れたゲーム画面も取得できますが、フォアグラウンドよりやや低速で、ウィンドウ入力もバックグラウンド入力にする必要があります（最小化時はどちらも取得不可）。ここはデフォルト設定であり、メイン画面で「バックグラウンドモード」にチェックを入れると自動で「バックグラウンドキャプチャ」がオンになりますが、実行中でも随時変更できます。"
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 実験的機能：端末に律匠アプリをインストールしユーザー補助サービスを有効にする必要があります。タップ・スワイプの実行経路のみを変更し、キャプチャ方式は変わりません。接続失敗時は ADB shell input にフォールバックします。
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: 対応する種類の接続情報がまだありません。先にメインウィンドウでデバイス接続またはウィンドウ特定を行ってください。
