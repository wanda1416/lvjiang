  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 'Recurso experimental: muitos scripts ainda não funcionam neste modo; relatos de indisponibilidade deste recurso não são aceitos. A captura em segundo plano captura a janela do jogo mesmo coberta por outras janelas, sendo um pouco mais lenta; exige também entrada em segundo plano, e nenhum dos dois funciona com a janela minimizada. Isto define o padrão: a janela principal só marca "Captura em segundo plano" automaticamente quando "Modo em segundo plano" estiver marcado, e você pode alterar a qualquer momento durante a execução.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Recurso experimental: o celular precisa ter o app LvJiang instalado com o serviço de acessibilidade ativado; altera apenas o canal de cliques e deslizes, não o método de captura. Recua para ADB shell input se a conexão falhar.'
