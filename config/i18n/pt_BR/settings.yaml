  完全离线模式（暂停全部联网功能）: Modo totalmente offline (pausa todos os recursos de rede)
  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 'Recurso experimental: muitos scripts ainda não funcionam nesse modo e relatos de indisponibilidade não são aceitos. A captura em segundo plano permite capturar a janela do jogo mesmo coberta por outras, sendo um pouco mais lenta; ela exige entrada de janela em segundo plano, e nenhuma das duas funciona com a janela minimizada. Isto define o padrão: a janela principal só marca "Captura em segundo plano" automaticamente ao marcar "Modo em segundo plano", e você pode alterar a qualquer momento durante a execução.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 'Recurso experimental: o celular precisa ter o app LvJiang instalado com o Serviço de Acessibilidade ativado; altera apenas o canal de toques e deslizes, sem mudar o método de captura. Em caso de falha na conexão, volta para ADB shell input.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: Ainda não há informações de conexão deste tipo; conecte um dispositivo ou localize uma janela na janela principal primeiro.
