  画布尺寸: ขนาดผืนภาพ
  画布尺寸无效: ขนาดผืนภาพไม่ถูกต้อง
  画布编辑模式：拖拽/缩放黄色画布框以排除窗口边框: 'โหมดแก้ไขผืนภาพ: ลาก/ปรับขนาดกรอบผืนภาพสีเหลืองเพื่อตัดขอบหน้าต่างออก'
  画布裁剪后应有的宽高比。启动任务前会按它校验目标窗口/设备，不符合就拒绝执行——形态错配不会报错，只会让坐标整体偏移。: อัตราส่วนกว้าง:ยาวของผืนภาพหลังครอป ก่อนเริ่มงานจะตรวจสอบกับหน้าต่าง/อุปกรณ์เป้าหมาย หากไม่ตรงจะปฏิเสธการรัน เพราะสัดส่วนผิดจะไม่ขึ้นข้อผิดพลาดแต่จะทำให้พิกัดคลาดเคลื่อนทั้งหมด
  留空为本地入口；* 为全局，或逗号分隔场景 key: เว้นว่างสำหรับทางเข้าในฉาก * สำหรับส่วนกลาง หรือระบุคีย์ฉากคั่นด้วยจุลภาค
  留空则与 key 相同: เว้นว่างเพื่อให้เหมือนกับ key
  留空则点击坐标；可输入或下拉选择: เว้นว่างเพื่อคลิกพิกัด สามารถพิมพ์หรือเลือกจากรายการได้
  目标场景不存在: ไม่พบฉากเป้าหมาย
  确定删除引用 {key} 吗？: ต้องการลบการอ้างอิง {key} หรือไม่?
  ? '确定删除截图 {idx} 吗？

    删除后其余截图将自动重编号。'
  : 'ต้องการลบภาพหน้าจอ {idx} หรือไม่?

    หลังลบภาพหน้าจอที่เหลือจะถูกจัดลำดับเลขใหม่โดยอัตโนมัติ'
  ? '确定恢复布局「{name}」最近一次保存的状态吗？

    所有未保存的布局标定、模板截取和版本调整都会丢失。'
  : 'ต้องการคืนค่าเลย์เอาต์ «{name}» กลับไปยังสถานะที่บันทึกล่าสุดหรือไม่?

    การกำหนดค่าเลย์เอาต์ การจับภาพเทมเพลต และการปรับเวอร์ชันที่ยังไม่บันทึกทั้งหมดจะหายไป'
