  : "Xóa bộ trang bị \"{name}\"?\n\nCác vị trí trong phương án xuất chiến và bản ghi trang bị tham chiếu bộ này sẽ hiển thị là bộ không xác định sau khi xóa, không tự động xóa trắng.{detail}"
