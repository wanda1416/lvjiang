  截图坐标与输入坐标一致。非 20:9 机型若点位整体偏移，在手机端悬浮球里做一次屏幕标定: Координаты скриншота и ввода совпадают. Если на устройствах с соотношением сторон, отличным от 20:9, есть общее смещение нажатий, выполните калибровку экрана через плавающую кнопку на телефоне
  手势、点击与截图都依赖它。在 app 内按引导开启；部分系统会在「受限设置」里额外拦一道，需要先允许: От неё зависят жесты, нажатия и скриншоты. Включите её по инструкции в приложении; в некоторых системах сначала нужно разрешить доступ в «Ограниченных настройках»
