user_avatar:
  从剪贴板粘贴: วางจากคลิปบอร์ด
  从当前设备或窗口获取最新截图: จับภาพหน้าจอล่าสุดจากอุปกรณ์หรือหน้าต่างปัจจุบัน
  使用此头像: ใช้รูปโปรไฟล์นี้
  保存头像失败：{error}: 'บันทึกรูปโปรไฟล์ไม่สำเร็จ: {error}'
  保存并使用: บันทึกและใช้งาน
  删除历史头像: ลบรูปโปรไฟล์ในประวัติ
  删除历史头像失败：{error}: 'ลบรูปโปรไฟล์ในประวัติไม่สำเร็จ: {error}'
  剪贴板中没有图片: ไม่มีรูปภาพในคลิปบอร์ด
  双击编辑头像: ดับเบิลคลิกเพื่อแก้ไขรูปโปรไฟล์
  可拖动图片定位，滚轮或滑块缩放 · Ctrl+V 粘贴: ลากรูปภาพเพื่อจัดตำแหน่ง เลื่อนล้อเมาส์หรือแถบเลื่อนเพื่อซูม · Ctrl+V เพื่อวาง
  图片尺寸过大，请选择不超过 4000 万像素的图片: ขนาดรูปภาพใหญ่เกินไป กรุณาเลือกรูปภาพที่มีความละเอียดไม่เกิน 40 ล้านพิกเซล
  图片文件 (*.png *.jpg *.jpeg *.webp *.bmp): ไฟล์รูปภาพ (*.png *.jpg *.jpeg *.webp *.bmp)
  头像库: คลังรูปโปรไฟล์
  头像文件不存在或文件名无效: ไม่พบไฟล์รูปโปรไฟล์หรือชื่อไฟล์ไม่ถูกต้อง
  头像正在使用: รูปโปรไฟล์กำลังถูกใช้งาน
  导入图片或从剪贴板粘贴: นำเข้ารูปภาพหรือวางจากคลิปบอร์ด
  导入头像图片: นำเข้ารูปภาพโปรไฟล์
  当前使用: ใช้งานอยู่
  截图失败: จับภาพหน้าจอไม่สำเร็จ
  无法更新用户头像引用: ไม่สามารถอัปเดตการอ้างอิงรูปโปรไฟล์ผู้ใช้ได้
  无法粘贴: ไม่สามารถวางได้
  无法读取图片：{error}: 'ไม่สามารถอ่านรูปภาพได้: {error}'
  没有可保存的裁剪图片: ไม่มีรูปภาพที่ครอบตัดสำหรับบันทึก
  没有读取到有效图片: ไม่พบรูปภาพที่ถูกต้อง
  确定永久删除这张历史头像吗？此操作无法撤销。: ยืนยันที่จะลบรูปโปรไฟล์ในประวัตินี้อย่างถาวรหรือไม่? การดำเนินการนี้ไม่สามารถย้อนกลับได้
  移除头像失败：{error}: 'ลบรูปโปรไฟล์ไม่สำเร็จ: {error}'
  移除当前头像: ลบรูปโปรไฟล์ปัจจุบัน
  编辑“{name}”的头像: แก้ไขรูปโปรไฟล์ของ "{name}"
  编辑头像: แก้ไขรูปโปรไฟล์
  缩放: ซูม
  "该头像正被以下用户使用，不能删除：\n{users}\n\n请先为这些用户更换或移除头像。": "รูปโปรไฟล์นี้กำลังถูกใช้งานโดยผู้ใช้ต่อไปนี้ จึงไม่สามารถลบได้:\n{users}\n\nกรุณาเปลี่ยนหรือลบรูปโปรไฟล์ของผู้ใช้เหล่านี้ก่อน"
  选择之前保存的头像，或导入一张新图片: เลือกรูปโปรไฟล์ที่บันทึกไว้ก่อนหน้า หรือนำเข้ารูปภาพใหม่
user_manager:
  保存属性: บันทึกคุณสมบัติ
  删除属性: ลบคุณสมบัติ
  同步全部头像: ซิงก์รูปโปรไฟล์ทั้งหมด
  属性 Key 不能为空: Key ของคุณสมบัติต้องไม่ว่างเปล่า
  属性 Key 不能重复：{key}: 'Key ของคุณสมบัติซ้ำกันไม่ได้: {key}'
  悬浮点击编辑，或双击头像: วางเมาส์แล้วคลิกเพื่อแก้ไข หรือดับเบิลคลิกที่รูปโปรไฟล์
  把本机与云端的头像做一次双向合并；不参与日常自动同步: ผสานรูปโปรไฟล์ระหว่างเครื่องนี้กับคลาวด์แบบสองทางหนึ่งครั้ง โดยไม่รวมอยู่ในการซิงก์อัตโนมัติประจำวัน
  新增属性: เพิ่มคุณสมบัติ
  新建用户: สร้างผู้ใช้ใหม่
  无法删除该用户: ไม่สามารถลบผู้ใช้นี้ได้
  正在同步头像…: กำลังซิงก์รูปโปรไฟล์…
  用户名只能用中文、字母、数字、下划线和连字符，最多 32 个字符。: ชื่อผู้ใช้ใช้ได้เฉพาะตัวอักษรจีน ตัวอักษรภาษาอังกฤษ ตัวเลข ขีดล่าง และยัติภังค์ สูงสุด 32 ตัวอักษร
  用户名已存在: ชื่อผู้ใช้นี้มีอยู่แล้ว
  用户属性: คุณสมบัติผู้ใช้
  "确定要删除用户「{name}」吗？\n用户将从当前列表和批量配置中移除，关联数据文件会保留；以后添加同名用户即可恢复。": "ยืนยันที่จะลบผู้ใช้ \"{name}\" หรือไม่?\nผู้ใช้จะถูกลบออกจากรายการปัจจุบันและการตั้งค่าแบบกลุ่ม แต่ไฟล์ข้อมูลที่เกี่ยวข้องจะยังคงอยู่ และสามารถกู้คืนได้โดยเพิ่มผู้ใช้ชื่อเดิมในภายหลัง"
  ＋ 新建用户: ＋ สร้างผู้ใช้ใหม่
