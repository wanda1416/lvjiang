  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 'Testar realmente executa o script antes de chamar esta função: não use com scripts lentos ou de origem desconhecida, pois a interface ficará travada até retornar.'
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: Esta função requer injeção do motor (_engine/_wf) e só pode ser chamada durante a execução de um script
  语法检查通过（保存后会再做布局引用校验）: Verificação de sintaxe aprovada (as referências de layout serão validadas novamente ao salvar)
