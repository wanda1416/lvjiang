name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Windows 视觉自动化工具，与目标平台保持一致；Qt offscreen 开箱即用
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8  # runner 默认 GBK 代码页，避免中文日志 UnicodeEncodeError
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      # ruff 全仓阻断；规则集与豁免见 pyproject.toml [tool.ruff]
      - name: Lint (ruff)
        run: python -m ruff check src tests

      # mypy 只查非 UI 区（workflows + core），存量豁免见 [tool.mypy] 棘轮清单
      - name: Type check (mypy)
        run: python -m mypy

      - name: Run tests
        run: python -m pytest tests
