  识别文字: Reconnaître le texte
  识别配置: Configuration de reconnaissance
  识别配置已保存: Configuration de reconnaissance enregistrée
  请先保存或取消当前清洗组的修改: Veuillez d'abord enregistrer ou annuler les modifications du groupe de nettoyage actuel
  输入测试文本...: Saisissez le texte de test...
  选择图片: Sélectionner une image
  选框区域为空: La zone sélectionnée est vide
  重命名规则组: Renommer le groupe de règles
  "默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。\n改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。": "Les règles par défaut s'appliquent globalement à tout l'OCR ; les clauses with de scan/find superposent le groupe métier sélectionné aux règles par défaut.\nCliquez sur « Enregistrer » pour appliquer sans redémarrer ; utilisez « Annuler » pour restaurer les modifications non enregistrées."
  默认规则（全局）: Règles par défaut (global)
  "识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。\n保存后从下一次识别开始生效，不需要重启。": "Les performances de reconnaissance s'appliquent à chaque appel : plus le parallélisme est élevé, plus c'est rapide, mais la charge CPU augmente en proportion.\nLes modifications enregistrées prennent effet dès la prochaine reconnaissance, sans redémarrage."
  识别性能: Performances
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: 'Nombre de threads utilisés par une reconnaissance. Valeur par défaut : 2. Aller plus haut n''accélère pas en pratique et augmente seulement la charge CPU globale ; 1 consomme le moins de CPU pour les exécutions longues en arrière-plan.'
  识别线程数: Threads de reconnaissance
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: 'Nombre de voies d''opérateurs en parallèle. Les modèles de détection, classification et reconnaissance possèdent déjà chacun leur pool de threads ; augmenter cette valeur ajoute surtout de la contention d''ordonnancement. Valeur par défaut : 1.'
  并行算子线程数: Threads d'opérateurs parallèles
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: Avant la détection, l'image est redimensionnée pour que son côté court corresponde à cette valeur (les grandes images sont réduites, les petites agrandies). Une valeur plus basse est plus rapide et légère mais risque de manquer les petits textes ; 736 est la valeur d'usine, à laisser telle quelle sans besoin particulier.
  检测输入短边: Côté court d'entrée de détection
