batch:
  "* 表示当前用户使用独立参数\n": "* はこのユーザーが専用パラメータを使用していることを示します\n"
  <b>选择执行单元</b>: <b>実行単位を選択</b>
  <b>选择执行脚本</b>: <b>実行スクリプトを選択</b>
  Profile 定义不可用: Profile 定義が利用できません
  Profile 定义已不存在: Profile 定義は既に存在しません
  '[批量] 以下已勾选脚本当前不可用，本次不会执行：': '[一括] 以下のチェック済みスクリプトは現在利用できないため、今回は実行されません：'
  '{name}（已失效）': '{name}（無効）'
  不指定: 指定なし
  人: 人
  人无数值，置于末尾: 人は値がないため末尾に配置
  全局任务参数: グローバルタスクパラメータ
  单个执行单元时跳过上述生命周期工作流: 実行単位が1つのみの場合は上記のライフサイクルワークフローをスキップ
  单元: 単位
  单元候选: 単位候補
  单元候选（{key}）: 単位候補（{key}）
  单元候选（用户名）: 単位候補（ユーザー名）
  可见任务: 表示タスク
  可见用户: 表示ユーザー
  定义主页面右键「按 Profile 排序」用哪个键、什么方向。排完的顺序只属于本次运行，不写回这里: メイン画面の右クリック「Profile で並べ替え」で使うキーと昇順/降順を定義します。並べ替え結果は今回の実行のみ有効で、ここには書き戻されません
  实际只选择一个用户单元时，直接执行任务，不调用生命周期工作流: 実際に選択されたユーザー単位が1つのみの場合、ライフサイクルワークフローを呼ばず直接タスクを実行します
  实际只选择一个用户单元时，直接执行任务；属性单元始终运行准备工作流: 実際に選択されたユーザー単位が1つのみの場合、直接タスクを実行します。属性単位では常に準備ワークフローを実行します
  对应的任务脚本已不存在；取消勾选并保存即可从列表移除: 対応するタスクスクリプトは既に存在しません。チェックを外して保存するとリストから削除されます
  工作流文件 (*.wf): ワークフローファイル (*.wf)
  已按 Profile 排序用户: Profile でユーザーを並べ替えました
  异常恢复: 異常復旧
  "当前按「{key}」调度，但条目准备工作流「{wf}」不会选定并返回本单元的用户名。请改用 batch/prepare_item_by_attr.wf，或在自写的准备工作流里声明 #% batch_unit_prepare: true 并返回 username。": "現在「{key}」でスケジュールしていますが、項目準備ワークフロー「{wf}」はこの単位のユーザー名を選択・返却しません。batch/prepare_item_by_attr.wf を使うか、自作の準備ワークフローで #% batch_unit_prepare: true を宣言して username を返してください。"
  当前按属性调度，请先在「工具 → 批量配置」中配置条目准备 wf。: 現在属性でスケジュールしています。先に「ツール → 一括設定」で項目準備 wf を設定してください。
  恢复默认顺序: デフォルト順に戻す
  手机端正在执行任务，请暂停或者结束任务: スマホ側でタスクを実行中です。一時停止または終了してください
  "手机端正在执行任务，请暂停或者结束任务。\n\n设备返回：{detail}": "スマホ側でタスクを実行中です。一時停止または終了してください。\n\n端末からの応答：{detail}"
  "执行用户：{username}\n参数来源：{source}": "実行ユーザー：{username}\nパラメータソース：{source}"
  "执行用户：{username}\n点击查看本轮任务参数": "実行ユーザー：{username}\nクリックして今回のタスクパラメータを表示"
  执行顺序: 実行順序
  批量设置: 一括設定
  批量配置: 一括設定
  拖动可临时调整实际执行顺序: ドラッグで実際の実行順序を一時的に変更できます
  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: ドラッグで実際の実行順序を変更できます。右クリックでデフォルト順に戻す、シャッフル、Profile で並べ替えが可能です。一括設定の順序は初期順序としてのみ使用されます
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: ドラッグで実際の実行順序を変更できます。右クリックでデフォルト順に戻すかシャッフルできます。一括設定の順序は初期順序としてのみ使用されます
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: ドラッグで実際の実行順序を変更できます。右クリックでデフォルト順に戻すかシャッフルできます。一括設定の順序は初期順序としてのみ使用されます
  指定顺序排序: 指定順で並べ替え
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: 属性スケジュール時は適用外：1つの属性値が複数のユーザーに対応する場合があるため、項目準備ワークフローでユーザー名を選択・返却する必要があり、ライフサイクルは常に実行されます。「ユーザー名」に戻すと元の選択が復元されます
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: ユーザー名でスケジュールするか、ユーザープロファイルの属性でスケジュールするかを設定します。メイン画面の候補一覧、ライフサイクル規約、項目準備ワークフローの有効性を決めるため、設定グループ定義に属します
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: 並べ替えキーは設定グループ定義に属します。ユーザー一覧で右クリックして「Profile で並べ替え」を1回実行でき、並べ替え結果は今回の実行のみ有効です
  新建配置: 新規設定
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: 無人実行中に異常一時停止が発生した際、ゲームをログイン画面に戻すために使用します。メイン画面の「無人実行」はここで設定してからチェックできます
  无法开始批量任务: 一括タスクを開始できません
  暂无启用的单元，请到「单元」页勾选: 有効な単位がありません。「単位」タブでチェックを入れてください
  暂无配置组，请先通过「工具 → 批量配置」添加: 設定グループがありません。先に「ツール → 一括設定」から追加してください
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: 長時間の無人実行時にチェック：異常一時停止が発生しても待機せず、そのタスクを失敗としてスキップし、設定グループの「異常復旧 wf」でゲームをログイン画面に戻してから次のタスクへ進みます。確認・入力・選択は引き続きユーザー操作を待ちます
  条目准备: 項目準備
  条目准备工作流不支持当前属性调度，请到批量配置中修改: 項目準備ワークフローが現在の属性スケジュールに対応していません。一括設定で変更してください
  条目收尾: 項目後処理
  浏览...: 参照...
  点击查看本轮任务参数: クリックして今回のタスクパラメータを表示
  用户独立参数: ユーザー専用パラメータ
  确定删除当前批量配置吗？: 現在の一括設定を削除しますか？
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: 1列目はメイン画面に表示するかどうか、2列目は初回読み込み時や「デフォルトに戻す」時にチェックするかどうかを制御します。ドラッグで初期順序を変更できます
  脚本: スクリプト
  脚本候选: スクリプト候補
  请到「单元」页至少勾选一个执行单元: 「単位」タブで実行単位を少なくとも1つ選択してください
  请到「脚本」页至少勾选一个脚本: 「スクリプト」タブでスクリプトを少なくとも1つ選択してください
  请在「工具 → 批量配置」中配置条目准备工作流: 「ツール → 一括設定」で項目準備ワークフローを設定してください
  请至少勾选一个脚本: スクリプトを少なくとも1つ選択してください
  请选择 workflows 目录下的 .wf 文件: workflows ディレクトリ配下の .wf ファイルを選択してください
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: スケジュール単位は設定グループ定義に属します。「ツール → 一括設定」で変更してください
  选择工作流文件: ワークフローファイルを選択
  配置名称已存在: 設定名は既に存在します
  重命名配置: 設定名を変更
  随机打乱顺序: 順序をシャッフル
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: 先に「ツール → 一括設定」でこの設定グループの「異常復旧 wf」を設定してください。無人実行中の異常一時停止後にゲームをログイン画面へ戻すために必要です
  默认执行: デフォルト実行
  配置名称: 設定名
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: Android ターゲットの一括実行開始時に縦画面であっても、幅と高さを入れ替えてレイアウトのキャンバス比率と一致すれば起動を許可します。起動後は設定グループの「異常復旧 wf」でログイン画面に戻し、続いて「項目準備ワークフロー」でゲーム内へ遷移します。両方とも「ツール → 一括設定」で設定してください
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: 先に「ツール → 一括設定」でこの設定グループの「異常復旧 wf」と「項目準備ワークフロー」を設定してください。縦画面許可で起動すると先にゲームをログイン画面へ戻すため、項目準備がないとゲーム内に戻れません
  允许竖屏需要先配置条目准备工作流: 縦画面許可には先に項目準備ワークフローの設定が必要です
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: 「縦画面を許可」で起動すると、先に異常復旧 wf でクライアントをログイン画面に戻し、項目準備ワークフローでゲーム内に戻します。先に「ツール → 一括設定」でこの設定グループの項目準備 wf を設定してください。
  上一轮: 前のラウンド
  下一轮: 次のラウンド
  第 {round}/{rounds} 轮: 第 {round}/{rounds} ラウンド
  跳到最新一轮并持续跟随；按下表示正在跟随: 最新ラウンドへ移動して追従を継続します。押下中は追従中を示します
  全局参数: グローバルパラメータ
  编辑范围: 編集範囲
