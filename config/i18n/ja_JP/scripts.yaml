  试算会真的执行脚本再调这个函数：别拿它跑耗时或来源不明的脚本，界面会一直卡到它返回。: 試算はスクリプトを実際に実行してからこの関数を呼び出します。時間のかかるスクリプトや出所不明のスクリプトでは実行しないでください（戻るまで UI がブロックされます）。
  该函数需要引擎注入（_engine/_wf），只能在脚本执行时调用: この関数はエンジン注入（_engine/_wf）が必要なため、スクリプト実行中のみ呼び出せます
  语法检查通过（保存后会再做布局引用校验）: 構文チェックに合格しました（保存時にレイアウト参照チェックを再実行します）
