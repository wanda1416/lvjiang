action_catalog:
  0=红 1=绿 2=蓝: 0=빨강 1=초록 2=파랑
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / 영문 키 / MOUSE_LEFT; 기기에서는 ESC=뒤로가기
  OCR 扫描区域: OCR 스캔 영역
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: PC에서는 클립보드와 Ctrl+V로 텍스트를 입력하며 백그라운드 모드를 지원합니다
  find 结果、矩形或坐标变量: find 결과, 사각형 또는 좌표 변수
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: 「{label}」에는 큰따옴표(")나 줄바꿈을 포함할 수 없습니다(DSL 문자열은 이스케이프를 지원하지 않습니다)
  '「{label}」应为 #rrggbb': '「{label}」은(는) #rrggbb 형식이어야 합니다'
  「{label}」应为 {n} 个数: 「{label}」은(는) {n}개의 숫자여야 합니다
  「{label}」应为命名延迟（字母或中文开头的名字）: 「{label}」은(는) 명명된 지연(영문자 또는 한자로 시작하는 이름)이어야 합니다
  「{label}」未填写: 「{label}」이(가) 입력되지 않았습니다
  「{label}」的 {n} 个值都必须是数字: 「{label}」의 {n}개 값은 모두 숫자여야 합니다
  不带 by 得到文字；带 by 得到命中与否: by가 없으면 텍스트를 반환하고, by가 있으면 일치 여부를 반환합니다
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: '「{label}」에는 대괄호나 씬 접두사 없이 단일 key(예: ok)만 입력하세요'
  不抖动: 랜덤 오프셋 없음
  主导通道: 주요 채널
  交互: 상호작용
  亮段计数: 밝은 구간 수
  值/表达式: 값/표현식
  停止应用: 앱 중지
  内容: 내용
  出错也继续: 오류 시 계속
  列表: 목록
  到达后按住(秒): 도달 후 누르기 유지(초)
  匹配: 매칭
  区域/点: 영역/좌표점
  区域里接近目标色的像素比例 0–1，判断按钮亮没亮/在哪个界面: 영역 내 목표 색상과 유사한 픽셀 비율(0~1)로 버튼 활성 상태나 현재 화면을 판별합니다
  取点亮度: 지점 밝기 측정
  取点颜色: 지점 색상 추출
  只判断是否含: 포함 여부만 확인
  只看某区域: 특정 영역만 확인
  向量倍数: 벡터 배율
  启动应用: 앱 실행
  命名延迟，留空则不等待: 명명된 지연(비워 두면 대기하지 않음)
  图库识别（分类）: 라이브러리 인식(분류)
  图色: 픽셀/색상
  声明全局变量: 전역 변수 선언
  声明后可在主流程与所有子过程中共享读写: 선언 후 메인 플로와 모든 서브프로시저에서 공유하여 읽고 쓸 수 있습니다
  失败退出: 실패 시 종료
  如 $x > 0.5 / $v contains "ok" / not $hit: '예: $x > 0.5 / $v contains "ok" / not $hit'
  如果…: 조건(If)…
  如果…否则…: 조건(If… Else…)
  字符串写双引号，或使用 $变量: 문자열은 큰따옴표로 감싸거나 $변수를 사용하세요
  存入变量: 변수에 저장
  定义区域变量: 영역 변수 정의
  定义子过程: 서브프로시저 정의
  容差: 허용 오차
  应用名: 앱 이름
  延迟: 지연
  当…时重复: 조건 동안 반복(While)…
  形如 [scene].[region]: '[scene].[region] 형식'
  形如 [scene].[region]，留空全画布: '[scene].[region] 형식(비워 두면 전체 캔버스)'
  形如 [scene].[region]；留空则搜索整个画布: '[scene].[region] 형식; 비워 두면 전체 캔버스 검색'
  循环变量: 반복 변수
  感知: 인식
  截图存档: 스크린샷 보관
  打日志: 로그 출력
  找同色图标: 동일 색상 아이콘 찾기
  找图（模板定位）: 이미지 찾기(템플릿 위치 탐지)
  找文字（可点击）: 텍스트 찾기(클릭 가능)
  拖拽区域翻页: 영역 드래그로 페이지 넘기기
  拖拽（两点）: 드래그(두 지점)
  按住(秒/区间): 누르기 유지(초/구간)
  按区域绑定找图: 영역 바인딩으로 이미지 찾기
  按压按键/鼠标键: 키/마우스 버튼 누르기
  按布局中 Region 绑定的模板匹配，返回首个命中的区域 key: 레이아웃의 Region에 바인딩된 템플릿으로 매칭하여 처음 일치한 영역 key를 반환합니다
  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: 앱 등록 유형에 따라 Android 또는 PC 앱을 중지하고 프로세스 종료를 확인합니다
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: 앱 등록 유형에 따라 Android 또는 PC 앱을 실행하고 프로세스 시작을 확인합니다
  控制流: 제어 흐름
  搜索范围: 검색 범위
  操作后等待: 동작 후 대기
  收集到输出: 출력에 수집
  数据与输出: 데이터 및 출력
  文字: 텍스트
  文本/变量: 텍스트/변수
  暂停等人工: 수동 작업 대기(일시정지)
  最低分(0-1): 최소 점수(0-1)
  最长等待(秒): 최대 대기 시간(초)
  模板匹配区域: 템플릿 매칭 영역
  模板区域: 템플릿 영역
  模板场景: 템플릿 씬
  滑动时长(秒/区间): 스와이프 시간(초/구간)
  激活区域: 영역 활성화
  激活布局实体；默认点击中心，布局可改为按键: 레이아웃 엔티티를 활성화합니다. 기본적으로 중앙을 클릭하며 레이아웃에서 키 입력으로 변경할 수 있습니다
  点击变量: 변수 클릭
  点击坐标: 좌표 클릭
  点击画布归一化坐标: 캔버스 정규화 좌표 클릭
  画布上点一下取值: 캔버스에서 클릭해 값 선택
  画布框选取值: 캔버스에서 드래그해 값 선택
  画布框选的区域存成变量，之后 click / 图色函数都能用: 캔버스에서 선택한 영역을 변수로 저장하여 이후 click 및 픽셀/색상 함수에서 사용할 수 있습니다
  目标色: 목표 색상
  等待画面稳定: 화면 안정화 대기
  等待（命名延迟）: 대기(명명된 지연)
  等待（秒）: 대기(초)
  粘贴文本: 텍스트 붙여넣기
  级别: 수준
  终点: 끝점
  行/列数: 행/열 수
  读取当前布局的 Region 模板绑定，并在指定范围或全画布定位: 현재 레이아웃의 Region 템플릿 바인딩을 읽어 지정 범위 또는 전체 캔버스에서 위치를 찾습니다
  调用子过程: 서브프로시저 호출
  赋值: 할당
  起点: 시작점
  起点→终点向量放大/缩小，如 2 或 0.5: '시작점→끝점 벡터 확대/축소 배율(예: 2 또는 0.5)'
  超时(秒): 제한 시간(초)
  输出键名: 출력 키 이름
  过程名: 프로시저 이름
  返回列表，按面积降序；$first = $icons[0] 后可 click: 면적 내림차순으로 목록을 반환합니다. $first = $icons[0] 후 click할 수 있습니다
  进入亮段阈值: 밝은 구간 진입 임계값
  退出阈值: 이탈 임계값
  通道下限: 채널 하한
  遍历列表: 목록 순회
  重复 N 次: N회 반복
  重复直到…: 조건까지 반복(Until)…
  错误变量: 오류 변수
  键名: 키 이름
  限定区域: 제한 영역
  面板/区域: 패널/영역
  颜色占比: 색상 비율
  高出其他通道: 다른 채널 대비 초과값
builtin_profile:
  DSL OCR 观测: DSL OCR 관측
  DSL 写入: DSL 쓰기
  'color_ratio: 缺少颜色参数': 'color_ratio: 색상 매개변수가 누락되었습니다'
  'find_multi_color: 偏移点应为 [dx, dy, "#rrggbb"]，实际: {v!r}': 'find_multi_color: 오프셋 지점은 [dx, dy, "#rrggbb"] 형식이어야 합니다. 실제값: {v!r}'
  'find_multi_color: 缺少锚点颜色': 'find_multi_color: 기준점 색상이 누락되었습니다'
  'pixel_ratios: rules 必须是非空字典': 'pixel_ratios: rules는 비어 있지 않은 딕셔너리여야 합니다'
  '{name}: 需要数值，实际: {v!r}': '{name}: 숫자가 필요합니다. 실제값: {v!r}'
  '{what}: 需要坐标引用（$var = [scene].[region]、find 结果或 (x, y[, w, h]) 字面量），实际: {t}': '{what}: 좌표 참조($var = [scene].[region], find 결과 또는 (x, y[, w, h]) 리터럴)가 필요합니다. 실제값: {t}'
  '{what}: 需要坐标引用，实际: {t}': '{what}: 좌표 참조가 필요합니다. 실제값: {t}'
