maps:
  'HUD 场景不存在: {scene}': 'HUD 씬이 존재하지 않습니다: {scene}'
  HUD 绑定 minimap_center 必须属于基础视图: HUD 바인딩 minimap_center는 기본 뷰에 속해야 합니다
  'HUD 绑定 minimap_center 必须引用坐标点，未找到: {key}': 'HUD 바인딩 minimap_center는 좌표점을 참조해야 하지만 찾을 수 없습니다: {key}'
  HUD 绑定 {attr} 必须属于 full 视图: HUD 바인딩 {attr}은(는) full 뷰에 속해야 합니다
  HUD 绑定 {attr} 必须属于基础视图: HUD 바인딩 {attr}은(는) 기본 뷰에 속해야 합니다
  'HUD 绑定 {attr} 必须引用区域，未找到: {key}': 'HUD 바인딩 {attr}은(는) 영역을 참조해야 하지만 찾을 수 없습니다: {key}'
  POI key 必须以小写字母开头，仅含小写字母/数字/下划线: POI key는 소문자로 시작해야 하며 소문자, 숫자, 밑줄(_)만 포함할 수 있습니다
  POI {key} 坐标超出底图范围: POI {key} 좌표가 기본 지도 범위를 벗어났습니다
  POI 必须是键值映射: POI는 키-값 매핑이어야 합니다
  base_image_sha256 必须是 64 位十六进制摘要: base_image_sha256은 64자리 16진수 해시여야 합니다
  min_area 必须大于 0: min_area는 0보다 커야 합니다
  pois 必须是列表: pois는 리스트여야 합니다
  ui 必须是键值映射: ui는 키-값 매핑이어야 합니다
  window_ratio 必须在 0.05–1 之间: window_ratio는 0.05–1 사이여야 합니다
  '{name} 必须是三元整数列表': '{name}은(는) 3개의 정수로 이루어진 리스트여야 합니다'
  '{name} 必须满足 H=0–180、S/V=0–255': '{name}은(는) H=0–180, S/V=0–255 조건을 만족해야 합니다'
  '{name}地图': '{name} 지도'
  地图 key 必须以小写字母开头，仅含小写字母/数字/下划线: 지도 key는 소문자로 시작해야 하며 소문자, 숫자, 밑줄(_)만 포함할 수 있습니다
  '地图不存在: {key}': '지도가 존재하지 않습니다: {key}'
  地图名称不能为空: 지도 이름은 비워 둘 수 없습니다
  '地图名称已存在: {name}': '지도 이름이 이미 존재합니다: {name}'
  地图图片与定义摘要不一致: 지도 이미지가 정의된 해시와 일치하지 않습니다
  地图定义必须是键值映射: 지도 정의는 키-값 매핑이어야 합니다
  地图文件 {rel} 内的 key 为 {inner}，与文件名不一致: 지도 파일 {rel} 내부의 key({inner})가 파일 이름과 일치하지 않습니다
  地域名称不能为空，且 key 不得重复: 지역 이름은 비워 둘 수 없으며 key는 중복될 수 없습니다
  大地图: 전체 지도
  底图数据为空: 기본 지도 데이터가 비어 있습니다
  底图文件名固定为 base.png: 기본 지도 파일 이름은 base.png로 고정되어 있습니다
  探查图片名称不能为空，且 key 不得重复: 탐사 이미지 이름은 비워 둘 수 없으며 key는 중복될 수 없습니다
  '探查图片引用了不存在的地域: {region}': '탐사 이미지가 존재하지 않는 지역을 참조합니다: {region}'
  探查图片必须有有效的 SHA256 摘要: 탐사 이미지에는 유효한 SHA256 해시가 있어야 합니다
  '探查图片缺失或摘要不匹配: {name}': '탐사 이미지가 누락되었거나 해시가 일치하지 않습니다: {name}'
  '未知导航模式: {mode}': '알 수 없는 내비게이션 모드: {mode}'
  '未知朝向识别方法: {method}': '알 수 없는 방향 인식 방법: {method}'
