  当前密码: Mot de passe actuel
  当前设备不是初始同步设备: Cet appareil n'est pas l'appareil de synchronisation initiale
  总览: Vue d'ensemble
  ? '把本机当前全部角色数据上传为云端总览基线。

    初始同步会自动创建一次；之后需要时手动点。'
  : 'Envoyer toutes les données locales des personnages comme base de référence cloud.

    La synchronisation initiale en crée une automatiquement ; cliquez manuellement plus tard si besoin.'
  操作未完成: Opération incomplète
  数据同步: Synchronisation des données
  文档: Documentation
  新密码至少 8 位: Le nouveau mot de passe doit contenir au moins 8 caractères
  新密码（至少 8 位）: Nouveau mot de passe (au moins 8 caractères)
  显示密码: Afficher le mot de passe
  最近同步时间：{}: 'Dernière synchronisation : {}'
  最近活跃: Dernière activité
  未知设备: Appareil inconnu
  检测到云端覆盖待确认；点「立即同步」处理。: Un écrasement cloud attend confirmation ; cliquez sur « Synchroniser maintenant » pour le traiter.
  正在修改密码…: Modification du mot de passe…
  正在同步…: Synchronisation…
  正在备份并应用云端快照…: Sauvegarde et application de l'instantané cloud…
  正在清除同步…: Effacement de la synchronisation…
  正在登录…: Connexion…
  注册: S'inscrire
  清除同步: Effacer la synchronisation
  登出: Se déconnecter
  登录: Se connecter
  登录后可同步角色名册、文档与总览数据: Connectez-vous pour synchroniser les listes de personnages, documents et données de vue d'ensemble
  确定让该设备下线？该设备上的全部会话会立即失效。: Déconnecter cet appareil ? Toutes les sessions sur cet appareil seront immédiatement invalidées.
  确认后会先把本机 profile 数据备份到 config/session/_sync-backup-<时间戳>/，再应用云端快照；可在该目录恢复。: Après confirmation, les données locales du profil seront sauvegardées dans config/session/_sync-backup-<horodatage>/ avant d'appliquer l'instantané cloud ; vous pourrez restaurer depuis ce dossier.
  立即同步: Synchroniser maintenant
  自助服务…: Libre-service…
  设备登出: Déconnecter l'appareil
  设备管理: Gestion des appareils
  复制ID: Copier l'ID
