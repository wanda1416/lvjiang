  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : '引擎算出的點選/拖拽座標跑到畫面外時怎麼辦。

    不勾選（預設）：報錯並結束本次執行——越界說明指令碼的位移引數與當前面板幾何不匹配，自動截斷會把「滾兩行」悄悄變成「滾一行」，指令碼和日誌都看不出來。

    勾選：引擎截斷到畫面邊界並記一條 warning，本次執行繼續。

    判定在引擎層完成：同一個越界座標，裝置端無障礙手勢是硬拒絕，而桌面與 adb shell input 會靜默接受，指望後端攔不住。'
