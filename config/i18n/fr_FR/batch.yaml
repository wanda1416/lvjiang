  批量设置: Paramètres par lots
  批量配置: Configuration par lots
  拖动可临时调整实际执行顺序: Faites glisser pour ajuster temporairement l'ordre d'exécution réel
  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: Faites glisser pour ajuster l'ordre d'exécution réel ; cliquez avec le bouton droit pour rétablir par défaut, mélanger ou trier par profil ; l'ordre dans la configuration par lots sert uniquement d'ordre initial
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: Faites glisser pour ajuster l'ordre d'exécution réel ; cliquez avec le bouton droit pour rétablir par défaut ou mélanger ; l'ordre dans la configuration par lots sert uniquement d'ordre initial
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: Faites glisser pour ajuster l'ordre d'exécution réel ; cliquez avec le bouton droit pour rétablir par défaut ou mélanger ; l'ordre dans la configuration par lots sert uniquement d'ordre initial
  指定顺序排序: Trier selon l'ordre défini
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: 'Non applicable lors de la planification par attribut : une valeur d''attribut peut correspondre à plusieurs utilisateurs, le workflow de préparation doit donc sélectionner et renvoyer le nom d''utilisateur et le cycle de vie s''exécute toujours. Revenir à « Nom d''utilisateur » rétablit votre choix initial'
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: 'Planifier par nom d''utilisateur ou par un attribut du profil. Ce réglage détermine la liste des candidats de la fenêtre principale, le contrat du cycle de vie et la validité du workflow de préparation : il fait donc partie du groupe de configuration'
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: La clé de tri appartient au groupe de configuration ; cliquez avec le bouton droit sur la liste des utilisateurs et choisissez « Trier par profil » pour trier une fois — l'ordre ne s'applique qu'à cette exécution
  新建配置: Nouvelle configuration
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: Utilisé pour ramener le jeu à l'écran de connexion après une pause anormale en mode autonome. La case « Autonome » de la fenêtre principale nécessite d'abord ce réglage
  无法开始批量任务: Impossible de démarrer le lot
  暂无启用的单元，请到「单元」页勾选: Aucune unité activée ; cochez-en dans l'onglet « Unités »
  暂无配置组，请先通过「工具 → 批量配置」添加: Aucun groupe de configuration ; ajoutez-en un via « Outils → Configuration par lots »
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: 'Cochez cette option pour une exécution autonome prolongée : en cas de pause anormale, la tâche n''attend plus — elle est marquée en échec et ignorée, puis le workflow de récupération du groupe ramène le jeu à l''écran de connexion avant la tâche suivante. Les confirmations, saisies et choix attendent toujours une interaction'
  条目准备: Préparation d'élément
  条目准备工作流不支持当前属性调度，请到批量配置中修改: Le workflow de préparation d'élément ne prend pas en charge la planification par attribut actuelle ; modifiez-le dans Configuration par lots
  条目收尾: Finalisation d'élément
  浏览...: Parcourir...
  点击查看本轮任务参数: Cliquez pour afficher les paramètres de ce tour
  用户独立参数: Paramètres dédiés par utilisateur
  确定删除当前批量配置吗？: Supprimer la configuration par lots actuelle ?
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: La première colonne contrôle l'affichage dans la fenêtre principale ; la seconde indique si l'élément est coché au premier chargement ou lors de « Rétablir par défaut ». Faites glisser pour ajuster l'ordre initial
  脚本: Script
  脚本候选: Scripts candidats
  请到「单元」页至少勾选一个执行单元: Cochez au moins une unité d'exécution dans l'onglet « Unités »
  请到「脚本」页至少勾选一个脚本: Cochez au moins un script dans l'onglet « Scripts »
  请在「工具 → 批量配置」中配置条目准备工作流: Configurez le workflow de préparation d'élément dans « Outils → Configuration par lots »
  请至少勾选一个脚本: Cochez au moins un script
  请选择 workflows 目录下的 .wf 文件: Sélectionnez un fichier .wf dans le dossier workflows
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: L'unité de planification appartient au groupe de configuration ; modifiez-la dans « Outils → Configuration par lots »
