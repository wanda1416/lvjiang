action_catalog:
  0=红 1=绿 2=蓝: 0=แดง 1=เขียว 2=น้ำเงิน
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / ปุ่มตัวอักษร / MOUSE_LEFT; บนอุปกรณ์ ESC=ย้อนกลับ
  OCR 扫描区域: พื้นที่สแกน OCR
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: บน PC พิมพ์ข้อความผ่านคลิปบอร์ดและ Ctrl+V รองรับโหมดเบื้องหลัง
  find 结果、矩形或坐标变量: ผลลัพธ์จาก find สี่เหลี่ยม หรือตัวแปรพิกัด
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: '"{label}" ต้องไม่มีเครื่องหมายอัญประกาศคู่หรือขึ้นบรรทัดใหม่ (สตริง DSL ไม่รองรับอักขระหลีก)'
  '「{label}」应为 #rrggbb': '"{label}" ควรอยู่ในรูปแบบ #rrggbb'
  「{label}」应为 {n} 个数: '"{label}" ควรเป็นตัวเลข {n} ค่า'
  「{label}」应为命名延迟（字母或中文开头的名字）: '"{label}" ควรเป็นชื่อดีเลย์ (ชื่อที่ขึ้นต้นด้วยตัวอักษรหรือตัวอักษรจีน)'
  「{label}」未填写: ยังไม่ได้กรอก "{label}"
  「{label}」的 {n} 个值都必须是数字: ค่าทั้ง {n} ค่าของ "{label}" ต้องเป็นตัวเลขทั้งหมด
  不带 by 得到文字；带 by 得到命中与否: หากไม่ระบุ by จะคืนค่าข้อความ หากระบุ by จะคืนค่าว่าพบหรือไม่
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: กรุณากรอก key เดียวสำหรับ "{label}" (เช่น ok) โดยไม่ใส่วงเล็บเหลี่ยมหรือคำนำหน้าฉาก
  不抖动: ไม่สุ่มสั่นไหว
  主导通道: ช่องสีหลัก
  交互: การโต้ตอบ
  亮段计数: นับช่วงสว่าง
  值/表达式: ค่า/นิพจน์
  停止应用: หยุดแอป
  内容: เนื้อหา
  出错也继续: ดำเนินการต่อแม้เกิดข้อผิดพลาด
  列表: รายการ
  到达后按住(秒): กดค้างหลังถึงปลายทาง (วินาที)
  匹配: จับคู่
  区域/点: พื้นที่/จุด
  区域里接近目标色的像素比例 0–1，判断按钮亮没亮/在哪个界面: สัดส่วนพิกเซลในพื้นที่ที่ใกล้เคียงสีเป้าหมาย (0–1) ใช้ตรวจสอบว่าปุ่มสว่างหรือไม่หรืออยู่หน้าจอใด
  取点亮度: อ่านความสว่างที่จุด
  取点颜色: อ่านสีที่จุด
  只判断是否含: ตรวจสอบเฉพาะว่ามีอยู่หรือไม่
  只看某区域: ตรวจเฉพาะพื้นที่ที่กำหนด
  向量倍数: ตัวคูณเวกเตอร์
  启动应用: เปิดแอป
  命名延迟，留空则不等待: ชื่อดีเลย์ หากเว้นว่างจะไม่รอ
  图库识别（分类）: การรู้จำคลังภาพ (จำแนกประเภท)
  图色: สีพิกเซล
  声明全局变量: ประกาศตัวแปรโกลบอล
  声明后可在主流程与所有子过程中共享读写: เมื่อประกาศแล้วสามารถอ่านและเขียนร่วมกันได้ทั้งในโฟลว์หลักและโพรซีเดอร์ย่อยทั้งหมด
  失败退出: ออกเมื่อไม่สำเร็จ
  如 $x > 0.5 / $v contains "ok" / not $hit: เช่น $x > 0.5 / $v contains "ok" / not $hit
  如果…: ถ้า…
  如果…否则…: ถ้า… มิฉะนั้น…
  字符串写双引号，或使用 $变量: ใส่สตริงในเครื่องหมายอัญประกาศคู่ หรือใช้ $ตัวแปร
  存入变量: เก็บในตัวแปร
  定义区域变量: กำหนดตัวแปรพื้นที่
  定义子过程: กำหนดโพรซีเดอร์ย่อย
  容差: ค่าความคลาดเคลื่อน
  应用名: ชื่อแอป
  延迟: ดีเลย์
  当…时重复: ทำซ้ำขณะที่…
  形如 [scene].[region]: รูปแบบ [scene].[region]
  形如 [scene].[region]，留空全画布: รูปแบบ [scene].[region] หากเว้นว่างจะใช้ทั้งแคนวาส
  形如 [scene].[region]；留空则搜索整个画布: รูปแบบ [scene].[region] หากเว้นว่างจะค้นหาทั้งแคนวาส
  循环变量: ตัวแปรวนซ้ำ
  感知: การรับรู้
  截图存档: บันทึกภาพหน้าจอลงคลัง
  打日志: เขียนบันทึก
  找同色图标: ค้นหาไอคอนสีเดียวกัน
  找图（模板定位）: ค้นหาภาพ (จับคู่เทมเพลต)
  找文字（可点击）: ค้นหาข้อความ (คลิกได้)
  拖拽区域翻页: ลากพื้นที่เพื่อเปลี่ยนหน้า
  拖拽（两点）: ลาก (สองจุด)
  按住(秒/区间): กดค้าง (วินาที/ช่วง)
  按区域绑定找图: ค้นหาภาพตามการผูกพื้นที่
  按压按键/鼠标键: กดปุ่มคีย์บอร์ด/ปุ่มเมาส์
  按布局中 Region 绑定的模板匹配，返回首个命中的区域 key: จับคู่เทมเพลตที่ผูกไว้กับ Region ในเลย์เอาต์ แล้วคืนค่า key ของพื้นที่แรกที่พบ
  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: หยุดแอป Android หรือ PC ตามประเภทที่ลงทะเบียนไว้ และยืนยันว่าโพรเซสปิดลงแล้ว
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: เปิดแอป Android หรือ PC ตามประเภทที่ลงทะเบียนไว้ และยืนยันว่าโพรเซสปรากฏขึ้นแล้ว
  控制流: การควบคุมโฟลว์
  搜索范围: ขอบเขตการค้นหา
  操作后等待: รอหลังดำเนินการ
  收集到输出: รวบรวมไปยังผลลัพธ์
  数据与输出: ข้อมูลและผลลัพธ์
  文字: ข้อความ
  文本/变量: ข้อความ/ตัวแปร
  暂停等人工: หยุดชั่วคราวรอผู้ใช้ดำเนินการ
  最低分(0-1): คะแนนต่ำสุด (0-1)
  最长等待(秒): เวลารอสูงสุด (วินาที)
  模板匹配区域: พื้นที่จับคู่เทมเพลต
  模板区域: พื้นที่เทมเพลต
  模板场景: ฉากเทมเพลต
  滑动时长(秒/区间): ระยะเวลาการปัด (วินาที/ช่วง)
  激活区域: เปิดใช้งานพื้นที่
  激活布局实体；默认点击中心，布局可改为按键: เปิดใช้งานเอนทิตีในเลย์เอาต์ ค่าเริ่มต้นคือคลิกกึ่งกลาง หรือเปลี่ยนเป็นปุ่มกดในเลย์เอาต์ได้
  点击变量: คลิกตัวแปร
  点击坐标: คลิกพิกัด
  点击画布归一化坐标: คลิกพิกัดแบบนอร์มัลไลซ์บนแคนวาส
  画布上点一下取值: คลิกบนแคนวาสเพื่อดึงค่า
  画布框选取值: ลากกรอบบนแคนวาสเพื่อดึงค่า
  画布框选的区域存成变量，之后 click / 图色函数都能用: บันทึกพื้นที่ที่ลากกรอบบนแคนวาสเป็นตัวแปร เพื่อให้ฟังก์ชัน click หรือฟังก์ชันสีพิกเซลนำไปใช้ต่อได้
  目标色: สีเป้าหมาย
  等待画面稳定: รอให้หน้าจอนิ่ง
  等待（命名延迟）: รอ (ชื่อดีเลย์)
  等待（秒）: รอ (วินาที)
  粘贴文本: วางข้อความ
  级别: ระดับ
  终点: จุดสิ้นสุด
  行/列数: จำนวนแถว/คอลัมน์
  读取当前布局的 Region 模板绑定，并在指定范围或全画布定位: อ่านการผูกเทมเพลตของ Region ในเลย์เอาต์ปัจจุบัน แล้วระบุตำแหน่งในขอบเขตที่กำหนดหรือทั้งแคนวาส
  调用子过程: เรียกโพรซีเดอร์ย่อย
  赋值: กำหนดค่า
  起点: จุดเริ่มต้น
  起点→终点向量放大/缩小，如 2 或 0.5: ขยายหรือย่อเวกเตอร์จากจุดเริ่มต้น→จุดสิ้นสุด เช่น 2 หรือ 0.5
  超时(秒): หมดเวลา (วินาที)
  输出键名: ชื่อคีย์ผลลัพธ์
  过程名: ชื่อโพรซีเดอร์
  返回列表，按面积降序；$first = $icons[0] 后可 click: คืนค่าเป็นรายการเรียงตามพื้นที่จากมากไปน้อย สามารถใช้ $first = $icons[0] แล้วสั่ง click ได้
  进入亮段阈值: เกณฑ์เข้าสู่ช่วงสว่าง
  退出阈值: เกณฑ์ออก
  通道下限: ค่าต่ำสุดของช่องสี
  遍历列表: วนซ้ำรายการ
  重复 N 次: ทำซ้ำ N ครั้ง
  重复直到…: ทำซ้ำจนกว่า…
  错误变量: ตัวแปรข้อผิดพลาด
  键名: ชื่อคีย์
  限定区域: จำกัดพื้นที่
  面板/区域: แผง/พื้นที่
  颜色占比: สัดส่วนสี
  高出其他通道: สูงกว่าช่องสีอื่น
