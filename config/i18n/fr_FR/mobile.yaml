  ℹ️ shell 通道不可用（Shizuku 未授权）。普通点击与截图不受影响: ℹ️ Canal shell indisponible (Shizuku non autorisé). Les clics ordinaires et captures d'écran ne sont pas affectés
  ✅ Shizuku 已授权：shell 通道可用: '✅ Shizuku autorisé : canal shell disponible'
  '✅ 支持输入时间线（并发手势）：声明 #% requires: [device_gesture] 的脚本可以运行': '✅ Chronologie d''entrée prise en charge (gestes simultanés) : les scripts déclarant #% requires: [device_gesture] peuvent s''exécuter'
  '❌ 不支持输入时间线：声明 #% requires: [device_gesture] 的脚本会在加载时被拒绝，需要先开启无障碍服务': '❌ Chronologie d''entrée non prise en charge : les scripts déclarant #% requires: [device_gesture] sont rejetés au chargement ; activez d''abord le service d''accessibilité'
  上一设备操作已完成；当前设备已切换，请刷新状态: L'opération précédente est terminée ; l'appareil actif a changé, actualisez l'état
  下发全部用户、任务配置和 Profile，仅携带所选布局及其继承依赖；保留手机历史、日志和结果。: Envoie tous les utilisateurs, configurations de tâches et profils, avec uniquement la disposition sélectionnée et ses dépendances héritées ; l'historique, les journaux et les résultats du téléphone sont conservés.
  下发配置: Envoyer la configuration
  下发配置（需激活功能）: Envoyer la configuration (activation requise)
