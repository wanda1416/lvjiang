  把激活码粘贴到这里，换行和空格会被自动忽略: Dán mã kích hoạt vào đây, ký tự xuống dòng và khoảng trắng sẽ tự động bị bỏ qua
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Nhận bản cập nhật cấu hình và tác vụ chính thức khớp với phiên bản ứng dụng hiện tại, có hiệu lực vào lần khởi động tới sau khi xác minh. Cấu hình cục bộ của bạn luôn được ưu tiên; tác vụ đang chạy tiếp tục dùng cấu hình đã tải. Khi tắt tùy chọn này hoặc chuyển sang chế độ ngoại tuyến, lần khởi động tới sẽ khôi phục cấu hình tích hợp và gỡ nội dung thành viên mà không ảnh hưởng dữ liệu cục bộ.
