  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'エンジンが算出したクリック／ドラッグ座標が画面外に出たときの動作です。

    チェックなし（デフォルト）：エラーを出して今回の実行を終了します（範囲外はスクリプトの移動量と現在のパネル形状が合っていないことを意味し、自動切り詰めを行うと「2行スクロール」が気づかぬうちに「1行スクロール」へ変わり、スクリプトにもログにも残りません）。

    チェックあり：エンジンが画面端に切り詰め、warning を記録して実行を続行します。

    判定はエンジン層で行います（同じ範囲外座標でもデバイス側ユーザー補助ジェスチャーは厳格に拒否する一方、デスクトップや adb shell input は黙って受け入れるためバックエンド任せにできません）。'
