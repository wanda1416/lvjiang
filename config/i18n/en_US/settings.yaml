  "获取连接信息": "Get Connection Info"
  "该热键只在「脚本编辑」工作台打开期间临时全局注册，对话框关闭后立即注销；其余热键在软件运行期间始终生效。": "This hotkey is only temporarily registered globally while the \"Script Editor\" workbench is open, and unregistered the moment the dialog closes; all other hotkeys stay active while the app runs."
  "请先粘贴激活码": "Paste an activation code first"
  "读不到硬件标识（非 Windows 平台）": "Hardware identity unavailable (non-Windows platform)"
  "越界坐标自动截断": "Auto-truncate out-of-bounds coordinates"
  "连接方案": "Connection Plans"
  "连接端侧执行时自动启动 Shizuku 服务": "Auto-start the Shizuku service when connecting in on-device mode"
  "部分激活码不绑定机器，直接粘贴即可，不需要提供序列号。": "Some activation codes aren't machine-bound — just paste them; no serial needed."
  "重置匿名标识": "Reset Anonymous ID"
  "重置后服务端会把你当成一个新用户，之前的记录无法再与新标识关联。确定重置吗？": "After resetting, the server will treat you as a new user; previous records can no longer be linked to the new ID. Reset anyway?"
  "重置标识": "Reset ID"
  "重试间隔（秒）": "Retry interval (seconds)"
  "需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。": "If your activation code is machine-bound, send this serial to the author. It's derived from the motherboard identity, computed at each launch, never stored, and contains no reversible hardware information."
  "首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。": "Used for both the initial stream setup and automatic recovery after a disconnect. Once exhausted the task waits for manual handling and never gives up by itself."
  "首次窗口定位后可自动获取": "Can be filled automatically after the first window location"
  "高级设置": "Advanced Settings"
  ? "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。"
  : "By default the video stream is set up 5 times, then the agent is reconnected 5 times and ADB 5 times, 2 s apart. If it still fails, the task waits for manual handling with no timeout: Yes re-checks, No stops the task; closing the prompt does not stop it and the banner stays.\nMulti-touch and concurrent gestures are not downgraded. Inputs that may already have been sent are never replayed automatically. Applies to tasks started afterwards."
  "鼠标/触控移动到目标位置的耗时": "Time for the mouse/touch to move to the target position"
  "鼠标移动时长(秒)": "Mouse Move Duration (sec)"
  "坐标越界处理": "Out-of-Bounds Handling"
  "坐标随机偏移(px)": "Random Coordinate Offset (px)"
