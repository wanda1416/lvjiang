  "仅合并已结束的手机记录；参数、Profile 和插件业务数据不回传。重复回传不会重复导入。": "Es werden nur abgeschlossene Telefoneinträge zusammengeführt; Parameter, Profile und Plugin-Daten werden nicht zurückübertragen. Erneutes Übertragen führt nicht zu doppelten Importen."
