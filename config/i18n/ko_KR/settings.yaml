  方案把图库、环境、布局绑成一个整体，并声明连接模式和启动权限要求。: 연결 프로필은 이미지 라이브러리, 환경, 레이아웃을 하나로 묶고 연결 모드와 실행 권한 요구 사항을 정의합니다.
  方案设置: 연결 프로필 설정
