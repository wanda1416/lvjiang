  该热键只在「脚本编辑」工作台打开期间临时全局注册，对话框关闭后立即注销；其余热键在软件运行期间始终生效。: Ce raccourci n'est enregistré globalement que tant que l'atelier « Éditeur de scripts » est ouvert, puis immédiatement désenregistré à sa fermeture ; les autres raccourcis restent actifs tant que le logiciel fonctionne.
  请先粘贴激活码: Veuillez d'abord coller un code d'activation
  读不到硬件标识（非 Windows 平台）: Identifiant matériel indisponible (plateforme non Windows)
