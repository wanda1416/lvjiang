  部分激活码不绑定机器，直接粘贴即可，不需要提供序列号。: 'Certains codes d''activation ne sont pas liés à la machine : collez-les directement sans fournir de numéro de série.'
  重置匿名标识: Réinitialiser l'identifiant anonyme
  重置后服务端会把你当成一个新用户，之前的记录无法再与新标识关联。确定重置吗？: Après réinitialisation, le serveur vous considérera comme un nouvel utilisateur et les anciens enregistrements ne pourront plus être associés au nouvel identifiant. Réinitialiser quand même ?
  重置标识: Réinitialiser l'identifiant
  重试间隔（秒）: Intervalle de nouvelle tentative (s)
  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: Pour un code d'activation lié à la machine, envoyez ce numéro de série à l'auteur. Il est calculé au démarrage à partir de la carte mère, jamais enregistré sur disque et ne contient aucune donnée matérielle réversible.
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: Partagé entre l'établissement initial du flux vidéo et sa récupération automatique après déconnexion. Une fois épuisé, la tâche attend une intervention manuelle sans jamais abandonner d'elle-même.
  首次窗口定位后可自动获取: Peut être rempli automatiquement après la première localisation de fenêtre
  高级设置: Paramètres avancés
  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'Par défaut, le flux vidéo est tenté 5 fois, puis l''agent 5 fois et ADB 5 fois, à 2 s d''intervalle. En cas d''échec persistant, la tâche attend indéfiniment une intervention manuelle : Oui revérifie, Non arrête la tâche ; fermer l''invite ne l''arrête pas et la bannière reste affichée.

    Les gestes multipoints et concurrents ne sont pas dégradés. Une action déjà potentiellement exécutée n''est jamais rejouée automatiquement. S''applique aux tâches lancées ensuite.'
  鼠标/触控移动到目标位置的耗时: Temps de déplacement de la souris ou du toucher jusqu'à la cible
  鼠标移动时长(秒): Durée de déplacement de la souris (s)
  坐标越界处理: Gestion des coordonnées hors limites
  坐标随机偏移(px): Décalage aléatoire des coordonnées (px)
  当前标识: Identifiant actuel
