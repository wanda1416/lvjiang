  "正在激活，请等待联网操作完成后关闭。": "Activating; wait for the online operation to finish before closing."
  "正在验证激活码；一次性码将联网绑定本机…": "Verifying the activation code; one-time codes will bind to this machine online…"
  "每个应用可同时绑定 Android 与 Windows。运行时按当前实际连接目标选择绑定，与工作流环境无关；连接后可用对应的「获取连接信息」自动回填。": "Each app can bind Android and Windows at once. At runtime the binding follows the actual connected target, independent of workflow environment; after connecting, the matching \"Get connection info\" fills it in automatically."
