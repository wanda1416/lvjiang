  已暂停公告检查、版本检查、在线配置更新和匿名数据上报；关闭离线模式后，将恢复之前的选择。: Se han pausado la comprobación de avisos, las comprobaciones de versión, las actualizaciones de configuración en línea y el envío anónimo de datos; al desactivar el modo sin conexión se restaurarán tus opciones anteriores.
