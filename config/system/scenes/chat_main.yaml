  - base
  - private
  to: /private
  navigation: switch
- key: chat_target
  name: 当前会话对象
  type: attr
  is_text: true
  is_clickable: false
  view: private
- key: gift_entry
  name: 赠礼入口
  type: func
  is_text: true
  is_clickable: true
  view: private
  to: /gift
  navigation: open
- key: gift_back
  name: 赠礼返回
  type: func
  is_text: false
  is_clickable: true
  views:
  - gift
  - item
- key: gift_target
  name: 赠礼对象
  type: attr
  is_text: true
  is_clickable: false
  view: gift
- key: gift_qty_max
  name: 赠礼数量拉满
  type: func
  is_text: false
  is_clickable: true
  view: gift
- key: item_name
  name: 道具名称
  type: attr
  is_text: true
  is_clickable: false
  view: item
- key: item_shop_tongyou
  name: 同游商店入口
  type: func
  is_text: true
  is_clickable: true
  view: item
  to: /shop
  navigation: open
- key: item_shop_jieyi
  name: 结义商店入口
  type: func
  is_text: true
  is_clickable: true
  view: item
  to: /shop
  navigation: open
- key: shop_stock
  name: 周库存
  type: attr
  is_text: true
  is_clickable: false
  view: shop
- key: shop_qty_max
  name: 购买数量拉满
  type: func
  is_text: false
  is_clickable: true
  view: shop
- key: shop_buy
  name: 购买
  type: func
  is_text: true
  is_clickable: true
  view: shop
- key: shop_back
