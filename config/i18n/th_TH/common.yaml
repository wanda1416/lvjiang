  ? '实验性功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。

    用 Windows Graphics Capture 取帧，游戏窗口被别的窗口盖住也能截图；窗口最小化时仍然拿不到画面。仅本次运行期间生效'
  : 'ฟีเจอร์ทดลอง: สคริปต์จำนวนมากยังไม่สามารถรันผ่านในโหมดนี้ได้ จึงไม่รับแจ้งปัญหาใช้งานไม่ได้

    ใช้ Windows Graphics Capture ดึงเฟรม ทำให้จับภาพได้แม้หน้าต่างเกมถูกหน้าต่างอื่นบัง แต่เมื่อย่อหน้าต่างจะยังจับภาพไม่ได้ มีผลเฉพาะรอบการรันนี้'
  ? '局域网内未发现可连接的 ADB 设备。


    请确认：

    1. 设备与电脑在同一局域网

    2. 设备已开启无线调试（开发者选项）

    3. 多网卡时可在下拉框改选目标网段，或改用本地扫描'
  : 'ไม่พบอุปกรณ์ ADB ที่เชื่อมต่อได้ใน LAN


    กรุณาตรวจสอบ:

    1. อุปกรณ์และคอมพิวเตอร์อยู่ใน LAN เดียวกัน

    2. อุปกรณ์เปิดการดีบักไร้สายแล้ว (ตัวเลือกนักพัฒนา)

    3. หากมีหลายการ์ดเครือข่าย ให้เลือกวงเครือข่ายเป้าหมายในรายการ หรือใช้การสแกนในเครื่องแทน'
