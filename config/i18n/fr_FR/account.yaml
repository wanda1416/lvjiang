  ? '将清空云端的定义、用户、文档与总览数据（账号与登录态保留）。

    此操作不可恢复；本地数据不会被删除。'
  : 'Cette opération efface les définitions, utilisateurs, documents et données de vue d''ensemble sur le cloud (le compte et la session restent conservés).

    Cette action est irréversible ; les données locales ne sont pas supprimées.'
  已取消覆盖：本机数据未改动，profile 同步未启用。: 'Écrasement annulé : les données locales sont inchangées et la synchronisation du profil n''est pas activée.'
