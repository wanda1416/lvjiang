  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Erzeugt lesbare, direkt bearbeitbare WF-DSL. Beim Stoppen werden sicher zusammenführbare Tastendrücke, Halten, Loslassen und folgende Wartezeiten zusammengefasst; kontinuierliche Mausbewegungen und kurze Pausen werden im ~100-ms-Raster gebündelt. Ideal für reguläre UI-Abläufe und Nachbearbeitung, nicht jedoch für Kamerabewegungen mit exakter Roh-Wiedergabe.
