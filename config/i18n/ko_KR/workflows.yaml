  'find_multi_color: 偏移点应为 [dx, dy, "#rrggbb"]，实际: {v!r}': 'find_multi_color: 오프셋 지점은 [dx, dy, "#rrggbb"] 형식이어야 합니다. 실제값: {v!r}'
  'find_multi_color: 缺少锚点颜色': 'find_multi_color: 기준점 색상이 누락되었습니다'
  '{name}: 需要数值，实际: {v!r}': '{name}: 숫자가 필요합니다. 실제값: {v!r}'
  '{what}: 需要坐标引用（$var = [scene].[region]、find 结果或 (x, y[, w, h]) 字面量），实际: {t}': '{what}: 좌표 참조($var = [scene].[region], find 결과 또는 (x, y[, w, h]) 리터럴)가 필요합니다. 실제값: {t}'
  '{what}: 需要坐标引用，实际: {t}': '{what}: 좌표 참조가 필요합니다. 실제값: {t}'
  图色函数需要在工作流引擎中调用: 픽셀/색상 함수는 워크플로 엔진 내부에서 호출해야 합니다
  图色函数：截图失败: '픽셀/색상 함수: 스크린샷 실패'
  图色函数：画布裁剪为空（检查布局 canvas 配置）: '픽셀/색상 함수: 캔버스 자르기 결과가 비어 있습니다(레이아웃 canvas 설정을 확인하세요)'
  工作流已暂停，点击确定继续: 워크플로가 일시정지되었습니다. 계속하려면 확인을 클릭하세요
  无法获取截屏尺寸，无法换算屏幕坐标（检查截屏后端）: 스크린샷 크기를 가져올 수 없어 화면 좌표로 변환할 수 없습니다(캡처 백엔드를 확인하세요)
  等分降级: 균등 분할 대체
