- key: materials
  name: 材料格
  min_visible: 0.95
  calibration: even
  scroll_direction: none
references:
- scene: general_control
  entity: confirm
  view: reset_confirm
- scene: general_control
  entity: cancel
  view: reset_confirm
- scene: general_control
  entity: blank_area
  view: return_good
