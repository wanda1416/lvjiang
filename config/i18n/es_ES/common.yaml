  "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。": "Por defecto se intenta iniciar el flujo de vídeo 5 veces; si falla, se reconecta el agente 5 veces y ADB 5 veces con intervalos de 2 s. Si sigue sin estar disponible, espera indefinidamente intervención manual: «Sí» vuelve a comprobar y «No» detiene la tarea; cerrar el aviso no detiene la tarea y el banner superior permanece visible.\nLos gestos multitáctiles y concurrentes no se degradan. Si no es seguro que una acción se haya ejecutado, no se repite automáticamente. Se aplica a las tareas iniciadas después."
