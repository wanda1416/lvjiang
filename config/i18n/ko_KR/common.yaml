scrcpy_capture:
  5 秒内未收到首帧（手机息屏、锁屏或当前画面无法编码时会出现）；请点亮屏幕后重试: 5초 이내에 첫 프레임을 수신하지 못했습니다(휴대폰 화면 꺼짐, 잠금 화면 또는 현재 화면 인코딩 불가 시 발생). 화면을 켠 후 다시 시도하세요
  scrcpy server 启动失败（返回码 {rc}）：{detail}: 'scrcpy server 시작 실패 (종료 코드 {rc}): {detail}'
