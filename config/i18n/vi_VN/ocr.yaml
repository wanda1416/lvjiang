  重命名规则组: Đổi tên nhóm quy tắc
  ? "默认规则对所有 OCR 全局生效；scan/find 的 with 声明会在默认规则后叠加所选业务规则组。\n改完点「保存」后生效，无需重启；未保存的修改可以用「撤销」恢复。"
  : "Quy tắc mặc định áp dụng toàn cục cho mọi OCR; mệnh đề with của scan/find sẽ xếp chồng nhóm quy tắc nghiệp vụ đã chọn sau quy tắc mặc định.\nNhấn \"Lưu\" để áp dụng ngay không cần khởi động lại; thay đổi chưa lưu có thể khôi phục bằng \"Hoàn tác\"."
  默认规则（全局）: Quy tắc mặc định (toàn cục)
  ? "识别性能作用于所有识别调用：并行度越高越快，但也会按比例占用 CPU。\n保存后从下一次识别开始生效，不需要重启。"
  : "Hiệu năng nhận diện áp dụng cho mọi lần gọi nhận diện: mức song song càng cao càng nhanh, nhưng cũng tiêu tốn CPU tương ứng.\nSau khi lưu sẽ có hiệu lực từ lần nhận diện tiếp theo, không cần khởi động lại."
  识别性能: Hiệu năng nhận diện
  单次识别内部使用的线程数。默认 2：实测再往上不会更快，只会推高整机 CPU 占用；填 1 最省 CPU，适合后台长跑。: "Số luồng dùng bên trong mỗi lần nhận diện. Mặc định là 2: thực tế tăng cao hơn không nhanh hơn mà chỉ làm tăng tải CPU toàn máy; đặt 1 để tiết kiệm CPU nhất, phù hợp chạy nền dài hạn."
  识别线程数: Số luồng nhận diện
  同时并行的算子路数。检测、分类、识别三个模型各自已有线程池，调大通常只增加调度争抢，默认 1。: "Số nhánh toán tử chạy song song cùng lúc. Ba mô hình phát hiện, phân loại và nhận diện đều đã có nhóm luồng riêng, tăng lên thường chỉ gây tranh chấp điều phối; mặc định là 1."
  并行算子线程数: Số luồng toán tử song song
  检测前把画面按短边缩放到该值：大图缩小、小图放大。调小更快更省 CPU，但小字号更容易漏检；736 是出厂值，没有特别需求不要动。: "Trước khi phát hiện, khung hình sẽ được thu phóng theo cạnh ngắn về giá trị này: ảnh lớn thu nhỏ, ảnh nhỏ phóng to. Giảm nhỏ sẽ nhanh hơn và tiết kiệm CPU hơn nhưng dễ bỏ sót chữ nhỏ; 736 là giá trị gốc, không có nhu cầu đặc biệt thì không nên thay đổi."
  检测输入短边: Cạnh ngắn đầu vào phát hiện
