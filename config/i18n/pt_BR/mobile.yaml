  ? '测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。

    请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。'
  : 'O teste mantém o canto inferior esquerdo da tela pressionado por um tempo enquanto toca duas vezes no canto inferior direito — ou seja, "segurar o analógico enquanto toca".

    Deixe o celular em uma tela do jogo onde seja possível ver movimento e pulo, depois clique em Iniciar.'
  版本: Versão
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: Quando as versões diferem, o protocolo e as configurações integradas podem ficar incompatíveis. Recomenda-se atualizar o lado mais antigo para igualar
  用 PC 配置覆盖手机任务参数和用户名册。: Sobrescreve os parâmetros de tarefa e a lista de usuários do celular com a configuração do PC.
  用 PC 配置覆盖手机批量配置。: Sobrescreve as configurações em lote do celular com a configuração do PC.
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: Escaneie com o celular para baixar e instalar a partir deste PC. O celular precisa estar na mesma rede local, sem necessidade de internet.
  ? '用手机扫码，直接从 GitHub 下载安装。

    手机上不了网时，改用右侧「本机共享」。'
  : 'Escaneie com o celular para baixar e instalar diretamente do GitHub.

    Se o celular estiver sem internet, use "Compartilhamento local" à direita.'
