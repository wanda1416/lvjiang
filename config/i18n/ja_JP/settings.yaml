  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: 端末バインドが必要なアクティベーションコードの場合は、このシリアル番号を作者へ送付してください。マザーボード識別子から毎回起動時に算出され、保存されず、復元可能なハードウェア情報も含みません。
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: 初回ストリーム確立と切断後の自動復旧でこの回数を共有します。使い切ると手動対応待ちになり、タスクを自動放棄しません。
  首次窗口定位后可自动获取: 初回ウィンドウ特定後に自動取得できます
  高级设置: 詳細設定
  "默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。\n多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。": "デフォルトでは映像ストリーム確立を 5 回試行し、失敗後にエージェント再接続 5 回、ADB 再接続 5 回を 2 秒間隔で行います。それでも復旧しない場合は無期限で手動対応待ちになります（「はい」で再確認、「いいえ」で対象タスクを停止。ダイアログを閉じてもタスクは停止せず、上部バナーが維持されます）。\nマルチタッチや同時ジェスチャーはフォールバックしません。実行済みか不明な操作は自動再送しません。設定は以降に開始するタスクから適用されます。"
