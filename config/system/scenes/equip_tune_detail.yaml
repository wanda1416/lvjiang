  name: 未展开提示
  type: func
  is_text: true
  is_clickable: true
- key: expand
  name: 展开
  type: func
  is_text: false
  is_clickable: true
- key: tune_affix
  name: 调律词条
  type: attr
  is_text: true
  is_clickable: false
  view: result
- key: tune_tip
