  未单独标定点击区域时，落点框从区域中心向四边延伸的比例。0.25 = 落点覆盖区域中间的一半；必须小于 0.5: 클릭 영역을 별도로 보정하지 않았을 때 영역 중심에서 네 변으로 확장되는 클릭 범위 비율입니다. 0.25는 영역 중앙의 절반을 덮으며 0.5 미만이어야 합니다
  未知日期: 알 수 없는 날짜
