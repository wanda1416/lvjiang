  扫码安装: Escanear para instalar
  拿不到屏幕尺寸，无法下发手势: No se puede obtener el tamaño de pantalla; no se pueden enviar gestos
  新增附件：{count} 个: 'Adjuntos nuevos: {count}'
  旋转: Rotación
  无可用局域网地址: No hay dirección LAN disponible
  无法启动本机共享: No se puede iniciar la compartición local
  无法连接离线执行接口，请先打开手机 App 并更新 APK: No se puede conectar con la interfaz de ejecución sin conexión; abre primero la app móvil y actualiza el APK
  无法连接设备端代理: No se puede conectar con el agente del dispositivo
  无障碍服务: Servicio de accesibilidad
  无障碍服务未开启，无法执行手势测试: El servicio de accesibilidad no está activado; no se puede ejecutar la prueba de gestos
  旧版 app 不上报版本，建议升级到与 PC 相同的版本: La app antigua no informa de su versión; se recomienda actualizarla a la misma versión que el PC
  旧版 app 不上报该值，升级后可见: La app antigua no informa de este valor; será visible tras actualizar
  最近一次操作: Última operación
  未上报: Sin informar
  未发现可连接的设备: No se encontraron dispositivos conectables
  未开启: Desactivado
  未比对（取不到 SHA256SUMS）: Sin verificar (SHA256SUMS no disponible)
  未运行: No está en ejecución
  未连接设备，无法判断可用能力: No hay ningún dispositivo conectado; no se pueden determinar las capacidades disponibles
  本地 APK 校验失败：{err}: 'Error al verificar el APK local: {err}'
  本地安装包: Paquete local
  本机不支持多路并发，输入时间线无法落地: Este equipo no admite concurrencia multicanal; no se puede ejecutar la línea de tiempo de entrada
  本机共享（局域网）: Compartición local (LAN)
  本机尚无安装包: Aún no hay paquete local
