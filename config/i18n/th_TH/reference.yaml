  保存空间展示名失败，详见日志: บันทึกชื่อที่แสดงของพื้นที่ไม่สำเร็จ ดูรายละเอียดในบันทึก
  空间 key: key ของพื้นที่
  key 是目录名与方案里的引用，不可修改；要换 key 请新建空间。展示名留空则直接显示 key。: key คือชื่อโฟลเดอร์และชื่ออ้างอิงในแผนงาน จึงไม่สามารถแก้ไขได้ หากต้องการเปลี่ยน key กรุณาสร้างพื้นที่ใหม่ หากเว้นชื่อที่แสดงว่างไว้จะแสดง key โดยตรง
  无法创建空间，详见日志: ไม่สามารถสร้างพื้นที่ได้ ดูรายละเอียดในบันทึก
  空间 key 不能为空: key ของพื้นที่ต้องไม่ว่างเปล่า
  空间 key 不能包含路径分隔符或特殊字符: key ของพื้นที่ต้องไม่มีตัวคั่นพาธหรืออักขระพิเศษ
  同名空间已存在: มีพื้นที่ชื่อนี้อยู่แล้ว
  小写字母、数字与下划线，如 android: ตัวอักษรพิมพ์เล็ก ตัวเลข และขีดล่าง เช่น android
  key 是目录名与方案里的引用，编辑时不可修改: key คือชื่อโฟลเดอร์และชื่ออ้างอิงในแผนงาน ไม่สามารถแก้ไขได้ขณะแก้ไข
  key 是目录名与方案里的引用，创建后不可修改。简体中文与英文必须填写。: key คือชื่อโฟลเดอร์และชื่ออ้างอิงในแผนงาน ไม่สามารถแก้ไขได้หลังสร้าง ต้องกรอกทั้งภาษาจีนตัวย่อและภาษาอังกฤษ
  简体中文与英文都必须填写: ต้องกรอกทั้งภาษาจีนตัวย่อและภาษาอังกฤษ
