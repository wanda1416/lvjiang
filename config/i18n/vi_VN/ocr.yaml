  区域批量识别: Nhận diện vùng hàng loạt
  ? "区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。\n这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。"
  : "Nhận diện vùng hàng loạt sẽ ghép nhiều vùng văn bản thành một khung vẽ và chỉ gọi OCR một lần.\nCác tham số này điều chỉnh kích thước ảnh ghép; có hiệu lực từ lần nhận diện tiếp theo sau khi lưu."
  原始文本: Văn bản gốc
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: "Cấu hình OCR có thay đổi chưa lưu, bạn có chắc muốn thoát và hủy bỏ không?"
  "图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*)": "Tệp hình ảnh (*.png *.jpg *.jpeg *.bmp *.webp);;Tất cả tệp (*)"
  已撤销未保存的清洗规则修改: Đã hoàn tác các thay đổi quy tắc làm sạch chưa lưu
