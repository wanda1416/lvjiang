  ? '局域网扫描用于发现已开启无线 ADB 的设备；本机端口扫描用于发现只监听 127.0.0.1 的模拟器。

    扫描只建立 ADB 连接，不会切换主界面的执行目标。'
  : 'L''analyse LAN détecte les appareils avec ADB sans fil activé ; l''analyse des ports locaux détecte les émulateurs écoutant uniquement sur 127.0.0.1.

    L''analyse établit seulement les connexions ADB sans changer la cible d''exécution de la fenêtre principale.'
