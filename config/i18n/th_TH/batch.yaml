  用户独立参数: พารามิเตอร์เฉพาะผู้ใช้
  确定删除当前批量配置吗？: ต้องการลบการตั้งค่าแบบชุดปัจจุบันหรือไม่?
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: คอลัมน์แรกกำหนดว่าจะแสดงในหน้าหลักหรือไม่ คอลัมน์ที่สองกำหนดว่าจะติ๊กเลือกไว้เมื่อโหลดหน้าหลักครั้งแรกหรือเมื่อกด «คืนค่าเริ่มต้น» หรือไม่ ลากเพื่อปรับลำดับเริ่มต้น
  脚本: สคริปต์
  脚本候选: ตัวเลือกสคริปต์
  请到「单元」页至少勾选一个执行单元: กรุณาเลือกหน่วยการทำงานอย่างน้อย 1 หน่วยที่แท็บ «หน่วย»
  请到「脚本」页至少勾选一个脚本: กรุณาเลือกสคริปต์อย่างน้อย 1 รายการที่แท็บ «สคริปต์»
  请在「工具 → 批量配置」中配置条目准备工作流: กรุณาตั้งค่าเวิร์กโฟลว์เตรียมรายการใน «เครื่องมือ → ตั้งค่าแบบชุด»
  请至少勾选一个脚本: กรุณาเลือกสคริปต์อย่างน้อย 1 รายการ
  请选择 workflows 目录下的 .wf 文件: กรุณาเลือกไฟล์ .wf ภายใต้โฟลเดอร์ workflows
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: หน่วยจัดคิวเป็นนิยามของกลุ่มการตั้งค่า แก้ไขได้ใน «เครื่องมือ → ตั้งค่าแบบชุด»
  选择工作流文件: เลือกไฟล์เวิร์กโฟลว์
  配置名称已存在: มีชื่อการตั้งค่านี้อยู่แล้ว
  重命名配置: เปลี่ยนชื่อการตั้งค่า
  随机打乱顺序: สุ่มสลับลำดับ
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: ต้องตั้งค่า «เวิร์กโฟลว์กู้คืน» ให้กลุ่มการตั้งค่านี้ใน «เครื่องมือ → ตั้งค่าแบบชุด» ก่อน โหมดอัตโนมัติจำเป็นต้องใช้เพื่อดึงเกมกลับไปยังหน้าเข้าสู่ระบบเมื่อเกิดการหยุดผิดปกติ
  默认执行: ทำงานเป็นค่าเริ่มต้น
  配置名称: ชื่อการตั้งค่า
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: สำหรับเป้าหมาย Android หากอยู่ในแนวตั้งตอนเริ่มงานแบบชุด จะอนุญาตให้เริ่มได้ตราบใดที่เมื่อสลับความกว้างกับความสูงแล้วสัดส่วนตรงกับผืนผ้าใบเลย์เอาต์ หลังเริ่มแล้ว «เวิร์กโฟลว์กู้คืน» ของกลุ่มจะพากลับหน้าเข้าสู่ระบบ จากนั้น «เวิร์กโฟลว์เตรียมรายการ» จะส่งกลับเข้าเกม ต้องตั้งค่าทั้งสองเวิร์กโฟลว์ใน «เครื่องมือ → ตั้งค่าแบบชุด»
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: ต้องตั้งค่าทั้ง «เวิร์กโฟลว์กู้คืน» และ «เวิร์กโฟลว์เตรียมรายการ» ให้กลุ่มการตั้งค่านี้ใน «เครื่องมือ → ตั้งค่าแบบชุด» ก่อน การเริ่มจากแนวตั้งจะดึงเกมกลับหน้าเข้าสู่ระบบก่อน หากไม่มีเวิร์กโฟลว์เตรียมรายการจะไม่สามารถส่งกลับเข้าเกมได้
  允许竖屏需要先配置条目准备工作流: การอนุญาตแนวตั้งต้องตั้งค่าเวิร์กโฟลว์เตรียมรายการก่อน
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: เมื่อเริ่มด้วย «อนุญาตแนวตั้ง» ระบบจะใช้เวิร์กโฟลว์กู้คืนดึงไคลเอนต์กลับหน้าเข้าสู่ระบบก่อน แล้วต้องใช้เวิร์กโฟลว์เตรียมรายการส่งกลับเข้าเกม กรุณาตั้งค่าเวิร์กโฟลว์เตรียมรายการให้กลุ่มนี้ใน «เครื่องมือ → ตั้งค่าแบบชุด» ก่อน
