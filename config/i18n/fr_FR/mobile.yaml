  ? "测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。\n请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。"
  : "The test holds the bottom-left of the screen for a while while tapping the bottom-right twice — \"holding the joystick while tapping\".\nPut the phone on a game screen where movement and jumping are visible, then click Start."
  版本: Version
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: With mismatched versions, protocol and bundled configs may disagree. Upgrade the lower side to match
  用 PC 配置覆盖手机任务参数和用户名册。: Overwrite the phone's task parameters and user roster with PC configs.
  用 PC 配置覆盖手机批量配置。: Overwrite the phone's batch configs with PC configs.
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: Scan with the phone to download and install from this PC. The phone must be on the same LAN but needs no internet.
  ? "用手机扫码，直接从 GitHub 下载安装。\n手机上不了网时，改用右侧「本机共享」。"
  : "Scan with the phone to download and install directly from GitHub.\nIf the phone has no internet, use \"Local Sharing\" on the right instead."
