  正在修改密码…: パスワードを変更中…
  正在同步…: 同期中…
  正在备份并应用云端快照…: バックアップしてクラウドスナップショットを適用中…
  正在清除同步…: 同期データを消去中…
  正在登录…: ログイン中…
  注册: 新規登録
  清除同步: 同期をクリア
  登出: ログアウト
  登录: ログイン
  登录后可同步角色名册、文档与总览数据: ログインするとキャラクター名簿、ドキュメント、概要データを同期できます
  确定让该设备下线？该设备上的全部会话会立即失效。: この端末をオフラインにしますか？この端末上のすべてのセッションは直ちに無効になります。
  确认后会先把本机 profile 数据备份到 config/session/_sync-backup-<时间戳>/，再应用云端快照；可在该目录恢复。: 確認後、先にローカルの profile データを config/session/_sync-backup-<タイムスタンプ>/ にバックアップしてからクラウドスナップショットを適用します。そのディレクトリから復元できます。
  立即同步: 今すぐ同期
  自助服务…: セルフサービス…
