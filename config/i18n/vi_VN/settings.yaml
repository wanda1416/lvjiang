  ? "引擎算出的点击/拖拽坐标跑到画面外时怎么办。\n不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。\n勾选：引擎截断到画面边界并记一条 warning，本次运行继续。\n判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。"
  : "Cách xử lý khi tọa độ nhấp/kéo do công cụ tính toán nằm ngoài khung hình.\nKhông chọn (mặc định): báo lỗi và kết thúc phiên chạy — vượt biên nghĩa là tham số dịch chuyển của script không khớp hình học bảng hiện tại, tự cắt biên sẽ âm thầm biến \"cuộn hai dòng\" thành \"cuộn một dòng\" mà script lẫn nhật ký đều không thấy.\nChọn: công cụ cắt về biên khung hình, ghi một cảnh báo và tiếp tục chạy.\nViệc kiểm tra diễn ra ở tầng công cụ: cùng tọa độ vượt biên, cử chỉ trợ năng trên thiết bị sẽ từ chối cứng, còn máy tính và adb shell input lại âm thầm chấp nhận nên không thể trông cậy vào phần phụ trợ."
  当前标识：未生成（未开启）: "Định danh hiện tại: chưa tạo (chưa bật)"
  手机重启后 Shizuku 服务进程会死亡，需要重启游戏的任务依赖它。开启后在连接端侧执行时自动检测并启动一次（仅在未运行时启动）。: "Sau khi khởi động lại điện thoại, tiến trình dịch vụ Shizuku sẽ dừng, trong khi các tác vụ cần khởi động lại trò chơi phụ thuộc vào nó. Khi bật, kết nối ở chế độ trên thiết bị sẽ tự động kiểm tra và khởi chạy một lần (chỉ khi chưa chạy)."
  执行参数: Tham số thực thi
  把激活码粘贴到这里，换行和空格会被自动忽略: "Dán mã kích hoạt vào đây, ký tự xuống dòng và khoảng trắng sẽ tự động bị bỏ qua"
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: "Nhận bản cập nhật cấu hình và tác vụ chính thức khớp với phiên bản ứng dụng hiện tại, có hiệu lực ở lần khởi động tiếp theo sau khi xác minh. Cấu hình cục bộ luôn được ưu tiên; tác vụ đang chạy tiếp tục dùng cấu hình đã nạp. Tắt tùy chọn này hoặc bật chế độ ngoại tuyến sẽ khôi phục bản tích hợp sẵn và gỡ nội dung hội viên ở lần khởi động sau mà không ảnh hưởng dữ liệu cục bộ."
