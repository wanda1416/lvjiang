  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Genera código WF DSL legible y editable directamente. Al detener la grabación, fusiona pulsaciones, retenciones, liberaciones y esperas posteriores cuando es seguro; los movimientos continuos del ratón y esperas cortas se agrupan en intervalos de unos 100 ms. Ideal para flujos de interfaz normales y ajustes manuales, pero no para cámaras de juego que requieran reproducción exacta de cada evento sin procesar.
