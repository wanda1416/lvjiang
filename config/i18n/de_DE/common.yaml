  ? "引擎算出的点击/拖拽坐标跑到画面外时怎么办。\n不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。\n勾选：引擎截断到画面边界并记一条 warning，本次运行继续。\n判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。"
  : "Verhalten, wenn von der Engine berechnete Klick-/Ziehkoordinaten außerhalb des Bildes liegen.\nDeaktiviert (Standard): Fehler auslösen und Lauf beenden – eine Bereichsüberschreitung zeigt, dass die Verschiebung nicht zur Panel-Geometrie passt; stilles Abschneiden würde „zwei Zeilen scrollen“ unbemerkt zu „eine Zeile“ verkürzen.\nAktiviert: Engine begrenzt auf den Bildrand, protokolliert eine Warnung und läuft weiter.\nDie Prüfung erfolgt in der Engine, da Geräte-Bedienungshilfen solche Koordinaten hart ablehnen, Desktop und adb shell input sie jedoch still akzeptieren."
