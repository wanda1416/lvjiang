  ? "测试会在屏幕左下角按住一段时间，期间在右下角点两次——也就是「推着摇杆同时连点」。\n请先把手机停在游戏里能看出移动和跳跃的画面，再点开始。"
  : "Bài kiểm tra sẽ nhấn giữ góc dưới bên trái màn hình một lúc, đồng thời chạm hai lần ở góc dưới bên phải — tức là \"vừa đẩy cần điều khiển vừa chạm liên tiếp\".\nVui lòng để điện thoại ở màn hình trò chơi có thể thấy rõ di chuyển và nhảy rồi bấm bắt đầu."
  版本: Phiên bản
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: "Khi phiên bản không khớp, cả giao thức lẫn cấu hình đi kèm đều có thể sai lệch. Nên nâng cấp phía thấp hơn cho khớp"
  用 PC 配置覆盖手机任务参数和用户名册。: Ghi đè tham số tác vụ và danh sách người dùng trên điện thoại bằng cấu hình từ PC.
  用 PC 配置覆盖手机批量配置。: Ghi đè cấu hình hàng loạt trên điện thoại bằng cấu hình từ PC.
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: Quét mã bằng điện thoại để tải và cài đặt từ máy tính này. Điện thoại cần cùng mạng LAN với máy tính nhưng không cần có internet.
  ? "用手机扫码，直接从 GitHub 下载安装。\n手机上不了网时，改用右侧「本机共享」。"
  : "Quét mã bằng điện thoại để tải và cài đặt trực tiếp từ GitHub.\nNếu điện thoại không vào được mạng, hãy dùng mục \"Chia sẻ cục bộ\" ở bên phải."
  由本机提供下载，手机不需要能上网: "Tải xuống do máy tính này cung cấp, điện thoại không cần kết nối internet"
