about:
  仅限非商业使用: Chỉ dành cho mục đích phi thương mại
  律匠: LvJiang
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: Dự án này chỉ dành cho mục đích học tập và nghiên cứu kỹ thuật. Việc sử dụng công cụ tự động hóa để thao tác trò chơi có thể vi phạm điều khoản người dùng của trò chơi liên quan; người sử dụng tự chịu mọi hậu quả phát sinh.
  本项目源码公开、免费使用: "Dự án mã nguồn mở, sử dụng miễn phí"
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: "Định vị & chụp cửa sổ → Đánh dấu vùng → Nhận diện OCR → Thực thi quy trình"
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: "Phần mềm được cung cấp theo nguyên trạng, không kèm theo bất kỳ bảo đảm nào; tác giả không chịu trách nhiệm đối với mọi tổn thất phát sinh từ việc sử dụng phần mềm này."
  通用视觉 RPA 引擎: Công cụ RPA thị giác đa năng
