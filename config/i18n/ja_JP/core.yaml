about:
  仅限非商业使用: 非商用利用限定
  律匠: 律匠
  本项目仅供学习与技术研究使用。使用自动化工具操作游戏可能违反相关游戏的用户协议，由此产生的后果由使用者自行承担。: 本プロジェクトは学習および技術研究のみを目的としています。自動化ツールによるゲーム操作は該当ゲームの利用規約に違反する可能性があり、それに伴う結果はすべて利用者自身の責任となります。
  本项目源码公开、免费使用: 本プロジェクトはオープンソース・無料で利用できます
  窗口定位截屏 → 区域标注 → OCR识别 → 工作流执行: ウィンドウ位置取得・キャプチャ → 領域アノテーション → OCR 認識 → ワークフロー実行
  软件按现状提供，不附带任何担保，作者不对使用本软件造成的任何损失负责。: 本ソフトウェアは現状のまま提供され、いかなる保証も付帯しません。本ソフトウェアの利用によって生じたいかなる損害についても作者は責任を負いません。
  通用视觉 RPA 引擎: 汎用ビジュアル RPA エンジン
