static_check:
  区域未绑定模板: พื้นที่ยังไม่ได้ผูกเทมเพลต
  场景未绑定任何坐标: ฉากยังไม่ได้ผูกพิกัดใด ๆ
  场景未绑定任何子场景引用: ฉากยังไม่ได้ผูกการอ้างอิงฉากย่อยใด ๆ
  子场景引用未定义: ไม่ได้นิยามการอ้างอิงฉากย่อย
  子场景引用未绑定坐标: การอ้างอิงฉากย่อยยังไม่ได้ผูกพิกัด
  引用目标不是子场景: เป้าหมายที่อ้างอิงไม่ใช่ฉากย่อย
  请核对脚本里的 key 拼写（DSL 只认 key，不认中文名），或在场景布局编辑器中绑定: กรุณาตรวจสอบการสะกด key ในสคริปต์ (DSL รู้จักเฉพาะ key ไม่รู้จักชื่อภาษาจีน) หรือผูกค่าในตัวแก้ไขเลย์เอาต์ฉาก
