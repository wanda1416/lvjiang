  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: รับอัปเดตชุดตั้งค่าและงานทางการที่ตรงกับเวอร์ชันแอปปัจจุบัน หลังตรวจสอบผ่านจะมีผลเมื่อเปิดโปรแกรมครั้งถัดไป ชุดตั้งค่าในเครื่องของคุณมีลำดับความสำคัญสูงสุดเสมอ งานที่กำลังรันอยู่จะใช้ชุดตั้งค่าที่โปรเซสนี้โหลดไว้แล้ว หากปิดตัวเลือกนี้หรือเข้าโหมดออฟไลน์ การเปิดครั้งถัดไปจะคืนค่าในตัวและถอดเนื้อหาสมาชิกออกโดยไม่กระทบข้อมูลในเครื่อง
