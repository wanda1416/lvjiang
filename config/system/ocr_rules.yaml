# OCR 文本清洗规则
#
# 规则类型：
# - replacements: 文本替换 {"错误文本": "正确文本"} 或 {"噪声": ""}
# - patterns: 正则替换 {"正则": "替换"}
#
# 用户自定义规则请放到 config/local/ocr_rules.yaml（优先级更高）

# 文本替换规则（按顺序执行）
replacements:
  # ── 形近字纠错 ──
  "猜准率": "精准率"
  "扁武学": "扇武学"
  "经甲": "胫甲"

# 正则替换规则（按顺序执行）
patterns:
  # ── 符号统一（中文/全角 → 英文）──
  "[【［]": "["
  "[】］]": "]"
  "（": "("
  "）": ")"
  # ── 噪声删除 ──
  "[荐·]": ""
