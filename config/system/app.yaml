input_simulation:
  before_click_wait:
  - 0.1
  - 0.3
  after_click_wait:
  - 0.1
  - 0.3
  mouse_move_duration:
  - 0.5
  - 0.7
  click_random_offset: 5
  region_jitter_ratio: 0.25
delay_params:
  step_interval:
    label: 操作间隔
    range:
    - 1.0
    - 1.2
  click_interval:
    label: 点击间隔
    range:
    - 1.0
    - 1.2
  page_refresh:
    label: 页面刷新等待
    range:
    - 2.0
    - 3.0
  scroll_settle:
    label: 滚动惯性等待
    range:
    - 3.0
    - 4.0
  secondary_confirm:
    label: 二次确认等待（包括装备冷却）
    range:
    - 6.0
    - 7.0
envs:
- key: android
  name: 安卓
- key: desktop
  name: 桌面
plans:
- id: 13626639a4d5427588e1b620e855c3fc
  name: 手游
  space: 手游
  env: android
  layout: 默认布局
  modes:
  - adb
- id: 5deb7222def5486bb5431fd3b541a950
  name: 端游
  space: 端游
  env: desktop
  layout: 桌面布局
  modes:
  - windows
- id: f29e8e838d2a40d8b22aa48627a1c14f
  name: 手游投屏
  space: 手游
  env: android
  layout: 继承布局
  modes:
