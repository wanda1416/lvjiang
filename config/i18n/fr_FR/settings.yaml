  把激活码粘贴到这里，换行和空格会被自动忽略: Collez le code d'activation ici ; les retours à la ligne et espaces sont ignorés
  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Reçoit les mises à jour officielles de configuration et de tâches compatibles avec la version actuelle, appliquées au prochain démarrage après vérification. Vos configurations locales restent prioritaires ; les tâches en cours conservent celles déjà chargées. Désactiver cette option ou passer hors ligne restaure les valeurs préinstallées et retire le contenu membre au prochain démarrage sans toucher aux données locales.
