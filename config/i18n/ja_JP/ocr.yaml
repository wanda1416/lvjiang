  刷新截图不可用：未连接设备或未传入回调: スクリーンショットを更新できません：デバイス未接続またはコールバック未設定
  刷新截图失败: スクリーンショットの更新に失敗しました
  匹配参考图: 参照画像と照合
  区域批量识别: 領域一括認識
  ? "区域批量识别会把多个文字区域拼成一张画布，只调用一次 OCR。\n这些参数用于控制拼图尺寸；保存后从下一次识别开始生效。"
  : "領域一括認識では複数のテキスト領域を1枚のキャンバスに結合し、OCR を1回だけ呼び出します。\nこれらのパラメータは結合サイズを制御し、保存後の次回認識から有効になります。"
  原始文本: 生テキスト
  图像识别配置有未保存的更改，确定退出并放弃这些更改吗？: 画像認識設定に未保存の変更があります。変更を破棄して終了しますか？
  图片文件 (*.png *.jpg *.jpeg *.bmp *.webp);;所有文件 (*): 画像ファイル (*.png *.jpg *.jpeg *.bmp *.webp);;すべてのファイル (*)
  已撤销未保存的清洗规则修改: 未保存のクレンジングルールの変更を取り消しました
  已撤销未保存的识别配置修改: 未保存の認識設定の変更を取り消しました
  已清除选框: 選択枠をクリアしました
  拼图画布宽、高的最小值。过小会使窄区域被 OCR 检测器大幅放大。: 結合キャンバスの幅・高さの最小値です。小さすぎると細い領域が OCR 検出器によって大幅に拡大されます。
  撤销清洗规则: クレンジングルールの変更を元に戻す
  撤销识别配置: 認識設定の変更を元に戻す
  文本替换（精确匹配）: テキスト置換（完全一致）
  无图片: 画像なし
  无法读取剪贴板图片: クリップボードの画像を読み込めません
  替换为: 置換後
