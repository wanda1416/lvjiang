  相邻文字区域在拼图中的间隔。: Abstand zwischen benachbarten Textbereichen auf der zusammengefügten Leinwand.
  确定删除规则组「{name}」吗？引用它的工作流将无法执行。: Regelgruppe „{name}“ wirklich löschen? Workflows, die darauf verweisen, können dann nicht mehr ausgeführt werden.
  确定撤销本次所有未保存的清洗规则更改吗？: Alle ungespeicherten Änderungen an den Bereinigungsregeln dieser Sitzung rückgängig machen?
  确定撤销本次所有未保存的识别配置更改吗？: Alle ungespeicherten Änderungen an der Erkennungskonfiguration dieser Sitzung rückgängig machen?
