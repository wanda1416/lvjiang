  ? '实验性功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。

    用 Windows Graphics Capture 取帧，游戏窗口被别的窗口盖住也能截图；窗口最小化时仍然拿不到画面。仅本次运行期间生效'
  : 'Tính năng thử nghiệm: nhiều kịch bản tạm thời chưa chạy ổn trong chế độ này và không tiếp nhận phản hồi lỗi không dùng được.

    Dùng Windows Graphics Capture để lấy khung hình ngay cả khi cửa sổ trò chơi bị cửa sổ khác che khuất; vẫn không lấy được khung hình khi cửa sổ bị thu nhỏ. Chỉ có hiệu lực trong phiên chạy này'
  ? '局域网内未发现可连接的 ADB 设备。


    请确认：

    1. 设备与电脑在同一局域网

    2. 设备已开启无线调试（开发者选项）

    3. 多网卡时可在下拉框改选目标网段，或改用本地扫描'
  : 'Không tìm thấy thiết bị ADB có thể kết nối trong mạng LAN.


    Vui lòng kiểm tra:

    1. Thiết bị và máy tính ở cùng mạng LAN

    2. Thiết bị đã bật gỡ lỗi không dây (Tùy chọn nhà phát triển)

    3. Nếu có nhiều card mạng, chọn lại lớp mạng mục tiêu trong danh sách thả xuống hoặc dùng quét cục bộ'
