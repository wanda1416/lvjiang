action_catalog:
  0=红 1=绿 2=蓝: 0=Rouge 1=Vert 2=Bleu
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / touches alphabétiques / MOUSE_LEFT ; sur appareil ESC = Retour
  OCR 扫描区域: Zone d'analyse OCR
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: Sur PC, saisit le texte via le presse-papiers et Ctrl+V ; prend en charge le mode arrière-plan
  find 结果、矩形或坐标变量: Résultat de find, rectangle ou variable de coordonnées
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: « {label} » ne peut pas contenir de guillemets droits ni de sauts de ligne (les chaînes DSL ne gèrent pas l'échappement)
  '「{label}」应为 #rrggbb': '« {label} » doit être au format #rrggbb'
  「{label}」应为 {n} 个数: « {label} » doit contenir {n} nombres
  「{label}」应为命名延迟（字母或中文开头的名字）: « {label} » doit être un délai nommé (nom commençant par une lettre ou un caractère chinois)
  「{label}」未填写: « {label} » n'est pas renseigné
  「{label}」的 {n} 个值都必须是数字: Les {n} valeurs de « {label} » doivent toutes être des nombres
  不带 by 得到文字；带 by 得到命中与否: Sans by, renvoie le texte ; avec by, renvoie si la correspondance a réussi
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: Saisissez une seule clé pour « {label} » (ex. ok), sans crochets ni préfixe de scène
  不抖动: Sans tremblement
  主导通道: Canal dominant
  交互: Interaction
  亮段计数: Comptage des segments lumineux
  值/表达式: Valeur / expression
  停止应用: Arrêter l'application
  内容: Contenu
  出错也继续: Continuer en cas d'erreur
  列表: Liste
  到达后按住(秒): Maintenir à l'arrivée (s)
  匹配: Correspondance
  区域/点: Zone / point
  区域里接近目标色的像素比例 0–1，判断按钮亮没亮/在哪个界面: Proportion (0–1) de pixels proches de la couleur cible dans la zone ; sert à vérifier si un bouton est allumé ou quel écran est affiché
  取点亮度: Luminosité d'un point
  取点颜色: Couleur d'un point
  只判断是否含: Vérifier uniquement la présence
  只看某区域: Limiter à une zone
  向量倍数: Multiplicateur de vecteur
  启动应用: Démarrer l'application
  命名延迟，留空则不等待: Délai nommé ; laisser vide pour ne pas attendre
  图库识别（分类）: Reconnaissance de galerie (classification)
  图色: Couleur de pixel
  声明全局变量: Déclarer une variable globale
  声明后可在主流程与所有子过程中共享读写: Partagée en lecture/écriture entre le flux principal et tous les sous-processus après déclaration
  失败退出: Quitter en cas d'échec
  如 $x > 0.5 / $v contains "ok" / not $hit: Ex. $x > 0.5 / $v contains "ok" / not $hit
  如果…: Si…
  如果…否则…: Si… Sinon…
  字符串写双引号，或使用 $变量: Chaînes entre guillemets droits, ou utiliser $variable
  存入变量: Stocker dans une variable
  定义区域变量: Définir une variable de zone
  定义子过程: Définir un sous-processus
  容差: Tolérance
  应用名: Nom de l'application
  延迟: Délai
  当…时重复: Répéter tant que…
  形如 [scene].[region]: 'Format : [scene].[region]'
  形如 [scene].[region]，留空全画布: 'Format : [scene].[region] ; laisser vide pour tout le canevas'
  形如 [scene].[region]；留空则搜索整个画布: 'Format : [scene].[region] ; laisser vide pour rechercher sur tout le canevas'
  循环变量: Variable de boucle
  感知: Perception
  截图存档: Archiver la capture
  打日志: Écrire dans le journal
  找同色图标: Trouver une icône de même couleur
  找图（模板定位）: Trouver une image (correspondance de modèle)
  找文字（可点击）: Trouver du texte (cliquable)
  拖拽区域翻页: Faire glisser la zone pour tourner la page
  拖拽（两点）: Glisser (deux points)
  按住(秒/区间): Maintenir (s / plage)
  按区域绑定找图: Trouver une image par liaison de zone
  按压按键/鼠标键: Appuyer sur une touche / bouton de souris
  按布局中 Region 绑定的模板匹配，返回首个命中的区域 key: Fait correspondre les modèles liés à Region dans la mise en page ; renvoie la clé de la première zone trouvée
  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: Arrête une application Android ou PC selon son type d'enregistrement et vérifie que le processus s'est terminé
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: Démarre une application Android ou PC selon son type d'enregistrement et vérifie que le processus apparaît
  控制流: Contrôle de flux
  搜索范围: Zone de recherche
  操作后等待: Attente après action
  收集到输出: Collecter dans la sortie
  数据与输出: Données et sortie
  文字: Texte
  文本/变量: Texte / variable
  暂停等人工: Pause pour intervention manuelle
  最低分(0-1): Score minimal (0-1)
  最长等待(秒): Attente maximale (s)
  模板匹配区域: Zone de correspondance de modèle
  模板区域: Zone de modèle
  模板场景: Scène de modèle
  滑动时长(秒/区间): Durée du glissement (s / plage)
  激活区域: Activer la zone
  激活布局实体；默认点击中心，布局可改为按键: Active une entité de mise en page ; clique au centre par défaut ou utilise une touche définie dans la mise en page
  点击变量: Cliquer sur une variable
  点击坐标: Cliquer sur des coordonnées
  点击画布归一化坐标: Cliquer sur des coordonnées normalisées du canevas
  画布上点一下取值: Cliquer sur le canevas pour récupérer une valeur
  画布框选取值: Encadrer sur le canevas pour récupérer une valeur
  画布框选的区域存成变量，之后 click / 图色函数都能用: Enregistre la zone encadrée sur le canevas en variable, utilisable ensuite par click ou les fonctions couleur
  目标色: Couleur cible
  等待画面稳定: Attendre la stabilisation de l'écran
  等待（命名延迟）: Attendre (délai nommé)
  等待（秒）: Attendre (s)
  粘贴文本: Coller du texte
  级别: Niveau
  终点: Point d'arrivée
  行/列数: Lignes / colonnes
  读取当前布局的 Region 模板绑定，并在指定范围或全画布定位: Lit les liaisons de modèle Region de la mise en page actuelle et localise dans la zone ou sur tout le canevas
  调用子过程: Appeler un sous-processus
  赋值: Affecter
  起点: Point de départ
  起点→终点向量放大/缩小，如 2 或 0.5: Échelle du vecteur départ→arrivée, ex. 2 ou 0.5
  超时(秒): Délai d'expiration (s)
  输出键名: Nom de clé de sortie
  过程名: Nom du processus
  返回列表，按面积降序；$first = $icons[0] 后可 click: Renvoie une liste triée par surface décroissante ; $first = $icons[0] peut ensuite être cliqué
  进入亮段阈值: Seuil d'entrée de segment lumineux
  退出阈值: Seuil de sortie
  通道下限: Borne inférieure du canal
  遍历列表: Parcourir la liste
  重复 N 次: Répéter N fois
  重复直到…: Répéter jusqu'à…
  错误变量: Variable d'erreur
  键名: Nom de clé
  限定区域: Restreindre à la zone
  面板/区域: Panneau / zone
  颜色占比: Ratio de couleur
  高出其他通道: Écart au-dessus des autres canaux
