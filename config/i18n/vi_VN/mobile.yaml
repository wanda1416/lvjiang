  : "Quét mạng LAN dùng để tìm thiết bị đã bật ADB không dây; quét cổng cục bộ dùng để tìm trình giả lập chỉ lắng nghe 127.0.0.1.\nQuét chỉ thiết lập kết nối ADB, không chuyển mục tiêu thực thi ở cửa sổ chính."
