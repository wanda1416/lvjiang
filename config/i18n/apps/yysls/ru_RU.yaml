  只有开发模式可以指定保存位置: Указывать место сохранения можно только в режиме разработчика
  "只检查部位和金/紫品阶是否有启用规则；判定结果和首词条条件需在实际运行时确定。": "Проверяется только наличие активных правил для слотов и золотого/фиолетового качества; результаты оценки и условия первого аффикса определяются во время работы."
  "只能从可用词条库里、且各流派转律词条库允许转出的词条中选择；动态类四个词条只要在可用词条库中即可选。": "Выбор возможен только из пула доступных аффиксов в пределах пула переноса каждого стиля; четыре динамических аффикса доступны, если есть в пуле."
  "只评估本次自动调律实际勾选的规则与玩法，避免为本次不打算培养的方案消耗材料。": "Оцениваются только правила и стили игры, реально отмеченные для текущей автонастройки, чтобы не тратить материалы на ненужные планы."
  "只读实例不能停用 MCP 服务，请在主实例操作": "Экземпляр только для чтения не может остановить сервис MCP; выполните это в основном экземпляре"
  可交换: Доступно для обмена
