  每个应用可同时绑定 Android 与 Windows。运行时按当前实际连接目标选择绑定，与工作流环境无关；连接后可用对应的「获取连接信息」自动回填。: Каждое приложение можно одновременно привязать к Android и Windows. Во время работы привязка выбирается по фактической цели подключения независимо от среды рабочего процесса; после подключения можно заполнить поля кнопкой «Получить данные подключения».
