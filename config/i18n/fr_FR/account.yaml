  下行: Téléchargement
  云端基线是空的。<br>来源：{origin}<br>时间：{created}<br>条目：0<br><br>继续将用本机当前总览补上基线，不会备份或替换本地用户。: 'La base de référence cloud est vide.<br>Source : {origin}<br>Heure : {created}<br>Entrées : 0<br><br>Continuer remplira la base à partir de la vue d''ensemble actuelle de cette machine ; les utilisateurs locaux ne seront ni sauvegardés ni remplacés.'
  ? 云端已有快照。<br>来源：{origin}<br>时间：{created}<br>条目：{count}{warning}<br><br>继续将先把本地用户、总览定义与总览数据备份到 config/session/_backup-*，再拉取云端数据。
  : 'Un instantané cloud existe déjà.<br>Source : {origin}<br>Heure : {created}<br>Entrées : {count}{warning}<br><br>Continuer sauvegardera d''abord les utilisateurs locaux, les définitions et les données de vue d''ensemble dans config/session/_backup-*, puis récupérera les données du cloud.'
  修改密码: Modifier le mot de passe
  修改密码…: Modification du mot de passe…
  创建快照: Créer un instantané
  初始同步: Synchronisation initiale
  在浏览器中打开注册页面: Ouvrir la page d'inscription dans un navigateur
  在浏览器打开自助操作页：修改密码、导出数据、清除云端数据、注销账号: 'Ouvrir la page libre-service dans un navigateur : modifier le mot de passe, exporter les données, effacer les données cloud, supprimer le compte'
  定义: Définitions
