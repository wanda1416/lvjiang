  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: 記錄鍵盤、滑鼠按鈕、滾輪以及可選滑鼠移動的原始時間線。儲存指令碼時會同時生成 workflows/lvtrace 下的配套軌跡檔案，回放時序更接近錄製過程，適合遊戲視角等高時序場景。指令碼依賴配套軌跡檔案，不能只複製 WF 文字進行遷移。
