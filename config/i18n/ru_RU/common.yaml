  接收与当前应用版本匹配的官方配置和任务更新，校验通过后下次启动生效。你的本地配置始终优先；正在执行的任务继续使用本进程已经加载的配置。关闭此选项或进入离线模式后，下次启动会恢复预置并撤下会员内容，不影响本地数据。: Получать официальные обновления конфигураций и задач для текущей версии приложения; после проверки они применятся при следующем запуске. Локальные настройки всегда имеют приоритет; запущенные задачи продолжают использовать уже загруженную конфигурацию. При отключении или переходе в автономный режим при следующем запуске восстановятся встроенные данные без затрагивания локальных.
