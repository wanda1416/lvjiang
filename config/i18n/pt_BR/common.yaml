  记录键盘、鼠标按钮、滚轮以及可选鼠标移动的原始时间线。保存脚本时会同时生成 workflows/lvtrace 下的配套轨迹文件，回放时序更接近录制过程，适合游戏视角等高时序场景。脚本依赖配套轨迹文件，不能只复制 WF 文本进行迁移。: Registra a linha do tempo bruta de teclado, botões do mouse, rolagem e movimento opcional do mouse. Ao salvar, gera também um arquivo de trajetória em workflows/lvtrace para temporização fiel à gravação, ideal para câmera de jogo e cenas sensíveis ao tempo. O script depende do arquivo de trajetória; não migre apenas o texto WF.
