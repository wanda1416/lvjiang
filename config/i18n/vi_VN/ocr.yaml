  拼图画布宽、高的最小值。过小会使窄区域被 OCR 检测器大幅放大。: Chiều rộng và chiều cao tối thiểu của khung vẽ ghép. Quá nhỏ sẽ khiến bộ phát hiện OCR phóng đại quá mức các vùng hẹp.
