  完全离线模式（暂停全部联网功能）: 完全離線模式（暫停全部聯網功能）
  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : 實驗功能：很多指令碼暫時無法在該模式下跑通，不受理該功能的不可用反饋。後台截圖讓遊戲視窗被別的視窗蓋住時也能截圖，代價是比前台截圖略慢；它要求視窗輸入同時為後台輸入，視窗最小化時兩者都拿不到畫面。這裡設的是預設值：主介面只有勾選「後台模式」後才會按它自動勾上「後台截圖」，本次執行內仍可隨時改。
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: 實驗功能：手機需安裝律匠 App 並開啟無障礙服務；僅改變點選和滑動的執行通道，不改變截圖方式。連線失敗時回退 ADB shell input。
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: 尚無對應型別的連線資訊，請先在主視窗連線裝置或定位視窗。
