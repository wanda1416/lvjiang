action_catalog:
  0=红 1=绿 2=蓝: 0=Красный 1=Зелёный 2=Синий
  ESC / 字母键 / MOUSE_LEFT；设备端 ESC=返回: ESC / буквенные клавиши / MOUSE_LEFT; на устройстве ESC = Назад
  OCR 扫描区域: Область сканирования OCR
  PC 端通过剪贴板和 Ctrl+V 输入文本，支持后台模式: На ПК ввод текста идёт через буфер обмена и Ctrl+V; поддерживается фоновый режим
  find 结果、矩形或坐标变量: Результат find, прямоугольник или переменная координат
  「{label}」不能包含英文双引号或换行（DSL 字符串不支持转义）: «{label}» не может содержать двойные кавычки или переносы строк (строки DSL не поддерживают экранирование)
  '「{label}」应为 #rrggbb': '«{label}» должно быть в формате #rrggbb'
  「{label}」应为 {n} 个数: «{label}» должно содержать {n} чисел
  「{label}」应为命名延迟（字母或中文开头的名字）: «{label}» должно быть именованной задержкой (имя, начинающееся с буквы или иероглифа)
  「{label}」未填写: Поле «{label}» не заполнено
  「{label}」的 {n} 个值都必须是数字: Все {n} значений поля «{label}» должны быть числами
  不带 by 得到文字；带 by 得到命中与否: Без by возвращает текст; с by возвращает факт совпадения
  「{label}」请填单个 key（例如 ok），不要带方括号或场景前缀: Укажите одиночный ключ для «{label}» (например ok), без квадратных скобок и префикса сцены
  不抖动: Без дрожания
  主导通道: Основной канал
  交互: Взаимодействие
  亮段计数: Подсчёт светлых сегментов
  值/表达式: Значение / выражение
  停止应用: Остановить приложение
  内容: Содержимое
  出错也继续: Продолжать при ошибке
  列表: Список
  到达后按住(秒): Удержание в конце (сек)
  匹配: Совпадение
  区域/点: Область/Точка
  区域里接近目标色的像素比例 0–1，判断按钮亮没亮/在哪个界面: Доля пикселей (0–1), близких к целевому цвету; позволяет определить активность кнопки или текущий экран
  取点亮度: Яркость точки
  取点颜色: Цвет точки
  只判断是否含: Только проверка наличия
  只看某区域: Только в области
  向量倍数: Множитель вектора
  启动应用: Запустить приложение
  命名延迟，留空则不等待: Именованная задержка; оставьте пустым, чтобы не ждать
  图库识别（分类）: Распознавание по галерее (классификация)
  图色: Цвет пикселей
  声明全局变量: Объявить глобальную переменную
  声明后可在主流程与所有子过程中共享读写: После объявления доступна для чтения и записи в основном процессе и всех подпроцедурах
  失败退出: Выход при ошибке
  如 $x > 0.5 / $v contains "ok" / not $hit: 'Например: $x > 0.5 / $v contains "ok" / not $hit'
  如果…: Если…
  如果…否则…: Если… Иначе…
  字符串写双引号，或使用 $变量: Строки в двойных кавычках или $переменная
  存入变量: Сохранить в переменную
  定义区域变量: Задать переменную области
  定义子过程: Определить подпроцедуру
  容差: Допуск
  应用名: Имя приложения
  延迟: Задержка
  当…时重复: Повторять пока…
  形如 [scene].[region]: 'Формат: [scene].[region]'
  形如 [scene].[region]，留空全画布: 'Формат: [scene].[region]; пустое значение — весь холст'
  形如 [scene].[region]；留空则搜索整个画布: 'Формат: [scene].[region]; пустое значение — поиск по всему холсту'
  循环变量: Переменная цикла
  感知: Восприятие
  截图存档: Сохранить скриншот
  打日志: Запись в журнал
  找同色图标: Найти значок того же цвета
  找图（模板定位）: Поиск изображения (по шаблону)
  找文字（可点击）: Поиск текста (кликабельный)
  拖拽区域翻页: Перетащить область для прокрутки
  拖拽（两点）: Перетаскивание (две точки)
  按住(秒/区间): Удержание (сек/диапазон)
  按区域绑定找图: Поиск изображения по привязке области
  按压按键/鼠标键: Нажать клавишу или кнопку мыши
  按布局中 Region 绑定的模板匹配，返回首个命中的区域 key: Сопоставляет шаблоны, привязанные к Region в макете, и возвращает ключ первой совпавшей области
  按应用注册类型停止 Android 或 PC 应用，并确认进程消失: Останавливает приложение Android или ПК согласно его регистрации и проверяет завершение процесса
  按应用注册类型启动 Android 或 PC 应用，并确认进程出现: Запускает приложение Android или ПК согласно его регистрации и проверяет появление процесса
  控制流: Управление потоком
  搜索范围: Область поиска
  操作后等待: Ожидание после действия
  收集到输出: Добавить в вывод
  数据与输出: Данные и вывод
  文字: Текст
  文本/变量: Текст/переменная
  暂停等人工: Пауза для ручного действия
  最低分(0-1): Мин. оценка (0-1)
  最长等待(秒): Макс. ожидание (сек)
  模板匹配区域: Область сопоставления шаблона
  模板区域: Область шаблона
  模板场景: Сцена шаблона
  滑动时长(秒/区间): Длительность свайпа (сек/диапазон)
  激活区域: Активировать область
  激活布局实体；默认点击中心，布局可改为按键: Активирует элемент макета; по умолчанию нажимает в центр, в макете можно привязать клавишу
  点击变量: Нажать на переменную
  点击坐标: Нажать по координатам
  点击画布归一化坐标: Нажать по нормализованным координатам холста
  画布上点一下取值: Щёлкните на холсте, чтобы выбрать точку
  画布框选取值: Выделите область на холсте
  画布框选的区域存成变量，之后 click / 图色函数都能用: Выделенная на холсте область сохраняется в переменную для click и функций анализа цвета
  目标色: Целевой цвет
  等待画面稳定: Ждать стабилизации экрана
  等待（命名延迟）: Ожидание (именованная задержка)
  等待（秒）: Ожидание (сек)
  粘贴文本: Вставить текст
  级别: Уровень
  终点: Конечная точка
  行/列数: Строки/Столбцы
  读取当前布局的 Region 模板绑定，并在指定范围或全画布定位: Считывает привязки шаблонов Region текущего макета и ищет в заданной области или по всему холсту
  调用子过程: Вызвать подпроцедуру
  赋值: Присвоить
  起点: Начальная точка
  起点→终点向量放大/缩小，如 2 或 0.5: Масштаб вектора «начало→конец», например 2 или 0.5
  超时(秒): Тайм-аут (сек)
  输出键名: Ключ вывода
  过程名: Имя процедуры
  返回列表，按面积降序；$first = $icons[0] 后可 click: Возвращает список по убыванию площади; затем можно сделать $first = $icons[0] и click
  进入亮段阈值: Порог входа в светлый сегмент
  退出阈值: Порог выхода
  通道下限: Нижний предел канала
  遍历列表: Перебор списка
  重复 N 次: Повторить N раз
  重复直到…: Повторять до…
  错误变量: Переменная ошибки
  键名: Имя ключа
  限定区域: Ограничить областью
  面板/区域: Панель/Область
  颜色占比: Доля цвета
  高出其他通道: Превышение над другими каналами
