  ? '引擎算出的点击/拖拽坐标跑到画面外时怎么办。

    不勾选（默认）：报错并结束本次运行——越界说明脚本的位移参数与当前面板几何不匹配，自动截断会把「滚两行」悄悄变成「滚一行」，脚本和日志都看不出来。

    勾选：引擎截断到画面边界并记一条 warning，本次运行继续。

    判定在引擎层完成：同一个越界坐标，设备端无障碍手势是硬拒绝，而桌面与 adb shell input 会静默接受，指望后端拦不住。'
  : 'จะทำอย่างไรเมื่อพิกัดคลิก/ลากที่เอนจินคำนวณหลุดออกนอกขอบภาพ

    ไม่ติ๊ก (ค่าเริ่มต้น): แจ้งข้อผิดพลาดและจบการรันรอบนี้ — การออกนอกขอบแสดงว่าระยะเลื่อนของสคริปต์ไม่ตรงกับรูปทรงแผงปัจจุบัน การตัดขอบอัตโนมัติจะทำให้ «เลื่อน 2 แถว» กลายเป็น «เลื่อน 1 แถว» โดยสคริปต์และบันทึกมองไม่เห็น

    ติ๊กเลือก: เอนจินจะตัดพิกัดให้อยู่ที่ขอบภาพ บันทึก warning 1 รายการ และรันต่อ

    การตรวจสอบทำในชั้นเอนจิน: พิกัดออกนอกขอบเดียวกันนี้ ท่าทางบริการการเข้าถึงบนอุปกรณ์จะปฏิเสธทันที ส่วนเดสก์ท็อปและ adb shell input จะยอมรับแบบเงียบ จึงพึ่งแบ็กเอนด์กั้นไม่ได้'
