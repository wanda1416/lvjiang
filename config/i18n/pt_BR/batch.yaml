  执行顺序: Ordem de execução
  批量设置: Configurações em lote
  批量配置: Configuração em lote
  拖动可临时调整实际执行顺序: Arraste para ajustar temporariamente a ordem real de execução
  拖动可调整实际执行顺序；右键可恢复默认、随机打乱或按 Profile 排序；批量配置中的顺序仅作为初始顺序: Arraste para ajustar a ordem real de execução; clique com o botão direito para restaurar o padrão, embaralhar ou ordenar por Profile; a ordem na configuração em lote serve apenas como ordem inicial
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱顺序；批量配置中的顺序仅作为初始顺序: Arraste para ajustar a ordem real de execução; clique com o botão direito para restaurar o padrão ou embaralhar; a ordem na configuração em lote serve apenas como ordem inicial
  拖动可调整实际执行顺序；右键可恢复默认或随机打乱；批量配置中的顺序仅作为初始顺序: Arraste para ajustar a ordem real de execução; clique com o botão direito para restaurar o padrão ou embaralhar; a ordem na configuração em lote serve apenas como ordem inicial
  指定顺序排序: Ordenar por ordem especificada
  按属性调度时不适用：一个属性值可能对应多名用户，必须由条目准备工作流选定并回传用户名，所以生命周期始终执行。切回「用户名」会恢复你原来的选择: 'Não aplicável ao agendar por atributo: um valor de atributo pode corresponder a vários usuários, então o fluxo de preparação de item precisa selecionar e retornar o nome de usuário, mantendo o ciclo de vida sempre ativo. Voltar para "Nome de usuário" restaura sua escolha anterior'
  按用户名调度，还是按用户资料的某个属性调度。它决定主页面候选列表的内容、生命周期契约和条目准备工作流的合法性，所以属于配置组定义: Define se o agendamento é por nome de usuário ou por um atributo do perfil. Isso determina a lista de candidatos na tela principal, o contrato de ciclo de vida e a validade do fluxo de preparação de item, pertencendo à definição do grupo de configuração
  排序键属于配置组定义；在用户列表右键「按 Profile 排序」执行一次，排完的顺序只属于本次运行: A chave de ordenação faz parte da definição do grupo de configuração; clique com o botão direito na lista de usuários em "Ordenar por Profile" para ordenar uma vez — a ordem vale apenas para esta execução
  新建配置: Nova configuração
  无人值守撞上异常暂停后，用它把游戏收回登录主页。主页面的「无人值守」要等这里配好才能勾选: Usado para devolver o jogo à tela inicial de login após uma pausa anormal no modo autônomo. A opção "Modo autônomo" na tela principal só pode ser marcada depois de configurar isto
  无法开始批量任务: Não foi possível iniciar a tarefa em lote
  暂无启用的单元，请到「单元」页勾选: Nenhuma unidade habilitada; marque algumas na aba "Unidades"
  暂无配置组，请先通过「工具 → 批量配置」添加: Nenhum grupo de configuração; adicione um em "Ferramentas → Configuração em lote" primeiro
  本次长时间无人看守时勾选：任务遇到异常暂停时不再等人，该任务按失败记录并跳过，随后由配置组的「异常恢复 wf」把游戏收回登录主页，再继续下一个任务。确认、输入和选择仍等待用户交互: 'Marque ao deixar sem supervisão por longos períodos: ao ocorrer uma pausa anormal, a tarefa não espera — ela é registrada como falha e ignorada, o fluxo de recuperação de falhas do grupo devolve o jogo à tela de login e a próxima tarefa continua. Confirmações, entradas e escolhas ainda aguardam interação do usuário'
  条目准备: Preparação de item
  条目准备工作流不支持当前属性调度，请到批量配置中修改: O fluxo de preparação de item não suporta o agendamento por atributo atual; altere na Configuração em lote
  条目收尾: Finalização de item
  浏览...: Procurar...
  点击查看本轮任务参数: Clique para ver os parâmetros das tarefas desta rodada
  用户独立参数: Parâmetros próprios do usuário
  确定删除当前批量配置吗？: Excluir a configuração em lote atual?
  第一列决定是否出现在主页面，第二列决定主页面首次加载或点「恢复默认」时是否勾选；拖动可调整初始顺序: A primeira coluna define se aparece na tela principal; a segunda define se vem marcado no carregamento inicial ou ao clicar em "Restaurar padrão". Arraste para ajustar a ordem inicial
  脚本: Script
  脚本候选: Candidatos de script
  请到「单元」页至少勾选一个执行单元: Marque pelo menos uma unidade de execução na aba "Unidades"
  请到「脚本」页至少勾选一个脚本: Marque pelo menos um script na aba "Scripts"
  请在「工具 → 批量配置」中配置条目准备工作流: Configure o fluxo de preparação de item em "Ferramentas → Configuração em lote"
  请至少勾选一个脚本: Marque pelo menos um script
  请选择 workflows 目录下的 .wf 文件: Selecione um arquivo .wf na pasta workflows
  调度单元属于配置组定义，在「工具 → 批量配置」中修改: A unidade de agendamento faz parte da definição do grupo de configuração; altere em "Ferramentas → Configuração em lote"
  选择工作流文件: Selecionar arquivo de fluxo de trabalho
  配置名称已存在: O nome da configuração já existe
  重命名配置: Renomear configuração
  随机打乱顺序: Embaralhar ordem
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」：无人值守撞上异常暂停后要靠它把游戏收回登录主页: 'Configure primeiro o "fluxo de recuperação de falhas" deste grupo em "Ferramentas → Configuração em lote": o modo autônomo depende dele para devolver o jogo à tela de login após uma pausa anormal'
  默认执行: Executar por padrão
  配置名称: Nome da configuração
  安卓目标批量开始时若处于竖屏，只要交换宽高后与布局画布比例一致就允许启动；启动后先由配置组的「异常恢复 wf」回到登录主页，再由「条目准备工作流」把人送回游戏。两者的工作流都要在「工具 → 批量配置」里配置: Para alvos Android, o lote pode iniciar no modo retrato desde que trocar largura e altura corresponda à proporção da tela do layout. Após iniciar, o "fluxo de recuperação de falhas" do grupo retorna o jogo à tela de login e o "fluxo de preparação de item" coloca o jogador de volta no jogo. Ambos os fluxos são configurados em "Ferramentas → Configuração em lote"
  需要先在「工具 → 批量配置」为本配置组配置「异常恢复 wf」与「条目准备工作流」：允许竖屏启动会先把游戏收回登录主页，没有条目准备就无法再把人送回游戏: 'Configure primeiro o "fluxo de recuperação de falhas" e o "fluxo de preparação de item" deste grupo em "Ferramentas → Configuração em lote": iniciar em modo retrato primeiro retorna o jogo à tela de login e, sem a preparação de item, não há como voltar ao jogo'
  允许竖屏需要先配置条目准备工作流: Permitir modo retrato exige configurar primeiro o fluxo de preparação de item
  「允许竖屏」启动时会先由异常恢复 wf 把客户端收回登录主页，需要条目准备工作流再把人送回游戏。请先在「工具 → 批量配置」为该配置组配置条目准备 wf。: Ao iniciar com "Permitir modo retrato", o fluxo de recuperação de falhas retorna primeiro o cliente à tela de login, exigindo o fluxo de preparação de item para voltar ao jogo. Configure primeiro o fluxo de preparação de item deste grupo em "Ferramentas → Configuração em lote".
