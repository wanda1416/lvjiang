  "可用词条库（全局，各部位词条混放）": "Kho dòng thuộc tính khả dụng (toàn cục, trộn chung các vị trí)"
  "可转律（取消后不做转律模拟）": "Có thể Chuyển Luật (bỏ chọn để không mô phỏng Chuyển Luật)"
  "可输入装备提供的直接属性和原始五维，以验证天赋阈值。不要填角色最终面板，也不要重复填写五维转换后的攻击。此处输入仅用于本次预览，不写入内置来源。": "Có thể nhập thuộc tính trực tiếp và ngũ hành gốc do trang bị cung cấp để kiểm tra ngưỡng thiên phú. Không nhập bảng chỉ số cuối của nhân vật hay nhập trùng tấn công đã quy đổi từ ngũ hành. Dữ liệu này chỉ dùng cho bản xem trước, không ghi vào nguồn tích hợp."
