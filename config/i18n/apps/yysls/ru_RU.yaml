  "启动 MCP 后，在 WorkBuddy 等外部 Agent 中交流流派和养成目标。AI 可以了解当前用户与全部用户、查询装备、扫描备战方案、生成新配置并启动调律。启用后每次主实例启动时自动开启服务并同步接入配置。": "После запуска MCP обсуждайте стили и цели развития во внешних агентах вроде WorkBuddy. ИИ сможет видеть текущего и всех пользователей, проверять снаряжение, сканировать пресеты, создавать настройки и запускать настройку. При включении сервис запускается автоматически."
