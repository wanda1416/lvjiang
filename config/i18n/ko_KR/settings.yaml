  ? 实验功能：很多脚本暂时无法在该模式下跑通，不受理该功能的不可用反馈。后台截图让游戏窗口被别的窗口盖住时也能截图，代价是比前台截图略慢；它要求窗口输入同时为后台输入，窗口最小化时两者都拿不到画面。这里设的是默认值：主界面只有勾选「后台模式」后才会按它自动勾上「后台截图」，本次运行内仍可随时改。
  : '실험 기능: 현재 많은 스크립트가 이 모드에서 정상 동작하지 않으며, 이 기능의 미동작 피드백은 접수하지 않습니다. 백그라운드 캡처를 사용하면 게임 창이 다른 창에 가려져도 캡처할 수 있지만 포그라운드 캡처보다 다소 느립니다. 창 입력도 백그라운드 입력으로 설정되어야 하며, 창이 최소화되면 두 방식 모두 화면을 가져올 수 없습니다. 여기 설정은 기본값이며 메인 창에서 「백그라운드 모드」를 체크해야 「백그라운드 캡처」가 자동 선택됩니다. 실행 중에도 언제든 변경할 수 있습니다.'
  实验功能：手机需安装律匠 App 并开启无障碍服务；仅改变点击和滑动的执行通道，不改变截图方式。连接失败时回退 ADB shell input。: '실험 기능: 휴대폰에 LvJiang 앱을 설치하고 접근성 서비스를 켜야 합니다. 클릭과 스와이프 실행 채널만 변경하며 캡처 방식은 바꾸지 않습니다. 연결 실패 시 ADB shell input으로 대체됩니다.'
  尚无对应类型的连接信息，请先在主窗口连接设备或定位窗口。: 해당 유형의 연결 정보가 아직 없습니다. 먼저 메인 창에서 기기를 연결하거나 창을 지정하세요.
