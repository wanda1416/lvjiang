  版本: เวอร์ชัน
  版本不一致时协议和随包配置都可能对不上。建议把低的那一边升到高的: หากเวอร์ชันไม่ตรงกัน โปรโตคอลและการตั้งค่าที่มากับแพ็กเกจอาจไม่เข้ากัน แนะนำให้อัปเกรดฝั่งที่ต่ำกว่าให้ตรงกัน
  用 PC 配置覆盖手机任务参数和用户名册。: เขียนทับพารามิเตอร์งานและรายชื่อผู้ใช้บนมือถือด้วยการตั้งค่าจาก PC
  用 PC 配置覆盖手机批量配置。: เขียนทับการตั้งค่าแบบชุดบนมือถือด้วยการตั้งค่าจาก PC
  用手机扫码，从本机下载安装。手机需要和电脑在同一局域网，但不需要能上网。: ใช้มือถือสแกนเพื่อดาวน์โหลดและติดตั้งจากเครื่องนี้ มือถือต้องอยู่ใน LAN เดียวกับคอมพิวเตอร์แต่ไม่จำเป็นต้องต่ออินเทอร์เน็ต
  "用手机扫码，直接从 GitHub 下载安装。\n手机上不了网时，改用右侧「本机共享」。": "ใช้มือถือสแกนเพื่อดาวน์โหลดและติดตั้งจาก GitHub โดยตรง\nหากมือถือต่ออินเทอร์เน็ตไม่ได้ ให้ใช้ «แชร์จากเครื่องนี้» ทางด้านขวาแทน"
  由本机提供下载，手机不需要能上网: ดาวน์โหลดผ่านเครื่องนี้ มือถือไม่จำเป็นต้องต่ออินเทอร์เน็ต
