  手势、点击与截图都依赖它。在 app 内按引导开启；部分系统会在「受限设置」里额外拦一道，需要先允许: Les gestes, clics et captures d'écran en dépendent. Activez-le dans l'application selon le guide ; certains systèmes le bloquent aussi dans « Paramètres restreints », où il faut l'autoriser d'abord
