common:
  cancel: 취소
  current: 현재
  empty: 아직 메모가 없습니다
  paste: 클립보드에서 붙여넣기
  remove: 현재 아바타 제거
  reset: 초기화
  title: 메모
  请输入用户名: 사용자 이름을 입력하세요
user_avatar:
  从剪贴板粘贴: 클립보드에서 붙여넣기
  从当前设备或窗口获取最新截图: 현재 기기 또는 창에서 최신 스크린샷 가져오기
  使用此头像: 이 아바타 사용
  保存头像失败：{error}: '아바타 저장 실패: {error}'
  保存并使用: 저장 후 사용
  删除历史头像: 이전 아바타 삭제
  删除历史头像失败：{error}: '이전 아바타 삭제 실패: {error}'
  剪贴板中没有图片: 클립보드에 이미지가 없습니다
  双击编辑头像: 더블클릭하여 아바타 편집
  可拖动图片定位，滚轮或滑块缩放 · Ctrl+V 粘贴: 이미지를 드래그해 위치 조정, 휠 또는 슬라이더로 확대/축소 · Ctrl+V 붙여넣기
  图片尺寸过大，请选择不超过 4000 万像素的图片: 이미지가 너무 큽니다. 4,000만 화소 이하의 이미지를 선택하세요
  图片文件 (*.png *.jpg *.jpeg *.webp *.bmp): 이미지 파일 (*.png *.jpg *.jpeg *.webp *.bmp)
  头像库: 아바타 라이브러리
  头像文件不存在或文件名无效: 아바타 파일이 없거나 파일 이름이 잘못되었습니다
  头像正在使用: 아바타 사용 중
  导入图片或从剪贴板粘贴: 이미지를 가져오거나 클립보드에서 붙여넣으세요
  导入头像图片: 아바타 이미지 가져오기
  当前使用: 현재 사용 중
  截图失败: 스크린샷 실패
  无法更新用户头像引用: 사용자 아바타 참조를 업데이트할 수 없습니다
  无法粘贴: 붙여넣을 수 없습니다
  无法读取图片：{error}: '이미지를 읽을 수 없습니다: {error}'
  没有可保存的裁剪图片: 저장할 잘린 이미지가 없습니다
  没有读取到有效图片: 유효한 이미지를 읽지 못했습니다
  确定永久删除这张历史头像吗？此操作无法撤销。: 이 이전 아바타를 영구 삭제할까요? 이 작업은 되돌릴 수 없습니다.
  移除头像失败：{error}: '아바타 제거 실패: {error}'
  移除当前头像: 현재 아바타 제거
  编辑“{name}”的头像: “{name}”의 아바타 편집
  编辑头像: 아바타 편집
  缩放: 확대/축소
  "该头像正被以下用户使用，不能删除：\n{users}\n\n请先为这些用户更换或移除头像。": "이 아바타는 다음 사용자가 사용 중이므로 삭제할 수 없습니다:\n{users}\n\n먼저 해당 사용자의 아바타를 변경하거나 제거하세요."
  选择之前保存的头像，或导入一张新图片: 이전에 저장한 아바타를 선택하거나 새 이미지를 가져오세요
user_manager:
  保存属性: 속성 저장
  删除属性: 속성 삭제
  同步全部头像: 모든 아바타 동기화
  属性 Key 不能为空: 속성 Key는 비워 둘 수 없습니다
  属性 Key 不能重复：{key}: '속성 Key가 중복되었습니다: {key}'
  悬浮点击编辑，或双击头像: 마우스를 올려 클릭하거나 아바타를 더블클릭하여 편집
  把本机与云端的头像做一次双向合并；不参与日常自动同步: 로컬과 클라우드의 아바타를 1회 양방향 병합합니다(일상 자동 동기화에는 포함되지 않음)
  新增属性: 속성 추가
  新建用户: 새 사용자
  无法删除该用户: 이 사용자는 삭제할 수 없습니다
  正在同步头像…: 아바타 동기화 중…
  用户名只能用中文、字母、数字、下划线和连字符，最多 32 个字符。: 사용자 이름은 한자/중문, 영문자, 숫자, 밑줄(_), 하이픈(-)만 사용할 수 있으며 최대 32자입니다.
  用户名已存在: 사용자 이름이 이미 존재합니다
  用户属性: 사용자 속성
  "确定要删除用户「{name}」吗？\n用户将从当前列表和批量配置中移除，关联数据文件会保留；以后添加同名用户即可恢复。": "사용자 「{name}」을(를) 삭제할까요?\n현재 목록과 일괄 설정에서 제거되지만 관련 데이터 파일은 유지되며, 나중에 같은 이름으로 추가하면 복원됩니다."
  ＋ 新建用户: ＋ 새 사용자
user_toolbar:
  上一个用户: 이전 사용자
  下一个用户: 다음 사용자
