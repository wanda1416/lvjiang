  启用智能调律: เปิดใช้การปรับจูนอัจฉริยะ
  启用紫装: เปิดใช้อุปกรณ์สีม่วง
  启用金装: เปิดใช้อุปกรณ์สีทอง
  "命中条件：装备任一条题名属于勾选词条；自选词条语义不跑潜力判定": "เงื่อนไขตรงเกณฑ์: ชื่อออฟชันใดก็ได้ของอุปกรณ์อยู่ในรายการที่ติ๊ก ความหมายออฟชันกำหนดเองจะไม่รันการประเมินศักยภาพ"
  "命中条件：预期评级属于勾选档位（全选 = 不限）": "เงื่อนไขตรงเกณฑ์: ระดับคาดการณ์อยู่ในระดับที่ติ๊ก (เลือกทั้งหมด = ไม่จำกัด)"
  品阶门槛（覆盖）: เกณฑ์ระดับคุณภาพ (แทนที่)
  四个系数都是 0，还没填: สัมประสิทธิ์ทั้งสี่ตัวเป็น 0 ยังไม่ได้กรอก
  四档：垃圾 / 一般 / 优秀 / 顶级: 'สี่ระดับ: ขยะ / ปกติ / ยอดเยี่ยม / ระดับสูงสุด'
  "回收补位循环上限：回收后重读同格续处理的最大次数，必须大于 0": "ขีดจำกัดรอบวนอ่านซ้ำหลังย่อย: จำนวนครั้งสูงสุดในการอ่านช่องเดิมซ้ำหลังย่อย ต้องมากกว่า 0"
  培养只能提高定音数值: การพัฒนาสามารถเพิ่มค่าปรับเสียงได้เท่านั้น
  培养只能提高词条数值: การพัฒนาสามารถเพิ่มค่าออฟชันได้เท่านั้น
  基于当前用户基础属性调整出装搭配: ปรับชุดอุปกรณ์ตามค่าพื้นฐานของผู้ใช้ปัจจุบัน
  基础属性「{name}」已存在，请使用其他名称。: มีค่าพื้นฐาน "{name}" อยู่แล้ว โปรดใช้ชื่ออื่น
  "基础属性使用当前所选的已存数值，尚未拆分的内容仍归这一列。五维转换已计入对应词条，不重复相加。": "ค่าพื้นฐานใช้ค่าที่บันทึกไว้ซึ่งเลือกอยู่ในปัจจุบัน ส่วนที่ยังไม่ได้แยกจะยังคงอยู่ในคอลัมน์นี้ การแปลงห้ามิติถูกนับรวมในออฟชันที่เกี่ยวข้องแล้ว ไม่บวกซ้ำ"
  基础规则组 {key} 不存在: ไม่พบกลุ่มกฎพื้นฐาน {key}
  基础配置: การตั้งค่าพื้นฐาน
  "填写当前面板属性，并自动扣除穿戴装备、套装与弓玦属性": "กรอกค่าหน้าต่างปัจจุบัน แล้วระบบจะหักค่าจากอุปกรณ์ที่สวมใส่ เซ็ต และธนู/หยกให้อัตโนมัติ"
  增益名不能为空: ชื่อบัฟต้องไม่ว่างเปล่า
  增益表: ตารางบัฟ
  处理动作: การกระทำการจัดการ
  备战方案管理: จัดการแผนเตรียมพร้อม
  备战方案范围: ขอบเขตแผนเตรียมพร้อม
  "多件装备出现同名词条时只生效数值最高的一条，例如两把剑各带一条剑武学增伤只算最高者": "เมื่อมีออฟชันชื่อเดียวกันบนอุปกรณ์หลายชิ้น จะมีผลเฉพาะแถวที่ค่าสูงสุดเท่านั้น เช่น กระบี่สองเล่มต่างมีเพิ่มดาเมจวรยุทธ์กระบี่ จะนับเฉพาะอันที่สูงกว่า"
  大于等于: มากกว่าหรือเท่ากับ
  套装名称: ชื่อเซ็ต
  如 aggressive（小写字母/数字/下划线）: เช่น aggressive (ตัวพิมพ์เล็ก/ตัวเลข/ขีดล่าง)
  如 my_rule（小写字母/数字/下划线）: เช่น my_rule (ตัวพิมพ์เล็ก/ตัวเลข/ขีดล่าง)
  如 治疗-纯奶: เช่น สายรักษา-ฮีลล้วน
  如 激进回收: เช่น ย่อยแบบเข้มงวด
  字段: ฟิลด์
  "存在多个可能版本或兼容性分歧，请人工核对；一键勾选不选择本组。": "พบหลายเวอร์ชันที่เป็นไปได้หรือมีความเข้ากันได้ขัดแย้งกัน โปรดตรวจสอบด้วยตนเอง การติ๊กทั้งหมดจะข้ามกลุ่มนี้"
  对战类型: ประเภทการต่อสู้
  导入出装搭配: นำเข้าชุดอุปกรณ์
  导入毕业率方案: นำเข้าแผนอัตราจบชุด
  导出文件: ส่งออกไฟล์
  导出路径需为绝对路径或以 ~/ 开头: เส้นทางส่งออกต้องเป็นเส้นทางสมบูรณ์หรือขึ้นต้นด้วย ~/
  "将出装搭配「{build}」导入备战方案「{plan}」，替换八个槽位的装备。\n原装备保留在当前用户装备库中，不会删除，也不会影响其他备战方案。\n同时应用该搭配的弓玦，战斗类型设为 PVE：\n{details}\n是否继续？": "นำเข้าชุดอุปกรณ์ \"{build}\" ไปยังแผนเตรียมพร้อม \"{plan}\" เพื่อแทนที่อุปกรณ์ทั้งแปดช่อง\nอุปกรณ์เดิมจะยังคงอยู่ในคลังอุปกรณ์ของผู้ใช้ปัจจุบัน ไม่ถูกลบ และไม่กระทบแผนเตรียมพร้อมอื่น\nพร้อมนำธนู/หยกของชุดนี้มาใช้ และตั้งประเภทการต่อสู้เป็น PVE:\n{details}\nต้องการทำต่อหรือไม่?"
  将承音装备的普通词条数值视为承音上限参与计算: ถือว่าค่าออฟชันปกติของอุปกรณ์เฉิงอินเป็นขีดจำกัดเฉิงอินในการคำนวณ
  尚无内置角色属性表: ยังไม่มีตารางคุณสมบัติตัวละครในตัว
  尚无最终评级 → 结束并保留装备: ยังไม่มีระดับสุดท้าย → สิ้นสุดและเก็บอุปกรณ์ไว้
  展开筛选条件: ขยายเงื่อนไขการกรอง
  属性 / 来源: คุณสมบัติ / แหล่งที่มา
