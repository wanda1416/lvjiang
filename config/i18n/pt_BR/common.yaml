  '[错误] 请先连接并选择执行目标': '[Erro] Conecte e selecione um destino de execução primeiro'
  '[错误] 请先连接设备': '[Erro] Conecte um dispositivo primeiro'
  '[错误] 请选择一个工作流': '[Erro] Selecione um fluxo de trabalho'
  '[错误] 请选择有效的执行用户': '[Erro] Selecione um usuário de execução válido'
  ? '{name} 的画面流中断，自动恢复没有成功。

    {error}


    请检查手机（是否息屏、游戏是否被切走、USB／无线是否正常）后选择是重新检查；选择否停止该目标任务。关掉本提示不会停止任务，顶部横幅会一直保留。'
  : 'A transmissão de tela de {name} foi interrompida e a recuperação automática falhou.

    {error}


    Verifique o celular (tela apagada, jogo em segundo plano, USB ou rede sem fio) e escolha Sim para verificar novamente, ou Não para parar a tarefa deste destino. Fechar este aviso não para a tarefa; o banner superior permanecerá visível.'
  ? '{name} 的连接恢复未完成。

    {error}


    请恢复 ADB／手机代理连接后选择是重新检查；选择否停止该目标任务。'
  : 'A recuperação de conexão de {name} não foi concluída.

    {error}


    Restaure a conexão ADB/agente do celular e escolha Sim para verificar novamente, ou Não para parar a tarefa deste destino.'
