  重置后服务端会把你当成一个新用户，之前的记录无法再与新标识关联。确定重置吗？: หลังรีเซ็ต เซิร์ฟเวอร์จะมองคุณเป็นผู้ใช้ใหม่ บันทึกก่อนหน้าจะไม่สามารถเชื่อมโยงกับรหัสใหม่ได้ ต้องการรีเซ็ตหรือไม่?
  重置标识: รีเซ็ตรหัส
  重试间隔（秒）: ระยะห่างการลองใหม่ (วินาที)
  需要绑定本机的激活码时，把这串序列号发给作者。它由主板标识算出，每次启动现算、不会存盘，也不包含任何可还原的硬件信息。: หากรหัสเปิดใช้งานต้องผูกกับเครื่องนี้ ให้ส่งหมายเลขเครื่องนี้ให้ผู้พัฒนา โดยคำนวณจากตัวระบุเมนบอร์ดทุกครั้งที่เปิดโปรแกรม ไม่บันทึกลงดิสก์ และไม่มีข้อมูลฮาร์ดแวร์ที่ย้อนกลับได้
  首次建立视频流和断连后自动恢复视频流共用这个次数；耗尽后等待人工处理，不会自动放弃任务。: ใช้ร่วมกันทั้งการสร้างสตรีมวิดีโอครั้งแรกและการกู้คืนอัตโนมัติหลังหลุดการเชื่อมต่อ เมื่อครบจำนวนครั้งแล้วจะรอผู้ใช้จัดการเองโดยไม่ยกเลิกงานอัตโนมัติ
  首次窗口定位后可自动获取: สามารถดึงข้อมูลอัตโนมัติได้หลังระบุตำแหน่งหน้าต่างครั้งแรก
  高级设置: ตั้งค่าขั้นสูง
  ? '默认建立视频流 5 次，失败后重连代理 5 次、ADB 5 次，间隔 2 秒。仍不可用时无限等待人工处理：选择是重新检查、选择否停止对应任务；关掉提示不会停止任务，顶部横幅会一直保留。

    多指和并发手势不降级。动作是否已执行不确定时，不自动重复输入。设置对后续启动的任务生效。'
  : 'ค่าเริ่มต้นคือลองสร้างสตรีมวิดีโอ 5 ครั้ง หากไม่สำเร็จจะเชื่อมต่อเอเจนต์ใหม่ 5 ครั้ง และ ADB 5 ครั้ง ห่างกันครั้งละ 2 วินาที หากยังใช้ไม่ได้จะรอผู้ใช้จัดการแบบไม่จำกัดเวลา: เลือก «ใช่» เพื่อตรวจสอบใหม่ เลือก «ไม่» เพื่อหยุดงานนั้น การปิดข้อความจะไม่หยุดงาน และแบนเนอร์ด้านบนจะยังคงอยู่

    ท่าทางหลายนิ้วและท่าทางพร้อมกันจะไม่ลดระดับ และหากไม่แน่ใจว่าส่งคำสั่งไปแล้วหรือไม่ ระบบจะไม่ส่งซ้ำอัตโนมัติ การตั้งค่ามีผลกับงานที่เริ่มถัดไป'
  鼠标/触控移动到目标位置的耗时: ระยะเวลาที่เมาส์/สัมผัสเคลื่อนที่ไปยังตำแหน่งเป้าหมาย
  鼠标移动时长(秒): เวลาเลื่อนเมาส์ (วินาที)
