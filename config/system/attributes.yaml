# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  属性规则配置
#  统一管理基础属性规则和词条属性上限
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── 基础属性（用于品阶推断） ──
base_attrs:
  weapon:
    110:
      gold:   { min: 100, max: 232 }
      purple: { min: 90,  max: 209 }
      blue:   { min: 80,  max: 186 }
    105:
      gold:   { min: 87, max: 203 }
      purple: { min: 79, max: 183 }
  ring:
    110:
      gold: 133
      purple: 120
      blue: 106
  pendant:
    110:
      gold: 199
      purple: 179
      blue: 159
  armor_other:
    110:
      gold: 9723
      purple: 8750
      blue: 7778
  chest:
    110:
      gold: 19445
      purple: 17500
      blue: 15556

# ── 词条属性上限 ──
# 同类词条共享上限，按类别合并：
#   外功攻击:   最大/最小外功攻击
#   属性攻击:   最大/最小无相/牵丝/鸣金/裂石/破竹攻击
#   五维属性:   劲、势、敏、体、御
#   会意率 / 会心率 / 精准率
#   单武学增伤: 剑/枪/...武学增伤
#   扇武学增效: 扇武学增效（独立类别）
#   全武学增效
#   对单位增效: 对首领单位增伤、对玩家单位增效
#   奇术类增伤: 单体类/群体类奇术增伤
#
# 每条记录：
#   cap: 上限值
#   unit: 单位（"" 或 "%"）
#   chengyin: 承音数值（cap × 94%，只读展示）
affix_caps:
  外功攻击:
    110: { cap: 121.4, unit: "" }
  属性攻击:
    110: { cap: 68.8, unit: "" }
  五维属性:
    110: { cap: 76.8, unit: "" }
  会意率:
    110: { cap: 7.0, unit: "%" }
  会心率:
    110: { cap: 14.0, unit: "%" }
  精准率:
    110: { cap: 12.4, unit: "%" }
  单武学增伤:
    110: { cap: 9.8, unit: "%" }
  扇武学增效:
    110: { cap: 9.8, unit: "%" }
  全武学增效:
    110: { cap: 4.9, unit: "%" }
  对单位增效:
    110: { cap: 5.1, unit: "%" }
  奇术类增伤:
    110: { cap: 15.0, unit: "%" }
