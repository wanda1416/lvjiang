  生成可读、可直接编辑的 WF DSL。录制停止时会合并能够安全合并的按键按下、按住、释放和后续等待；连续鼠标移动及短等待按约 100ms粒度归并。适合普通界面操作和后续手工调整，不适合要求逐个原始输入事件精确回放的游戏视角。: Génère un WF DSL lisible et directement modifiable. À l'arrêt, les appuis/maintiens/relâchements de touches et attentes suivantes sont fusionnés si possible ; les mouvements continus de souris et courtes attentes sont regroupés par tranches d'environ 100 ms. Adapté aux opérations d'interface classiques et aux ajustements manuels, mais pas à la rotation de caméra exigeant une relecture exacte des événements bruts.
